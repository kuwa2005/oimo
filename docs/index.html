*Main-loop send site** (~line 2720/2723)\n- **Fork/subagent send site** (~line 2850/2853)\n\n`isLastStep` is computed once per iteration at `prompt.ts:2573` (`step >= (agent.steps ?? Infinity)`) and is in scope at both sites.\n\nAt each site, when `isLastStep` is true:\n\n- **Messages** — a message carrying the `MAX_STEPS` instruction (from `src/session/prompt/max-steps.txt`) is appended with `role: \"user\"`, so `messages` ends on a user turn. Previously this was `role: \"assistant\"` (a prefill).\n- **toolChoice** — set to `\"none\"`, physically preventing tool calls on the final turn. On non-last steps the prior behavior is unchanged (`\"required\"` for `json_schema` format, otherwise `undefined`). Last-step `\"none\"` takes precedence over the `json_schema` `\"required\"` branch.\n\n`toolChoice: \"none\"` is a valid value on both code paths: `StreamInput` (`src/session/llm.ts:195`) and the max-mode step (`src/session/max-mode.ts:61`) both type it as `\"auto\" | \"required\" | \"none\"`. Setting `toolChoice` does not alter the tools schema, so the cached request prefix (system prompt + tool definitions) is unaffected.\n\n### Design Decisions\n\n- **User message, not provider detection.** We deliver `MAX_STEPS` on a user-role message rather than branching on provider capability (e.g. a `supportsPrefill` flag). The user-role form is valid on every provider including Anthropic-direct, so per-provider branching would be dead complexity.\n- **Provider-agnostic by ending on a user turn.** Rather than using assistant prefill to force a final turn, the instruction rides on a prompt-text/user message with turn bounding. Conversations that end on an assistant turn are rejected by providers that don't support prefill (e.g. Bedrock-routed Claude), so ending on a user turn is the portable choice.\n- **Restored `toolChoice: \"none\"` deliberately.** The original max-steps feature (upstream PR #4062) disabled tools on the last step; the effectify refactor (upstream PR #19483) dropped it, leaving the assistant prefill as the only last-step control. Removing the prefill alone would have made the step cap a no-op, so tool disabling was restored alongside.\n\n## Usage\n\nNo user-facing API or config change. Behavior triggers automatically when an agent with a finite `steps` value (e.g. fork subagents at `maxTurns`/`steps` limits) reaches its cap. On that final step the model receives the `max-steps.txt` instruction (announce limit reached, summarize work done, list remaining tasks, recommend next steps) and cannot call tools.\n\n## Verification\n\n- `bun typecheck` (from `packages/opencode`) — exits 0 after both edits.\n- Grep assertions: zero `role: \"assistant\" ... MAX_STEPS` matches; two `role: \"user\" ... MAX_STEPS` matches; two `isLastStep ? \"none\"` toolChoice lines.\n- Test suites `test/session/prompt.test.ts`, `prompt-sweep.test.ts`, `max-mode.test.ts`, `test/agent/agent.test.ts` — 62 pass, 1 fail. The single failure (`general agent denies todo tools`) is **pre-existing and unrelated**: confirmed by reproducing it on the pre-change `prompt.ts` (it fails identically without this change).\n- Reasoning: on non-last steps both edited lines reduce to the prior behavior (the `isLastStep` ternary takes its false branch), so normal turns are byte-for-byte unchanged.\n\n## Journey Log\n\n> Brief notes on what informed the final design. Not required reading.\n\n- [lesson] The 400 was not a fork bug — the assistant-prefill last-step pattern is upstream-native (PR #4062). This fork only widened its reach by copying it into the fork/subagent loop.\n- [lesson] The effectify refactor (PR #19483) silently dropped two of three original last-step controls (`system.push(MAX_STEPS)` and `toolChoice: \"none\"`), leaving only the prefill — so a naive \"just delete the prefill\" fix would have quietly disabled step-cap enforcement.\n- [pivot] The robust pattern is to avoid assistant-final turns entirely for non-prefill providers. That confirmed the user-message + tool-disable approach over any provider-detection scheme.\n\n## Source Materials\n\n| File | Role | Notes |\n|------|------|-------|\n| `docs/compose/plans/2026-06-17-align-last-step-handling.md` | Implementation plan | Complete (3 tasks) |\n"},{"path":"compose/reports/cli-help-ja-test.md","title":"Report: CLI --help 全面改定・日本語化 (+ session list フラグ対応)","group":"reports","content":"# Report: CLI --help 全面改定・日本語化 (+ session list フラグ対応)\n\nStatus: Complete\nDate: 2026-08-06\nSpec: [cli-help-ja](../specs/cli-help-ja.md) (Rev 1, Approved at Requirements Lock 2026-08-06, headless)\n\n## Summary\n\n`--help` を全面日本語化し、記述を改善した。yargs 18 を `.locale(\"ja\")` に設定し、見出し・型表示・検証エラーも日本語化。全 ~31 コマンド ファイル + グローバル オプションの describe (~150 件) を翻訳 + 明確化。usage 行・使用例 (例: セクション)・`.fail()` のエラー表示 (メッセージ + ヒント) を追加。併せて `oimo session list -c --auto --se` の失敗 (TASK 4) を修正 — `session list` に `-c/--continue`・`--auto`・`--se/--autonomy` を追加し、TTY 起動時に TUI へフラグ転送する。\n\n## 実装内容\n\n### index.ts\n- `.locale(\"ja\")` 追加 (yargs 見出し/型表示/検証エラーを日本語化)\n- `.help(\"help\")` / `.version(\"version\", ...)` — 明示 msg 削除 → ja ロケール訳 (`ヘルプを表示` / `バージョンを表示`) を利用\n- `.usage(\"oimo \u003cコマンド> [オプション]\")` + `.example()` 4 件 (TUI 起動 / -c --auto --se 続行 / run / session list)\n- グローバル オプション describe 日本語化 (print-logs, log-level, pure, tor, log, log-mode)\n- `.completion` describe 日本語化\n- `.fail()`: 判定を日本語プレフィックス (`未知の引数です` / `オプションではない引数が` / `不正な値です`) に更新。マッチ時: エラー メッセージ (danger bold) + ヒント (`oimo --help` 参照) を stderr に表示 → `showHelp` → exit 1\n\n### コマンド ファイル (~30)\n- 全 describe を日本語へ。代表的な明確化: `--auto` (自動承認 + ワークスペース信頼プロンプト スキップ)、`--se/--autonomy` (SE 自律モードの説明)、`--log` (自動ファイル名)、`--log-mode` (既定: summary)、`--never-ask`、`--fork`、`--dangerously-skip-permissions` 等\n- 対象: run, tui/thread, tui/attach, session, account, mcp, providers, agent, db, network (serve/web/run 共有), debug/* (9), stats, github, plug, acp, uninstall, models, upgrade, export, import, pr, serve, web (batch A/B サブエージェント委譲 + 自前編集)\n\n### session.ts (TASK 4 修正)\n- `SessionListCommand` に `-c/--continue`・`--auto`・`--se/--autonomy` を追加 (describe は日本語)\n- `launchFlags(args)` ヘルパー (export): `{auto, autonomy}` → `[\"--auto\", \"--se\"]`\n- TTY: `-c` → `launchTui([\"--continue\", ...flags])` (ピッカーなし); それ以外 → ピッカーで選択したセッションへ `[\"--session\", id, ...flags]` / New session は `flags` のみ転送\n- 非 TTY: 従来どおり table/JSON 出力 (`-c` は無視)。セッション 0 件 + `-c` + TTY のみエラー exit 1\n\n## テスト結果\n\n新規: `packages/opencode/test/cli/help.test.ts` (6 tests)。スパウン統合テストは `MIMOCODE_HOME=\u003ctmpdir>` + `MIMOCODE_DISABLE_CLAUDE_IMPORT=1` で分離。\n\n| # | テスト | 結果 |\n|---|--------|------|\n| T1 | 静的完全性: src/cli/cmd + network.ts + index.ts の全 describe リテラルが日本語文字を含む | ✅ PASS (37 ファイル走査) |\n| T2 | スパウン `oimo --help` → コマンド:/オプション:/例: 見出し + 日本語コマンド説明、`Commands:` なし、exit 0 | ✅ PASS |\n| T3 | スパウン `run --help` / `session list --help` / `tui --help` → 日本語 (run の format 説明、list の新フラグ説明、TUI 起動説明) | ✅ PASS |\n| T4 | スパウン `session list --bogus` → `未知の引数です: bogus` + ヒント + exit 1 | ✅ PASS |\n| T5 | スパウン `session list -c --auto --se` (非 TTY) → exit 0、ヘルプ非表示 | ✅ PASS |\n| T6 | 単体 `launchFlags` 4 ケース | ✅ PASS |\n\n実行 (3 回): **6/6 PASS ×3** (`bun test --timeout 30000 test/cli/help.test.ts`、~60s。テストは package.json の `--timeout 30000` 前提 — 素の `bun test` は 5s デフォルトで T3 がタイムアウトするため、スパウンテストには `--timeout` 必須)。\n\n### 回帰\n- `bun typecheck` (tsgo --noEmit): ✅ PASS\n- `bun test --timeout 30000 test/cli/` (52 ファイル): **341 pass / 4 fail** — 4 件は全て既知の `voice` ネットワーク エラー テスト (タイムアウト、環境要因、クリーン ツリーでも再現済みの既存問題。本タスクと無関係)。プラグイン関連のエラー ログは表示されたが失敗テストには含まれず (フレーク)。\n- 英語文言に依存する既存テスト: なし (grep 確認)\n\n## 手動確認 (代表出力)\n\n```\n$ oimo --help\noimo \u003cコマンド> [オプション]\n\nコマンド:\n  oimo completion          シェルの補完スクリプトを生成する\n  oimo mcp                 MCP (Model Context Protocol) サーバーを管理する\n  oimo [project]           oimo TUI を起動する                                          [デフォルト]\n  oimo run [message..]     メッセージを渡して oimo を実行する\n  oimo session             セッションを管理する\n  ...\n\nオプション:\n  -h, --help  ヘルプを表示    [真偽]\n      --auto  明示的に拒否されていないパーミッションを自動承認する (危険!)。ワークスペース信頼プロンプトもスキップする    [真偽]\n\n例:\n  oimo                       TUI を起動する\n  oimo -c --auto --se        最後のセッションを自動許可 + SE 自律モードで続行する\n  oimo run \"バグを修正して\"  ヘッドレスで 1 回のプロンプトを実行する\n  oimo session list          セッションの一覧を表示する\n\n$ oimo session list --bogus\n未知の引数です: bogus\nヒント: `oimo --help` でコマンドとオプションを確認できます。\noimo session list\n...\n```\n\n## 知見・注意\n\n- `oimo tui --help` はトップレベル ヘルプにフォールバックする (tui は `$0 [project]` 既定コマンドでサブコマンドではない)。yargs の既存挙動。\n- `session --help` は親コマンドのヘルプ (list/delete/import-claude の一覧) を表示し、`-c/--auto/--se` は `session list --help` 側に表示される。\n- attach.ts の `description: \"directory to run in\"` は yargs が無視するキー (help に非表示) のため意図的に据え置き (修正するとヘルプに新規行が追加される = 挙動変更になるため対象外)。\n- スパウンテストは毎回 JSON→SQLite マイグレーションが走る (~2-3s/回)。oimo.db マーカー事前作成でスキップ可能だが、T5 は Session.list 用に実 DB が必要なため非採用。\n- 委譲した 2 サブエージェント (batch A: debug/* 等 13 ファイル 56 件、batch B: 8 ファイル 21 件) は typecheck PASS を確認済みで、git diff は describe 文字列のみの変更。\n\n## 変更ファイル\n\n- src: packages/opencode/src/index.ts, cli/network.ts, cli/cmd/{run,session,account,mcp,providers,agent,db,uninstall,models,upgrade,export,import,pr,serve,web,stats,github,plug,acp}.ts, cli/cmd/debug/{index,agent,config,file,lsp,ripgrep,scrap,skill,snapshot}.ts, cli/cmd/tui/{thread,attach}.ts\n- テスト: packages/opencode/test/cli/help.test.ts (新規)\n- ドキュメント: docs/compose/specs/cli-help-ja.md (新規, Approved)\n"},{"path":"compose/reports/docs-index-viewer-test.md","title":"Report: docs ビューア (docs/index.html 左右 2 ペイン)","group":"reports","content":"# Report: docs ビューア (docs/index.html 左右 2 ペイン)\n\n- 日付: 2026-08-06\n- Spec: docs/compose/specs/docs-index-viewer.md (Requirements Lock Approved 2026-08-06)\n- 状態: **実装完了・検証済み**\n\n## 概要\n\n--se モードの自律エージェント実行により docs/ 配下へ次々と生成されるドキュメント (現在 62 ファイル:\nspecs / spec / reports / plans / architecture / harness / RELEASING.md) を一覧・閲覧するための\n左右 2 ペイン・ビューア `docs/index.html` を作成した。\n\n- 左ペイン: ディレクトリ別グループ (トップ / Specs / Spec / Plans / Reports / Architecture / Harness) +\n  インクリメンタル検索フィルタ。\n- 右ペイン: 選択文書を marked.js で描画。タイトル + パス表示、`\u003cscript>` 等の除去によるサニタイズ。\n- 単一自己完結 HTML: 全文書本文・marked.js・CSS・JS をインライン (外部参照ゼロ) — file:// /\n  GitHub Pages / オフラインすべてで動作。\n- テーマ: prefers-color-scheme 自動 + 手動トグル (localStorage 永続)。ディープリンク (#パス) 対応。\n\n## 実装内容\n\n| ファイル | 内容 |\n|---|---|\n| `script/build-docs-index.ts` (NEW, chmod +x) | 生成スクリプト。`collectDocs` (Bun.Glob 再帰スキャン・ソート) / `titleOf` (frontmatter → H1 → ファイル名) / `groupOf` (ディレクトリ別) / `escapeForScript` (`\u003c` → `\\u003c` で `\u003c/script>` 無害化) / `renderDocsIndex` (単一 HTML 生成) を純関数化、メイン処理は `import.meta.main` ガード |\n| `script/vendor/marked.min.js` (NEW) | marked v12.0.2 (MIT) を vendored。生成 HTML にインライン埋め込み (プレースホルダ split/join 方式 — テンプレートリテラル挿入だと将来版のバッククォートで壊れるため) |\n| `docs/index.html` (生成物, ~760KB) | 62 文書の manifest JSON (JSON.stringify + `\u003c` エスケープ) と marked、ビューア JS を同梱 |\n| `.github/workflows/pages.yml` (編集) | Checkout 直後に Setup Bun + `bun script/build-docs-index.ts` を追加 — 公開 Pages はデプロイ前に常に再生成 |\n| `AGENTS.md` (編集) | 「docs/index.html は生成物 — 文書追加・変更時は `bun script/build-docs-index.ts` で再生成」を追記 |\n\n## セキュリティ設計\n\n- 埋め込みは `JSON.stringify(...).replace(/\u003c/g, \"\\\\u003c\")` — manifest 内の `\u003c/script>` を無害化。\n  テスト T5 で「生成 HTML の `\u003c/script>` は閉じタグ 3 つ (manifest / marked / アプリ) のみ」を保証。\n- 描画時: `DOMParser` でパース後に `script, iframe, object, embed` を除去してから innerHTML へ\n  (marked はデフォルトでサニタイズしないため)。\n\n## テスト結果\n\n実行: `bun test --timeout 30000 test/cli/docs-index.test.ts` → **8 pass / 0 fail (286 expect)**\n\n| ID | 内容 | 結果 |\n|---|---|---|\n| T1 | collectDocs が docs/ 全 md をソート順で検出 | PASS |\n| T2 | titleOf の frontmatter / H1 / ファイル名フォールバック | PASS |\n| T3 | groupOf のディレクトリ別グループ分け | PASS |\n| T4 | escapeForScript の `\u003c/script>` 無害化 + JSON 往復 | PASS |\n| T5 | 生成 HTML の構造 (左右ペイン・manifest・marked・テーマ) + `\u003c/script>` が閉じタグ 3 つのみ | PASS |\n| T6 | renderDocsIndex の決定性 (バイト一致) | PASS |\n| T7 | E2E — 実スクリプト実行 exit 0、全 62 文書が manifest に含まれ JSON パース可能 | PASS |\n| T8 | pages.yml 再生成ステップ + AGENTS.md 参照の存在 | PASS |\n\n## 検証 (typecheck・実機)\n\n| 検証 | コマンド/方法 | 結果 |\n|---|---|---|\n| typecheck | `bun typecheck` (packages/opencode, tsgo) | PASS |\n| 生成 | `bun script/build-docs-index.ts` | exit 0、`docs/index.html generated (62 docs)` |\n| 決定性 | 再実行 → サイズ 760379 バイト一致 (T6 でバイト一致も保証) | PASS |\n| HTTP 配信 | Bun.serve で docs/ を配信し `GET /index.html` → 200、manifest / marked / 文書パスを含む | PASS |\n| 自己完結性 | `\u003cscript src=` / `\u003clink href=` / `\u003cimg src=\"http` / `@import` の静的リソース読み込みがゼロ (見つかった https:// は全て文書本文テキスト) | PASS |\n| ブラウザ描画 | ヘッドレスブラウザが環境に無いため、描画ロジック (manifest パース・描画・検索・テーマ) は純関数 + 生成 HTML の静的検証で代替検証 (制約事項) | — |\n\n## 運用\n\n```bash\n# 文書を追加・変更したら再生成 (ローカル)\nbun script/build-docs-index.ts\n\n# GitHub Pages (https://kuwa2005.github.io/oimo/docs/) は\n# pages.yml がデプロイ前に自動再生成するため、push だけで最新化される\n```\n\n## 知見\n\n- **JSON 埋め込みの安全パターン**: `JSON.stringify(...).replace(/\u003c/g, \"\\\\u003c\")` は HTML の script\n  要素内でも `\u003c/script>` を完全に無害化し、`JSON.parse` で完全往復する。HTML エスケープや base64 より\n  単純で堅牢。\n- **vendored JS のテンプレート埋め込み**: ミニファイ済み JS をテンプレートリテラルに `${src}` で\n  挿入すると、将来版にバッククォートや `${` が含まれた瞬間に壊れる。プレースホルダ置換\n  (`template.split(\"__PLACEHOLDER__\").join(src)`) が安全。\n- **marked はデフォルトでサニタイズしない** — 描画結果を DOMParser に通して script/iframe を除去\n  する最小防御をビューア側に実装した (文書はリポジトリ内の信頼済みコンテンツのため最小限で十分)。\n- **ページサイズの一見矛盾**: 760KB (UTF-8 バイト) vs fetch の `text().length` 639K (UTF-16 文字数)\n  は日本語マルチバイトによる見かけの差で、実体は同一。\n"},{"path":"compose/reports/gpt-5-5-empty-output-and-reasoning-roundtrip.md","title":"Audit: gpt-5.5 empty output / `reasoning part rs_… not found`","group":"reports","content":"# Audit: gpt-5.5 empty output / `reasoning part rs_… not found`\n\nDate: 2026-07-02 · Branch: `vb/603e-gpt-5-5-bug` · Author: wqymi \u003cwangqiying@xiaomi.com>\n\n## Problem\n\nUsers on `gpt-5.5` (and other gpt-5.x reasoning models) via the `@ai-sdk/openai`\nResponses API frequently saw:\n\n- **Empty output** — the model returned a step with only reasoning / no text, which\n  `session/classify.ts:108-116` labels `think-only` / `\"empty output\"`.\n- **`reasoning part rs_… not found`** — a server-side Responses API rejection, seen even\n  when the user's config already set `include: [\"reasoning.encrypted_content\"]`, and\n  specifically against a **custom `baseURL` proxy** (MiMo Router), not `api.openai.com`.\n\nInitial hypotheses that were **ruled out**:\n- \"ai-sdk too old\" — false. `ai@6.0.168`, `@ai-sdk/openai@3.0.53` are current and identical\n  to upstream `anomalyco/opencode` dev.\n- Provider-level config `options` — the user's `reasoningEffort/include/…` were placed in the\n  **provider-level** `options` block, which only feeds the SDK constructor\n  (`provider.ts` resolveSDK), not per-request `providerOptions`. Per-request options come from\n  the **model-level** `options` (`session/llm.ts:349`). So `reasoningEffort:'high'` was silently\n  ignored (base `medium` shipped); `include` still shipped because base injects it. Not the\n  root cause of `rs_ not found`, but a real config foot-gun (see \"Operator guidance\").\n\n## Root causes & mechanics\n\nThe Responses API with `store: false` (forced for `providerID===\"openai\"` /\n`npm===\"@ai-sdk/openai\"` at `transform.ts` `options()`) is **stateless**: encrypted reasoning\nitems must be echoed back on every turn, and the SDK drops any reasoning input item lacking\n`encrypted_content` (`@ai-sdk/openai` dist `convert-to-openai-responses-input`: \"Reasoning parts\nwithout encrypted content are not supported when store is false\").\n\n1. **Missing `include` in base options.** MiMoCode's base `options()` set `store:false` +\n   `reasoningEffort:medium` + `reasoningSummary:auto` for `@ai-sdk/openai`, but only set\n   `include: [\"reasoning.encrypted_content\"]` when `providerID` started with `opencode` (or inside\n   an explicitly-selected reasoning variant). Without `include`, OpenAI never returns\n   `encrypted_content` → stored reasoning parts have `itemId` but no encrypted content → next turn\n   the SDK drops them while the dependent `function_call` still references the reasoning `rs_` →\n   `reasoning part rs_… not found`. Upstream sets `include` unconditionally for `@ai-sdk/openai`.\n\n2. **Blanket item-id strip in the fetch wrapper (proxy-incompatible).** `provider.ts` had a\n   fetch-wrapper block that, for `@ai-sdk/openai` non-Azure POSTs, ran `JSON.parse(opts.body)` →\n   deleted `id` from **every** `input[]` item → re-serialized — **after request signing**. This\n   \"codex-style\" strip is tolerated by official OpenAI (matches reasoning↔function_call by\n   encrypted_content/position in stateless mode) but breaks against proxies that still validate\n   the `rs_` reference. This code came from early upstream but upstream **refactored it away** in\n   PR #31429 (commit `a86ecf3bb`, \"adjust item id stripping to happen prior to request signing\"):\n   they moved it into the transform layer and strip only the `itemId` key from `providerOptions`,\n   before serialization. MiMoCode's fork was stuck on the old implementation.\n\n3. **8 ai-sdk provider deps behind upstream.** Not the cause of the above, but a maintenance gap;\n   the notable ones carry real fixes (openrouter duplicate tool-call; google Vertex\n   thoughtSignature).\n\n## Changes (3 commits)\n\n### 1. `915b1056c` — request encrypted reasoning for `@ai-sdk/openai` gpt-5.x\n- `provider/transform.ts` (+7): in base `options()`, after the existing `reasoningSummary` gate,\n  add `result[\"include\"] = [\"reasoning.encrypted_content\"]` for `npm === \"@ai-sdk/openai\"` (non-pro\n  gpt-5.x). Mirrors upstream.\n- `test/provider/transform.test.ts` (+19): assert `include` + `store:false` for gpt-5.5 / gpt-5,\n  and that `gpt-5-pro` does NOT set `include`.\n- Effect: OpenAI returns `encrypted_content` → stored → replayed → survives the store:false filter.\n\n### 2. `c67c94f5e` — strip openai Responses itemId in transform, not fetch wrapper (port of upstream PR #31429)\n- `provider/provider.ts` (−15): removed the fetch-wrapper blanket id-strip block.\n- `provider/transform.ts` (+): extracted `mapProviderOptions()` helper (also reused by the existing\n  providerID→SDK-key remap). Added, in `message()`, a strip that runs **before serialization** and\n  removes **only** `providerOptions[key].itemId` when `options.store !== true` and\n  `npm ∈ {@ai-sdk/openai, @ai-sdk/azure}`. Keyed by `sdkKey(npm)` so a custom `providerID` (proxy)\n  on the openai SDK still strips via the `openai` key. Preserves `reasoningEncryptedContent` and all\n  other options.\n  - Deliberate divergence from upstream: dropped `@ai-sdk/amazon-bedrock/mantle` from the npm list\n    (MiMoCode uses `@ai-sdk/amazon-bedrock`, and the old code never stripped bedrock). Kept\n    `openai` + `azure` to match prior MiMoCode behavior.\n- `test/provider/transform.test.ts`: rewrote the \"strip openai metadata when store=false\" suite to\n  assert the new behavior (itemId stripped for openai/azure when store≠true; encrypted content and\n  other options preserved; store:true keeps id; non-openai/azure npm untouched; azure namespace).\n- Effect: request body is no longer mutated post-signing, and reasoning `rs_` handling goes through\n  a clean SDK-built body — fixes `rs_ not found` on custom-baseURL proxies.\n\n### 3. `0dcdd77d7` — bump ai-sdk providers to match upstream (`anomalyco/opencode` dev)\nVersion bumps in `packages/opencode/package.json`:\n\n| Package | Old → New | Notable |\n|---|---|---|\n| @ai-sdk/amazon-bedrock | 4.0.96 → 4.0.112 | routine |\n| @ai-sdk/anthropic | 3.0.71 → 3.0.82 | model IDs + niche tool fixes |\n| @ai-sdk/cerebras | 2.0.41 → 2.0.60 | routine |\n| @ai-sdk/google | 3.0.63 → 3.0.73 | 3.0.71 fixes Vertex no-args streaming tool call dropping thoughtSignature (Gemini-3 thinking multi-turn 400) |\n| @ai-sdk/google-vertex | 4.0.112 → 4.0.128 | routine |\n| @openrouter/ai-sdk-provider | 2.5.1 → 2.9.0 | **2.9.0 fixes duplicate tool-call emit (streamText executing tools twice)**; 2.8.1 empty reasoning_details multi-turn; 2.6.0 deterministic tool-arg serialization |\n| gitlab-ai-provider | 6.6.0 → 6.10.0 | see below |\n| venice-ai-sdk-provider | 2.0.1 → 2.1.1 | routine |\n\nAccompanying code change (hard requirement):\n- **Dropped the obsolete `gitlab-ai-provider@6.6.0` patch** — removed root `package.json`\n  `patchedDependencies` entry and deleted `patches/gitlab-ai-provider@6.6.0.patch`. Verified: the\n  6.6.0 `dist/index.mjs` had 4 `__require` occurrences (the ESM dynamic-require shim the patch\n  fixed); 6.10.0 has **0** and ships clean ESM. The version-pinned patch could no longer apply, so\n  `bun install` would fail if it were carried forward. Upstream ships no gitlab patch.\n\nxai stayed at 3.0.82 (already matched upstream).\n\n## Verification\n\n- `bun install` — clean, no patch-apply failure.\n- `bun typecheck` (packages/opencode) — clean (no type-level API breakage from any bump).\n- `bun test test/provider/` — 304/304 pass (incl. rewritten transform suite).\n- Reverse test: the `include` tests fail with the fix reverted, pass with it applied.\n- `bun.lock`: residual old versions appear only transitively under `ai-gateway-provider/*` (that\n  package pins its own ai-sdk copies, as upstream does); direct deps resolve to the new versions.\n\n## Operator guidance (config)\n\n- `reasoningEffort` (and other per-request model behavior) must live in the **model-level**\n  `options`, not the provider-level block:\n  ```jsonc\n  \"openai\": {\n    \"npm\": \"@ai-sdk/openai\",\n    \"options\": { \"baseURL\": \"…\", \"apiKey\": \"…\" },        // SDK-construction only\n    \"models\": { \"gpt-5.5\": { \"name\": \"gpt-5.5\", \"options\": { \"reasoningEffort\": \"high\" } } }\n  }\n  ```\n- `include` / `reasoningSummary` / `textVerbosity` / `store` are auto-injected by base `options()`\n  for `@ai-sdk/openai` gpt-5.x — no need to set them manually (and avoid a stray backslash such as\n  `reasoning.encrypted\\_content`, which would be an invalid include value).\n\n## Resolved follow-up\n\n- **`smallOptions` include symmetry (done).** `smallOptions()` set `store:false` + `reasoningEffort`\n  for gpt-5.x but not `include`. Small-model calls today are single-shot with no tool loop\n  (title gen `prompt.ts:396` `tools:{}`; summarizer `prompt.ts:489`), so this could not trigger\n  `rs_ not found` in practice — but it was an asymmetry with the main-model path. Added\n  `include: [\"reasoning.encrypted_content\"]` for `@ai-sdk/openai` gpt-5.x in `smallOptions`\n  (github-copilot excluded — it uses its own include path) as defense-in-depth, with tests\n  (reverse-verified: they fail without the change).\n\n## Open follow-up (not done)\n\nUpstream also has a signature/redactedData-aware reasoning filter in `normalizeMessages`\n(preserves empty-text reasoning parts carrying a `signature`/`redactedData`) plus an\n`@ai-sdk/google@3.0.73` patch (pops empty Gemini `model` entries). MiMoCode's filter\n(`transform.ts` normalizeMessages, anthropic/bedrock branch) still drops `text===\"\"` reasoning\nparts. This is an independent robustness improvement for thinking/thoughtSignature multi-turn — not\nrequired by the bumps — and was intentionally left for separate evaluation.\n"},{"path":"compose/reports/log-mode-summary-auto-name-test.md","title":"Test Report: `--log` 出力モード (full/summary) と自動ファイル名","group":"reports","content":"# Test Report: `--log` 出力モード (full/summary) と自動ファイル名\n\nStatus: Passed (2026-08-06; Rev 2: デフォルトを summary に変更 — ユーザー回答「デフォルトは summaryでよい」)\nSpec: [log-mode-summary-auto-name](../specs/log-mode-summary-auto-name.md) (Approved, Rev 2)\n\n## 検証サマリ\n\n| 検証 | コマンド | 結果 |\n|------|----------|------|\n| Typecheck | `bun typecheck` (packages/opencode, tsgo --noEmit) | **PASS** |\n| session-log 単体テスト | `bun test test/cli/tui/session-log.test.ts` | **13/13 PASS** (42 expect) |\n| CLI テスト回帰 | `bun test test/cli/` | 334 PASS / 4 FAIL (事前存在の環境依存失敗、下記) |\n| yargs パース確認 | 一時ハーネス (tmp-logmode-parse.mjs, 実行後に削除) | **期待どおり** (下表) |\n\n## テスト仕様 (T1–T9) の実行結果\n\n全 9 項目を session-log.test.ts に実装し実行。すべて **PASS**。\n\n| # | テスト | 結果 |\n|---|--------|------|\n| T1 | formatSessionLogUser の形式 | PASS |\n| T2 | formatSessionLogQA の形式 (multiple/custom/未回答含む) | PASS |\n| T3 | formatSessionLogResult の形式 | PASS |\n| T4 | generateSessionLogFileName のパターンと重複回避 (-1 付与) | PASS |\n| T5 | resolveSessionLogFile (なし→undefined / auto→生成名 / explicit→そのまま) | PASS |\n| T6 | summary フロー: assistant は書き込みなし → 次のユーザー入力で Result flush → User 追記。空テキストは無視、順序 (Result \u003c User) 検証 | PASS |\n| T7 | flushSessionLogResult は pending なしで no-op | PASS |\n| T8 | full モード (MIMOCODE_LOG_MODE=full 明示) の既存挙動維持 + summary 専用レコードを無視 | PASS |\n| T9 | 既定モード: MIMOCODE_LOG_MODE 未設定で summary が既定 (sessionLogMode()=\"summary\"、record* が書き込む) | PASS |\n\n## yargs パース実測 (ハーネス)\n\n| 入力 | log | log-mode | 備考 |\n|------|-----|----------|------|\n| `oimo --log` | `\"\"` | — | → MIMOCODE_LOG_AUTO=1 (自動ファイル名) |\n| `oimo --log=foo.md` | `\"foo.md\"` | — | 従来どおり |\n| `oimo --log foo.md` | `\"foo.md\"` | — | 従来どおり |\n| `oimo --log run hello` | `\"run\"` | — | 既知の制限 (仕様 §4、対応外) |\n| `oimo --log --log-mode summary` | `\"\"` | `\"summary\"` | 自動名 + summary |\n| `oimo --log-mode summary` | — | `\"summary\"` | |\n| `oimo --log-mode bogus` | — | — | yargs choices エラー (期待どおり) |\n\n## 既知の事前失敗 (今回の変更と無関係)\n\n`test/cli/tui/voice.test.ts` の 4 件 (`transcribeAudio`/`processVoiceControl` × network error / custom model) が 5 秒タイムアウトで失敗。`git stash` で変更を退避したクリーンツリーでも同一 (33 pass / 4 fail) を確認済み。ネットワーク挙動依存の環境問題であり、本変更の影響ではない。\n\n## 検証方法の補足\n\n- 単体テストは `tmpdir` fixture + `process.env.MIMOCODE_LOG` / `MIMOCODE_LOG_MODE` の直接設定 (既存テストのパターンを踏襲)。\n- sync.tsx のイベント配線 (question.asked/replied の対応付け、モード分岐) は TUI 実行が必要なため、単体テスト対象外。ロジック本体 (フォーマット・フラッシュ順序・ファイル解決) は session-log.ts に分離し、上記テストでカバー。パース層はハーネスで実測確認。\n"},{"path":"compose/reports/log-without-filename.md","title":"調査レポート: `--log` をファイル名なしで指定したときの挙動","group":"reports","content":"# 調査レポート: `--log` をファイル名なしで指定したときの挙動\n\n- Date: 2026-08-06\n- 対象: Open Mimo Code (oimo) CLI / TUI\n- Spec: [docs/compose/specs/log-no-filename-investigation.md](../specs/log-no-filename-investigation.md)\n- 結論サマリ: **素の `oimo --log` は完全なサイレント no-op** (エラー・警告・ファイル作成のいずれも発生しない)。ただし後続にトークンがある場合はそのトークンを値として飲み込み、コマンドが誤解釈される。\n\n## 1. 調査対象の仕組み\n\n`--log` は「TUI セッションの各ユーザー発言とアシスタント回答を markdown ファイルに追記する」グローバルフラグ。経路は以下の 4 段階:\n\n```\nindex.ts フラグ定義\n  → middleware で MIMOCODE_LOG に設定 (path.resolve 済み)\n  → sanitizedProcessEnv で TUI worker へ env 伝搬\n  → TUI sync.tsx がターン完了時に session-log.ts の appendSessionLog を呼ぶ\n```\n\n| 段階 | 箇所 | 内容 |\n|------|------|------|\n| フラグ定義 | `packages/opencode/src/index.ts:99` | `.option(\"log\", { describe, type: \"string\" })` — **`requiresArg` なし** |\n| middleware | `packages/opencode/src/index.ts:112-113` | `if (opts.log) process.env.MIMOCODE_LOG = path.resolve(opts.log)` |\n| env 参照 | `packages/opencode/src/flag/flag.ts:71` | `get MIMOCODE_LOG() { return process.env[\"MIMOCODE_LOG\"] }` |\n| worker 伝搬 | `packages/opencode/src/util/mimo-process.ts:19` | `sanitizedProcessEnv` は `process.env` 全体をコピー → `MIMOCODE_LOG` も継承 |\n| 消費側 | `packages/opencode/src/cli/cmd/tui/context/sync.tsx:374` | 完了した assistant ターンごとに `appendSessionLog` を呼ぶ |\n| 書き込み | `packages/opencode/src/cli/cmd/tui/session-log.ts:26-32` | `file` が falsy なら即 return。それ以外は mkdir → appendFile (失敗時は warn のみ) |\n\n## 2. yargs のパース挙動 (実測)\n\nCLI と同等の設定 (`parserConfiguration({ \"populate--\": true })` + `.strict()` + string 型 `--log`、`requiresArg` なし) で yargs 18.0.0 を実測。\n\n| コマンドライン | `log` の値 | その他の結果 | 備考 |\n|---|---|---|---|\n| `oimo --log` | `\"\"` (空文字列) | — | **サイレント no-op になる** |\n| `oimo --log --model x` | `\"\"` | — | 後続の `--flag` は値として消費しない |\n| `oimo --log tui` | `\"tui\"` | `_`: `[]` | **後続のトークンを値として消費** (tui はサブコマンドではなく default コマンドなので TUI 起動自体は続行) |\n| `oimo --log run hello` | `\"run\"` | `project: \"hello\"` | **`run` コマンドが飲み込まれる**。`hello` が TUI の project 位置引数になる (コマンド誤解釈) |\n| `oimo --log=` | `\"\"` | — | 空文字 |\n| `oimo --log \"\"` | `\"\"` | — | 空文字 |\n| `oimo run hello --log` | `\"\"` | `run` 正常、`message: [\"hello\"]` | コマンドの後ろに置けば影響なし |\n| `oimo --log -- file.md` | `\"\"` | — | `--` でも回避不可 (以降のトークンはコマンド位置引数) |\n\n再現スクリプト (bun, packages/opencode 配下で実行):\n\n```js\nimport yargs from \"yargs\"\n\nconst mk = () => yargs([])\n  .parserConfiguration({ \"populate--\": true })\n  .scriptName(\"oimo\")\n  .usage(\"\")\n  .option(\"log\", { describe: \"x\", type: \"string\" })\n  .command(\"$0 [project]\", \"start oimo tui\", (y) => y.option(\"model\", { type: \"string\" }).positional(\"project\", { type: \"string\" }))\n  .command(\"run [message...]\", \"run a prompt\", (y) => y.positional(\"message\", { type: \"string\" }))\n  .strict()\n  .fail((msg, err) => { if (err) throw err; console.log(\"FAIL:\", msg); process.exitCode = 1 })\n\nfor (const argv of [[\"--log\"], [\"--log\", \"--model\", \"x\"], [\"--log\", \"tui\"], [\"--log\", \"run\", \"hello\"], [\"--log=\"], [\"--log\", \"\"], [\"run\", \"hello\", \"--log\"], [\"--log\", \"--\", \"file.md\"]]) {\n  const res = await mk().parse(argv)\n  console.log(JSON.stringify(argv), \"=> log:\", JSON.stringify(res.log), \"| _:\", JSON.stringify(res._), \"| project:\", JSON.stringify(res.project), \"| message:\", JSON.stringify(res.message))\n}\n```\n\n実行出力 (2026-08-06 実測、2 回とも同一結果):\n\n```\n[\"--log\"] => log: \"\" | _: [] | project: undefined | message: undefined\n[\"--log\",\"--model\",\"x\"] => log: \"\" | _: [] | project: undefined | message: undefined\n[\"--log\",\"tui\"] => log: \"tui\" | _: [] | project: undefined | message: undefined\n[\"--log\",\"run\",\"hello\"] => log: \"run\" | _: [] | project: \"hello\" | message: undefined\n[\"--log=\"] => log: \"\" | _: [] | project: undefined | message: undefined\n[\"--log\",\"\"] => log: \"\" | _: [] | project: undefined | message: undefined\n[\"run\",\"hello\",\"--log\"] => log: \"\" | _: [\"run\"] | project: undefined | message: [\"hello\"]\n[\"--log\",\"--\",\"file.md\"] => log: \"\" | _: [] | project: undefined | message: undefined\n```\n\n## 3. ダウンストリーム挙動\n\n### 3.1 `log` が `\"\"` (素の `--log`、`--log=`、`--log \"\"`)\n\n1. `index.ts:112` の `if (opts.log)` は空文字列で **falsy** → `MIMOCODE_LOG` は**設定されない**。\n2. `session-log.ts:27` の `Flag.MIMOCODE_LOG` は `undefined` → `appendSessionLog` は `Promise.resolve()` で即 return。\n3. **結果: ファイル作成も、エラーも、警告も一切発生しない。完全にサイレント no-op。**\n   - `--log` が指定された形跡すら残らない (ログの `args` には残るが、動作上の影響はゼロ)。\n\n### 3.2 `log` が truthy でディレクトリ等を指す場合 (`--log tui` → `\u003ccwd>/tui`)\n\n1. `MIMOCODE_LOG = path.resolve(\"tui\")` = `\u003ccwd>/tui` (ディレクトリ)。\n2. `session-log.ts:30` の `mkdir(path.dirname(file), { recursive: true })` は親ディレクトリなので成功。\n3. `session-log.ts:31` の `appendFile(file, ...)` は EISDIR で失敗。\n4. `session-log.ts:32` の `.catch` が捕捉し `log.warn(\"append failed\", { file, error })` を出すだけ。**TUI は継続** (best-effort 設計)。\n\n### 3.3 正常系 (`--log foo.md`)\n\n設計どおり: 完了した assistant ターンごとに markdown が `foo.md` へ追記される (`formatSessionLogEntry`、同一アシスタントメッセージは `loggedTurns` Set で二重書き込み防止)。\n\n## 4. 考察 (報告のみ、修正提案は本調査のスコープ外)\n\n- ヘルプ表示 (`oimo --help`) では `--log` に `\u003cfile>` プレースホルダーが付かない (`requiresArg` なし)。引数が必須であることがユーザーに伝わらない。\n- 素の `--log` がエラーにならず静かに no-op になるのは、ユーザーに「ログが取れている」と誤認させる危険がある。\n- `oimo --log run hello` のケースは、引数なし指定の副次効果として**コマンド名が値に飲み込まれる**ため、意図と異なる動作 (TUI 起動 + ディレクトリ誤解釈) になる。\n\n## 5. 検証\n\n- 実測スクリプト: §2 の通り 2 回実行し同一出力 (素の `--log` → `log: \"\"`、`--log run hello` → `log: \"run\"`)。\n- ソース参照の行番号はすべて grep で実コードと一致確認済み (§1 表)。\n- 実装コードの変更なし (調査のみ)。\n"},{"path":"compose/reports/plan-mode-edit-write-backstop.md","title":"Plan Mode edit/write Backstop — Final Report","group":"reports","content":"---\nfeature: plan-mode-edit-write-backstop\nstatus: delivered (PR #1330)\nspecs: []\nplans: []\nbranch: fix/plan-mode-edit-write-backstop\ncommits: 9c8f950..HEAD\nrelated: docs/compose/reports/plan-mode-write-restrictions.md (PR #1324, kept as draft for comparison)\n---\n\n# Plan Mode edit/write Backstop — Final Report\n\n> No plan doc was written for this branch; it was implemented directly as a\n> deliberately-simplified alternative to PR #1324. This report is the\n> authoritative record of the final state and the scope decisions.\n\n## Context & Why This Exists\n\nA first attempt (branch `fix/plan-mode-write-restrictions`, PR #1324) hardened\nplan mode by routing `bash`/`change_directory`/`workflow` to `\"ask\"` and forcing\nplan-spawned subagents to a read-only allowlist, on top of the edit/write block.\nIn review it was sound, but a design discussion concluded it overreached:\n\n- **opencode/mimocode favors trusting the model and minimizing user prompts.**\n  The permission layer is a **backstop**, not an active gate.\n- Gating `bash` via `\"ask\"` causes **repeated confirmation prompts** for plainly\n  read-only shell use (`git status`, `ls`, `cat`, running tests), because the\n  codebase has **no read-only-bash classifier** — every non-`cd` command under an\n  `\"ask\"` ruleset prompts. (Claude Code, by contrast, ships a built-in read-only\n  command allowlist and runs those silently; mirroring that is a separate, larger\n  effort.)\n- The model also wasn't told *which* tools were gated — only a vague \"read-only\n  only\" — so it would try `bash`, hit the prompt, and offload the decision to the\n  user.\n\nPR #1324 was therefore set to **draft** (kept for human experts to compare), and\nthis branch implements the minimal backstop.\n\n## What Was Built\n\nThree focused changes:\n\n1. **Root-cause permission fix** (`src/permission/index.ts`). The `ask` loop used\n   to evaluate the agent ruleset and persisted approvals together in one\n   `findLast`, so an `\"always\"`-approved action (e.g. an edit approved in build\n   mode) could out-rank an explicit ruleset `deny` and leak a write through. Now\n   the ruleset is evaluated **alone first** — a `deny` short-circuits — and\n   approvals are consulted only to upgrade an otherwise-`\"ask\"` to `\"allow\"`. This\n   is the genuine root cause of \"edited a file while in plan mode\".\n\n2. **edit/write backstop** (`src/agent/agent.ts`). New `Agent.hardPermission`\n   field (rules re-appended *after* the user/session merge so they always win) and\n   a `runtimePermission(agent, sessionPermission)` helper. Plan's `edit` deny +\n   plan-file allow exception moves out of `permission` (where `user` config was\n   merged last and could override it) into `hardPermission`. A user/session\n   `permission: { edit: \"allow\" }` can no longer relax it. `runtimePermission` is\n   wired into all five evaluation sites: `session/llm.ts` x2 (preapproval +\n   `resolveTools` schema filtering), `session/prompt.ts` x2 (main tool ask + subtask\n   ask), `cli/cmd/debug/agent.ts` x2 (tool-disabled view + ask callback).\n\n3. **Explicit plan prompt** (`src/session/prompt.ts`). Replaced the vague\n   \"no non-readonly tools / READ-ONLY actions only\" reminder with explicit\n   guidance — prefer the dedicated read-only tools (`read`/`grep`/`glob`/`lsp`),\n   and use `bash` only for the gap they can't cover and only when certain it is a\n   pure read (`git status`/`log`/`diff`). The forbidden list is explicit and\n   strict: writes to non-plan files are hard-blocked; `test`/`lint`/`typecheck`/\n   `build` are forbidden by default (lint may be `--fix`, test may write\n   snapshots/db, build writes artifacts) UNLESS the model has verified the exact\n   invocation has no side effects; no commits, no install, no `change_directory`,\n   no `workflow`. It also tells the model to take the\n   read-only action itself rather than push avoidable confirmation prompts onto the\n   user. This is the **model-adherence layer** that complements the permission\n   backstop.\n\n## Architecture\n\n`runtimePermission(agent, session)` = `Permission.merge(agent.permission,\nsession ?? [], agent.hardPermission ?? [])`. Because `hardPermission` is appended\nlast, it wins over any allow a user/session/approval could introduce. The\nmechanism is data-driven — no `agent.name === \"plan\"` checks were added (the\npre-existing plan-mode prompt gate and `tool/plan.ts` check are unrelated to the\npermission mechanism).\n\nPlan's `hardPermission`:\n```\nedit: { \"*\": \"deny\", \".mimocode/plans/*.md\": \"allow\", \u003cdata>/plans/*.md: \"allow\" }\n```\nThe `\"*\":\"deny\"` carries a non-`\"*\"` allow exception, so `Permission.disabled()`\ndoes **not** strip the edit tool from the schema — entering plan mode does not\nmutate the tool list (the prefix-cache concern from PR #1207). All write tools\n(`write`/`edit`/`multiedit`/`apply_patch`/`notebook_edit`) funnel through\n`ctx.ask({ permission: \"edit\" })`, so this single rule governs every file write.\n\n### Scope decisions (vs PR #1324)\n\n- **Only edit/write is enforced at the permission layer.** `bash`,\n  `change_directory`, `workflow` are NOT in `deny`/`ask` — left to the model's\n  discipline + the explicit prompt. This is the \"backstop, not gate\" stance.\n- **No `subagentToolAllowlist` / `READONLY_TOOLS` / actor wiring.** Without bash\n  gating there's no write vector to delegate around, so forcing subagents\n  read-only is unnecessary complexity. Dropped.\n- **Kept** the data-driven `hardPermission` mechanism, the single\n  `runtimePermission` helper at every site, and the persisted-approval root-cause\n  fix — these are correct regardless of scope.\n\n## Usage\n\nNo configuration surface. Entering plan mode applies the edit/write backstop\nautomatically. In plan mode: reads/search/research subagents and read-only bash\nwork normally; editing the plan file is allowed; editing any other file is denied\nat call time and **cannot** be relaxed by user/session config. Side-effecting\nbash/commits/etc. are discouraged by the prompt but not hard-blocked by the\npermission layer.\n\n## Verification\n\n- `bun test test/permission test/agent` — **164 pass / 0 fail**.\n- `bun typecheck` — clean.\n- New tests:\n  - Persisted `\"always\"` approval cannot override a ruleset `deny` (`next.test.ts`).\n  - Plan denies edits except plan files via `runtimePermission` (`agent.test.ts`).\n  - Plan edit deny is a backstop: user config `edit:\"allow\"` + session allow both\n    lose to `hardPermission` (`agent.test.ts`).\n  - Plan keeps the edit tool in the schema — not stripped (`agent.test.ts`).\n  - Plan does NOT restrict bash/change_directory/workflow (`agent.test.ts`).\n  - Build agent unaffected — no `hardPermission` (`agent.test.ts`).\n- Name-check audit: the permission mechanism adds no `=== \"plan\"` checks.\n- `git diff --check` — clean.\n\n## Files Changed\n\n| File | Change |\n|------|--------|\n| `src/permission/index.ts` | ask loop: evaluate ruleset alone before approvals |\n| `src/agent/agent.ts` | `hardPermission` field + `runtimePermission`; plan edit-only backstop |\n| `src/session/llm.ts` | 2 sites -> `runtimePermission` (type->value import) |\n| `src/session/prompt.ts` | 2 sites -> `runtimePermission`; explicit plan reminder |\n| `src/cli/cmd/debug/agent.ts` | 2 sites -> `runtimePermission` |\n| `test/permission/next.test.ts` | persisted-approval-vs-deny test |\n| `test/agent/agent.test.ts` | backstop + scope tests |\n\n## Open / Follow-up\n\n- **Read-only bash classifier** (mirror Claude Code's built-in read-only command\n  allowlist, run silently in plan mode): the richer way to let plan run\n  `git status`/`ls`/tests without prompting. Out of scope here; worth a separate\n  issue if plan-mode shell use becomes friction.\n- **MCP write tools** are outside all of this — MCP calls don't route through the\n  `edit` permission key. Pre-existing, orthogonal, theoretical write vector in\n  plan mode. Track separately.\n- This branch is **PR #1330** (ready for review); PR #1324 (the \"active gate\"\n  approach) is kept as a **draft** for human experts to compare the \"minimal\n  backstop\" vs \"active gate\" approaches.\n"},{"path":"compose/reports/release-0.1.14.md","title":"Report: Release v0.1.14 (operational)","group":"reports","content":"# Report: Release v0.1.14 (operational)\n\n- Status: Complete\n- Date: 2026-08-07\n- Spec: [release-0.1.14.md](../specs/release-0.1.14.md)\n\n## 実施内容\n\nv0.1.14 を GitHub Releases として公開した。旧 publish.yml (workflow_dispatch) 方式の最終実行。\n\n- バージョン: **v0.1.14** (`./script/release --version 0.1.14` — package.json が 0.1.10 のままのため\n  明示指定でカット。タグ v0.1.13 の次)\n- 公開日時: **2026-08-07T13:12:55Z** (draft=false, prerelease=false)\n- アセット: **12 アーカイブ** (darwin-arm64 / darwin-x64 / darwin-x64-baseline / linux-arm64 /\n  linux-arm64-musl / linux-x64 / linux-x64-baseline / linux-x64-baseline-musl / linux-x64-musl /\n  windows-arm64 / windows-x64 / windows-x64-baseline) + **SHA256SUMS**\n- URL: https://github.com/kuwa2005/oimo/releases/tag/v0.1.14\n\n## 経過\n\n1. 初回 run 31180686914 が publish ジョブの SHA256SUMS ステップで失敗\n   (`could not find any host configurations` — ステップ単位 env の `$TAG`/`$GH_REPO` が空で\n   `gh release download \"\" --repo \"\"` が実行されたため)。\n2. 修正 `fa73539ac` (env をジョブレベルへ移動) → 新規 dispatch (run 31181344253) で成功。\n   `gh run rerun --job` は元のワークフローファイルを再現するため修正は反映されない (この gh 版に\n   --latest なし) — 新規 dispatch でのみ有効と実証済み。\n3. ユーザーがローカルコマンドを中断した後もワークフローは完走 (abort はローカル watch のみを殺す)。\n4. draft 検証用に作った `v0.1.14` draft は `gh release delete --cleanup-tag` で削除\n   (タグ ref 不在の HTTP 422 が返るが削除自体は成功 — 未公開 draft のため安全)。\n\n## 検証\n\n- run 31181344253: **SUCCESS** (3m33s、12 build-cli ジョブ + publish)\n- `gh release view v0.1.14`: 12 アセット + SHA256SUMS、draft=false\n- インストーラー検証は 2026-08-06 の release-installer.test.ts 10/10 (継続的に green)\n\n## キーレッスン (次回以降に承継)\n\n- publish.yml (dispatch 方式) は本リリースをもって廃止 — 以降はタグプッシュ方式 (release.yml) へ移行。\n- ワークフロー修正の反映は常に新規発火 (rerun は古いファイルを再現)。\n"},{"path":"compose/reports/release-build-matrix-test.md","title":"Report: リリースビルドの並列化 (build matrix) + リリースノウハウのドキュメント化・スクリプト化","group":"reports","content":"# Report: リリースビルドの並列化 (build matrix) + リリースノウハウのドキュメント化・スクリプト化\n\n- 日付: 2026-08-06\n- Spec: docs/compose/specs/release-build-matrix.md (Requirements Lock Approved 2026-08-06)\n- 状態: **実装完了・検証済み**\n\n## 概要\n\nユーザー依頼「毎回リリースに手間取っていないか?」と続く指示「迷わずビルドし、リリースまで進められるように\nノウハウをドキュメントにまとめて、次からそれを参照するようにして。スクリプト化できるならスクリプト化も考慮」に\n応え、以下を実装した。\n\n1. **build matrix 並列化** — publish.yml の build-cli を 12 ターゲットの並列ジョブ化 (ウォールクロック短縮)。\n2. **リリースランブック** — docs/RELEASING.md (日本語) 新規作成。\n3. **script/release ワンストップ化** — プリフライト → 発火 → 監視 → サマリ。\n4. **将来参照の仕組み** — AGENTS.md + プロジェクト MEMORY.md (## Rules) に参照を記録。\n\nスキル化 (SKILL.md) はユーザー指示により行わない。\n\n## 実装内容\n\n### 1. packages/opencode/script/targets.ts (NEW)\n\n12 ターゲット定義と名前計算を一元化した純関数モジュール (副作用なし、テストから直接 import 可能)。\n\n- `ALL_TARGETS: Target[]` — 12 ターゲット (linux/darwin/win32 × arm64/x64 × baseline/musl)。\n- `targetName(item)` — アセット名計算。**接尾辞順は baseline → musl** (例: `oimo-linux-x64-baseline-musl`)。\n  実リリースのアセット名と一致させるため、元 build.ts の順序を維持 (インストーラー依存のため不変)。\n- `filterTargets(targets, filter)` — `MIMOCODE_TARGETS` の絞り込み。`oimo-` プレフィックス付き・無しの\n  両形式を受け付ける (`oimo-linux-x64` / `linux-x64`)。空フィルタなら全ターゲット (後方互換)。\n\n### 2. packages/opencode/script/build.ts (編集)\n\n- インラインの allTargets 配列と名前計算を削除し、targets.ts の import に置換。\n- `MIMOCODE_TARGETS` env を追加。`singleFlag` でない場合、`filterTargets(allTargets, targetFilter)` で\n  絞り込み (未指定 = 従来どおり全 12 ターゲット)。\n- リリースアップロード: `targetFilter.length === 0` (全ビルド) のときのみ SHA256SUMS を build.ts 内で生成。\n  matrix ジョブはアセットのみアップロード (SHA256SUMS は publish ジョブで一元生成 — 分散ビルドの競合回避)。\n\n### 3. .github/workflows/publish.yml (編集)\n\n```\nversion (バージョン決定・bump・push・ドラフト作成)\n   ↓\nbuild-cli: strategy.matrix.target × 12 (ubuntu-latest 並列、fail-fast: false)\n   各ジョブ: MIMOCODE_TARGETS=${{ matrix.target }} で 1 ターゲットのみビルド+アップロード (+FDS)\n   ↓\npublish: gh release download --pattern 'oimo-*' → checksums.ts で集約 SHA256SUMS 生成 → upload --clobber\n        → npm publish (NPM_TOKEN 存在時) → gh release edit --draft=false (finalize)\n```\n\n### 4. script/release (全面拡張)\n\n`script/release [major|minor|patch] [--version X.Y.Z] [--no-watch] [--help]`\n\n1. プリフライト: gh インストール/認証 (`gh auth status`) 確認 (失敗時 exit 1)、未コミット変更の警告、\n   シークレット状況表示 (`gh secret list` から NPM_TOKEN / MIMO_FDS_AK / MIMO_FDS_SK の有無を警告)。\n2. 発火: `gh workflow run publish.yml -f bump=\u003ctype> [-f version=\u003cver>]`、run URL 表示。\n3. 監視: `gh run watch --exit-status` (失敗時 `--log-failed` 表示 + exit 1)、`--no-watch` でスキップ。\n4. 結果: ジョブ別サマリ (`gh run view`) + リリース URL 表示。末尾に「docs/RELEASING.md 参照」を表示。\n\n### 5. docs/RELEASING.md (NEW, 日本語ランブック)\n\n概要 / 前提条件 (シークレット一覧と省略時挙動) / リリース手順 (script/release の使い方) /\nバージョン決定規則 / ワークフロー各ジョブの動作 / アセットと SHA256SUMS・インストーラー検証 /\nnpm per-platform 配布 / FDS ミラー / トラブルシュート表 / 開発・デバッグ用コマンド。\n\n### 6. AGENTS.md + プロジェクト MEMORY.md (編集)\n\n- AGENTS.md: 「Release procedure and troubleshooting live in `docs/RELEASING.md` (Japanese). Cut a\n  release with `./script/release \u003cmajor|minor|patch>` — consult the runbook first.」を追記。\n- MEMORY.md ## Rules: 「リリース手順・トラブルシュートは `docs/RELEASING.md` を参照…」を追記。\n\n## テスト結果\n\n実行: `bun test --timeout 30000 test/cli/release-build-matrix.test.ts` → **23 pass / 0 fail (61 expect)**\n\n| ID | 内容 | 結果 |\n|---|---|---|\n| T1 | targetName が 12 アセット名を計算 (win32→windows、baseline→musl 順) | PASS |\n| T1b | 接尾辞・OS 変換の単体 | PASS |\n| T2 | filterTargets 空フィルタ = 全ターゲット | PASS |\n| T2b | 単一ターゲット選択 | PASS |\n| T2c | 複数カンマ区切り選択 | PASS |\n| T2d | 未知名は無視 | PASS |\n| T2e | **プレフィックスなし (matrix 形式 `linux-x64`) の一致** | PASS |\n| T3 | publish.yml: workflow_dispatch 維持 | PASS |\n| T3b | build-cli が 12 ターゲット matrix | PASS |\n| T3c | MIMOCODE_TARGETS 受け渡し | PASS |\n| T3d | 依存チェーン version → build-cli → publish | PASS |\n| T3e | publish ジョブの集約 SHA256SUMS 再生成 | PASS |\n| T3f | finalize (--draft=false) | PASS |\n| T3g | npm publish の NPM_TOKEN ガード | PASS |\n| T4 | build.ts が MIMOCODE_TARGETS を参照 | PASS |\n| T4b | 全ビルド時のみ SHA256SUMS 生成 (matrix はスキップ) | PASS |\n| T4c | targets.ts ヘルパー再利用 | PASS |\n| T5 | script/release: --no-watch / watch / プリフライト / ランブック参照 | PASS |\n| T5b | `--help` スパウン exit 0 + usage | PASS |\n| T5c | 未知引数スパウン exit 1 + stderr usage | PASS |\n| T6 | docs/RELEASING.md 必須セクション存在 | PASS |\n| T7 | AGENTS.md が docs/RELEASING.md を参照 | PASS |\n| T7b | targets.ts が副作用なしで import 可能 | PASS |\n\n## 検証 (回帰・実機)\n\n| 検証 | コマンド | 結果 |\n|---|---|---|\n| typecheck | `bun typecheck` (packages/opencode, tsgo) | PASS |\n| 既存リリーステスト | `bun test --timeout 30000 test/cli/release-installer.test.ts` | 10/10 PASS |\n| 回帰 | `bun test --timeout 30000 test/cli/` | **374 pass / 4 fail (54 ファイル)** — 4 fail は既知の `voice` ネットワークタイムアウト (環境要因、本タスクと無関係) |\n| 実ビルド | `MIMOCODE_TARGETS=linux-x64 MIMOCODE_VERSION=0.0.0-test bun packages/opencode/script/build.ts` | linux-x64 単一ターゲットがビルドされ、スモークテスト (`dist/oimo-linux-x64/bin/oimo --version`) 成功。matrix モードで SHA256SUMS が生成されないことも確認 |\n| スクリプト | `./script/release --help` | exit 0、usage + runbook 参照を表示 |\n\n## リリース実行手順 (変更後)\n\n```bash\n# シークレット設定後 (NPM_TOKEN / MIMO_FDS_AK / MIMO_FDS_SK)\n./script/release              # patch リリース (プリフライト→発火→監視→サマリ)\n./script/release minor        # minor\n./script/release --version 0.1.14   # バージョン直接指定\n./script/release --no-watch   # 発火のみ\n```\n\n発火後は workflow が 12 ターゲットを並列ビルド → 集約 SHA256SUMS → npm publish → リリース公開まで自動実行。\n詳細は docs/RELEASING.md。\n\n## 知見\n\n- **アセット名の接尾辞順は baseline → musl** (`oimo-linux-x64-baseline-musl`)。元 build.ts の順序を\n  targets.ts で維持した。matrix のターゲット名を `linux-x64-baseline-musl` に合わせ、テストも実アセット名と\n  一致させる必要がある (初回テストで `-musl-baseline` と誤記 → 修正)。\n- **matrix のターゲット名はプレフィックスなし** (`linux-x64`) だが targetName は `oimo-` 付きを返す。\n  filterTargets は両形式を受け付ける実装とした (初回実ビルドでフィルタ不一致を実測し修正)。\n- **SHA256SUMS は matrix ジョブでは生成しない** (部分チェックサムの競合回避)。publish ジョブが\n  `gh release download --pattern 'oimo-*'` で全アセットを取り直し、`checksums.ts` (stdout 出力) で\n  単一の正を生成して `--clobber` アップロードする。`oimo-*` パターンは SHA256SUMS 自身を除外するため\n  再実行でも安全。\n- ローカル全ビルド (MIMOCODE_TARGETS 未指定) は従来どおり build.ts 内で SHA256SUMS を生成 —\n  matrix 導入後も後方互換。\n"},{"path":"compose/reports/release-tag-trigger-test.md","title":"Report: Tag-triggered release workflow (release.yml)","group":"reports","content":"# Report: Tag-triggered release workflow (release.yml)\n\n- Status: Complete\n- Date: 2026-08-07\n- Spec: [release-tag-trigger.md](../specs/release-tag-trigger.md) (Requirements Lock: Approved — never-ask 自律承認)\n\n## 実施内容\n\nリリース制御を GitHub Actions へ完全移譲。`v*` タグの push をトリガーに自動ビルド・公開する\n`.github/workflows/release.yml` を新設し、旧 dispatch 方式 (`publish.yml` + `script/release` の\n`gh workflow run`) を廃止した。\n\n| 変更 | 内容 |\n|---|---|\n| `.github/workflows/release.yml` (新規) | `on: push.tags: [\"v*\"]` / `permissions: contents: write` / build-cli (12 ターゲット matrix) → assemble (download-artifact → SHA256SUMS → changelog → **softprops/action-gh-release@v2** (draft: false) → npm ガード) |\n| `packages/opencode/script/build.ts` | `gh release upload` を `MIMOCODE_SKIP_UPLOAD` でゲート (アーカイブ生成・FDS は維持) |\n| `script/bump.ts` (新規) | `nextVersion` 純関数 + CLI: バージョン決定 → `bumpVersions` → git commit → stdout 出力 |\n| `script/release` (bash) | bump → ブランチ push → タグ vX.Y.Z push → release.yml の run 検出 → `gh run watch` |\n| 削除 | `.github/workflows/publish.yml` / `script/version.ts` / `script/release.ts` |\n| `docs/RELEASING.md` | タグプッシュ方式に全面改訂 (ジョブ動作・トラブルシュート・開発コマンド) |\n| `AGENTS.md` / プロジェクト MEMORY.md | リリース手順の参照行をタグプッシュ方式に更新 |\n\n## テスト結果 (V1–V4)\n\n| ID | コマンド | 結果 |\n|---|---|---|\n| V1 | `bun test --timeout 30000 test/cli/release-build-matrix.test.ts` | **27 pass / 0 fail** (83 expect) |\n| V2 | `bun test --timeout 30000 test/cli/release-installer.test.ts` | **10 pass / 0 fail** (44 expect) |\n| V3 | `bun test --timeout 30000 test/cli/` (回帰) | **386 pass / 4 fail** — 4 fail は全て既知の `voice` ネットワークタイムアウト (環境要因、前回から不変) |\n| V4 | `bun typecheck` (packages/opencode) | **PASS** |\n\nテスト仕様 T1–T9 の内訳: T1–T2e (targets.ts、維持) / **T3–T3i** (release.yml 静的:\nv* トリガー、workflow_dispatch なし、12 matrix、assemble `needs: build-cli`、checksums 集約、\nsoftprops + draft:false + contents:write、npm ガード、upload/download-artifact、SKIP_UPLOAD + タグ由来\nバージョン) / T4–T4d (build.ts: MIMOCODE_TARGETS、SHA256SUMS、targets.ts 再利用、SKIP_UPLOAD ゲート) /\nT5–T5c (script/release: bump.ts・git tag・push・watch・`gh workflow run publish.yml` なし) /\nT6–T7b (RELEASING.md・AGENTS.md) / **T8** (nextVersion 純関数ユニット) / T9 (release-installer T5\n改修: script/version.ts 参照の除去)。\n\n## ワークフロー検証 (V5–V6)\n\n| ID | 検証 | 結果 |\n|---|---|---|\n| V5a | actionlint `.github/workflows/release.yml` | **exit 0** (クリーン) |\n| V5b | push 後の `gh api repos/kuwa2005/oimo/actions/workflows` で **release.yml の登録を確認** | コミット・push 後に実施 (本レポート末尾に追記) |\n| V6 | 実タグ push でのトリガー実証 | **実施しない** — 公開リリースが即座に作られるため。登録確認 + actionlint + 静的テスト (T3–T3i) で担保 |\n\n## 既知の制約\n\n- npm 公開は `NPM_TOKEN` 未設定のため CI ではスキップ (リポジトリにシークレット 0 件の現状を維持。\n  警告付きで GitHub リリース自体は完了)。FDS も同様。\n- 実タグでの E2E トリガー実証は公開リリースを伴うため行っていない。登録確認で担保する。\n\n## キーレッスン\n\n- タグトリガーのワークフローは**リリース作成前**にビルドが走るため、従来の `gh release upload`\n  (build.ts の Script.release ブロック) は失敗する。`MIMOCODE_SKIP_UPLOAD` ゲートで\n  「アーカイブ生成のみ」にし、softprops フロー (upload-artifact → download-artifact →\n  softprops/action-gh-release) へ切り替えた。\n- バージョンの真実をタグ (`${GITHUB_REF_NAME#v}`) に置くことで、workflow 内の version job と\n  それに伴う detached HEAD push / 非 fast-forward rebase の問題を構造的に排除した。\n- 本リポジトリでは GitHub のワークフロー登録がファイル名+内容ハッシュでキャッシュされ、拒否が\n  サイレントに起きる実績があるため、**push 後の登録確認は必須工程**として RELEASING.md に追記した。\n"},{"path":"compose/reports/releases-installer-test.md","title":"Report: GitHub Releases パイプライン追加 + インストーラー更新 (テスト結果)","group":"reports","content":"# Report: GitHub Releases パイプライン追加 + インストーラー更新 (テスト結果)\n\nDate: 2026-08-06\nAuthor: compose agent (SE mode)\nSpec: [docs/compose/specs/releases-installer.md](../specs/releases-installer.md) (Status: Approved)\n\n## 概要\n\n「releasesを追加、インストーラーを更新」に対し、以下を実装・検証した:\n\n1. **publish.yml ワークフロー新設** — `workflow_dispatch` のみ (bump major/minor/patch + version 上書き)。jobs: `version` (バージョン算出 + 全 package.json bump + commit/push + ドラフトリリース作成) → `build-cli` (全 12 ターゲットビルド + SHA256SUMS + gh/FDS アップロード) → `publish` (npm publish + リリース finalize)。NPM_TOKEN 不在時は npm をスキップして警告 (repo シークレット空のため必須)。\n2. **バージョン整合性回復** — `script/bump-version.ts` (純関数 `bumpVersions`) を新設し、version.ts がリリース作成**前**に bump + commit + push するように変更。publish.ts のインライン書き換えもヘルパー共用に置換。git バージョン (0.1.10) とタグ (v0.1.13) の乖離の根因を解消。\n3. **SHA256 チェックサム検証** — `script/checksums.ts` (純関数 `sha256Sums`、sha256sum -c 互換 `\"\u003chex>  \u003cname>\"`、ソート) を新設。build.ts のリリースパスで `SHA256SUMS` を生成し gh/FDS アップロードに含める。\n4. **インストーラー更新** — `install` (bash) / `install-utf8.ps1` に `OIMO_BASE_URL` 対応 + `verify_checksum` (不一致 = exit 1、404/エントリ無し = 警告+継続、macOS `shasum -a 256` フォールバック)。install.ps1 を再生成。\n5. **changelog.ts 修正** — 存在しない `opencode run --command changelog` を廃止し、git log (`--from` 既定 = 最新タグ) + 純関数 `renderChangelog` (conventional-commit グループ化) に置換。\n6. **setup-bun 修正** — `bun install` → `bun ci` (AGENTS ルール整合)。\n\n## テスト結果\n\n実行コマンド: `bun test --timeout 30000 test/cli/release-installer.test.ts` (workdir = packages/opencode)\n\n| ID | 内容 | 結果 |\n|----|------|------|\n| T1 | `sha256Sums` 単体 (`\"\u003chex>  \u003cname>\"`・ソート・ハッシュ一致) | **PASS** |\n| T1b | `bumpVersions` 単体 (node_modules/dist 除外・一括書換) | **PASS** |\n| T2 | インストーラー E2E 正常系 (偽リリースサーバ + OIMO_BASE_URL + チェックサム一致) | **PASS** |\n| T3 | インストーラー E2E 改竄 (チェックサム不一致 → exit 1、インストール中断) | **PASS** |\n| T4 | インストーラー E2E SHA256SUMS 不在 (警告 + 継続、後方互換) | **PASS** |\n| T5 | publish.yml 静的検証 (dispatch / bump choice / env / jobs / npm skip) | **PASS** |\n| T6 | install.ps1 再生成決定性 (byte-for-byte + Get-FileHash/OIMO_BASE_URL/SHA256SUMS 含有) | **PASS** |\n| T7 | `renderChangelog` 単体 (グループ化 / プレフィックス除去 / 空入力) | **PASS** |\n\n**10 pass / 0 fail (46 expect calls)**\n\n## その他の検証\n\n| 項目 | コマンド | 結果 |\n|------|----------|------|\n| 型検査 | `bun typecheck` (packages/opencode) | **PASS** |\n| 回帰 | `bun test --timeout 30000 test/cli/` (53 ファイル) | **351 pass / 4 fail** — 4 件は全て既知の `voice > processVoiceControl` ネットワークタイムアウト (環境要因、`test/cli/tui/voice.test.ts` 単独実行で 33/4 を確認、本変更と無関係) |\n| checksums スモーク | `bun script/checksums.ts /tmp/chk_a.txt /tmp/chk_b.txt` | 出力が `sha256sum` とバイト一致・ファイル名ソート順 |\n| changelog スモーク | `bun script/changelog.ts --from v0.1.11 --to v0.1.13 --print` | グループ化 (Features/Fixes/Other) を確認。タグ後コミット無しレンジ (v0.1.13..HEAD) は \"No notable changes\" (正しい) |\n| install.ps1 同期 | `bun script/build-install-ps1.ts` + T6 | 再生成 = コミット済み install.ps1 とバイト一致 |\n\n## 変更ファイル\n\n**新規**\n- `.github/workflows/publish.yml`\n- `script/checksums.ts`\n- `script/bump-version.ts`\n- `packages/opencode/test/cli/release-installer.test.ts`\n- `docs/compose/specs/releases-installer.md` (本タスクの spec)\n\n**変更**\n- `script/version.ts` — bump + commit + push → sha 再取得 → changelog → `gh release create -d --target`\n- `script/publish.ts` — インライン version 書換を `bumpVersions` に置換\n- `script/changelog.ts` — 全面書き換え (git log + renderChangelog)\n- `packages/opencode/script/build.ts` — リリースパスで SHA256SUMS 生成・アップロード + FDS コメント修正 (OIMO_BASE_URL 言及)\n- `install` / `install-utf8.ps1` / `install.ps1` — OIMO_BASE_URL + チェックサム検証\n- `.github/actions/setup-bun/action.yml` — `bun install` → `bun ci`\n\n## リリース実行手順 (ユーザー手動、不可逆操作のため自動カットはしない)\n\n1. repo シークレット追加 (Settings → Secrets and variables → Actions):\n   - `NPM_TOKEN` (npmjs.com access token、publish 権限) — 未設定時は npm がスキップされる\n   - `MIMO_FDS_AK` / `MIMO_FDS_SK` (および任意で `MIMO_FDS_ENDPOINT` / `MIMO_FDS_BUCKET` / `MIMO_FDS_PREFIX`) — 未設定時は FDS ミラーがスキップされる\n2. リリースカット: `GH_REPO=kuwa2005/oimo ./script/release patch` (または major / minor)。バージョン固定は publish.yml の `version` input で上書き可能。\n3. ワークフローが バージョン bump → ビルド (12 ターゲット) → アセット+SHA256SUMS アップロード → npm publish → リリース finalize を実行。\n\n## 知見\n\n- `script/release` は既に `gh workflow run publish.yml` を発火する設計 — publish.yml 追加でそのまま有効化された。\n- npm は per-platform パッケージ (`@mimo-ai/oimo-\u003cplatform>-\u003carch>`) で配布されており、GitHub リリースアセットは curl/irm インストーラー専用。SHA256SUMS もインストーラー検証専用。\n- インストーラーの検証は「404/エントリ無し = 警告+継続」で後方互換 (v0.1.10–13 には SHA256SUMS 無し)。\n- publish.yml の version job は checkout が detached HEAD になるため、push は `git push origin HEAD:\u003cbranch>` (GITHUB_REF_NAME フォールバック) で明示している。\n- テスト T2–T4 は `OIMO_BASE_URL` を偽リリースサーバ (Bun.serve) に向けることで、GitHub に触れずにインストール→検証→失敗系を E2E 検証できる。\n"},{"path":"compose/reports/sticky-agent-mode.md","title":"Sticky Agent Mode — Final Report","group":"reports","content":"---\nfeature: sticky-agent-mode\nstatus: proposed\nspecs: []\nplans: []\nbranch: feat/sticky-agent-mode\n---\n\n# Sticky Agent Mode — Final Report\n\n## What Was Built\n\nAn experimental mode-locking system where agent selection is permanent for the duration of a session. Once a session has content (any user message), the user cannot switch to a different mode group. Build, Plan, and Compose form a single free-switch group; other agents (Orchestrator, Max, custom primaries, etc.) are isolated — once you're in one of those, you stay until `/new` (or `agent_force`).\n\n> **Update:** Compose was originally isolated from Build/Plan. That trapping users in Compose mid-session was not the intended product behavior; Compose is now in `FREE_SWITCH_GROUP` with Build and Plan.\n\nThree supporting changes enable a clean per-mode experience:\n\n1. **Permission-based skill scoping** — compose skills use `deny`/`allow` permissions instead of `hidden: true`\n2. **Plan tools scoped to build/plan** — `plan_enter`/`plan_exit` denied by default, allowed only for build/plan (keeping compose's tool list clean)\n3. **Removed `composeSkillsBlock()` injection** — compose skills appear naturally in the system prompt via `available(agent)`\n\n## Architecture\n\n### Sticky Mode (TUI)\n\n**File:** `packages/opencode/src/cli/cmd/tui/context/local.tsx`\n\n- `agentStore.sessionHasMessages` — reactive boolean derived from `!!lastUserMessage()`\n- `FREE_SWITCH_GROUP = [\"build\", \"plan\", \"compose\"]` — agents that can freely switch between each other\n- `canSwitchTo(target)` — returns true if: no messages yet, OR target is self, OR both current and target are in the same group\n- `set(name)` — unguarded, for system/programmatic use (session restore, plan tools, CLI)\n- `userSwitch(name)` — guarded, for user actions (dialog, voice). Shows contextual toast when blocked\n- `move(direction)` — cycles through agents, skipping blocked ones. Toast only when no valid target exists\n- `switchBlockedToast()` — shows subset message (build/plan/compose group) or locked message (isolated agent)\n\n**File:** `packages/opencode/src/cli/cmd/tui/component/prompt/index.tsx`\n\n```ts\ncreateEffect(() => {\n  local.agent.setSessionHasMessages(!!lastUserMessage())\n})\n```\n\nSingle reactive effect — no manual lock/unlock. Naturally handles `/new` (empty session = unlocked), `/session` (has messages = locked), and message submission.\n\n### Permission-Based Skill Scoping\n\n**File:** `packages/opencode/src/agent/agent.ts`\n\n- `defaults` includes `skill: { \"*\": \"allow\", \"compose:*\": \"deny\" }`\n- Compose agent overrides with `skill: { \"compose:*\": \"allow\" }`\n\n**File:** `packages/opencode/src/skill/index.ts`\n\n- `Skill.available()` no longer filters `!sk.hidden` — relies entirely on permission\n\n### Plan Tools Scoping\n\n**File:** `packages/opencode/src/agent/agent.ts`\n\n- `defaults` includes `plan_enter: \"deny\"`, `plan_exit: \"deny\"`\n- Build agent: `plan_enter: \"allow\"`, `plan_exit: \"allow\"`\n- Plan agent: `plan_enter: \"allow\"`, `plan_exit: \"allow\"`\n- Both agents see BOTH tools (symmetric, no list mutation on build↔plan switch)\n\n**No registry.ts changes needed** — `llm.ts:resolveTools()` already uses `Permission.disabled()` to strip denied tools before sending them to the model. The permission rules in agent.ts are sufficient.\n\n### Compose Prompt Cleanup\n\n**File:** `packages/opencode/src/session/prompt.ts`\n\n- `composeSkillsBlock()` import and call removed\n- Only `{{compose_docs_dir}}` substitution remains in PROMPT_COMPOSE\n\n**File:** `packages/opencode/src/session/prompt/compose.txt`\n\n- \"Compose Skills Visibility\" section simplified: skills are in the normal listing\n- Subagent guidance: \"distill instructions into prompts\"\n\n### Design Decisions\n\n**`set()` vs `userSwitch()` separation:** The guard only applies to user-initiated actions (Tab, dialog, voice). System paths (session restore, plan_enter/plan_exit, CLI --agent) use `set()` directly and are never blocked. This avoids a fragile whitelist of \"force\" call sites.\n\n**Reactive `sessionHasMessages` from `lastUserMessage()`:** No manual lock/unlock state. The signal is derived from actual session content, so `/new`, `/session`, and submits all work correctly without explicit handling.\n\n**`move()` skips blocked agents:** Tab cycles within the allowed group instead of stopping at the first blocked agent. Toast only shows when the entire group has been exhausted (e.g., orchestrator mode with no other agents in that group).\n\n**Self-switch always allowed:** `canSwitchTo` returns true when `current === target`. Prevents false toast on no-op switches (e.g., compose user selecting compose in `/agents` dialog).\n\n**Contextual toast messages:** Two variants — \"只能在 build, plan, compose 之间切换\" when in the group but target is outside, \"进入 {{mode}} 模式后无法切换\" when isolated with no valid targets.\n\n**Plan tools: symmetric allow in build/plan, deny in defaults:** Future agents automatically inherit the deny. Build and plan both see both tools (no list mutation within the group). This is NOT a revert of #1207 — #1207 made plan tools visible to ALL agents; this scopes them to the build/plan group only, possible because sticky mode prevents cross-group switching.\n\n**Permission in defaults (deny) + specific agent override (allow):** Used for both skills (`compose:*`) and tools (`plan_enter`/`plan_exit`). Future agents automatically inherit all deny rules. Only the relevant agent explicitly opts in.\n\n## Usage\n\n- **New session:** Mode selector works normally (Tab cycles all agents)\n- **After first message:** Mode is locked to the current group\n  - Build/Plan/Compose: Tab cycles among them. Toast when trying to reach Orchestrator (or other out-of-group agents)\n  - Orchestrator (etc.): Tab shows toast — cannot switch mid-session\n- **`/new`:** Creates empty session → mode unlocked again\n- **`/session`:** Enters existing session → mode locked to that session's agent\n- **Self-switch:** Always allowed (no-op, no toast)\n\n## Verification\n\n- `bun typecheck` — clean\n- `bun test test/session/prompt-skill-mention.test.ts` — 8/8 pass\n- `bun test test/permission` — 141/141 pass\n- `bun test test/agent/agent.test.ts` — 48/48 pass\n\n## Design Notes\n\nKey constraints that shaped the final approach:\n\n- Guard must separate system paths (`set()`) from user actions (`userSwitch()`) — putting the guard directly in `set()` requires a fragile whitelist for session restore, plan tools, and CLI\n- Sticky state must be **derived** (`!!lastUserMessage()`), not manually managed — a boolean `lock()` breaks on `/new` and `/session` transitions\n- `move()` must skip blocked agents rather than stopping — otherwise Tab appears broken when the next agent in order is blocked\n- Plan tools use the existing `Permission.disabled()` pipeline in `llm.ts:resolveTools()` — no registry changes needed\n"},{"path":"compose/reports/task-spawn-rendering.md","title":"Task Component Async Actor Rendering — Final Report","group":"reports","content":"---\nfeature: task-spawn-rendering\nstatus: delivered\nspecs: []\nplans:\n  - docs/compose/plans/2025-07-01-fix-task-component-spawn-rendering.md\nbranch: fix/task-spawn-rendering\ncommits: 7ea754e..781abf0\n---\n\n# Task Component Async Actor Rendering — Final Report\n\n## What Was Built\n\nThe `Task` component in the TUI now correctly renders actor tool calls across all operation types (`run`, `spawn`, `wait`, `cancel`, `status`). Previously, spawned background actors immediately showed as \"completed · 0ms\" while still running, and `wait`/`cancel` operations rendered as bare spinners with no context. The fix checks the actor's actual runtime status from the sync store registry, displays appropriate state (spinner while running, completed format when done), and labels each operation type clearly.\n\n## Architecture\n\nAll changes are in a single file: `packages/opencode/src/cli/cmd/tui/routes/session/index.tsx`, within the `Task` function (lines 2721–2848).\n\n**New memos added:**\n\n| Memo | Purpose |\n|------|---------|\n| `inputActorId` | Extracts `actor_id` from input for wait/cancel/status operations |\n| `inputAction` | Extracts `action` field (run/spawn/wait/cancel/status) |\n| `actorEntry` | Looks up the actor in `sync.data.actor[sessionID]` registry by ID |\n| `actorStatus` | Derives the actor's actual runtime status from the registry entry |\n| `resolvedDescription` | Falls back to actor registry description when input has none |\n\n**Modified memos:**\n\n| Memo | Change |\n|------|--------|\n| `targetSession` | Added fallback to `actorEntry().session_id` for ops without metadata |\n| `targetBucket` | Added fallback to `inputActorId()` for ops without metadata |\n| `isRunning` | Now returns `true` when tool part is \"completed\" but actor is still running/pending |\n| `content` | Renders action-specific headers and respects actual actor status |\n\n### Design Decisions\n\n- **Actor registry as source of truth** — Rather than trying to infer running state from message timing or tool part status alone, the component reads the actor's actual status from `sync.data.actor`. This is reliable because the sync store receives `actor.status` events in real-time.\n\n- **Unified Task component for all actor operations** — All actor tool calls (`run`, `spawn`, `wait`, `cancel`, `status`) render through the same `Task` component with differentiated labels, rather than splitting into separate components. This keeps navigation (click-to-view-subagent) working consistently.\n\n- **Labels per action type** — Each operation gets a distinct header format so the user can immediately understand what's happening without reading tool output.\n\n## Usage\n\nNo configuration needed. The rendering is automatic based on the actor tool call's action:\n\n| Action | Running State | Completed State |\n|--------|--------------|-----------------|\n| `run` | `⠋ General Task — \u003cdesc>` + live activity | `│ General Task — \u003cdesc>` + `└ N toolcalls · Xs` |\n| `spawn` | `⠋ Background Explore Task — \u003cdesc>` + live activity | `│ Background Explore Task — \u003cdesc>` + `└ N toolcalls · Xs` |\n| `wait` | `⠋ Waiting for — \u003cdesc>` + live activity | `│ Waiting for — \u003cdesc>` + `└ N toolcalls · Xs` |\n| `cancel` | `⠋ Cancelling — \u003cdesc>` | `│ Cancelled — \u003cdesc>` + `└ N toolcalls · Xs` |\n\nWhen an actor is cancelled, non-cancel operations append `(cancelled)` to their header.\n\n## Verification\n\n- Typecheck: `bun typecheck` passes with zero errors\n- Manual testing: spawn + wait + cancel flow verified in live TUI session\n  - Background tasks correctly show spinner with live tool activity (not \"0ms completed\")\n  - Wait operations show \"Waiting for — \" with live activity from the actor\n  - Cancel shows \"Cancelling\" → \"Cancelled\" transition\n  - Normal synchronous `run` operations render unchanged\n\n## Journey Log\n\n> Brief notes on what informed the final design.\n\n- [lesson] Tool part \"completed\" status doesn't mean the actor finished — for `spawn`, the tool part completes immediately while the actor runs in background. Always cross-check `sync.data.actor` registry.\n- [pivot] Initially rendered `wait` as a minimal one-liner, then expanded to full info with live activity after user feedback — both spawn and wait benefit from showing the same real-time tool activity.\n- [lesson] \"Cancelling\" vs \"Cancelled\" distinction matters — the cancel tool part has a brief \"running\" phase before completing, so showing the transition gives correct feedback.\n\n## Source Materials\n\n| File | Role | Notes |\n|------|------|-------|\n| `docs/compose/plans/2025-07-01-fix-task-component-spawn-rendering.md` | Implementation plan | Covered Task 1 and Task 2 |\n"},{"path":"compose/reports/tui-model-selector-search.md","title":"TUI Model Selector Search — Final Report","group":"reports","content":"---\nfeature: tui-model-selector-search\nstatus: delivered\npr: https://github.com/XiaomiMiMo/MiMo-Code/pull/932\nbranch: fix/model-selector-search-ui\ncommits: 83ca130..ee30bc0\n---\n\n# TUI Model Selector Search — Final Report\n\n## What Was Built\n\nRestored the search input box in the TUI model selector dialog (`/models` command). The search box was hidden due to `skipFilter={true}` being set on the `DialogSelect` component, which suppresses the built-in filter input. Removing this prop re-enables the search UI while preserving the existing custom fuzzysort filtering logic via `onFilter`.\n\n## Architecture\n\nThe model selector consists of two layers:\n\n- **`DialogModel`** (`packages/opencode/src/cli/cmd/tui/component/dialog-model.tsx`) — builds the options list (favorites, recents, provider models, \"+ Add model\" entries) and performs custom fuzzysort filtering via a `query` signal.\n- **`DialogSelect`** (`packages/opencode/src/cli/cmd/tui/ui/dialog-select.tsx`) — generic selection dialog with built-in search input, keyboard navigation, and scroll. Renders the input when `skipFilter` is not set.\n\nData flow:\n```\nUser types → DialogSelect \u003cinput onInput> → props.onFilter(query)\n  → DialogModel setQuery() → options() recomputes with fuzzysort\n  → DialogSelect receives new props.options → re-renders filtered list\n```\n\n### Design Decisions\n\n- **Custom filtering in DialogModel, not DialogSelect**: DialogModel uses `skipFilter` semantics — it passes pre-filtered `options` to DialogSelect rather than letting DialogSelect do the filtering. This allows model-specific logic (favorites/recents sections disappear on search, fuzzysort with weighted title/category scoring).\n- **\"+ Add model\" entries are searchable**: Each `source === \"config\"` provider appends a \"+ Add model\" option. Searching \"add\" surfaces all of them — this is intentional so users can identify which provider to add to. Normal model searches are unaffected by fuzzysort scoring.\n\n## Usage\n\nPress `/models` in TUI or trigger via keybind. The search input auto-focuses. Type to filter models by name or provider. Press Enter to select, Escape to close.\n\n## Verification\n\n- `bun typecheck` passes (full turbo, 12/12 packages)\n- CI: typecheck ✅, lint ✅, 8 test failures are all pre-existing (documented in #911)\n- Manual: search box renders and filters correctly in `/models` dialog\n\n## Journey Log\n\n- [lesson] `skipFilter={true}` hides the search input entirely in `DialogSelect` — this prop should only be used when search is genuinely unwanted (e.g. short fixed-option lists like worktree creation)\n- [lesson] When a component does its own filtering via `onFilter` callback, it still needs the input rendered — `skipFilter` controls UI visibility, not filtering logic\n"},{"path":"compose/reports/tui-task-block-click-navigation.md","title":"TUI Task Block Click Navigation — Final Report","group":"reports","content":"---\nfeature: tui-task-block-click-navigation\nstatus: delivered\nspecs: []\nplans: []\nbranch: fix/task-block-click\ncommits: 6af864e\n---\n\n# TUI Task Block Click Navigation — Final Report\n\n## What Was Built\n\nFixed a bug where clicking a running Task Block (subagent) in the TUI did nothing. The root cause was that `ctx.metadata()` — which writes `sessionId`/`actorId` to the tool part state — was only called AFTER `actor.spawn()` returned. For `action:\"run\"`, spawn blocks on `Fiber.join` until the subagent completes, so metadata was never available during the running phase. The TUI's click handler read `targetSession()` as `undefined` and early-returned.\n\nThe fix introduces an `onReady` callback on `SpawnInput` that fires before `Fiber.join`, allowing the actor tool to emit metadata while the tool is still \"running\". A secondary fix in the TUI ensures the `onClick` handler reads from reactive memos (SolidJS-idiomatic) rather than raw getter chains.\n\n## Architecture\n\n### Data Flow (Before Fix)\n\n```\nactor.spawn() → Fiber.join(fiber) [BLOCKS] → return\nctx.metadata({ sessionId, actorId }) ← never reached while running\n```\n\n### Data Flow (After Fix)\n\n```\nactor.spawn() → onReady fires → ctx.metadata() writes to DB → Fiber.join(fiber) [BLOCKS]\n                 ↑ metadata available to TUI immediately\n```\n\n### Key Files\n\n| File | Change |\n|------|--------|\n| `src/actor/spawn.ts` | Added `onReady` to `SpawnInput`; invoked before `Fiber.join` |\n| `src/tool/actor.ts` | Passes `onReady` that calls `ctx.metadata()` |\n| `src/cli/cmd/tui/routes/session/index.tsx` | Task onClick uses `targetSession()` / `targetBucket()` memos |\n\n### Design Decisions\n\n- **`onReady` callback over removing `Fiber.join`**: `Fiber.join` provides interrupt propagation (parent abort → child interrupt). Removing it would break cancellation semantics and existing tests. The callback approach preserves blocking-run semantics while allowing metadata emission at the right time.\n- **Effect-returning callback (`onReady`) vs sync callback (`onActorID`)**: `ctx.metadata()` calls `processor.updateToolCall()` which involves DB writes via `SyncEvent.run`. This requires yielding an Effect, not just a sync function.\n\n## Verification\n\n- Manual TUI testing: spawned a `run`-mode subagent (sleep 20s), confirmed spinner visible during execution, click navigates into subagent view, can exit and re-enter after completion.\n- Typecheck: passes.\n- Unit test: `test/actor/spawn.test.ts` — \"onReady fires before Fiber.join blocks\" verifies the callback fires during spawn and receives correct actorID/sessionID.\n\n## Testing Strategy\n\nThe `onReady` behavior is tested at the **spawn layer** (`test/actor/spawn.test.ts`) rather than via end-to-end prompt-loop integration tests. Two prior integration tests (`prompt-effect.test.ts`) were removed because:\n\n1. Their integration path (prompt loop → AI SDK v6 `fullStream` → tool execution → DB poll) is fundamentally broken in the test environment — AI SDK v6's `fullStream` stalls after `start-step` due to microtask scheduling conflicts between Web Streams and Effect's fiber runtime.\n2. Adding `Actor.layer` to `prompt-effect.test.ts`'s layer composition creates a circular dependency with `SessionPrompt.layer`.\n3. The behavior they intended to verify is already covered by:\n   - **Spawn-level unit test**: `onReady` fires at the correct time (before `Fiber.join`)\n   - **Existing tool tests**: `ctx.metadata()` → `updateToolCall` → `SyncEvent.run` → DB write (used by bash/edit/glob tools)\n   - **Manual TUI verification**: running subagent shows spinner, click navigates correctly\n\n## Journey Log\n\n> Brief notes on what informed the final design.\n\n- [dead end] Removing `Fiber.join` entirely — broke interrupt propagation and existing \"failed subtask\" test expectations\n- [dead end] Adding `Actor.layer` to test layer composition — circular dependency with SessionPrompt.layer\n- [lesson] AI SDK v6's `fullStream` may not yield tool-call events to an Effect Stream consumer in test environments due to microtask scheduling conflicts between Web Streams and Effect fibers\n- [lesson] SolidJS store proxy access in event handlers: using reactive memos is safer than raw getter chains through store proxies, especially when properties are added dynamically via `reconcile`\n"},{"path":"compose/spec/bun-text-import-esm-collision.md","title":"Built-in workflow scripts collide with the ESM parser","group":"spec","content":"---\nfeature: bun-text-import-esm-collision\nstatus: delivered\nupdated: 2026-08-03\nbranch: fix/workflow-script-ext\ncommits: 09d03d67..e8f1a8d1\n---\n\n# Built-in workflow scripts collide with the ESM parser\n\n## Report\n\n**What was built** — The four built-in workflow scripts are no longer imported. A Bun macro\nreads the directory at build time and their sources are inlined into the bundle, so the files\nnever enter the module graph and nothing can attempt to parse them.\n\n**Verification** — From `packages/opencode`.\n\n| Check                                                                     | Before                        | After                     |\n| ------------------------------------------------------------------------- | ----------------------------- | ------------------------- |\n| `bun test test/cli/tui/plugin-toggle.test.ts test/cli/tui/thread.test.ts` | 3 tests ran, 1 fail, 1 error  | 4 pass, 0 fail, 0 error   |\n| `bun test test/cli/tui test/cli/cmd/tui`                                  | 261 pass, 1 fail, 1 error     | 262 pass, 0 fail, 0 error |\n| `bun test test/workflow`                                                  | —                             | 194 pass, 5 skip, 0 fail  |\n| `bun typecheck`                                                           | passes with four suppressions | passes with none          |\n\nThe counts rise by one because the test that previously failed to load now runs.\n`bun run build:local` compiles; `bun build --target=bun src/workflow/builtin.ts` shows the macro\ncall site replaced by an object literal, so the development fallback below is unreachable in a\nbundle; `mimo debug agent build` from the compiled binary, run in an empty directory, loads the\nworkflow registry. `bun.lock` is unmodified.\n\n**Journey log**\n\n- The first fix renamed the files to `.js.fn` so no loader would try. It worked, and it was the\n  wrong shape: the defect was that the scripts were reachable as modules, not that they were\n  named `.js`. Renaming also took them out of oxlint and editor highlighting, and touched every\n  reference to them. Asking what makes the failure impossible rather than unlikely gave a\n  better answer than iterating on the first one that worked.\n- The macro form was already in this codebase twice for the same job. Searching for precedent\n  before inventing an extension would have found it immediately.\n- Two Bun constraints only surfaced by running into them, and the published pattern in\n  `skill/builtin/extract.ts` already encodes both — reading it properly instead of assuming its\n  shape would have saved two failed builds.\n- An explicit list of the four filenames survived into the first macro version out of habit.\n  Nothing outside this module references those filenames, so it was pure ceremony from the era\n  when static imports forced it.\n\n## [S1] Problem\n\nThe four scripts in `src/workflow/builtin/` are workflow **function bodies**, not modules: each\nends in a top-level `return`, because the sandbox evaluates them inside a function wrapper.\nThey were imported as raw text via `with { type: \"text\" }` so that they would embed into the\ncompiled binary, which has no source tree to read at runtime.\n\nThat left them reachable as modules, and under `bun test` one was occasionally loaded through\nthe ECMAScript parser instead of the text loader, where a top-level `return` is a syntax error:\n\n```\n# Unhandled error between tests\nerror: Top-level return cannot be used inside an ECMAScript module\n    at .../src/workflow/builtin/fact-check.js:1:1\n```\n\nNo assertion produced it. Bun counts the event once as a failure and once as an error, and one\ntest never starts, so a test file silently loses coverage. Reproducible with two files, in\neither order, each of which passes alone:\n\n```\nbun test test/cli/tui/plugin-toggle.test.ts test/cli/tui/thread.test.ts\n```\n\nContinuous integration missed it because `test.yml` shards test files across four processes, so\nthe two files that collide are usually not in the same one.\n\nTwo measurements pinned it down. An `onResolve` hook showed the importer was always\n`builtin.ts` itself — the legitimate text import, with no second importer anywhere — and that\n`thread.test.ts` alone re-evaluates `builtin.ts` on the order of a hundred times in one\nprocess, of which a handful t
