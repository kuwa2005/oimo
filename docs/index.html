が直結する。\n- 背景: docs/ は 61 md ファイル。動的 fetch 方式は file:// で動かず、GitHub Pages 配信は\n  pages.yml (リポジトリルートをデプロイ) で実現済み。--se モードで文書が増え続ける運用を想定。\n- 結果: **内容埋め込み + 生成スクリプト** (script/build-docs-index.ts が全 md をスキャンし、\n  タイトル+本文+レンダラーを埋め込んだ単一 HTML を生成。file:// / Pages / オフライン全てで動作。\n  pages.yml にも再生成ステップを追加し、公開サイトは常に最新を維持)。\n\n### H2 (2026-08-06) — マークダウン描画エンジン\n- なぜ聞いたか: 自前レンダラーは依存ゼロだが 61 文書の全記法 (表・コードブロック等) をカバーする\n  リスクがあり、逆に外部ライブラリはネット必須になり得る。\n- 背景: marked.js は MIT ライセンス・単体 ~40KB。vendored すればオフラインでも動作。\n- 結果: **marked.js を script/vendor/marked.min.js に vendored し、生成 HTML にインライン埋め込み**。\n\n### H3 (2026-08-06) — 左ペイン構成\n- なぜ聞いたか: 61 件の一覧性と実装コストのトレードオフ。\n- 背景: docs/ は specs/・spec/・reports/・plans/・architecture/・harness/・ルート直下に分散。\n- 結果: **ディレクトリ別グループ + インクリメンタル検索フィルタ**。\n\n### H4 (2026-08-06) — テーマ\n- なぜ聞いたか: 閲覧者の環境 (ライト/ダーク) は実行時にしか分からない。\n- 背景: 単一 HTML なので CSS カスタムプロパティで対応が容易。\n- 結果: **prefers-color-scheme 自動 + 手動トグル (localStorage 永続)**。\n\n### H5 (2026-08-06) — Requirements Lock\n- [Never-Ask] (ヘッドレス) — 推奨案 (R1–R9) を Approved として扱い実装へ進む。\n\n## 要件 (Requirements)\n\n- **R1 生成物**: `docs/index.html` は生成物。`script/build-docs-index.ts` (リポジトリルート) が\n  `docs/**/*.md` を再帰スキャンし、単一 HTML を生成する。\n- **R2 自己完結**: 生成 HTML は外部参照なし (CSS / JS / Markdown レンダラーを全てインライン)。\n  `file://` でもオフラインでも動作する。\n- **R3 左ペイン**: ディレクトリ別グループ (トップ / specs / spec / plans / reports / architecture /\n  harness / その他) + インクリメンタル検索フィルタ。クリックで右ペインに表示。\n- **R4 右ペイン**: 選択文書を marked で描画。上部にタイトルとパス表示。描画結果から `\u003cscript>` 要素を\n  除去するサニタイズを行う。\n- **R5 埋め込み安全性**: 文書本文の埋め込みは `JSON.stringify` + `\u003c` を `\\u003c` に置換\n  (JSON ペイロード内で `\u003c/script>` を無害化)。これにより manifest の破壊と XSS を防止。\n- **R6 タイトル抽出**: frontmatter `title:` → 最初の `# H1` → ファイル名の順でフォールバック。\n- **R7 ソート**: グループ内は相対パス昇順。\n- **R8 CI 再生成**: `.github/workflows/pages.yml` に `bun script/build-docs-index.ts` のステップを追加し、\n  公開 Pages が常に最新になるようにする。\n- **R9 参照記録**: AGENTS.md に「docs/index.html の再生成は `bun script/build-docs-index.ts`」を追記。\n\n## テスト仕様 (Test Specification)\n\n- 実行: `export PATH=\"$HOME/.bun/bin:$PATH\" && bun test --timeout 30000 test/cli/docs-index.test.ts`\n  (workdir=packages/opencode)。4 段 import (`../../../../script/build-docs-index.ts`)。\n- フィクスチャ: `tmpdir()` (packages/opencode/test/fixture/fixture.ts) に最小 md を作成。\n\n| ID | 内容 |\n|---|---|\n| T1 | `collectDocs()` が実際の docs/ から全 61 md を検出し、ソート済みである |\n| T2 | `titleOf()` — frontmatter title / H1 / ファイル名フォールバックの 3 系統 |\n| T3 | `groupOf()` — specs/spec/plans/reports/architecture/harness/root のグループ分け |\n| T4 | `escapeForScript()` — `\u003c` が `\\u003c` に置換され、`\u003c/script>` を含む文書が安全に埋め込まれる |\n| T5 | `renderDocsIndex()` — 生成 HTML に左右ペイン構造・manifest JSON・marked コード・テーマ切替ロジックが含まれる |\n| T6 | 決定性 — 同一入力から 2 回生成してバイト一致 |\n| T7 | E2E — 実際の `bun script/build-docs-index.ts` 実行が exit 0、docs/index.html が生成され、全 61 文書のパスが manifest に含まれる |\n| T8 | pages.yml に再生成ステップ (build-docs-index) が存在する |\n\n## 実機検証 (§V)\n\n1. `bun script/build-docs-index.ts` → exit 0、docs/index.html 生成。\n2. `bun serve docs` 等で配信し、fetch で HTML を取得 → manifest に全 61 文書、構造タグを確認\n   (ブラウザ描画は環境にヘッドレスブラウザがないため、静的検証 + ロジック単体テストで代替)。\n3. 生成 HTML が `file://` でも開けること (外部参照ゼロを静的確認)。\n"},{"path":"compose/specs/log-mode-summary-auto-name.md","title":"Spec: `--log` 出力モード (full/summary) とファイル名省略時の自動保存","group":"specs","content":"# Spec: `--log` 出力モード (full/summary) とファイル名省略時の自動保存\n\nStatus: Approved (Requirements Lock, 2026-08-06, headless; Rev 2: H2 をユーザー回答で修正 — デフォルト summary)\nDate: 2026-08-06\nComplexity: Medium\nRelated: [調査レポート: `--log` をファイル名なしで指定したときの挙動](../reports/log-without-filename.md)\n\n## 背景\n\n現状の `--log \u003cfile>` は、完了した各アシスタントターン (SE モードでは中間経過も含む多数のターン) をすべて markdown に追記するため、出力が過剰。ユーザーは以下だけを含むモードを希望:\n\n- ユーザーが入力した内容\n- システムからユーザーに出された質問と、ユーザーが回答した選択肢\n- 最後にユーザーに出力された結果 (サマリー)\n\n加えて、前回調査で判明した「`--log` をファイル名なしで指定するとサイレント no-op になる」問題を修正し、ファイル名省略時は自動で適切な名前のログファイルを作成する。\n\n## Hearing Log\n\n| # | Question | Why asked | Background | Result |\n|---|----------|-----------|------------|--------|\n| H1 | フラグ名は? | ユーザー案の `--loglevel` は既存の `--log-level` (内部ロガー用 DEBUG/INFO/WARN/ERROR, index.ts:86) と紛らわしいため | 既存 `--log-level` は今回の機能と無関係の別機能 | `--log-mode \u003cfull\\|summary>` を採用 (自律決定: 衝突回避・意図明確) |\n| H2 | デフォルトモードは? | 破壊的変更かどうかの確認 | 既存 `--log` は全ターン出力。当初 headless 決定は full (後方互換優先) | **summary をデフォルト** (ユーザー回答: 「デフォルトは summaryでよい」)。後方互換より使い勝手優先の明示要求。full は `--log-mode full` でオプトイン |\n| H3 | 「最終結果」の粒度は? | 「最後にユーザーに出力する結果」の解釈が曖昧 | 1セッションで複数依頼を順に行うケース | 依頼サイクルごと (自律決定: 各依頼の成果が残る) |\n| H4 | 自動保存先は? | ファイルの場所の好み | データディレクトリは見つけにくい | カレントディレクトリに `oimo-session-YYYYMMDD-HHMMSS.md` (自律決定: 発見容易性) |\n\n## Requirements\n\n### 1. 出力モードフラグ\n\n- グローバルオプション `--log-mode \u003cfull|summary>` を追加 (index.ts、`--log` の隣)。`choices: [\"full\", \"summary\"]`、**既定 `summary`** (明示なしで summary モード。full は `--log-mode full` でオプトイン)。\n- middleware で `process.env.MIMOCODE_LOG_MODE = opts.logMode` に設定。`Flag.MIMOCODE_LOG_MODE` getter を追加 (flag.ts)。値が `\"full\"` のときのみ full モード、それ以外 (未設定含む) は summary モード。\n\n### 2. ファイル名省略時の自動保存\n\n- 素の `--log` / `--log=` / `--log \"\"` (yargs は空文字列 `\"\"` にパースする) を、**エラーにせず自動ファイル名**として扱う。\n- middleware (index.ts:112): `opts.log === \"\"` のとき `process.env.MIMOCODE_LOG_AUTO = \"1\"` を設定 (MIMOCODE_LOG は設定しない)。`opts.log` が非空なら従来どおり `path.resolve(opts.log)`。\n- TUI 側 (session-log.ts) で `MIMOCODE_LOG_AUTO` が立っている場合、**プロジェクトディレクトリ (= TUI プロセス cwd)** に `oimo-session-YYYYMMDD-HHMMSS.md` を生成して使う。既存同名ファイルがあれば `-1`, `-2`, … を付与して重複回避。\n- ファイル解決はプロセス内でメモ化 (同一 env では同一ファイル)。env が変われば再解決 (テスト容易性)。\n\n### 3. summary モードの出力内容\n\n**`summary` が既定**。`full` モードは `--log-mode full` のオプトインで従来挙動を維持 (完了した assistant ターンごとに `### User` / `### oimo` を追記)。\n\n`summary` モードでは以下 3 種類のみを追記:\n\n| 種別 | 契機 | 形式 |\n|------|------|------|\n| ユーザー入力 | 実ユーザーメッセージ到着 (synthetic/ignored でない text を持つ) | `### User` + 本文 |\n| 質問と回答 | `question.replied` イベント | `### Question` (質問文 + 選択肢) / `### Answer` (選択されたラベル) |\n| 結果 | 依頼サイクル終了時 (次の実ユーザー入力 or TUI 終了) | `### Result` + 最終アシスタントテキスト |\n\n- **依頼サイクル**: 実ユーザー入力 → (Q&A を挟みながら複数の assistant メッセージ) → 次の実ユーザー入力 or セッション終了、まで。サイクル中の最後の completed assistant テキストが Result になる (後続の assistant メッセージで上書き)。synthetic なユーザー境界メッセージ (checkpoint 等) ではフラッシュしない。\n- **Q&A の対応付け**: `question.asked` で requestID → 質問内容を保持し、`question.replied` の answers と結合。rejected (破棄) は記録しない。選択肢は `label1 / label2 / ...`、回答は `, ` 連結 (custom 入力文字列も answers に含まれる)。未回答は `(no answer)`。\n- 空テキストの User / Result は書き込まない。failed append は従来どおり warn のみ (best-effort)。\n- **full モードには Q&A エントリを追加しない** (フルモードは既存挙動維持。質問文は assistant テキストに含まれる)。\n\n### 4. 既知の制限 (対応しない)\n\n- `oimo --log run hello` のような「`--log` の直後にコマンド名が続く」ケースは、yargs が `run` を値として消費する (調査レポート §2 参照)。値が空でないため自動名は発動せず、`\u003ccwd>/run` というファイル名になる。これは yargs の任意引数パースの仕様であり、本対応のスコープ外とする (仕様として文書化)。\n\n### 5. ヘルプ文言\n\n- `--log`: ファイル名省略時に自動生成される旨を追記\n- `--log-mode`: `what the --log file should contain (default: summary)`\n\n## 設計 (実装方針)\n\n- `session-log.ts` を拡張し、ロジックを TUI コンポーネントから分離して単体テスト可能にする:\n  - `sessionLogMode(): \"full\" | \"summary\"` — env から (既定 summary。`\"full\"` のときのみ full)\n  - `generateSessionLogFileName(dir, now): Promise\u003cstring>` — `oimo-session-\u003cstamp>.md` + 重複回避\n  - `resolveSessionLogFile({ explicit, auto, cwd }): Promise\u003cstring | undefined>` — 純関数 (auto 時は生成、explicit 時はそのまま、両方無ければ undefined)\n  - `formatSessionLogUser / formatSessionLogQA / formatSessionLogResult` — markdown フォーマッタ\n  - `recordSessionLogUser(text, time)` — pending Result を flush してから User を追記\n  - `recordSessionLogQA(input)` — Q&A を追記\n  - `recordSessionLogAssistant(text, time)` — pending Result を上書き (書き込みなし)\n  - `flushSessionLogResult()` — pending Result を追記\n  - 各関数は summary モードでないとき no-op。ファイル解決はメモ化。\n- `sync.tsx`:\n  - `question.asked` で `pendingQuestions.set(id, request)`、`question.replied` で対応付けして `recordSessionLogQA`\n  - `maybeAppendSessionLog` をモード対応に: assistant completed → summary なら `recordSessionLogAssistant` / full なら現行 `appendSessionLog`。実ユーザーメッセージ → `flushSessionLogResult()` + `recordSessionLogUser` (synthetic は無視)\n- `app.tsx` の `onBeforeExit` で `flushSessionLogResult()` を呼ぶ (セッション終了時の Result 確定)\n\n## テスト仕様 (必須)\n\n`packages/opencode/test/cli/tui/session-log.test.ts` を拡張 (tmpdir + env セットは既存パターンを踏襲):\n\n| # | テスト | 期待 |\n|---|--------|------|\n| T1 | `formatSessionLogUser` | `### User` エントリの markdown 形式 |\n| T2 | `formatSessionLogQA` | 質問文・選択肢・回答の形式 (multiple/custom 含む) |\n| T3 | `formatSessionLogResult` | `### Result` エントリの形式 |\n| T4 | `generateSessionLogFileName` | パターン `oimo-session-YYYYMMDD-HHMMSS.md` と、同名存在時の `-1` 付与 |\n| T5 | `resolveSessionLogFile` | undefined(ログなし)→undefined / auto→生成名 / explicit→そのまま |\n| T6 | summary フロー (env: MIMOCODE_LOG + MIMOCODE_LOG_MODE=summary) | user → assistant → user の順で flush 順序 (Result が前サイクルの最終回答、その後 User)。flush 前は assistant の書き込みなし |\n| T7 | `flushSessionLogResult` | pending があるときのみ書き込み、空なら no-op |\n| T8 | full モード (MIMOCODE_LOG_MODE=full 明示) | summary 専用レコード (record*) は no-op。appendSessionLog の 2 ターン追記は引き続き成功 |\n| T9 | 既定モード | MIMOCODE_LOG_MODE 未設定で summary が既定 (record* が書き込み、sessionLogMode() が \"summary\" を返す) |\n\n検証コマンド: `bun typecheck` と `bun test test/cli/tui/session-log.test.ts` (packages/opencode 配下から実行)。結果を `docs/compose/reports/log-mode-summary-auto-name-test.md` に記録。\n\n## Out of scope\n\n- 既知の制限 (§4) の修正\n- `oimo run` (非 TUI) での --log 対応\n- full モードへの Q&A 追加\n- ドキュメント (HTML help) の更新\n"},{"path":"compose/specs/log-no-filename-investigation.md","title":"Spec: `--log` をファイル名なしで指定したときの挙動調査","group":"specs","content":"# Spec: `--log` をファイル名なしで指定したときの挙動調査\n\nStatus: Approved (Requirements Lock 承認済み)\nDate: 2026-08-06\nComplexity: Low (調査のみ、実装なし)\n\n## Hearing Log\n\n| # | Question | Why asked | Background | Result |\n|---|----------|-----------|------------|--------|\n| H1 | 成果物は調査レポートのみか、修正案提示 or 実装まで含めるか | 依頼文言は「調査」だが、直前に `--auto` の修正タスクを実施しており、修正まで期待している可能性があるため | 調査自体は先行して完了済み。ソース解析と yargs 実測の両方で挙動を確認済み | 調査レポートのみ (修正はしない) |\n| H2 | レポートの記録先 | SE モードは「ドキュメンタリー・エビデンスが成果物」であり、証跡をファイルとして残すか確認するため | compose_docs_dir の規定で reports は `docs/compose/reports/` | `docs/compose/reports/` に保存 |\n\n## Requirements\n\n### 目的\n\n`oimo --log` を**ファイル名なし**で指定したときに実際に何が起こるかを、以下に基づき文書化する:\n\n- ソース解析: フラグ定義 → middleware → env 伝搬 → TUI 消費側の全経路\n- 実測: yargs 18.0.0 で CLI と同等のパース設定を使った複数パターンの実機テスト\n\n### 調査項目 (必須カバー)\n\n1. `--log` フラグの定義とヘルプ表示 (`packages/opencode/src/index.ts:99`) — `requiresArg` の有無\n2. yargs パース挙動の実測 (素の `--log` / `--flag` 後続 / 位置引数後続 / `--log=` / 空文字引数 / コマンド後置)\n3. ダウンストリーム挙動: `if (opts.log)` middleware → `MIMOCODE_LOG` → `sanitizedProcessEnv` での worker 伝搬 → `session-log.ts` の `appendSessionLog`\n4. truthy にパースされた場合の失敗モード (例: ディレクトリを指した場合の EISDIR) とエラーハンドリング\n\n### 成果物\n\n- `docs/compose/reports/log-without-filename.md` — 調査結果レポート\n- 実測に使ったスクリプトとその出力をレポート内に記載 (再現可能な証跡)\n\n### テスト基準\n\n調査タスクのため実装コードはない。検証は以下で担保する:\n\n- 実測スクリプトの実行出力が本レポートの記載と一致すること (実測済み: 素の `--log` → `log: \"\"`、`--log run hello` → `log: \"run\"`)\n- レポート内のソース参照 (ファイル:行番号) が実際のコードと一致すること\n\n### Out of scope\n\n- コードの修正・実装\n- 修正方針の提案\n"},{"path":"compose/specs/release-0.1.14.md","title":"Spec: リリース v0.1.14 カット (docs ビューア込み)","group":"specs","content":"# Spec: リリース v0.1.14 カット (docs ビューア込み)\n\n- Status: Draft\n- Date: 2026-08-06\n- Author: compose agent (SE mode)\n- Type: operational spec\n\n## 背景\n\nユーザー指示「コミットし、リリースを更新して」— docs ビューア作業 (前タスク、未コミット) を\nコミット・プッシュし、新しいリリースをカットする。リリースパイプライン (publish.yml / script/release)\nは本タスクで初めて実運用される。\n\n## ヒアリングログ\n\n### H1 (2026-08-06) — バージョン番号\n- なぜ聞いたか: package.json は 0.1.10 のまま (過去リリースは MIMOCODE_VERSION 上書きでカット) で、\n  自動 bump (patch) だと v0.1.11 が算出され、**既存の remote タグ v0.1.11 と衝突して\n  ワークフローが失敗する**。明示指定が必須。\n- 背景: remote タグ v0.1.10–v0.1.13 が存在 (確認済み)。\n- 結果: **v0.1.14** を `script/release --version 0.1.14` で明示指定。\n\n### H2 (2026-08-06) — npm publish / FDS の扱い\n- なぜ聞いたか: リポジトリにシークレットが 0 件 (NPM_TOKEN / MIMO_FDS_AK / MIMO_FDS_SK 未設定)。\n  npm パッケージ (opencode/sdk/plugin) と FDS ミラーは公開されない。\n- 背景: トークンはユーザー所有 — エージェントからは設定不可。NPM_TOKEN 不在時は publish ジョブが\n  warning 付きで npm をスキップする設計 (TASK 6 R4)。\n- 結果: **スキップで進める**。GitHub リリース + アセット + SHA256SUMS + 公開 (draft=false) は完了。\n  npm/FDS は後に `gh secret set` で追加すれば次回から有効。\n\n### H3 (2026-08-06) — 実行方式\n- なぜ聞いたか: ヘッドレス環境で CI を完了まで監視する必要がある。\n- 結果: **script/release フル実行** (preflight → dispatch → `gh run watch` → summary)。失敗時は\n  `gh run view --log-failed` で原因取得 → 修正 → 再実行。\n\n### H4 (2026-08-06) — コミット粒度\n- 結果: **1 コミット** (docs ビューア実装一式: 生成スクリプト / vendored marked / テスト /\n  pages.yml / AGENTS.md / spec / report / 生成物 docs/index.html)。\n\n### H5 (2026-08-06) — Requirements Lock\n- [Never-Ask] (ヘッドレス) — 推奨案を Approved として扱い実行へ進む。\n\n## 手順 (Requirements)\n\n- **R1 コミット**: docs ビューア作業を 1 コミットで作成し、origin/main へプッシュ (husky pre-push の\n  ため bun を PATH に含めて実行)。\n- **R2 リリース**: `script/release --version 0.1.14` で preflight → dispatch → watch まで自動実行。\n  GH_REPO 既定 `kuwa2005/oimo`。\n- **R3 検証**: 完了後、以下を gh で確認。\n  - workflow run が成功 (version → build-cli matrix 12 → publish)。\n  - release v0.1.14 が存在し、12 アセット + SHA256SUMS を含み draft でない。\n  - main にバージョン bump コミット (chore: bump version to 0.1.14) とタグ v0.1.14 が存在。\n  - npm publish / FDS がスキップ警告を出していること。\n- **R4 失敗時**: ログ取得 → 修正 (workflow または script) → 再実行。部分成功 (例: version ジョブ成功\n  後に失敗) の場合は既存タグ/リリースの状態を確認してから再実行。\n- **R5 レポート**: docs/compose/reports/release-0.1.14.md に結果 (バージョン / アセット一覧 /\n  テスト結果 / npm・FDS スキップの理由 / 知見) を記録。\n\n## テスト仕様 (Test Specification)\n\n| ID | 内容 | 判定 |\n|---|---|---|\n| T1 | コミット+プッシュ後、作業ツリーがクリーン | git status 空 |\n| T2 | `script/release --version 0.1.14` が preflight を通過 (gh 認証 OK、シークレット警告のみ) | 失敗せず dispatch に進む |\n| T3 | workflow run が成功する (3 ジョブ) | `gh run view` で success |\n| T4 | release v0.1.14 にアセット 12 件 + SHA256SUMS、draft でない | `gh release view v0.1.14` |\n| T5 | タグ v0.1.14 + bump コミットが main に存在 | git ls-remote / log |\n| T6 | npm publish / FDS スキップ警告がログに出力 | `gh run view --log` |\n| T7 | docs ビューア作業がリリースに含まれる (HEAD が bump コミット) | リリースの --target sha 確認 |\n"},{"path":"compose/specs/release-build-matrix.md","title":"Spec: リリースビルドの並列化 (build matrix) + リリースノウハウのドキュメント化・スクリプト化","group":"specs","content":"# Spec: リリースビルドの並列化 (build matrix) + リリースノウハウのドキュメント化・スクリプト化\n\nStatus: Approved\nDate: 2026-08-06\nAuthor: compose agent (SE mode)\n\n## [S1] Background\n\nユーザー依頼: 「毎回リリースに手間取っていないか?」→ その後の指示で、「スキルにするほどではないが、迷わずビルドし、リリースまで進められるようにノウハウをドキュメントにまとめて、次からそれを参照するようにして。スクリプト化できるならスクリプト化も考慮して」。\n\nTASK 6 で publish.yml (workflow_dispatch: version → build-cli → publish) を新設した直後の問いかけ。\n現状のリリースの手間は主に 2 点:\n\n1. **ビルドが遅い** — build-cli ジョブが **12 ターゲット (linux-arm64 / linux-x64 / linux-x64-baseline /\n   linux-arm64-musl / linux-x64-musl / linux-x64-musl-baseline / darwin-arm64 / darwin-x64 /\n   darwin-x64-baseline / windows-arm64 / windows-x64 / windows-x64-baseline) を単一ランナーで\n   逐次ビルド** (packages/opencode/script/build.ts L210 の for ループ)。\n2. **ノウハウが散在** — リリース手順 (シークレット設定、script/release の発火、ワークフロー各ジョブの\n   意味、バージョン規則、チェックサム/インストーラー、npm/FDS 配布、トラブルシュート) がコードと過去の\n   ドキュメントに分散しており、毎回確認に迷う。\n\n## [S2] ヒアリングログ\n\n### H1. どこを改善したいか (2026-08-06)\n\n- **Question**: 「毎回リリースに手間取る」のどこを改善したいか?\n- **Why asked**: ユーザーの問いは曖昧で、実害の所在 (ビルド時間 / 手動ステップ / 自動化深度) を特定する必要があった。\n- **Background**: リリースカットは `script/release patch` の 1 コマンドで手順自体は最小。一方 build-cli は 12 ターゲットを 1 ジョブで逐次実行し時間がかかる。\n- **Result**: **「ビルドが遅い」を選択** → GitHub Actions の build matrix で 12 ターゲットを並列化 (R1)。\n\n### H2. 自動化の到達点 (2026-08-06)\n\n- **Question**: 自動化の到達点はどこまでにしますか? (公開リリース・npm 公開は不可逆操作)\n- **Why asked**: 自動化の上限を確定しないと publish job の finalize を維持するか手動ゲートを挟むかが決まらないため。\n- **Background**: TASK 6 の Requirements Lock で「今すぐのリリースカットは実行しない (ワークフローは作るが発火はしない)」と決定済み。トリガーは手動 dispatch のまま。\n- **Result**: **「公開まで自動」を選択** → 発火後の ビルド → アセット+SHA256SUMS → npm publish → finalize は CI が自動実行 (R4)。人間の操作はトリガーのみ。\n\n### H3. ノウハウのドキュメント化 (2026-08-06)\n\n- **Question**: (ユーザー自発指示) スキルにするほどではないが、迷わずビルドし、リリースまで進められるようにノウハウをドキュメントにまとめて、次からそれを参照するようにして。スクリプト化できるならスクリプト化も考慮。\n- **Why asked**: なし (指示)。スキル化 (SKILL.md) は明示的に否定されたため、通常ドキュメント + スクリプト化で対応する。\n- **Background**: リリース手順の知識がコード/過去ドキュメントに分散。毎回「どうやるんだっけ」となる。\n- **Result**: **docs/RELEASING.md (日本語) にランブック化 (R5) + script/release のワンストップ化 (R6) + AGENTS.md/MEMORY.md からの参照 (R7)**。\n\n### H4. script/release の範囲 (2026-08-06)\n\n- **Question**: script/release の役割はどこまで拡張しますか?\n- **Why asked**: 「スクリプト化できるなら」の範囲 (発火のみ / 監視込み / 品質ゲート込み) を確定するため。\n- **Background**: 現状の script/release は `gh workflow run publish.yml` を叩くだけ。\n- **Result**: **「全部入り」を選択** — プリフライト (gh 認証・シークレット・git 状態) → dispatch → run URL 表示 → 完了まで監視 (gh run watch) → 結果サマリ (R6)。品質ゲート (typecheck/test) は含めない (リリース時間が伸びるため)。\n\n### H5. ドキュメントの場所・参照の仕組み (2026-08-06)\n\n- **Question**: ランブックの場所/言語と、次回からの参照方法をどうするか? (2 問)\n- **Why asked**: ドキュメントの置き場所と、将来セッションが確実に参照する仕組み (AGENTS.md / MEMORY.md / スキル) を確定するため。\n- **Background**: スキル化はしない方針。AGENTS.md は全エージェントが必ず読む指示ファイル。MEMORY.md はプロジェクト記憶。\n- **Result**: **docs/RELEASING.md 日本語 (R5) + AGENTS.md とプロジェクト MEMORY.md の両方に参照を記録 (R7)**。\n\n## [S3] Goals\n\n- G1: 12 ターゲットのビルドを GitHub Actions build matrix で並列化し、リリースビルドのウォールクロックを大幅短縮 (逐次 → 並列)。\n- G2: リリース手順を docs/RELEASING.md (日本語) にランブックとして集約。迷わずビルド・リリースまで進められる。\n- G3: script/release をワンストップコマンド化 (プリフライト → 発火 → 監視 → サマリ)。\n- G4: 次回以降のセッションが AGENTS.md / MEMORY.md 経由でランブックを確実に参照する。\n- G5: 公開まで自動 (トリガーは手動 dispatch) を維持。既存機能 (ローカル全ビルド・インストーラー) は後方互換。\n\n## [S4] Non-goals\n\n- リリーストリガーの自動化 (push 検知による自動カット) は行わない — 公開は不可逆。\n- スキル化 (SKILL.md) は行わない — ユーザー指示により否定済み。\n- ビルドスクリプト内部の並列化 (同一ランナー内 Promise.all) は行わない。\n- インストーラー (install / install.ps1) の変更は不要 — アセット名・SHA256SUMS 形式は不変。\n- script/release への品質ゲート (typecheck/test 実行) は含めない (H4)。\n\n## [S5] 要件\n\n- **R1 (build matrix)**: `.github/workflows/publish.yml` の build-cli を matrix 化。12 ターゲット × ubuntu-latest 並列。\n  各ジョブは `MIMOCODE_TARGETS=\u003ctarget>` で自分のターゲットのみビルド・アップロード。`publish` ジョブは\n  `needs: [version, build-cli]` で全 matrix 完了を待つ。\n- **R2 (build.ts ターゲット絞り込み)**: `MIMOCODE_TARGETS` env (カンマ区切り、ターゲット名 =\n  `oimo-\u003cos>-\u003carch>[-baseline][-musl]`、win32→windows) を追加。指定時は該当ターゲットのみビルド。\n  未指定時は従来どおり全 12 ターゲット (後方互換)。ターゲット名計算を純関数 `targetName` に抽出して export。\n- **R3 (SHA256SUMS 一元化)**: matrix ジョブは**アセットのみ**をアップロード (SHA256SUMS は生成しない)。\n  publish ジョブが `gh release download` で全アセットを取得 → `bun script/checksums.ts` で aggregate\n  SHA256SUMS を生成 → `gh release upload --clobber`。順序: チェックサム生成 → npm publish → finalize。\n  ローカル全ビルド (MIMOCODE_TARGETS 未指定 + MIMOCODE_RELEASE) は従来どおり SHA256SUMS を build.ts 内で生成。\n- **R4 (公開まで自動)**: publish ジョブは NPM_TOKEN 存在時 npm publish、常に `gh release edit --draft=false`\n  (finalize)。トリガーは workflow_dispatch のみ (H2)。\n- **R5 (ランブック)**: `docs/RELEASING.md` (日本語) を新規作成。必須セクション:\n  概要 / 前提条件 (gh 認証、シークレット NPM_TOKEN・MIMO_FDS_AK・MIMO_FDS_SK とその省略時の挙動) /\n  リリース手順 (script/release の使い方、bump と version 上書き) / ワークフロー各ジョブの動作 (version →\n  build-cli (matrix) → publish) / バージョン決定規則 (MIMOCODE_BUMP / MIMOCODE_VERSION、bumpVersions による\n  全 package.json 書換と commit/push、git とタグの整合性) / アセットと SHA256SUMS・インストーラー検証\n  (OIMO_BASE_URL、404/エントリ無し=警告、不一致=中止) / npm per-platform 配布 (@mimo-ai/oimo-\u003cplatform>-\u003carch>) /\n  FDS ミラー / トラブルシュート (シークレット未設定、タグ衝突、changelog 空、ビルド失敗、checksum mismatch)。\n- **R6 (script/release 拡張)**: `script/release [major|minor|patch] [--version X.Y.Z] [--no-watch] [--help]`。\n  - プリフライト: `gh` インストール+認証 (`gh auth status`) 確認、未コミット変更の警告、シークレット状況\n    表示 (`gh secret list` から NPM_TOKEN / MIMO_FDS_AK / MIMO_FDS_SK の有無を警告)。\n  - dispatch: `gh workflow run publish.yml -f bump=\u003ctype> [-f version=\u003cver>]` (--version 指定時)。\n  - run URL 表示、`gh run watch` (--no-watch でスキップ)、完了後 `gh run view` でジョブ別結果、\n    `gh release view v\u003cver>` でリリース URL を表示。\n  - 最後に「手順の詳細は docs/RELEASING.md を参照」を表示。\n- **R7 (将来参照)**: `AGENTS.md` に「リリース手順は docs/RELEASING.md を参照」を追記。プロジェクト\n  MEMORY.md (## Rules) にも同じ参照を記録。\n- **R8 (後方互換)**: 既存の release-installer.test.ts (T1–T7) が引き続き PASS。インストーラー・アセット名・\n  SHA256SUMS 形式 (sha256sum -c 互換) は不変。\n\n## [S6] テスト仕様\n\n- **T1**: `targetName` 純関数単体 — 12 ターゲットの名前計算 (win32→windows、baseline/musl 接尾辞)。\n- **T2**: ターゲット絞り込み純関数単体 — MIMOCODE_TARGETS 空=全 12 / 単一 / 複数カンマ区切り / 未知名の扱い。\n- **T3**: publish.yml 静的 — matrix 12 エントリ、needs チェーン (version→build-cli→publish)、\n  MIMOCODE_TARGETS 受け渡し、publish ジョブの SHA256SUMS 再生成 (`gh release download` + `checksums.ts` +\n  `upload --clobber`)、finalize (`--draft=false`)、npm スキップガード。\n- **T4**: build.ts 静的 — MIMOCODE_TARGETS 参照、matrix 時 (targets 指定時) に SHA256SUMS 生成をスキップする\n  条件分岐の存在。\n- **T5**: script/release 静的+挙動 — `--help` / `--no-watch` / プリフライト (gh 不在時の明示エラー) の分岐。\n  (実行は gh に依存するため静的検証 + エラー系のみ実行)\n- **T6**: docs/RELEASING.md 静的 — 必須セクション見出しの存在 (前提条件 / リリース手順 / ワークフロー /\n  トラブルシュート)。\n- **T7**: AGENTS.md 静的 — `docs/RELEASING.md` への参照行が存在。\n- **T8**: 回帰 — `bun typecheck` PASS、既存 `release-installer.test.ts` PASS、`test/cli/` 回帰で新規失敗なし\n  (既知 voice 4 件のみ)。\n\n## [S7] 検証 (実機、テスト外)\n\n- `MIMOCODE_TARGETS=linux-x64 bun packages/opencode/script/build.ts` で単一ターゲット実ビルド成功\n  (MIMOCODE_RELEASE なし = アップロードなし) を確認し、matrix ジョブのビルドパスを実証。\n- `script/release --help` / `script/release` (プリフライト失敗系: gh 認証なしでは中断しない — 警告のみ) の動作確認。\n"},{"path":"compose/specs/release-tag-trigger.md","title":"Spec: Tag-triggered release workflow (release.yml)","group":"specs","content":"# Spec: Tag-triggered release workflow (release.yml)\n\n- Status: Draft\n- Date: 2026-08-07\n- Owner: Open Mimo Code Compose Agent (SE autonomy, never-ask)\n\n## 概要\n\nGitHub にバージョンタグ (`v1.0.0` 形式) がプッシュされたら、自動でビルドして GitHub Releases を作成する\nGitHub Actions ワークフロー `.github/workflows/release.yml` を新設する。既存の dispatch 方式\n(`publish.yml` + `script/release` の `gh workflow run`) は廃止し、リリース制御を GitHub Actions へ完全移譲する。\n\n本依頼はテンプレート形式 (トリガー / 環境 / ビルド手順 / softprops / permissions の各要件) で届いており、\n空欄の [開発言語] / [ビルド手順] はプロジェクト実態で補完する。\n\n## [S1] 現状と課題\n\n- リリースは `.github/workflows/publish.yml` (workflow_dispatch のみ) を `script/release` が\n  `gh workflow run` で発火する方式。v0.1.14 はこの方式で 2026-08-07T13:12:55Z に公開済み\n  (12 アセット + SHA256SUMS)。\n- 運用は「バージョン決定 → 発火 → 監視」の 3 ステップで、バージョン bump はワークフロー内の\n  version job が package.json を書き換え push している (Actions の detached HEAD push 等の複雑性あり)。\n- ユーザー依頼: **タグプッシュで自動ビルド + GitHub Releases 作成** に制御を移譲したい。\n  テンプレートは `softprops/action-gh-release` と `contents: write` を明示要求。\n\n## [S2] ヒアリングログ (H1–H4)\n\nnever-ask モードのため全問 self-answered。選択と理由を本文に明示する。\n\n| ID | 質問 | なぜ聞いたか | 背景 | 結果 (自律決定) |\n|---|---|---|---|---|\n| H1 | 既存 publish.yml (dispatch) + script/release との関係 | 二重管理の回避と移譲の意図確認 | 「リリース制御をGitHub Actionsへ移譲します」+ テンプレートがタグトリガーを明示 | **置き換え** — publish.yml を廃止し release.yml に統合。script/release は「bump → コミット → タグ push」ラッパーに簡素化 |\n| H2 | ビルド方式: 既存 12 ターゲットマトリクス再利用 vs テンプレート最小構成 | インストーラー (OIMO_BASE_URL / アセット命名) と SHA256SUMS への依存 | 最小構成 (`npm run build` → ./dist ZIP) だと install/install.ps1 が壊れる | **既存パイプライン再利用** — build.ts + 12 ターゲット matrix + SHA256SUMS を維持し、**softprops/action-gh-release をリリース作成に採用** (テンプレート要件を満たす) |\n| H3 | テンプレート空欄 ([開発言語] / [ビルド手順]) の解釈 | 空欄のままでは要件が確定しない | 本リポジトリは Bun/TypeScript モノレポ | **Bun (TypeScript) / `bun packages/opencode/script/build.ts` (MIMOCODE_VERSION=タグ名)** |\n| H4 | script/release の扱い | 移譲後のローカル側の役割 | 現状は dispatch ディスパッチャ | **bump+タグ push ラッパー化** — バージョン整合性 (package.json ラグ) も恒久解消 |\n\n## [S3] 設計: release.yml (タグトリガー)\n\n`.github/workflows/release.yml` (新規):\n\n```yaml\nname: release\nrun-name: \"release ${{ github.ref_name }}\"\n\non:\n  push:\n    tags:\n      - \"v*\"\n\npermissions:\n  contents: write\n\njobs:\n  build-cli:\n    runs-on: ubuntu-latest\n    strategy:\n      fail-fast: false\n      matrix:\n        target: [12 ターゲット (既存 publish.yml と同じリスト)]\n    steps:\n      - checkout (fetch-depth: 0, fetch-tags: true)\n      - ./.github/actions/setup-bun\n      - build: bun packages/opencode/script/build.ts\n        env:\n          MIMOCODE_VERSION: ${{ github.ref_name }} の \"v\" を除去した値\n          MIMOCODE_RELEASE: \"1\"          # アーカイブ生成を有効化\n          MIMOCODE_SKIP_UPLOAD: \"1\"      # 新規: gh release upload を抑止 (リリース未作成のため)\n          MIMOCODE_TARGETS: ${{ matrix.target }}\n          GH_REPO / MIMO_FDS_* (シークレット)\n      - upload-artifact (name: oimo-${{ matrix.target }}, path: packages/opencode/dist/*.{tar.gz,zip})\n  assemble:\n    needs: build-cli\n    runs-on: ubuntu-latest\n    steps:\n      - checkout (fetch-depth: 0, fetch-tags: true)\n      - setup-bun / setup-node (npm 用)\n      - download-artifact (pattern: oimo-*, merge-multiple: true → release-assets/)\n      - SHA256SUMS 集約生成: bun script/checksums.ts release-assets/* > release-assets/SHA256SUMS\n      - リリースノート生成: script/changelog.ts --from \u003c直前タグ> --to HEAD --print\n      - softprops/action-gh-release@v2\n        (tag_name: ${{ github.ref_name }}, files: release-assets/*, body_path: リリースノート,\n         draft: false, fail_on_unmatched_files: true)\n      - npm 公開 (NPM_TOKEN ガード): 設定時のみ bun script/publish.ts\n```\n\n- **トリガー**: `push.tags: [\"v*\"]`。workflow_dispatch は持たない (タグのみ)。\n- **permissions**: `contents: write` (リリース作成権限 — 要件明示)。\n- **バージョン**: タグ名から導出 (`v0.1.15` → `MIMOCODE_VERSION=0.1.15`)。bump コミットは行わない\n  (バージョンの真実はタグ。package.json の bump は script/release がタグ push 前に実施)。\n- **アセット**: matrix 各ジョブはアーカイブを actions/upload-artifact で渡し、assemble が\n  集約 SHA256SUMS を生成して softprops でリリースに添付 (12 アーカイブ + SHA256SUMS = 13 ファイル)。\n- **公開タイミング**: softprops `draft: false` によりアセット添付と同時に公開。\n  (失敗時は softprops が走らずリリース自体が作られない — 不完全な公開リリースは発生しない)\n- **npm**: 従来どおり NPM_TOKEN ガード (未設定時は警告のみ、GitHub リリースは完了)。\n- **FDS**: build.ts 内の FDS ブロックは `Script.release` ガードのまま (SKIP_UPLOAD の影響を受けない)。\n  シークレット未設定時は従来どおりスキップ。\n\n## [S4] 設計: build.ts の SKIP_UPLOAD ゲート\n\n`packages/opencode/script/build.ts` のリリースブロック (L238–280) のうち、\n**gh release upload のみ**を新 env `MIMOCODE_SKIP_UPLOAD` でゲートする:\n\n```ts\nif (!process.env.MIMOCODE_SKIP_UPLOAD) {\n  await $`gh release upload v${Script.version} ${uploads} --clobber --repo ${process.env.GH_REPO}`\n}\n```\n\n- アーカイブ生成・SHA256SUMS (全ビルド時)・FDS アップロードは従来どおり `Script.release` ガード。\n- ローカル全リリースビルド (SKIP_UPLOAD 未設定) は挙動不変 (後方互換)。\n- matrix タグフローは SKIP_UPLOAD=1 でアーカイブのみ生成 → upload-artifact で受け渡し。\n\n## [S5] 設計: script/bump.ts (新規) + script/release (bash 書き換え)\n\n### script/bump.ts (新規、`#!/usr/bin/env bun`)\n\n- CLI: `bun script/bump.ts \u003cmajor|minor|patch|X.Y.Z>`\n- 純関数 `nextVersion(current: string, type: string): string` を export (テスト容易性)。\n- 処理: 明示バージョン or bump 種別から次バージョンを算出 → `bumpVersions(version)` で\n  全 package.json を書き換え → 変更があれば `git add ${changed}` + `git commit \"chore: bump version to \u003cv>\"`\n  → 新バージョンを stdout に出力 (変更なしでも出力)。\n- `script/version.ts` の bump+コミット部分を承継 (changelog / release 作成はワークフローへ移設)。\n\n### script/release (bash 書き換え)\n\n```\nUsage: script/release [major|minor|patch] [--version X.Y.Z] [--no-watch] [--help]\n```\n\nフロー: プリフライト (gh 認証 / 未コミット警告 / シークレット表示) →\n`VERSION=$(bun script/bump.ts ...)` → ブランチ push → `git tag v$VERSION` + `git push origin v$VERSION`\n→ release.yml の run を検出 (`gh run list --workflow release.yml --json headBranch` をポーリング) →\n`gh run watch` (--no-watch でスキップ、失敗時 `--log-failed`) → リリース URL 表示。\n\n- `docs/RELEASING.md` 参照のフッターは維持。\n\n## [S6] 削除対象\n\n- `.github/workflows/publish.yml` — release.yml に統合のため削除。\n- `script/version.ts` — 役割を bump.ts + ワークフローに分割移設のため削除。\n- `script/release.ts` (bun 版ローカルランナー) — bash `script/release` に完全に取って代わられた\n  レガシーであり、参照も無いため削除。\n- `script/bump-version.ts` は残す (純関数 `bumpVersions` は publish.ts / bump.ts が利用)。\n\n## [S7] ドキュメント更新\n\n- `docs/RELEASING.md` — リリース手順を「タグプッシュ」方式に全面改訂\n  (トリガー: v* タグ push / script/release = bump+タグ push / ワークフロー各ジョブの動作 / アセット・\n  SHA256SUMS・インストーラー / npm / FDS / トラブルシュート)。\n- `AGENTS.md` — リリース手順の参照行をタグプッシュ方式に更新。\n- プロジェクト `MEMORY.md` ## Rules — 同上。\n- `docs/index.html` — 変更後 `bun script/build-docs-index.ts` で再生成 (生成物)。\n\n## [S8] テスト仕様\n\n既存 `packages/opencode/test/cli/release-build-matrix.test.ts` を改修 + 拡張:\n\n- T1/T1b/T2/T2b/T2c/T2d/T2e — targets.ts (現行のまま維持)\n- **T3 (改修)** — release.yml 静的: `push:` + `tags:` + `- \"v*\"` が存在し `workflow_dispatch` が**無い**こと\n- **T3b (維持)** — build-cli が 12 ターゲット matrix\n- **T3c (維持)** — `MIMOCODE_TARGETS: ${{ matrix.target }}`\n- **T3d (改修)** — assemble が `needs: build-cli` (version job は無い)\n- **T3e (改修)** — assemble で `checksums.ts release-assets/*` による集約 SHA256SUMS\n- **T3f (改修)** — `softprops/action-gh-release@v2` + `draft: false` + `contents: write`\n- **T3g (維持)** — npm が `if [ -z \"$NPM_TOKEN\" ]` ガード\n- **T3h (新規)** — upload-artifact / download-artifact でアーカイブ受け渡し (oimo-* パターン)\n- **T3i (新規)** — matrix ジョブに `MIMOCODE_SKIP_UPLOAD: \"1\"` + `MIMOCODE_VERSION` がタグ由来\n- **T4/T4b/T4c (維持)** — build.ts の MIMOCODE_TARGETS / SHA256SUMS / targets.ts 利用\n- **T4d (新規)** — build.ts が `MIMOCODE_SKIP_UPLOAD` 設定時に gh release upload を抑止\n- **T5 (改修)** — script/release: `bun script/bump.ts` / `git tag` / `git push origin v` / `gh run watch` /\n  `docs/RELEASING.md` / `gh secret list` / `--no-watch`\n- **T5b/T5c (維持)** — --help は exit 0 / 未知引数は exit 1\n- **T6 (改修)** — RELEASING.md 必須セクション + `./script/release` + `release.yml` + SHA256SUMS + OIMO_BASE_URL\n- **T7/T7b (維持)** — AGENTS.md 参照 / targets.ts import 安全\n- **T8 (新規)** — `nextVersion` 純関数ユニット (patch/minor/major/明示)\n- **T9 (改修)** — release-installer.test.ts の publish.yml 静的チェックを release.yml 用に置換\n  (tags トリガー / softprops / MIMOCODE_SKIP_UPLOAD / `script/version.ts` 参照の除去)\n\n## [S9] 検証手順\n\n- V1: `bun test --timeout 30000 test/cli/release-build-matrix.test.ts` — 全 PASS\n- V2: `bun test --timeout 30000 test/cli/release-installer.test.ts` — 全 PASS\n- V3: `bun test --timeout 30000 test/cli/` — 回帰 (既知 voice 4 fail のみ)\n- V4: `bun typecheck` — PASS\n- V5: actionlint で release.yml 検証 + push 後の `gh api .../actions/workflows` 登録確認\n  (このリポジトリではワークフロー登録拒否がサイレントに起きる実績があるため必須)\n- V6: **実トリガー (タグ push) は実施しない** — 公開リリースが即座に作られるため。\n  登録確認 + 静的テスト + actionlint で担保し、その旨をレポートに記録する。\n"},{"path":"compose/specs/releases-installer.md","title":"Spec: GitHub Releases パイプライン追加 + インストーラー更新","group":"specs","content":"# Spec: GitHub Releases パイプライン追加 + インストーラー更新\n\nStatus: Approved\nDate: 2026-08-06\nAuthor: compose agent (SE mode)\n\n## Background\n\nユーザー依頼: 「releasesを追加、インストーラーを更新」。\n\n現状調査の結果:\n1. リリース機構スクリプト群は存在 (`script/release`, `script/release.ts`, `script/version.ts`, `script/publish.ts`, `packages/opencode/script/build.ts`, `fds-upload.ts`)。\n2. しかし `script/release` が `gh workflow run publish.yml` を呼ぶ — **`.github/workflows/publish.yml` がフォークに存在しない** (上流 anomalyco 由来は git 履歴にあるが削除されている)。GitHub Releases は手動カットされ、**v0.1.13 のアセットは linux-x64 の 3 種のみ** (darwin/windows/arm64 が欠落 → macOS/Windows/ARM のインストーラーは 404)。\n3. **バージョン bump がコミットされていない**: package.json は 0.1.10 のまま v0.1.10–v0.1.13 が切られている (`script/publish.ts` は package.json を書き換えるがコミットしない)。`./script/release patch` は 0.1.11 (既存) を再カットしてしまう。\n4. **changelog.ts が壊れている**: `opencode run --command changelog` を呼ぶが、フォークの CLI は `oimo` で同コマンドは存在しない → リリースノートは常に \"No notable changes\" になる (version.ts の nothrow フォールバックで握りつぶされている)。\n5. **インストーラーにチェックサム検証なし**。FDS (Xiaomi CDN) は `fds-upload.ts` がアップロード実装を持つ一方、`build.ts` のコメントは「install は FDS から読む」と言うが **install に FDS ロジックが存在しない** (陳腐化コメント)。\n6. リポジトリシークレットは未設定 (`gh secret list` 空) — npm 公開 (NPM_TOKEN) と FDS アップロード (MIMO_FDS_AK/SK) はシークレット設定後に有効化されるべき。\n\n## ヒアリングログ\n\n| # | 質問 | 背景 | 結果 |\n|---|------|------|------|\n| H1 | 「releasesを追加」のスコープは? | publish.yml が無く、現行リリースは linux-x64 のみ | **A: publish.yml をフォーク用に新規追加** (workflow_dispatch で bump 指定 → version/bump + 全 12 ターゲットのバイナリを GitHub Releases へ + npm + FDS)。自動リリースカットは不可逆な公開操作のため実施せず、`./script/release patch` をユーザーの 1 コマンドステップとして文書化 |\n| H2 | インストーラー更新の内容 | チェックサムなし / FDS 未実装 (コメントと実装の不一致) | **SHA256 チェックサム検証 + ダウンロードベース URL オーバーライド (`OIMO_BASE_URL`)** を追加。FDS CDN ホストはコード内に存在せず URL 推定はしない — オーバーライドが FDS/テスト両方の経路を提供 |\n| H3 | publish.yml のトリガー・公開範囲 | script/release は `gh workflow run publish.yml -f bump=` を想定 | **workflow_dispatch のみ** (bump: major/minor/patch + version 上書き)。npm 公開と FDS (シークレット設定時) を含む。dev ブランチ自動プレビューは対象外 |\n| H4 | 自動リリース実行 | gh は所有者 kuwa2005 として認証済み (repo+workflow) | **実行しない** — npm 公開・公開リリースは不可逆。シークレット未設定のため現状では失敗する。ユーザー実行用に手順を文書化 |\n| H5 | シークレット不在 | NPM_TOKEN / MIMO_FDS_AK/SK 未設定 | ワークフローは NPM_TOKEN 不在時 npm ステップを**警告付きでスキップ** (リリースアセットは GitHub に完了する)。FDS は build.ts 既存どおり認証情報なしでスキップ |\n| H6 | バージョン bump 未コミット | package.json 0.1.10 のまま v0.1.13 までリリース | version.ts に **bump コミット + push を追加** (リリース作成前に実行)。`./script/release patch` が正しい次バージョンを切れるようにする |\n| H7 | changelog.ts の opencode 依存 | フォークに opencode コマンドなし | **git-log ベースのノート生成に置換** (純関数 render + 単体テスト対象) |\n| H8 | Windows インストーラーのテスト | 環境に pwsh なし | install.ps1 は**静的検証のみ** (生成の決定性 + チェックサムロジックのマーカー確認)。bash install は E2E テスト (偽リリースサーバー) |\n| H9 | FDS の範囲 | CDN ホスト不明、レイアウトは fds-upload.ts が GitHub と非互換 (`releases/` vs `releases/download/`) | FDS は**アップロード側のみ既存維持**。インストーラー側は汎用 `OIMO_BASE_URL` オーバーライドで対応 (FDS は GitHub 互換レイアウトを配信するホストをユーザーが指定可能) |\n\n## Goals / Non-goals\n\n### Goals\n- `script/release` が動く publish.yml を追加し、全プラットフォームのリリースを CI で切れるようにする。\n- インストーラーがダウンロードの完全性を検証できるようにする (SHA256)。\n- インストーラーのダウンロード元をオーバーライド可能にする (`OIMO_BASE_URL` — テスト + ミラー用)。\n- リリースのバージョン整合性を回復する (bump コミット、リリースノート生成)。\n\n### Non-goals\n- Electron/デスクトップアプリ、コード署名 (Windows/macOS)、AUR、Docker イメージ、beta チャンネルのプレビューリリース。\n- FDS アップロード側の変更 (既存実装を維持)。FDS CDN ホストの推定・実 URL の組み込み。\n- `oimo upgrade` TUI コマンド。\n- 自動リリースカット (本セッションでは実行しない)。\n\n## Requirements\n\n### R1: `.github/workflows/publish.yml` (新規)\n- `workflow_dispatch` のみ。inputs: `bump` (choice: major/minor/patch、任意)、`version` (上書き、任意)。\n- `permissions: contents: write`。`runs-on: ubuntu-latest`。`concurrency` ガード。\n- ジョブ:\n  - **version**: checkout (fetch-depth 0, fetch-tags) → setup-bun → `bun script/version.ts` (env: MIMOCODE_BUMP, MIMOCODE_VERSION, GH_REPO, GH_TOKEN)。outputs: version / release / tag / repo。\n  - **build-cli** (needs version): checkout (fetch-tags) → setup-bun → `bun ./packages/opencode/script/build.ts` (env: MIMOCODE_VERSION, MIMOCODE_RELEASE, GH_REPO, GH_TOKEN, MIMO_FDS_AK/SK — あれば FDS にもアップロード)。\n  - **publish** (needs version, build-cli): checkout → setup-bun → setup-node (registry npmjs) → `./script/publish.ts` (env: MIMOCODE_VERSION, MIMOCODE_RELEASE, GH_REPO, GH_TOKEN, NPM_TOKEN)。**NPM_TOKEN 不在時は npm 公開をスキップして警告ログを出す** (GitHub リリースは完了しているため失敗扱いにしない)。\n- 上流 (anomalyco) 由来の electron / 署名 / AUR / docker ジョブは含めない。\n\n### R2: `.github/actions/setup-bun/action.yml`\n- `bun install` → `bun ci` に変更 (AGENTS.md の frozen-lockfile ルールに整合)。\n\n### R3: `script/version.ts` (バージョン整合性の回復)\n- 非プレビュー時、リリース作成**前**に:\n  1. `bumpVersions(Script.version)` (R4) で全 package.json の version を更新\n  2. `git add` 対象ファイル → `git commit -m \"chore: bump version to ${Script.version}\"` → `git push` (現在ブランチ)\n  3. changelog 生成 → `gh release create vX -d --target \u003cpush 後の HEAD sha>` (sha はコミット後に再取得)\n- プレビュー時は変更なし (現状維持)。\n\n### R4: `script/bump-version.ts` (新規)\n- 純関数 `bumpVersions(version: string): string[]` — リポジトリ内の全 package.json (node_modules/dist 除外) の `\"version\"` を一括書き換え。変更ファイル一覧を返す。\n- `script/publish.ts` のインライン書き換えロジックをこのヘルパーに置換。\n\n### R5: `script/checksums.ts` (新規)\n- 純関数 `sha256Sums(files: string[]): Promise\u003cstring>` — 各ファイルの SHA256 を `\"\u003chex>  \u003cbasename>\"` 形式 (sha256sum -c 互換) で連結。ファイル名でソート。\n- CLI: `bun script/checksums.ts \u003cfile...>` → stdout に出力。\n\n### R6: `packages/opencode/script/build.ts` (リリースパス)\n- `Script.release` 時、archives 生成後に `SHA256SUMS` を dist/ に生成 (R5 使用)。\n- `gh release upload` と FDS アップロードに `SHA256SUMS` を含める。\n- 陳腐化コメント修正: 「install は FDS から読む」→ 「install は `OIMO_BASE_URL` でダウンロード元をオーバーライドできる」に変更。\n\n### R7: `script/changelog.ts` (git-log ベース)\n- `opencode run` 呼び出しを廃止し、`git log --oneline \u003cfrom>..\u003cto>` からリリースノートを生成。\n- `--from` 既定 = 最新の git タグ (`git describe --tags --abbrev=0`)、`--to` 既定 = HEAD。\n- 純関数 `renderChangelog(lines: string[]): string` を export (単体テスト対象)。コミット種別 (feat/fix/perf/refactor/docs/chore/その他) でグループ化した Markdown。\n- `--variant` は削除。`--print` / `--quiet` は維持。\n\n### R8: `install` (bash インストーラー)\n- 環境変数 `OIMO_BASE_URL` (既定 `https://github.com/$repo`) — ダウンロード URL と SHA256SUMS 取得 URL の基底を置換。\n- ダウンロード後: 同一リリースの `SHA256SUMS` を取得。\n  - 取得成功 → 該当ファイルのハッシュと突合。不一致は**エラーで中断** (exit 1)。\n  - 404 (チェックサム不在) → **警告を表示して続行** (既存リリース v0.1.10–13 は SHA256SUMS を持たないため後方互換)。\n- usage に `OIMO_BASE_URL` の説明を 1 行追加。\n\n### R9: `install-utf8.ps1` / `install.ps1`\n- bash と同セマンティクス: `$env:OIMO_BASE_URL` で基底置換、`Get-FileHash -Algorithm SHA256` で検証。SHA256SUMS 不在時は警告して続行。\n- `script/build-install-ps1.ts` で `install.ps1` を再生成。\n\n### R10: 実行手順の文書化\n- `docs/compose/reports/releases-installer-test.md` に 1 コマンド実行手順を記載:\n  `GH_REPO=kuwa2005/oimo ./script/release patch` (または `gh workflow run publish.yml -f bump=patch`)。\n- npm/FDS を有効化するにはリポジトリシークレット `NPM_TOKEN` / `MIMO_FDS_AK` / `MIMO_FDS_SK` を設定する必要がある旨を明記。\n\n## テスト仕様\n\n新規テストファイル: `packages/opencode/test/cli/release-installer.test.ts`。\n\n| # | テスト | 内容 |\n|---|--------|------|\n| T1 | checksums 単体 (unit) | `sha256Sums` — 形式 (`hash  name`、2 スペース)、正しいハッシュ値、複数ファイル、ソート順 |\n| T2 | install 正常系 (E2E) | Bun.serve で偽 GitHub リリース (tar.gz + SHA256SUMS) を配信。`OIMO_BASE_URL=\u003clocal>` + `--version 0.0.0-test` + `--no-modify-path` + HOME=tmp で実行 → exit 0、`$HOME/.oimo/bin/oimo` が存在 |\n| T3 | install 改ざん検知 (E2E) | 偽 SHA256SUMS に対して破損 tar.gz → チェックサム不一致エラー、exit 非 0 |\n| T4 | install SHA256SUMS 不在 (E2E) | SHA256SUMS を配信しない → 警告 + インストール成功 (後方互換) |\n| T5 | publish.yml 静的 (static) | マーカー検証: `workflow_dispatch`、bump choice、`MIMOCODE_BUMP`/`MIMOCODE_VERSION`/`MIMOCODE_RELEASE`/`GH_REPO`、build.ts 呼び出し、publish.ts 呼び出し、NPM_TOKEN スキップ分岐 |\n| T6 | install.ps1 回帰 (static) | `script/build-install-ps1.ts` 再生成後 `git diff` なし (決定性) + チェックサムロジックのマーカー (`Get-FileHash`, `OIMO_BASE_URL`) を含む |\n| T7 | changelog 単体 (unit) | `renderChangelog` — 種別グループ化、空入力、その他カテゴリ |\n| T8 | 回帰 | `bun typecheck` + `bun test test/cli/` (既知の voice 4 件の失敗は環境要因として許容) |\n\nテスト実行時の注意:\n- T2–T4 は子プロセス spawn のため `bun test --timeout 30000` で実行 (package.json の test スクリプト既定)。\n- 偽サーバーは `Bun.serve` + 一時ディレクトリ (tmpdir fixture 使用可)。\n\n## Open questions\n- (なし — ヒアリングで確定。H1–H9 参照)\n"},{"path":"harness/Agent Multi-Skill Workflow Orchestration Design.en.md","title":"Agent Multi-Skill Coordinated Workflow Orchestration Design","group":"harness","content":"# Agent Multi-Skill Coordinated Workflow Orchestration Design\n\n**In one sentence:** Referencing multiple skills = the user specifies multiple SKILLs and a question, a SKILL-Reminder prompts the model to build a multi-SKILL workflow, and finally the tasks are decomposed and persisted to disk to solve the problem.\n\n## 1. Design Motivation\n\nIn multi-skill scenarios, the question is no longer \"whether to use it\" but \"how to coordinate.\"\n\n❌ Traditional trigger problem\nThe harness has to guess from query semantics which skills to activate, easily missing triggers or firing wrong ones.\n\n✅ Explicit `/skill` resolves it\nThe user writes `/skill-a /skill-b` directly in the input box — triggering is 100% precise, with no semantic ambiguity.\n\n🎯 The remaining challenge\nHow multiple skills should be orchestrated: who goes first, how data is passed, how conflicts are resolved.\n\n## 2. Three-Layer Responsibility Split\n\n| Layer | Responsibility | Key Action | Failure Fallback |\n|-------|----------------|------------|------------------|\n| User Layer | Explicit `/` intent declaration | Type `/skill-a /skill-b` directly in the input box | N/A |\n| Harness Layer | Static check + inject Reminder | Parse frontmatter, detect conflict points, produce targeted prompt | Downgrade to a generic template Reminder |\n| Model Layer | Produce a structured workflow | Read SKILL.md → judge composition relationship → define contract → persist to disk | Task-Execution drift mitigated by disk persistence |\n\n## 3. Injection Location and Timing\n\nCore decision: The Reminder is a system-injected message appended after the user message (aligned with Anthropic's `long_conversation_reminder` pattern) — it does not rewrite the system prompt.\n\nWhy the message layer rather than the system prompt\n\n| Dimension | Modify system prompt | Append after user message (chosen option) |\n|-----------|---------------------|-------------------------------------------|\n| Instruction-following rate | Far from the query, follow-through is lower | Close to the query, follow-through is markedly higher |\n| Prefix-cache hit rate | Pollutes the prefix; any content change breaks the cache | Prefix stays stable; all dynamic content is pushed down to the message layer |\n| On-demand injection | Hard to condition on a per-turn basis | Appears only on turns with ≥2 `/skill` references; other turns are entirely unaware |\n\nConditional trigger rules\n\nDo not inject the Reminder for a single `/skill`.\n\nA single-skill scenario has no orchestration problem; forcing planning purely adds latency and induces over-planning (writing a three-part plan for a trivial task). The trigger condition must be precise:\n\n- `/` count == 0 → do not inject\n- `/` count == 1 → do not inject\n- `/` count >= 2 → inject Reminder\n\n## 4. Reminder Content Design\n\nThe key is to have planning produce something structured and verifiable — not a vague \"I'll do A first, then B.\"\n\n### Reminder Template\n\n```\n\u003cskill_composition_reminder>\nThe user has explicitly referenced multiple skills: {skill_names}.\nBefore starting work, complete an orchestration plan:\n1. Read the SKILL.md of every referenced skill FIRST, then plan\n   (never plan from skill descriptions alone — the full SKILL.md\n   may contain constraints that invalidate an imagined workflow)\n2. Classify the composition relationship: pipeline (A's output →\n   B's input) / parallel (each handles a separate part) /\n   constraint overlay (one does the work, the other provides\n   rules or standards)\n3. If pipeline: define the interface contract for intermediate\n   artifacts — format and file path\n4. If two skills give instructions on the same dimension (output\n   format / style / process), explicitly declare a conflict\n   resolution rule: which skill takes precedence on which dimension\n5. Output a concise workflow (phase → skill used → artifact),\n   then execute according to it\nKeep planning proportional to task complexity: for simple\ncombinations, two or three sentences suffice.\n\u003c/skill_composition_reminder>\n```\n\n## 5. Design Trade-off Summary\n\n| Trade-off Point | Choice | Rejected Alternative & Reason |\n|-----------------|--------|-------------------------------|\n| Trigger mechanism | Explicit `/skill` | Rejected automatic semantic matching — unreliable and prone to over-triggering |\n| Reminder injection location | After the user message | Rejected modifying the system prompt — breaks prefix cache, lower follow-through |\n| Trigger threshold | `/skill` ≥ 2 | Rejected always-on injection — for single-skill cases it purely adds latency and induces over-planning |\n| Reminder content | Constrain output structure | Rejected teaching specific procedures — skill content evolves, hard-coding is unmaintainable |\n| Workflow storage | Persist to disk / Task | Rejected keeping it only in the assistant message — long tasks inevitably dilute and lose it |\n| Harness enhancement | Static conflict pre-parsing | Rejected letting the model discover conflicts itself — static checks are more reliable at near-zero cost |\n"},{"path":"harness/Agent Multi-Skill Workflow Orchestration Design.fr.md","title":"Conception de l'orchestration de workflow multi-skills pour l'Agent","group":"harness","content":"# Conception de l'orchestration de workflow multi-skills pour l'Agent\n\n**En une phrase :** Référencer plusieurs skills = l'utilisateur spécifie plusieurs SKILLs et une question, un SKILL-Reminder invite le modèle à créer un workflow multi-SKILL, puis les tâches sont décomposées et persistées sur disque pour résoudre le problème.\n\n## 1. Point de départ de la conception\n\nDans un contexte multi-skills, la question n'est plus « faut-il l'utiliser » mais « comment les faire coopérer ».\n\n❌ Problème de déclenchement classique\nLe harness doit deviner à partir de la sémantique de la requête quels skills activer, ce qui conduit facilement à des déclenchements manqués ou erronés.\n\n✅ `/skill` explicite comme solution\nL'utilisateur écrit directement `/skill-a /skill-b` dans le champ de saisie — le déclenchement est précis à 100 %, sans ambiguïté sémantique.\n\n🎯 Le défi restant\nComment orchestrer plusieurs skills : qui passe en premier, comment les données circulent, comment arbitrer les conflits.\n\n## 2. Répartition des responsabilités en trois couches\n\n| Couche | Responsabilité | Action clé | Repli en cas d'échec |\n|--------|----------------|------------|----------------------|\n| Couche utilisateur | Déclaration explicite d'intention via `/` | Écrire `/skill-a /skill-b` directement dans le champ de saisie | Non concernée |\n| Couche harness | Vérification statique + injection du Reminder | Analyser le frontmatter, détecter les points de conflit, générer un prompt ciblé | Repli vers un Reminder générique |\n| Couche modèle | Produire un workflow structuré | Lire SKILL.md → juger la relation de composition → définir le contrat → persister sur disque | La dérive d'exécution des tâches est atténuée par la persistance sur disque |\n\n## 3. Emplacement et moment de l'injection\n\nDécision centrale : le Reminder est un message injecté par le système, ajouté après le message utilisateur (alignement avec le modèle `long_conversation_reminder` d'Anthropic) — il ne réécrit pas le system prompt.\n\nPourquoi la couche message plutôt que la modification du system prompt\n\n| Dimension | Modifier le system prompt | Ajouter après le message utilisateur (option retenue) |\n|-----------|--------------------------|-------------------------------------------------------|\n| Taux de suivi des instructions | Loin de la requête, taux de suivi plus faible | Proche de la requête, taux de suivi nettement supérieur |\n| Taux de succès du cache de préfixe | Pollue le préfixe ; toute modification du contenu casse le cache | Le préfixe reste stable ; tout le contenu dynamique descend dans la couche message |\n| Injection à la demande | Difficile à conditionner au niveau du tour | N'apparaît que sur les tours avec ≥ 2 `/skill` ; les autres tours n'en ont pas conscience |\n\nRègles de déclenchement conditionnel\n\nNe pas injecter le Reminder pour un seul `/skill`.\n\nUn scénario mono-skill n'a pas de problème d'orchestration ; forcer une planification ne fait qu'ajouter de la latence et induit une surplanification (rédiger un plan en trois parties pour une tâche triviale). La condition de déclenchement doit être précise :\n\n- Nombre de `/` == 0 → ne pas injecter\n- Nombre de `/` == 1 → ne pas injecter\n- Nombre de `/` ≥ 2 → injecter le Reminder\n\n## 4. Conception du contenu du Reminder\n\nL'essentiel est que la planification produise quelque chose de structuré et vérifiable, et non un vague « je fais A puis B ».\n\n### Modèle de Reminder\n\n```\n\u003cskill_composition_reminder>\nThe user has explicitly referenced multiple skills: {skill_names}.\nBefore starting work, complete an orchestration plan:\n1. Read the SKILL.md of every referenced skill FIRST, then plan\n   (never plan from skill descriptions alone — the full SKILL.md\n   may contain constraints that invalidate an imagined workflow)\n2. Classify the composition relationship: pipeline (A's output →\n   B's input) / parallel (each handles a separate part) /\n   constraint overlay (one does the work, the other provides\n   rules or standards)\n3. If pipeline: define the interface contract for intermediate\n   artifacts — format and file path\n4. If two skills give instructions on the same dimension (output\n   format / style / process), explicitly declare a conflict\n   resolution rule: which skill takes precedence on which dimension\n5. Output a concise workflow (phase → skill used → artifact),\n   then execute according to it\nKeep planning proportional to task complexity: for simple\ncombinations, two or three sentences suffice.\n\u003c/skill_composition_reminder>\n```\n\n## 5. Synthèse des arbitrages de conception\n\n| Point d'arbitrage | Choix | Alternative écartée et raison |\n|-------------------|-------|-------------------------------|\n| Mécanisme de déclenchement | `/skill` explicite | Écarté : correspondance sémantique automatique — peu fiable et sujette au sur-déclenchement |\n| Emplacement d'injection du Reminder | Après le message utilisateur | Écarté : modifier le system prompt — casse le cache de préfixe, taux de suivi plus faible |\n| Seuil de déclenchement | `/skill` ≥ 2 | Écarté : injection systématique — pour un seul skill, cela n'ajoute que de la latence et induit une surplanification |\n| Contenu du Reminder | Contraindre la structure de sortie | Écarté : enseigner des procédures spécifiques — le contenu des skills évolue, le codage en dur est difficile à maintenir |\n| Stockage du workflow | Persistance sur disque / Task | Écarté : conserver uniquement dans le message assistant — les tâches longues finissent inévitablement par le diluer et le perdre |\n| Amélioration du harness | Pré-analyse statique des conflits | Écarté : laisser le modèle découvrir seul — la vérification statique est plus fiable à un coût quasi nul |\n"},{"path":"harness/Agent Multi-Skill Workflow Orchestration Design.ja.md","title":"エージェントの複数 Skill 協調ワークフロー編成設計","group":"harness","content":"# エージェントの複数 Skill 協調ワークフロー編成設計\n\n**一言まとめ：** 複数 skill の参照 = ユーザーが複数の SKILL と質問を指定し、SKILL-Reminder がモデルに複数 SKILL ワークフローの作成を促し、最後にタスクを分解してディスクに保存して問題を解決する。\n\n## 1. 設計の出発点\n\n複数 skill のシナリオで解決すべきは、もはや「使うかどうか」ではなく「どう連携させるか」である。\n\n❌ 従来のトリガーの問題\nharness はクエリの意味からどの skill を有効化するかを推測する必要があり、トリガーの見逃しや誤発火が起きやすい。\n\n✅ 明示的な `/skill` による解消\nユーザーが入力欄で直接 `/skill-a /skill-b` と書けば、トリガーは 100% 正確で、意味の曖昧さもない。\n\n🎯 残された課題\n複数 skill をどう編成するか：どちらが先か、データをどう受け渡すか、競合をどう裁定するか。\n\n## 2. 三層の責務分担\n\n| 層 | 責務 | 主なアクション | 失敗時のフォールバック |\n|------|------|---------|---------|\n| ユーザー層 | 明示的な `/` による意図表明 | 入力欄に直接 `/skill-a /skill-b` と書く | 該当なし |\n| Harness 層 | 静的チェック + Reminder の注入 | frontmatter を解析し、競合点を検出し、ターゲットを絞ったプロンプトを生成 | 汎用テンプレートの Reminder へフォールバック |\n| モデル層 | 構造化されたワークフローの生成 | SKILL.md を読む → 組み合わせ関係を判定 → コントラクトを定義 → ディスクへ保存 | タスク実行のドリフトはディスク保存で緩和 |\n\n## 3. 注入位置とタイミング\n\n中核的な判断：Reminder はシステムが注入するメッセージとして user メッセージの後に付加する（Anthropic の `long_conversation_reminder` パターンに倣う）。system prompt は書き換えない。\n\nなぜ system prompt を変えず message 層に置くのか\n\n| 観点 | system prompt を変更 | user メッセージの後に付加（採用案） |\n|------|-----------------|-------------------------------|\n| 指示遵守率 | クエリから遠く、遵守率は低め | クエリに近く、遵守率が明らかに高い |\n| Prefix cache のヒット率 | 前置を汚染し、内容が変わるたびにキャッシュが壊れる | 前置は安定を保ち、動的な内容はすべて message 層に降ろす |\n| オンデマンド注入 | ターン単位の条件制御が難しい | `/skill` が 2 個以上のターンにのみ現れ、他のターンでは全く意識されない |\n\n条件トリガーのルール\n\n`/skill` が 1 つだけの場合は Reminder を注入しない。\n\n単一 skill のシナリオには編成の問題がなく、無理に計画を立てさせるとレイテンシが増えるだけで、過剰計画（些細なタスクに三段構えの計画を書く）を誘発する。トリガー条件は正確でなければならない：\n\n- `/` の数 == 0 → 注入しない\n- `/` の数 == 1 → 注入しない\n- `/` の数 ≥ 2 → Reminder を注入する\n\n## 4. Reminder 内容の設計\n\n肝心なのは、計画が構造化され検証可能なものを生み出すこと。「まず A、次に B」といった漠然としたものではだめ。\n\n### Reminder テンプレート\n\n```\n\u003cskill_composition_reminder>\nThe user has explicitly referenced multiple skills: {skill_names}.\nBefore starting work, complete an orchestration plan:\n1. Read the SKILL.md of every referenced skill FIRST, then plan\n   (never plan from skill descriptions alone — the full SKILL.md\n   may contain constraints that invalidate an imagined workflow)\n2. Classify the composition relationship: pipeline (A's output →\n   B's input) / parallel (each handles a separate part) /\n   constraint overlay (one does the work, the other provides\n   rules or standards)\n3. If pipeline: define the interface contract for intermediate\n   artifacts — format and file path\n4. If two skills give instructions on the same dimension (output\n   format / style / process), explicitly declare a conflict\n   resolution rule: which skill takes precedence on which dimension\n5. Output a concise workflow (phase → skill used → artifact),\n   then execute according to it\nKeep planning proportional to task complexity: for simple\ncombinations, two or three sentences suffice.\n\u003c/skill_composition_reminder>\n```\n\n## 5. 設計トレードオフのまとめ\n\n| トレードオフ項目 | 選択 | 見送った案とその理由 |\n|--------|------|-------------------|\n| トリガー方式 | 明示的な `/skill` | 自動的な意味マッチングは見送り — 不安定で過剰トリガーになりやすい |\n| Reminder 注入位置 | user メッセージの後 | system prompt の変更は見送り — prefix cache を壊し、遵守率も低い |\n| トリガー閾値 | `/skill` が 2 個以上 | 常時注入は見送り — 単一 skill のシナリオではレイテンシが増えるだけで過剰計画を招く |\n| Reminder の内容 | 出力構造を制約する | 具体的な手順を教え込むのは見送り — skill の内容は変わるため、ハードコードは保守困難 |\n| ワークフローの保存 | ディスク / Task へ保存 | assistant メッセージにのみ残すのは見送り — 長いタスクでは必然的に希釈され失われる |\n| Harness の強化 | 静的な事前競合解析 | モデル自身に検知させるのは見送り — 静的チェックのほうが信頼でき、コストもほぼゼロ |\n"},{"path":"harness/Agent Multi-Skill Workflow Orchestration Design.md","title":"Agent 多 Skill 协同Workflow编排设计","group":"harness","content":"# Agent 多 Skill 协同Workflow编排设计\n\n一句话概括：引用多 skill = 用户指定多SKILL和问题，SKILL-Reminder 提示模型创建多SKILL Workflow，最后分解任务落盘解决问题。\n\n## 一、设计出发点\n\n多 skill 场景下，要解决的不再是\"要不要用\"，而是\"怎么协同\"\n\n❌ 传统触发问题\nharness 需要从 query 语义猜测激活哪些 skill，容易漏触发或误触发。\n\n✅ 显式 /skill 化解\n用户在 input 框中直接 /skill-a /skill-b 在 input 框中直写，触发 100% 精确，语义无歧义。\n\n🎯 剩下的挑战\n多 skill 之间如何编排：谁先谁后、数据怎么传、冲突怎么裁决。\n\n## 二、三层职责划分\n\n| 层级 | 职责 | 关键动作 | 失败兜底 |\n|------|------|---------|---------|\n| 用户层 | 显式 / 声明意图 | /skill-a /skill-b 在 input 框中直写 | 不涉及 |\n| Harness 层 | 静态检查 + 注入 Reminder | 解析 frontmatter，检测冲突点，生成 targeted 提示 | 降级为通用模板 Reminder |\n| 模型层 | 产出结构化工作流 | 读 SKILL.md → 判定组合关系 → 定契约 → 落盘 | Task-Execution drift 由落盘缓解 |\n\n## 三、注入位置与时机\n\n核心决策：Reminder 作为 system-injected 消息附加在 user message 之后（对齐 Anthropic 的 long_conversation_reminder 模式），不改写 system prompt。\n\n为什么放 message 层而不改 system prompt\n\n| 维度 | 改 system prompt | 附在 user message 后（选定方案） |\n|------|-----------------|-------------------------------|\n| 指令遵循率 | 距离 query 远，遵循率较低 | 靠近 query，遵循率明显更高 |\n| Prefix cache 命中率 | 污染前缀，每次内容变都破坏缓存 | 前缀保持稳定，动态内容全部下沉到 message 层 |\n| 按需注入 | 难以做到 turn 级条件控制 | 只在 @≥2 skill 的 turn 出现，其他 turn 完全不感知 |\n\n条件触发规则\n\n/ 单个 skill 时不注入 Reminder。\n\n单 skill 场景没有编排问题，强制规划纯粹增加延迟，还会诱发过度规划（简单任务写三段计划）。触发条件必须精确：\n\n- /count == 0 → 不注入\n- /count == 1 → 不注入\n- /count >= 2 → 注入 Reminder\n\n## 四、Reminder 内容设计\n\n关键是让规划产出结构化且可校验的东西，而不是一段泛泛的\"我先做 A 再做 B\"。\n\n### Reminder 模板\n\n```\n\u003cskill_composition_reminder>\nThe user has explicitly referenced multiple skills: {skill_names}.\nBefore starting work, complete an orchestration plan:\n1. Read the SKILL.md of every referenced skill FIRST, then plan\n   (never plan from skill descriptions alone — the full SKILL.md\n   may contain constraints that invalidate an imagined workflow)\n2. Classify the composition relationship: pipeline (A's output →\n   B's input) / parallel (each handles a separate part) /\n   constraint overlay (one does the work, the other provides\n   rules or standards)\n3. If pipeline: define the interface contract for intermediate\n   artifacts — format and file path\n4. If two skills give instructions on the same dimension (output\n   format / style / process), explicitly declare a conflict\n   resolution rule: which skill takes precedence on which dimension\n5. Output a concise workflow (phase → skill used → artifact),\n   then execute according to it\nKeep planning proportional to task complexity: for simple\ncombinations, two or three sentences suffice.\n\u003c/skill_composition_reminder>\n```\n\n## 五、设计取舍总结\n\n| 取舍点 | 选择 | 放弃的方案 & 原因 |\n|--------|------|-------------------|\n| 触发方式 | 显式 /skill | 放弃自动语义匹配——不可靠且易过度触发 |\n| Reminder 注入位置 | user message 之后 | 放弃改 system prompt——破坏 prefix cache、遵循率低 |\n| 触发阈值 | /skill≥2 | 放弃全量注入——单 skill 场景纯增延迟且诱发过度规划 |\n| Reminder 内容 | 约束产出结构 | 放弃教具体做法——skill 内容会变，硬编码难以维护 |\n| 工作流存储 | 落盘 / Task | 放弃仅存 assistant message——长任务必然稀释丢失 |\n| Harness 增强 | 静态预解析冲突 | 放弃让模型自己发现——静态检查更可靠、成本几乎为零 |\n"},{"path":"harness/Agent Multi-Skill Workflow Orchestration Design.ru.md","title":"Проектирование оркестрации многоскилловых рабочих процессов Агента","group":"harness","content":"# Проектирование оркестрации многоскилловых рабочих процессов Агента\n\n**В одном предложении:** ссылка на несколько skill'ов = пользователь указывает несколько SKILL и вопрос, SKILL-Reminder подсказывает модели создать многоскилловый workflow, а затем задачи декомпозируются и сохраняются на диск для решения проблемы.\n\n## 1. Отправная точка проектирования\n\nВ сценариях с несколькими skill'ами вопрос уже не «использовать ли», а «как их согласовать».\n\n❌ Проблема традиционного триггера\nHarness вынужден угадывать по семантике запроса, какие skill'ы активировать, что легко приводит к пропуску нужных или ложному срабатыванию.\n\n✅ Явный `/skill` снимает проблему\nПользователь пишет `/skill-a /skill-b` прямо в поле ввода — срабатывание точное на 100 %, без семантической двусмысленности.\n\n🎯 Оставшийся вызов\nКак оркестрировать несколько skill'ов: кто идёт первым, как передаются данные, как разрешаются конфликты.\n\n## 2. Трёхслойное разделение ответственности\n\n| Слой | Ответственность | Ключевое действие | Резервный вариант при отказе |\n|------|-----------------|-------------------|-----------------------------|\n| Пользовательский слой | Явное объявление намерения через `/` | Написать `/skill-a /skill-b` прямо в поле ввода | Не задействован |\n| Слой harness | Статическая проверка + инъекция Reminder | Разобрать frontmatter, обнаружить точки конфликта, сгенерировать целевой prompt | Откат к обобщённому шаблонному Reminder |\n| Слой модели | Произвести структурированный workflow | Прочитать SKILL.md → определить тип композиции → задать контракт → сохранить на диск | Дрейф исполнения задач компенсируется сохранением на диск |\n\n## 3. Место и момент инъекции\n\nКлючевое решение: Reminder — это сообщение, инъецируемое системой и добавляемое после сообщения пользователя (по аналогии с паттерном `long_conversation_reminder` от Anthropic). Он не переписывает system prompt.\n\nПочему слой сообщений, а не изменение system prompt\n\n| Аспект | Изменение system prompt | Добавление после сообщения пользователя (выбранный вариант) |\n|--------|-------------------------|-------------------------------------------------------------|\n| Уровень следования инструкциям | Далеко от запроса — следование ниже | Близко к запросу — следование заметно выше |\n| Попадание в prefix-cache | Загрязняет префикс; любое изменение содержимого ломает кэш | Префикс остаётся стабильным; вся динамика опускается на уровень сообщений |\n| Инъекция по требованию | Трудно обусловить по ходу диалога (per-turn) | Появляется только на ходах с ≥ 2 `/skill`; остальные ходы её вовсе не видят |\n\nПравила условного триггера\n\nПри одном `/skill` Reminder не инъецировать.\n\nВ сценарии с одним skill нет проблемы оркестрации; принудительное планирование только добавляет задержку и провоцирует переусердствование (составление трёхэтапного плана для тривиальной задачи). Условие срабатывания должно быть точным:\n\n- количество `/` == 0 → не инъецировать\n- количество `/` == 1 → не инъецировать\n- количество `/` ≥ 2 → инъецировать Reminder\n\n## 4. Дизайн содержимого Reminder\n\nГлавное — чтобы планирование давало что-то структурированное и проверяемое, а не расплывчатое «сначала сделаю A, потом B».\n\n### Шаблон Reminder\n\n```\n\u003cskill_composition_reminder>\nThe user has explicitly referenced multiple skills: {skill_names}.\nBefore starting work, complete an orchestration plan:\n1. Read the SKILL.md of every referenced skill FIRST, then plan\n   (never plan from skill descriptions alone — the full SKILL.md\n   may contain constraints that invalidate an imagined workflow)\n2. Classify the composition relationship: pipeline (A's output →\n   B's input) / parallel (each handles a separate part) /\n   constraint overlay (one does the work, the other provides\n   rules or standards)\n3. If pipeline: define the interface contract for intermediate\n   artifacts — format and file path\n4. If two skills give instructions on the same dimension (output\n   format / style / process), explicitly declare a conflict\n   resolution rule: which skill takes precedence on which dimension\n5. Output a concise workflow (phase → skill used → artifact),\n   then execute according to it\nKeep planning proportional to task complexity: for simple\ncombinations, two or three sentences suffice.\n\u003c/skill_composition_reminder>\n```\n\n## 5. Сводка проектных компромиссов\n\n| Точка компромисса | Выбор | Отвергнутая альтернатива и причина |\n|-------------------|-------|------------------------------------|\n| Механизм триггера | Явный `/skill` | Отклонено автоматическое семантическое сопоставление — ненадёжно и склонно к чрезмерному срабатыванию |\n| Место инъекции Reminder | После сообщения пользователя | Отклонено изменение system prompt — ломает prefix-cache, ниже уровень следования инструкциям |\n| Порог срабатывания | `/skill` ≥ 2 | Отклонена сплошная инъекция — для одного skill это лишь добавляет задержку и провоцирует переусердствование |\n| Содержимое Reminder | Ограничивать структуру вывода | Отклонено обучение конкретным процедурам — содержимое skill'ов меняется, жёсткое кодирование сложно сопровождать |\n| Хранение workflow | Сохранение на диск / Task | Отклонено хранение только в сообщении ассистента — при длинных задачах оно неизбежно размывается и теряется |\n| Улучшение harness | Статический предварительный анализ конфликтов | Отклонено оставлять поиск конфликтов модели — статические проверки надёжнее и стоят почти ничего |\n"},{"path":"harness/MiMo Orchestrator Mode.en.md","title":"MiMo Orchestrator Mode","group":"harness","content":"# MiMo Orchestrator Mode\n\n**In one line**: a \"coordinator\" primary mode — manage all your tasks from a **single window, single session, in pure natural language**: it delegates work to child sessions and handles coordination, integration, and reporting, so you never have to switch back and forth between multiple windows/sessions (experimental, off by default).\n\n## 1. Background & Goals\n\nWhen you push several pieces of work forward at once, the usual approach is to open several terminal windows, run a coding session in each, and then constantly switch between them: watching which one finished, which is blocked waiting for approval, which needs the next instruction. The real burden is not machine compute — it's **your attention and energy**: context ping-pongs between windows and you get worn down by \"multiplexing\" yourself.\n\nThat is exactly what Orchestrator mode solves: **let you manage all your tasks from one window, one session, in pure natural language**. You hand the goal to the Orchestrator in natural language, and it splits the work up, dispatches it, watches progress, comes back to you when it needs a decision, and summarizes when done — you stay in the same conversation the whole time, never jumping between windows.\n\nTo do this, the Orchestrator plays a \"**leader / manager**\" role:\n\n- it **decomposes** your goal into deliverable units of work,\n- **dispatches a child session** for each unit (running in its own mode, model, task panel, and memory),\n- then **coordinates, integrates (git merge), and reports**.\n\nThe normal coding modes (build / plan / compose) are \"executors\": one session in one directory, reading/writing code and running commands itself — to advance several things in parallel you'd open several windows. The Orchestrator is the \"manager\": the parallel child sessions run in the background while what you face is always **this one** coordination session.\n\n**Core boundary**: the Orchestrator does **no substantive work itself** — no writing code, no concrete implementation planning, no quality review. Those are all delegated: a unit that needs planning goes to `plan` (or `compose`, whose workflow has plan/review phases built in); code goes to `build`. \"Decomposing into dispatchable units\" is its job; \"how a given unit is implemented\" and \"reviewing the result\" are jobs it delegates.\n\n**Off by default**: the whole capability is gated behind a single flag `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR` (see §6). When off, MiMoCode behaves exactly as before — no Orchestrator mode, no `session` tool, no approval routing, no workspace switching.\n\n## 2. Overall Model\n\n```\nuser goal\n   │  decomposition\n   ▼\nOrchestrator session (globally unique, see §5)\n   │  session create ──► child A (build,  dir=repo1, --isolate)  ┐\n   │  session create ──► child B (plan,   dir=repo2)             │  parallel, in background\n   │  session create ──► child C (compose,dir=repo1, --isolate)  ┘\n   │\n   │  child finishes → actor_notification back to inbox → wakes the Orchestrator\n   ▼\ncoordinate / integrate (git merge each child's mimocode/* branch) / report to user\n```\n\n- Each child is an **independent session** (its own session id, task panel, memory), running in the **background** with `mode: \"peer\"`.\n- The Orchestrator **returns immediately** after dispatching and does not poll; a child **actively wakes** it via an inbox notification when it finishes.\n- A child is a peer, not an in-session subagent — you can **fully attach** into any child session to view/take over, just like `mimo -c \u003cid>`.\n\n## 3. The `session` Tool (the Orchestrator's core capability)\n\nOnly Orchestrator mode can see and call the `session` tool (gated by agent name + by the flag). It offers both JSON and shell call forms (the exact syntax is given by the tool description). Eight verbs in total:\n\n| verb | purpose | key params |\n|---|---|---|\n| `create` | dispatch a new child session in the background | `task` (first-turn task, required); optional `mode` (build\\|plan\\|compose, default build), `model`, `title`, `dir` (the directory the child runs in — any project/path, defaults to the Orchestrator's own), `isolate` (run in a dedicated git worktree of `dir` to avoid concurrent-write conflicts) |\n| `switch` | move the frontend panel to a session | `sessionID` (resolve natural language to an id via `list` first, then switch) |\n| `list` | list this Orchestrator's child sessions (id / title / mode / status) | — |\n| `cancel` | stop a child that is no longer needed; if it was `--isolate`d, also remove its worktree and branch | `sessionID` |\n| `ask` | ask a session one **read-only, one-shot** side question (answered from a frozen snapshot of its history, without interrupting its run) | `session_id` + `question` |\n| `setmode` | change the mode a child runs under for its **subsequent turns** (e.g. a plan child, once done planning, switches to build to execute in the **same session**, no new session needed) | `sessionID` + `mode` (build\\|plan\\|compose) |\n| `approve` | approve a child's **currently pending** permission request (see §4) | `sessionID` |\n| `grant-approval` | pre-authorize: auto-approve future permission requests (no prompt each time) | `target` (a child's sessionID, or `all` for every child) |\n\nImplementation: `packages/opencode/src/tool/session.ts` (verb list `KNOWN_VERBS`).\n\n### 3.1 Directory & isolation (`--dir` / `--isolate`)\n\nThe Orchestrator is a **general** coordinator that can work across different projects, so each child's directory and isolation are **decided per task**, not assumed from the current project:\n\n- `dir` — the directory the child runs in. Point it at the project/subproject/scratch dir the task belongs to; omit to use the Orchestrator's own directory.\n- `isolate` — when on, the child runs in **its own git worktree** of `dir`'s repo (branch `mimocode/\u003ctask>`), so multiple children editing the same repo don't collide with each other or with the Orchestrator. Use it for \"will edit files, possibly concurrently\"; leave it off for read-only/single-writer work, or a non-git dir (which degrades to running directly in `dir`).\n\nThe worktree is created/removed in `dir`'s own repo Instance (cross-project correct); a child worktree lives at `\u003cdata>/worktree/\u003cprojID>/\u003ctask-slug>`, on branch `mimocode/\u003ctask-slug>`.\n\n### 3.2 Integration & cleanup\n\n- An isolated child's commits live on its own `mimocode/\u003c...>` branch. The Orchestrator integrates them itself with git (it has `bash`): `git log \u003cbranch>` / `git diff \u003cbase>...\u003cbranch>` / `git merge-tree` to preview conflicts → `git merge \u003cbranch>` (or cherry-pick). Find a child's branch via `git worktree list` / `git branch --list 'mimocode/*'`.\n- **Only `cancel` an isolated child after its work is merged, or the task is abandoned** — `cancel` deletes the worktree and branch, so doing it on **unmerged** work permanently loses that work. Don't `cancel` a child just because it \"finished\" (finishing produces commits on its branch that still need merging).\n\n### 3.3 Lifecycle (no-poll / interrupt / resume)\n\n- **No polling**: `create` returns immediately, the child runs in the background, and a message into the inbox wakes the Orchestrator when it's done. After dispatching, return / answer the user / end the turn — don't loop on `list`/status and burn turns.\n- **Interrupt**: interrupting the Orchestrator does **not** stop its children — they keep running in the background and notify on completion. To stop a specific child, use `session cancel \u003cid>`. When the whole session exits, all children exit with it.\n- **Resume all**: `session list` enumerates children; for any child whose last outcome wasn't success (cancelled/failed/never reported) or that still has open tasks, forward it a message via the `actor` send action to continue. There's no separate resume command — drive resume with list + relay.\n\n## 4. Child-session permission-approval routing\n\n**Problem**: a background child has no interactive panel facing the user directly. By default a background session that hits a permission gate requiring an `ask` (e.g. accessing a directory outside its workspace, reading `.env`) is **denied outright** (`interactive:false` → `DeniedError`) — the user never sees it and cannot approve it.\n\nAn Orchestrator child does have a path to a human — its parent session and the user viewing the TUI. So for an **Orchestrator peer child**, a permission `ask` is **forwarded for approval** instead of silently denied:\n\n- **Decision**: `decideAskRouting` (`src/agent/config.ts`) splits three ways: system agents (checkpoint-writer/dream/distill) → still auto-deny; **Orchestrator peer** (background + `mode:peer` + has a parent) → forward for approval; other background (compose subagents, etc.) → still auto-deny.\n- **Who approves**: a forwarded request can be resolved by (a) the **user directly** (switch into the child, use the normal per-session permission UI), or (b) the **Orchestrator on your behalf** — when it holds a matching delegation grant.\n- **Delegation grants**:\n  - `session grant-approval \u003cchildSessionID>` — pre-authorize a given child's future asks to pass automatically;\n  - `session grant-approval all` — pre-authorize **all** of this Orchestrator's children;\n  - `session approve \u003cchildSessionID>` — one-shot approve the child's currently pending request.\n- **Dedup**: there is only one copy of each permission request. Both the direct-user path (`Permission.reply`) and the Orchestrator path (`session approve`) converge on the same Deferred; the second is an idempotent no-op. Once either side approves, the Orchestrator's forwarded copy is dropped — no double handling, no stale request.\n- **Never hangs**: a forwarded ask that no one answers is **auto-denied** after `FORWARD_DENY_TIMEOUT_MS` (5 minutes, `src/permission/index.ts`), preserving the \"never hang\" guarantee of the original auto-deny; abortSignal can still cancel it anytime.\n- **Notifications**: recording a forwarded request **wakes the Orchestrator** (inbox note with the child id and how to approve) and pops a toast for the user; a child's **completion** also toasts the user (not just the Orchestrator).\n\n## 5. The globally-unique Orchestrator workspace\n\nOrchestrator mode uses a **fixed global working directory** (`\u003cdata>/orchestrator`, via `orchestratorDir()` in `src/global/index.ts`):\n\n- No matter which directory you launch MiMoCode from, **switching into Orchestrator mode** switches the TUI's working directory to this global directory and lands on the **single** root Orchestrator session there (find-or-create).\n- So it's always the same Orchestrator session regardless of where you launched — previously-created child sessions are always visible and reachable. Otherwise, launching from different directories would give different Orchestrator sessions, and you couldn't find the children you created before.\n\nThe switch reuses the worktree dialog's sequence: `instance.dispose → switchDirectory → sync.bootstrap →` find/create the root session and navigate. The server's cwd-containment check allows this app-owned global directory (only when the feature is enabled).\n\n## 6. Flag, off by default\n\nA single flag gates the whole capability, **off by default**, explicit opt-in:\n\n```\nMIMOCODE_EXPERIMENTAL_ORCHESTRATOR: MIMOCODE_EXPERIMENTAL || truthy(\"MIMOCODE_EXPERIMENTAL_ORCHESTRATOR\")\n```\n\n- Default **OFF**; set `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true` to enable (the umbrella `MIMOCODE_EXPERIMENTAL=1` enables it too).\n- **Two load-bearing gates** make the feature fully disappear when off:\n  1. **Agent registration** (`src/agent/agent.ts`) — the orchestrator agent is registered only when the flag is on, via a conditional spread (matching how `max` mode is done). When off it's not in the agent set, so it doesn't appear in the TUI mode-cycle (Tab), the agent dialog, or `defaultAgent`, and no peer can be dispatched.\n  2. **Tool registration** (`src/tool/registry.ts`) — the `session` tool is registered only when the flag is on. When off, no agent can get it.\n- **Defense in depth** (dead code once off, but explicit): the TUI's enter-Orchestrator dir-switch effect early-returns when off; the server middleware's global-dir exception applies only when on; `decideAskRouting` given `orchestratorEnabled:false` falls back to auto-deny for peers.\n\nThe flag is evaluated once at import (reads `process.env`). Tests set it to `true` early in `test/preload.ts` (the Orchestrator suites exercise the feature).\n\n## 7. Quick start\n\n1. Enable the feature: `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true` (or `MIMOCODE_EXPERIMENTAL=1`).\n2. Launch MiMoCode and press **Tab** to cycle to **Orchestrator** mode — the working directory switches automatically to the global Orchestrator workspace and lands on the single Orchestrator session.\n3. Give it work, e.g.: *\"Create a build-mode child to add a login page to repo1, dir set to /path/to/repo1, with isolate on; and a compose child to design the billing schema in repo2.\"*\n4. Use `/sessions` (or have the Orchestrator `session list`) to see the `↳`-labeled children; select one to fully attach in to view/take over, and return with the session-parent keybind.\n5. A child's completion wakes the Orchestrator and toasts you; operations needing approval are forwarded to you (or auto-approved per your `grant-approval`).\n6. When satisfied, have the Orchestrator merge/integrate each isolated child's `mimocode/*` branch.\n\n## 8. Related source\n\n| Concern | Location |\n|---|---|\n| Orchestrator agent definition + flag gate | `packages/opencode/src/agent/agent.ts` |\n| Orchestrator system prompt (delegator identity) | `packages/opencode/src/session/prompt/orchestrator.txt` |\n| `session` tool (8 verbs) | `packages/opencode/src/tool/session.ts` |\n| Tool registration + flag gate | `packages/opencode/src/tool/registry.ts` |\n| Permission approval-routing decision | `packages/opencode/src/agent/config.ts` (`decideAskRouting`) |\n| Forward/grant ref + dedup | `packages/opencode/src/permission/permission-forward-ref.ts`, `src/permission/index.ts` |\n| Global Orchestrator workspace | `packages/opencode/src/global/index.ts` (`orchestratorDir`), `src/cli/cmd/tui/app.tsx` |\n| flag definition | `packages/opencode/src/flag/flag.ts` (`MIMOCODE_EXPERIMENTAL_ORCHESTRATOR`) |\n"},{"path":"harness/MiMo Orchestrator Mode.fr.md","title":"MiMo Orchestrator Mode","group":"harness","content":"# MiMo Orchestrator Mode\n\n**En une phrase** : un mode principal « coordinateur » — gérez toutes vos tâches depuis **une seule fenêtre, une seule session, en langage naturel pur** : il délègue le travail à des sessions enfants (child sessions) et se charge de la coordination, de l'intégration et du compte rendu, pour que vous n'ayez jamais à basculer entre plusieurs fenêtres/sessions (fonctionnalité expérimentale, désactivée par défaut).\n\n## 1. Contexte et objectifs\n\nQuand vous faites avancer plusieurs travaux à la fois, l'approche habituelle est d'ouvrir plusieurs fenêtres de terminal, d'y lancer une session de codage chacune, puis de basculer sans cesse entre elles : surveiller laquelle a fini, laquelle est bloquée en attente d'approbation, laquelle attend la prochaine instruction. La vraie charge n'est pas la puissance de calcul — c'est **votre attention et votre énergie** : le contexte fait des allers-retours entre les fenêtres et vous vous épuisez à vous « multiplexer ».\n\nC'est exactement ce que résout le mode Orchestrator : **vous permettre de gérer toutes vos tâches depuis une fenêtre, une session, en langage naturel pur**. Vous confiez l'objectif à l'Orchestrator en langage naturel, et il découpe le travail, le distribue, surveille l'avancement, revient vers vous quand une décision est nécessaire, et résume une fois terminé — vous restez dans la même conversation tout du long, sans sauter d'une fenêtre à l'autre.\n\nPour cela, l'Orchestrator joue un rôle de « **leader / manager** » :\n\n- il **décompose** votre objectif en unités de travail livrables (decomposition),\n- **distribue une session enfant** pour chaque unité (tournant dans son propre mode, modèle, panneau de tâches et mémoire),\n- puis **coordonne, intègre (git merge) et rend compte**.\n\nLes modes de codage normaux (build / plan / compose) sont des « exécutants » : une session dans un répertoire, lisant/écrivant du code et lançant des commandes elle-même — pour avancer plusieurs choses en parallèle, il faudrait ouvrir plusieurs fenêtres. L'Orchestrator est le « manager » : les sessions enfants parallèles tournent en arrière-plan tandis que vous faites toujours face à **cette seule** session de coordination.\n\n**Frontière fondamentale** : l'Orchestrator ne fait **aucun travail substantiel lui-même** — pas d'écriture de code, pas de planification d'implémentation concrète, pas de revue de qualité. Tout cela est délégué : une unité nécessitant de la planification va à `plan` (ou `compose`, dont le flux intègre des phases plan/review) ; le code va à `build`. « Décomposer en unités à distribuer » est son travail ; « comment une unité donnée est implémentée » et « la revue du résultat » sont des travaux qu'il délègue.\n\n**Désactivé par défaut** : toute la capacité est protégée par un unique drapeau `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR` (voir §6). Désactivé, MiMoCode se comporte comme avant — pas de mode Orchestrator, pas d'outil `session`, pas de routage d'approbation, pas de changement d'espace de travail.\n\n## 2. Modèle global\n\n```\nobjectif utilisateur\n   │  décomposition\n   ▼\nsession Orchestrator (globalement unique, voir §5)\n   │  session create ──► child A (build,  dir=repo1, --isolate)  ┐\n   │  session create ──► child B (plan,   dir=repo2)             │  parallèle, en arrière-plan\n   │  session create ──► child C (compose,dir=repo1, --isolate)  ┘\n   │\n   │  l'enfant finit → actor_notification revient à l'inbox → réveille l'Orchestrator\n   ▼\ncoordonner / intégrer (git merge la branche mimocode/* de chaque enfant) / rendre compte\n```\n\n- Chaque enfant est une **session indépendante** (son propre session id, panneau de tâches, mémoire), tournant en **arrière-plan** avec `mode: \"peer\"`.\n- L'Orchestrator **revient immédiatement** après la distribution et ne fait pas de polling ; un enfant le **réveille activement** v
