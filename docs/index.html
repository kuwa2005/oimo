ook the ESM path. Three explanations were tried and falsified:\nleaked test state (both files restore their spies), a static-plus-dynamic import race, and\ncache exhaustion under concurrent re-imports; neither of the latter two reproduces standalone.\n\nThis reads as a Bun defect — a static import carrying `with { type: \"text\" }` should reach the\ntext loader every time — but no minimal standalone reproduction was isolated, so the trigger\nfor the re-evaluation remains unexplained.\n\n## [S2] Design\n\n`builtin.macro.ts` reads `builtin/*.js` with `fs.readdirSync` / `fs.readFileSync` and returns\n`{ file, script }[]`. `builtin.ts` consumes it through `with { type: \"macro\" }`, so the call is\nevaluated at transpile and the sources are inlined as string literals. A file read at build time\nis never in the module graph, whatever it is named, which is why this fixes the cause rather\nthan the symptom — and why the scripts keep their `.js` names, stay inside oxlint's coverage,\nand need no changes anywhere else.\n\nThe directory is the registry, as it is for built-in skills in `skill/builtin/bundle.macro.ts`.\nNothing outside this module refers to the filenames; consumers look workflows up by `meta.name`,\nwhich each script declares itself.\n\nThree consequences follow from that, all accepted because the directory is curated. Losing a\nscript is no longer a boot failure — it simply stops registering, and callers get the existing\nunknown-workflow error — so `builtin.test.ts` asserts the registered set to make a deletion\nloud. A stray `.js` dropped there becomes a shipped workflow rather than being inert, and a\nmalformed meta in it fails app boot. Two scripts declaring the same `meta.name` silently\nlast-wins, unchanged from before.\n\nTwo Bun constraints shape the call site, both already encoded in the pattern\n`skill/builtin/extract.ts` established:\n\n- Macros are not expanded in every transpile path. Under `bun test` the macro import is stripped\n  without the call being replaced, surfacing as a `ReferenceError`, so the macro module is also\n  imported normally and the macro form falls back to it. A `try`/`catch` is warranted here\n  against the repository's general preference because a non-expanded macro is not otherwise\n  detectable.\n- Macro arguments must be statically known. A per-filename signature would make a misspelled\n  name a build error, but it cannot pass through the fallback wrapper — the argument stops being\n  static and the build fails with `Cannot convert identifier to JS`.\n\n## [S3] Out of Scope\n\n- Reporting upstream. This removes the repository's exposure, not the loader behaviour. The\n  reproduction and measurements are recorded above so a report can be assembled without\n  repeating the work.\n- Why `thread.test.ts` re-evaluates `builtin.ts` a hundred times. It is the condition that made\n  the collision likely and it presumably still holds.\n- Rejected: renaming to `.js.fn` or `.txt` (treats the extension as the defect, costs lint\n  coverage; `.txt` would also collide with `session/prompt/compose.txt`), and making the scripts\n  valid ESM (the top-level `return` is the sandbox contract that user-authored workflows depend\n  on).\n\n## Tasks\n\n- [x] T1: Read the scripts through a build-time macro instead of importing them — acceptance: the two-file reproduction runs all four tests with no failure or error (covers: S2)\n- [x] T2: Add the dev fallback the macro pattern requires — acceptance: `bun test` loads the registry rather than throwing `ReferenceError`, and `bun typecheck` passes with no suppressions (covers: S2)\n- [x] T3: Confirm the sources still reach a compiled standalone binary — acceptance: the bundler output shows the macro call site replaced by a literal, and a command that loads the registry runs from the binary in an empty directory (covers: S2)\n"},{"path":"compose/spec/checkpoint-writer-safety.md","title":"Checkpoint Writer Safety","group":"spec","content":"---\nfeature: checkpoint-writer-safety\nstatus: delivered\nupdated: 2026-07-22\nbranch: investigate/checkpoint-writer-sandbox\ncommits: 0cb81dba827e27549bde6fba794e27509ef1bf65..25f175dd\n---\n\n# Checkpoint Writer Safety\n\n## Report\n\n**What was built** - The checkpoint writer is now confined to normal paths under the memory tree at the unified write gate; the existing precise memory allowlist remains authoritative inside that tree. Dream/distill retain their prior memory-or-`.mimocode/` behavior, while ordinary agents retain normal source writes. The gate now obtains its worktree from `InstanceState.context`, so InstanceRef-bound actor fibers cannot skip the sandbox.\n\nInvalid-output recovery now selects an explicit role policy. Primary turns keep the user-facing reminder, ordinary actors receive a parent-facing reminder, and checkpoint writers receive a scoped recovery instruction that either finishes authorized memory edits or returns `CHECKPOINT_COMPLETE`. System-agent policy coverage is exhaustive. Terminal assistant errors now fail actor outcomes, so exhausted checkpoint recovery leaves the watermark unchanged through the existing transactional settlement path.\n\n**Verification** - From `packages/opencode`, `bun test test/tool/memory-path-guard.test.ts test/tool/apply_patch.test.ts test/agent/ask-routing.test.ts test/session/invalid-output-continuation.test.ts test/actor/spawn.test.ts test/session/checkpoint-watermark-transactional.test.ts test/session/checkpoint-child-session.test.ts test/session/checkpoint-permission.test.ts` passed 151 tests with 286 assertions and 0 failures. `bun typecheck` passed. `git diff --check` passed. Targeted oxlint reported 0 errors; remaining warnings were existing large-file/test idioms. Independent final review approved spec compliance, correctness, and codebase consistency with no remaining findings.\n\n**Journey log**\n\n- The incident was one writer reactivated by the generic user-facing empty-output reminder, not duplicate checkpoint-writer spawns.\n- The unified memory guard was precise only after a path entered the memory tree; a separate checkpoint-writer memory-only sandbox was required for source paths.\n- `SessionPrompt.prompt` could return a terminal assistant error that Actor previously converted to success; propagating that error restores watermark transactionality.\n- A combined AppRuntime watermark E2E was process-state dependent, so stable boundary tests cover checkpoint exhaustion → actor failure and writer failure → unchanged watermark separately.\n- Symlink/hardlink topology inside the application-managed memory tree is explicitly user-owned and outside this lexical path-boundary threat model.\n\n## [S1] Problem\n\nThe checkpoint writer is a system-spawned actor whose successful work is expressed through memory-file edits followed by an intentionally empty stop. The generic invalid-output continuation treats that empty stop as a missing user-facing answer and injects a prompt telling the writer to answer the user or call another tool. Because the writer receives full parent context, that retry can make it resume the parent's development task instead of terminating.\n\nThe writer also receives general file-editing tools. Those tools call the unified write gate, but the current system-agent sandbox covers only `dream` and `distill`. The memory-specific guard precisely restricts checkpoint-writer paths only after a target is recognized as part of the memory tree; it permits non-memory targets to pass through. A drifted checkpoint writer can therefore edit source files with `write`, `edit`, or `apply_patch`.\n\nThe observed incident used both gaps: a generic empty-output retry reactivated a completed checkpoint writer, and the missing hard path boundary allowed it to patch project source. Prompt instructions and tool allowlists alone are insufficient because either can drift or be widened later.\n\n## [S2] Design\n\n### [S2.1] Checkpoint Writer Write Boundary\n\nThe unified write gate must enforce a checkpoint-writer-specific sandbox before applying the existing precise memory allowlist:\n\n- `checkpoint-writer` may target only files under the resolved memory root.\n- Within the memory root, `assertMemoryWriteAllowed` remains authoritative for canonical `MEMORY.md`, `checkpoint.md`, `notes.md`, permitted spillovers, and permitted task narratives.\n- `checkpoint-writer` must not write project source, repository configuration, any worktree path, or `.mimocode/`.\n- `dream` and `distill` retain their existing memory-root or worktree `.mimocode/` sandbox.\n- Primary and ordinary agents retain their existing source-write behavior.\n- Every file-mutating tool that uses `assertWriteAllowed`, including `write`, `edit`, `apply_patch`, and `notebook_edit`, receives the same boundary. `apply_patch` must enforce it for add, update, delete, and both sides of move operations.\n\nRemoving `apply_patch` from the checkpoint writer's tool whitelist is not a substitute for this boundary.\n\n### [S2.2] Role-Specific Invalid-Output Policies\n\nInvalid-output continuation must select a policy from the execution role rather than sharing one user-facing prompt across all agents:\n\n- A primary turn (`agentID === \"main\"`) retains the existing user-facing retry that asks for a final answer or a valid tool call.\n- An ordinary actor/subagent receives an actor-facing retry that asks it to return a usable result to its parent or continue the necessary tool work. It must not claim that it is answering the user directly.\n- `checkpoint-writer` receives the checkpoint-specific policy in [S2.3].\n- Existing system agents must declare an explicit policy. The declared policy keys and `SYSTEM_SPAWNED_AGENT_TYPES` must remain synchronized by a regression test so a future system agent cannot silently inherit a default user-facing retry.\n- `dream` and `distill` require a non-empty summary and use a system/actor-facing retry rather than the primary-user wording.\n\nPolicy selection must be centralized near the invalid-output continuation. Do not scatter independent agent-name checks across the three run-loop classification sites.\n\n### [S2.3] Checkpoint-Specific Retry\n\nAn empty or think-only checkpoint-writer stop remains retryable, but it must never receive the generic primary-agent reminder. The synthetic checkpoint reminder must:\n\n- restate that the actor is the checkpoint writer;\n- forbid answering or continuing the parent session's task;\n- restrict further work to the authorized checkpoint and memory paths already supplied to the writer;\n- tell the writer to finish any incomplete authorized edits; and\n- tell the writer to return exactly `CHECKPOINT_COMPLETE` without further tool calls when the authorized edits are already complete.\n\nThe fixed marker is ordinary non-empty assistant text, so existing classification terminates naturally without a checkpoint-specific classifier branch. Existing bounded invalid-output retry limits remain in force. This design intentionally does not add a checkpoint content hash, write ledger, or dedicated commit tool: a capable model gets one correctly scoped recovery instruction, while the hard write boundary makes drift non-destructive.\n\n### [S2.4] Actor Error Outcomes\n\nIf `SessionPrompt.prompt` returns a terminal assistant carrying `assistant.error`, `Actor.runAgentLoop` must fail instead of converting the result into a successful actor outcome with no text. This applies to all actors/subagents and does not change direct primary-session behavior.\n\nFor checkpoint writers, exhausting invalid-output recovery therefore produces a failed actor outcome. The checkpoint settlement watcher must leave `last_checkpoint_message_id` unchanged, preserving the existing invariant that an uncheckpointed delta is re-covered by a later writer.\n\n### [S2.5] Regression Contract\n\nTests must cover the real boundaries rather than prompt text alone:\n\n- checkpoint-writer source and `.mimocode/` writes fail through the unified gate;\n- valid checkpoint and project-memory writes continue to pass;\n- unauthorized memory-tree paths continue to fail;\n- `apply_patch` cannot mutate source as checkpoint-writer;\n- primary, ordinary actor, and checkpoint-writer empty outputs receive their respective prompts;\n- the checkpoint reminder contains no instruction to answer the user and converges when the model returns `CHECKPOINT_COMPLETE`;\n- actor terminal assistant errors produce failure outcomes;\n- primary invalid-output recovery and existing dream/distill sandbox behavior do not regress; and\n- every system-spawned agent has an explicit invalid-output policy.\n\n## [S3] Out of Scope\n\n- Modifying Compose skills, `compose.txt`, the Compose workflow, or PR descriptions.\n- Changing the checkpoint writer's full-context or child-session architecture.\n- Removing file-editing tools from the checkpoint writer solely as a safety mechanism.\n- Introducing a dedicated checkpoint commit tool, transactional multi-file writes, checkpoint hashes, or tool-history success ledgers.\n- Changing checkpoint content schemas, spillover formats, memory paths, or watermark selection.\n- Sandboxing direct shell filesystem writes for agents that are allowed to use shell tools; checkpoint-writer does not currently receive a shell tool.\n- Detecting symlink or hardlink escapes deliberately placed inside the application-managed memory tree; this boundary protects normal resolved paths and `..` traversal, not adversarial filesystem topology controlled by the user.\n- Modifying or repairing historical database records.\n\n## Tasks\n\n- [x] T1: Enforce the checkpoint-writer memory-only sandbox in the unified write gate - acceptance: checkpoint-writer source and `.mimocode/` targets are rejected while valid memory targets, dream/distill behavior, and normal-agent source writes pass (covers: S2.1, S2.5)\n- [x] T2: Add centralized role-specific invalid-output policy selection and checkpoint completion-marker retry - acceptance: primary, ordinary actor, checkpoint-writer, dream, and distill receive their specified prompts, the checkpoint path converges on `CHECKPOINT_COMPLETE`, and system-agent policy coverage is exhaustive (covers: S2.2, S2.3, S2.5)\n- [x] T3: Propagate terminal assistant errors as actor failures - acceptance: an actor whose prompt terminates with `assistant.error` resolves failure, while successful text and structured actor results remain successful (covers: S2.4, S2.5)\n- [x] T4: Add apply-patch and checkpoint outcome regressions - acceptance: checkpoint-writer `apply_patch` cannot mutate source, valid checkpoint and project-memory mutations succeed, exhausted checkpoint recovery resolves actor failure, failed writer settlement leaves the watermark unchanged, and primary recovery remains unchanged (covers: S2.1, S2.3, S2.4, S2.5; depends: T1, T2, T3)\n- [x] T5: Run focused tests and package typecheck, then obtain independent review - acceptance: all focused suites and `bun typecheck` pass from `packages/opencode`, and review confirms write-boundary, retry-policy, actor-outcome, and scope compliance (covers: S2.1, S2.2, S2.3, S2.4, S2.5; depends: T4)\n"},{"path":"compose/spec/compose-next.md","title":"Compose Next","group":"spec","content":"---\nfeature: compose-next\nstatus: delivered\nupdated: 2026-07-22\nbranch: compose-next\ncommits: 8e2817cfddb35ba19fcea221b6567966890dfc87..42613223d00eec340651b632aacfcac01677f795\npredecessor: compose-slim (draft PR #1850)\n---\n\n# Compose Next\n\n## Superseded in part (2026-07-31)\n\nThe invisibility mechanism described below was replaced by\n`docs/compose/spec/skill-invocation-control.md`, which is the current contract.\nThree statements in this document no longer hold:\n\n1. The exact `\"compose-next\": \"deny\"` default-agent skill permission is gone.\n   Permission now means authorization only — a `deny` makes a skill unusable by\n   the user too — so keeping it would have broken the user's own\n   `/compose-next`. Model invisibility moved to `disable-model-invocation: true`\n   in the skill's own frontmatter.\n2. S2's \"`SkillTool.execute()` stays permissive… if a model guesses the exact\n   name it may invoke it\" is reversed: the skill tool now refuses a\n   `disable-model-invocation` skill and redirects to the user's slash command.\n3. `skill/search.ts` no longer special-cases the name `compose-next`; its\n   exclusion from `skill_search` is carried by the field.\n\nThe rest — the skill's content, its presence in `Skill.all()` for slash\nautocomplete, the deprecation touchpoints, and the i18n keys — is unchanged.\n\n## Report\n\n**What was built** - One self-contained builtin skill `compose-next` (grill → spec → workspace → implement → verify → review → finalize → finish), invoked from Build as `/compose-next`. Hidden from model auto-discovery via an exact `\"compose-next\": \"deny\"` default-agent skill permission plus `skill_search` sourcing from `Skill.available(agent)`; still present in `Skill.all()` so slash autocomplete works. Legacy Compose is untouched functionally and marked deprecated through three additive touchpoints: agent description line, `Compose (legacy)` input-bar label, and a compose-only home-tip display override. Side fix: tips now render for first-time users (first-session gate removed).\n\n**Verification** - From `packages/opencode`: `bun test test/skill test/permission test/tool/skill-search.test.ts` — 230 pass / 0 fail / 555 assertions. `bun typecheck` — PASS. `git diff --check` — PASS. CI (lint, typecheck, unit shards 1-4) — all green on PR #1861.\n\n**Journey log**\n\n1. CI shard 4 failed from cross-file env pollution: `skill.test.ts` sets `MIMOCODE_DISABLE_BUILTIN_SKILLS` at module top-level and never restores; the Flag getter reads env lazily. Fixed with the save/clear/restore pattern from #1850's `available-permission.test.ts`. Lesson: any test needing builtin-bundle extraction must defensively clear that flag.\n2. The skill originally referenced `\u003ccompose_docs_dir>` — a prompt block only injected for the Compose agent and `compose.js`, never in Build sessions. Dead reference removed; path hardcoded to `docs/compose/spec/`. Lesson: a skill assembled from another agent's bundle inherits that agent's prompt-injection assumptions; audit them.\n3. Workspace was dropped from the pipeline declaration during the three-skill hand-merge, letting the mechanical-change branch land on `main` by omission. Merge artifacts hide in transition sentences, not section bodies.\n4. Review-loop needed a stop gate but a hardcoded round count was rejected in favor of judgment-based non-convergence signals (repeated findings on the same area; fixes introducing new criticals).\n5. The finalize commit necessarily sits outside the recorded reviewed range; without saying so, a literal reader loops finalize → re-review → finalize. The skill now states CI re-running on it is expected.\n\n## [S1] Problem\n\nLegacy Compose bundles three concerns into one agent mode: permission policy (what tools may be used), workflow curriculum (fourteen internal skills orchestrating brainstorm, plan, tdd, review, merge, ...), and UI state (Tab-cycle entry, status bar, dialog filtering). The curriculum was necessary for weaker models; stronger Fable/Sol-class models internalize most of it and benefit more from one compact executable contract than from fourteen orchestrated skills.\n\nDraft PR #1850 (`compose-slim`) validated this experimentally by consolidating fourteen skills into three (`compose-grill`, `compose-spec`, `compose-dev`), reducing `compose.txt`, and introducing a structured `scope` field with `Permission.evaluateSkill`. The experiment worked, but it replaces too much of Legacy Compose at once and cannot ship as-is: existing users depend on the current Compose agent, and rewriting the workflow while migrating discovery mechanism in the same PR is an unnecessarily large blast radius.\n\nCompose Next is the compatibility-first successor. It carries only the additive product surface (one new user-selectable skill) and the minimum discovery adjustment required to make it user-visible while keeping it out of routine model auto-discovery. Everything else — including the eventual removal of `compose:*` name-prefix filtering — is deferred to the Legacy-Compose-removal PR.\n\n## [S2] Design\n\n### One self-contained builtin skill\n\nAdd one skill file:\n\n```text\npackages/opencode/src/skill/builtin/.bundle/compose-next/SKILL.md\n```\n\nCanonical name: `compose-next`. Bundle root: builtin. Not prefixed with `compose:`; not scoped to the Compose agent. It is a normal builtin capability whose consumer is any primary agent (in practice, Build) that explicitly loads it.\n\nThe skill body is a single executable contract, in this order:\n\n1. **Grill** - resolve genuine user decisions (question tool with concrete options); apply Never-Ask to a single decision only; do not batch later decisions under one grant.\n2. **Spec** - create or amend a feature document at `docs/compose/spec/\u003cfeature>.md` when the work warrants one; keep design, tasks, and delivery report in that one document. The path is fixed in the skill text; no `\u003ccompose_docs_dir>` prompt injection is involved (that block only exists for the Compose agent and `compose.js`, neither of which is in the `/compose-next` path).\n3. **Workspace** - own a worktree before implementation on every path (linked worktree under `.worktrees/` by default); never start on `main`/`master` without explicit consent.\n4. **Implement** - proceed in dependency order; use test-first where applicable; do not spawn parallel edits into the same worktree.\n5. **Verify** - run verification and produce a compact PASS/FAIL/PRE-EXISTING summary; verification must complete before review is dispatched.\n6. **Review** - dispatch one fresh reviewer with spec path, worktree path, base/head SHAs, diff coordinates, and the compact verification summary; the reviewer reuses that summary rather than duplicating heavy E2E commands without cause.\n7. **Finalize** - update the feature document (report, journey log, verification evidence) before branch completion.\n8. **Finish** - explicit merge / PR / keep-branch / discard, with worktree ownership stated; destructive actions never auto-approve.\n\nThe three slim experimental skills are source material for this document; they are not carried into the production bundle.\n\n### User-visible, model-undiscovered\n\nDiscovery uses the existing `Skill.all()` versus `Skill.available(agent)` split; no new mechanism is added.\n\n- `Skill.all()` includes `compose-next`. Command registration and the app skills endpoint already resolve from `all()`, so `/compose-next` slash autocomplete and explicit invocation work in Build without further wiring.\n- Default agent skill permission adds an exact `compose-next: deny` rule at `packages/opencode/src/agent/agent.ts` alongside the existing `\"compose:*\": \"deny\"`. `Skill.available(agent)` therefore omits `compose-next` from `available_skills` and from the skill tool description surface.\n- `packages/opencode/src/tool/skill-search.ts` currently reads `Skill.all()`; it must switch to `Skill.available(agent)` so `compose-next` (and any future permission-hidden skill) is not returned by BM25 search or auto-load. This is a general correctness fix that PR #1850 already documented as independent of the scope refactor.\n- `SkillTool.execute()` (via `Skill.get()`) stays permissive. If a model guesses the exact name `compose-next` it may invoke it; this is behavior guidance, not a security boundary. Do not add activation state, invoke-time refusal, model allowlists, or new visibility schema.\n\nBecause the new skill is not named `compose:*` and lives in the builtin bundle, none of the six existing `startsWith(\"compose:\")` sites accidentally hide it:\n\n- `skill/search.ts:65` (name-prefix filter) — no match; unaffected.\n- `skill/localized-alias.ts:8` (alias suppression) — no match; `compose-next` produces localized aliases like any other builtin.\n- `cli/.../dialog-skill.tsx:29` (skill dialog filter) — no match; appears in the dialog.\n- `cli/.../autocomplete.tsx:388` (slash autocomplete filter outside Compose) — no match; `/compose-next` shows in Build autocomplete.\n- `agent/agent.ts:110` default agent `\"compose:*\": \"deny\"` — no match; a separate exact `compose-next: deny` rule handles model discovery.\n- `agent/agent.ts:219` compose agent `\"compose:*\": \"allow\"` — no match; Compose agent does not auto-allow `compose-next`, which is intended (Compose Next is not a Compose-mode internal).\n\n### Legacy Compose deprecation surface\n\nCompose agent stays enabled, keeps its private skills, its prompt injection, and `compose.js`. It is not removed from the Tab-cycle in this PR; the dual-path release window requires it to remain reachable exactly the way users know it today.\n\nThree additive deprecation touchpoints:\n\n1. **Agent description only** — single deprecation line appended to the `agent.ts` compose block `description`. The Compose system prompt (`packages/opencode/src/session/prompt/compose.txt`) is deliberately **not** touched: any byte change to a model-facing system prompt invalidates prefix cache for every existing Compose session. The description gives the TUI its deprecation copy; the input-bar `Compose (legacy)` label gives users a direct visual cue. That is enough.\n\n2. **Home tips — compose-only display override** — one new tip `tui.tips.compose_next` recommending Build + `/compose-next` is added to the i18n dictionaries but **not** to `TIP_KEYS` / `PRIORITY_WEIGHTS` (`packages/opencode/src/cli/cmd/tui/feature-plugins/home/tips-view.tsx`). The rotation runs exactly as on `main` and cycles the normal weighted pool; a `displayKey` memo overrides the rendered key to `tui.tips.compose_next` while `local.agent.current()?.name === \"compose\"`. Entering Compose visibly swaps to the deprecation tip; leaving Compose reveals whatever key the rotation currently holds — no artificial mid-cycle swap, and no impact on switches that do not involve the Compose agent. The Tips component only renders on home, so session-view Tab switching does not affect this.\n\n3. **Agent label suffix \"(legacy)\"** — the input-bar agent label at `packages/opencode/src/cli/cmd/tui/component/prompt/index.tsx` (currently renders `Locale.titlecase(agent.name)`) shows `Compose (legacy)` when the current agent is `compose`. This is a pure display concern; agent identity and routing remain `compose`. The suffix is intentionally not localized — \"legacy\" reads the same across the locales this project supports, and adding an i18n key just for a single-word technical suffix costs more than it earns.\n\nThis is guidance text, not runtime model detection. No hard model-ID list. Users choose either path.\n\n### i18n coverage\n\nAll user-facing strings introduced by this PR ship translations for every locale under `packages/opencode/src/cli/cmd/tui/i18n/` (`en`, `es`, `fr`, `ja`, `ru`, `zh`, `zht`). Missing a locale is a review-blocking gap.\n\nKeys added:\n\n- `tui.tips.compose_next` — home tip body recommending Build + `/compose-next`.\n- `tui.skill.compose-next.description` — description shown in skill dialog / autocomplete / command palette. Naming follows the existing `tui.skill.\u003cname>.description` convention.\n\nThe Compose agent description line appended in `agent.ts` is inline English today and stays inline English in this PR — the localized surface for users is the tip and the skill description, both keyed above.\n\n### Why no scope mechanism in this PR\n\nOn `main` today, `compose:` is not a runtime namespace — it is literally the leading segment of each Legacy Compose skill's frontmatter `name` (`compose:brainstorm`, `compose:tdd`, ...). The six `startsWith(\"compose:\")` sites are therefore self-consistent with the legacy bundle content, and they will disappear in one PR when the bundle is deleted.\n\nAdding `Skill.Info.scope` + `evaluateSkill` + `ScanMeta` now would introduce a general mechanism whose only consumer is a subsystem scheduled for removal. It also enlarges this PR's blast radius (schema, scanner, permission evaluator, six migration sites, tests) without user-visible benefit. Compose Next needs exactly one thing beyond `main`: a way to keep the new skill out of default-agent discovery. Exact-name permission handles that in one line.\n\nIf a future skill genuinely needs namespace-level gating, the scope refactor can be revisited then, informed by an actual second use case.\n\n## [S3] Implementation\n\n### Files\n\nAdd:\n\n- `packages/opencode/src/skill/builtin/.bundle/compose-next/SKILL.md`\n- `packages/opencode/test/permission/compose-next-discovery.test.ts`\n\nModify:\n\n- `packages/opencode/src/agent/agent.ts` — add exact `\"compose-next\": \"deny\"` to the default agent's `skill` permission ruleset (adjacent to the existing `\"compose:*\": \"deny\"`). Append the deprecation line to the Compose agent block's `description`. Do not add any skill rule to the Compose agent.\n- `packages/opencode/src/tool/skill-search.ts` — resolve current agent from context and source the searchable list from `Skill.available(agent)` instead of `Skill.all()`. Update the tool description string accordingly if needed.\n- `packages/opencode/src/cli/cmd/tui/component/prompt/index.tsx` — the input-bar agent label render (currently `Locale.titlecase(agent().name)`) shows `Compose (legacy)` when `agent.name === \"compose\"`. Pure display change; identity, routing, tab-cycle and everything else remain the same.\n- `packages/opencode/src/cli/cmd/tui/feature-plugins/home/tips-view.tsx` — leave the rotation exactly as on `main` (do NOT add `tui.tips.compose_next` to `TIP_KEYS`/`PRIORITY_WEIGHTS`). Add a `displayKey` memo that overrides the rendered key to `tui.tips.compose_next` while the current agent is `compose`, otherwise returns the rotation's current key. Non-compose agent switches must not trigger any rotation change.\n- `packages/opencode/src/cli/cmd/tui/feature-plugins/home/tips.tsx` — remove the `first = session.count() === 0` gate so tips render on a fresh project too. Original behavior hid tips from first-time users, which is the population that most needs the guidance.\n- `packages/opencode/test/skill/search.test.ts` — extend with two assertions: `compose-next` is NOT excluded by the `startsWith(\"compose:\")` filter (name has a dash, not a colon), and callers that pass a list not containing `compose-next` see no `compose-next` in results (mirrors production `available(defaultAgent)`).\n- All seven i18n locale files under `packages/opencode/src/cli/cmd/tui/i18n/` (`en.ts`, `es.ts`, `fr.ts`, `ja.ts`, `ru.ts`, `zh.ts`, `zht.ts`) — add two keys each: `tui.tips.compose_next`, `tui.skill.compose-next.description`.\n\nDo not touch:\n\n- `packages/opencode/src/session/prompt/compose.txt` — model-facing system prompt; any byte change invalidates every existing Compose session's prefix cache.\n- `packages/opencode/src/skill/index.ts` scanner or `Info` schema.\n- `packages/opencode/src/skill/search.ts` `startsWith(\"compose:\")` filter.\n- `packages/opencode/src/permission/evaluate.ts` (no `evaluateSkill`).\n- `packages/opencode/src/skill/compose/**` bundle contents.\n- `packages/opencode/src/workflow/builtin/compose.js`.\n- `packages/opencode/src/skill/localized-alias.ts`, `dialog-skill.tsx`, `autocomplete.tsx` legacy filters.\n- Tab-cycle order in `local.agent.move` / `app.tsx` agent registration order.\n\n### Skill content composition\n\nSource material comes from the compact contracts on `compose-slim`:\n\n- `compose-slim:packages/opencode/src/skill/compose/.bundle/compose-grill/SKILL.md` → sections on question-tool shapes and Never-Ask scope.\n- `compose-slim:packages/opencode/src/skill/compose/.bundle/compose-spec/SKILL.md` → single-document `\u003cfeature>.md` invariant.\n- `compose-slim:packages/opencode/src/skill/compose/.bundle/compose-dev/SKILL.md` → worktree, verification-before-review, review coordinate, finish rules.\n\nThese are copied via `git checkout origin/compose-slim -- \u003cpath>` into a scratch location, then hand-merged into one SKILL.md preserving executable contract text (tool shapes, ordering constraints, review coordinates) and dropping cross-skill coordination language (\"this skill hands off to the next\"). Rationale prose that does not carry executable content is dropped.\n\n### Tests\n\n- Discovery: `Permission.evaluate(\"skill\", \"compose-next\", defaultAgentRules)` returns `deny`; the compose agent inherits the same deny (Compose Next is not a Compose-mode internal); ordinary skills return `allow`; `compose:*` legacy pattern still denied on default and allowed on compose.\n- Search input filter: `compose-next` is NOT dropped by the `startsWith(\"compose:\")` filter in `skill/search.ts` (its name has a dash, not a colon); callers that pass a list not containing `compose-next` (mirroring `Skill.available(defaultAgent)`) get no `compose-next` in results.\n- Legacy invariants preserved: existing `compose:*` filter tests remain green unchanged.\n- i18n: the existing `skill-description.test.ts` completeness check exercises the two new `tui.skill.compose-next.*` keys; the `tui.tips.compose_next` key is loaded by `Tips()` when the compose agent is active.\n- Tip override: on the home view with `agent.name === \"compose\"`, the rendered tip is `tui.tips.compose_next`; leaving Compose reveals the rotation's current key with no forced swap; switches between non-compose agents do not affect the tip.\n- Agent label suffix: the input-bar label reads `Compose (legacy)` when the current agent is `compose`, and `Build` / `Plan` unchanged for those agents.\n\n### Verification\n\nFrom `packages/opencode`:\n\n- `bun test test/permission/compose-next-discovery.test.ts test/skill/search.test.ts test/tool/skill-search.test.ts` (new/extended).\n- `bun test test/agent test/skill test/permission test/tool` (regression band relevant to the touched files).\n- `bun typecheck` (workspace-level from package dir).\n- `git diff --check`.\n\nDraft PR opens in Ready state (not Draft) since this is the successor implementation, not a further experiment.\n\n## [S4] Migration and PR sequencing\n\n1. **This PR (P1)** - Compose Next additive; Legacy Compose deprecated but functional.\n2. **Draft PR #1850 closure** - After this PR opens, update PR #1850 body with this PR's URL and close #1850 as superseded by the compatibility route. The experiment graduated; it did not fail.\n3. **Dual-path release window** - Observe: task completion rate, user intervention rate, skipped spec/report/review, duplicate heavy verification, context/token cost, fallback-to-Legacy rate, third-party model behavior near Fable/Sol capability.\n4. **Legacy Compose removal PR (later)** - Remove `compose` agent, `compose:*` bundle, `compose.txt`, all six `startsWith(\"compose:\")` sites, and add `/compose` as an alias of `compose-next`. Only proceed after Fable/Sol-class capability is broadly available and the dual path has been observed without material regression.\n5. **Separate later work** - Plan-mode dissolution and Tab permission presets are independent roadmap items with their own specs.\n\n## [S5] Out of scope\n\n- Deleting or renaming any `compose:*` skill.\n- Any change to `compose.js` or `compose.txt` content, or to the Compose agent's permission set. `compose.txt` in particular is a model-facing system prompt and any byte change invalidates prefix cache for every existing Compose session.\n- Introducing `Skill.Info.scope`, `Permission.evaluateSkill`, or `ScanMeta` scanning.\n- Hard model-ID gating for `/compose-next`.\n- Treating model-undiscoverability as a security boundary.\n- Removing Legacy Compose in this PR.\n- Removing Legacy Compose from the Tab-cycle in this PR.\n- Any deprecation toast (design chose an ambient in-place `(legacy)` label instead).\n- Locking the tip anywhere except on home (session views do not render Tips).\n- Persistent \"user has seen this deprecation\" state.\n- Localizing the `(legacy)` label — it is a bare technical suffix and reads the same in every supported locale.\n- i18n-keying the Compose agent description text; that path is broader than this PR.\n- Migrating existing Compose feature documents.\n- Plan-mode dissolution and Tab permission-preset changes.\n\n## Tasks\n\n- [x] T1: author `packages/opencode/src/skill/builtin/.bundle/compose-next/SKILL.md` by hand-merging compact contracts from `origin/compose-slim` three slim skills — acceptance: skill validator reports 0 errors, 0 warnings; single-file self-contained load; executable contracts for grill / spec / worktree / verify / review / finalize / finish present (covers: S2)\n- [x] T2: add exact `\"compose-next\": \"deny\"` to default agent skill permission — acceptance: `Skill.available(defaultAgent)` omits `compose-next`; `Skill.all()` includes it; test asserts both (covers: S2, S3)\n- [x] T3: switch `tool/skill-search.ts` to `Skill.available(agent)` — acceptance: search over a query matching `compose-next` under the default agent returns no result; existing search tests remain green (covers: S2, S3)\n- [x] T4: append deprecation line to Compose agent `description` in `agent.ts` — acceptance: single-line addition; Compose agent behavior otherwise unchanged; `compose.txt` untouched (prefix-cache stability); existing Compose tests green (covers: S2)\n- [x] T5: surface `tui.tips.compose_next` as a compose-only display override in `tips-view.tsx` (leave rotation identical to main; excluded from `TIP_KEYS`/`PRIORITY_WEIGHTS`; a `displayKey` memo overrides while agent is `compose`); remove the first-session gate in `tips.tsx` so tips also render on a fresh project; add key to all seven locale files — acceptance: rendered tip is compose_next iff current agent is `compose`; non-compose agent switches do not trigger tip changes; leaving compose reveals the rotation's current key; on a fresh project the tips row renders; all seven locales carry the key (covers: S2)\n- [x] T6: show `Compose (legacy)` in the input-bar agent label when the current agent is `compose` — acceptance: agent identity, routing, and Tab-cycle unchanged; only the rendered label carries the suffix; label for `build`/`plan` unchanged (covers: S2)\n- [x] T7: add `tui.skill.compose-next.description` to all seven locales — acceptance: skill dialog / autocomplete render the localized description (covers: S2)\n- [x] T8: verification band pass — acceptance: relevant `bun test` bands and `bun typecheck` and `git diff --check` all pass from `packages/opencode` (covers: S3)\n- [x] T9: open the PR (Ready, not Draft); update PR #1850 body with its URL and close #1850 as superseded — acceptance: successor URL recorded on #1850; closure message frames the experiment as graduated (covers: S4)\n"},{"path":"compose/spec/context-budget-control.md","title":"Context Budget Control (user-adjustable early compaction)","group":"spec","content":"---\nfeature: context-budget-control\nstatus: in-progress\nupdated: 2026-08-05\nbranch: investigate/context-limit-double-rebuild\ncommits: 028f3178..3b15062d\n---\n\n# Context Budget Control (user-adjustable early compaction)\n\n## Report\n\n**What was built** — `compaction.max_context` lets a user compact earlier than the model's own window, expressed as a token count, a `\"300K\"` / `\"1M\"` / `\"50%\"` shorthand, or a map keyed by `\"\u003cproviderID>/\u003cmodelID>\"` with wildcards. `Overflow.contextWindow()` is the single place that resolves the provider cap (`limit.input || limit.context`), applies the budget as a clamp, and subtracts the reserves; `usable()` is now a thin wrapper over it, so the compaction trigger, checkpoint thresholds, and pruning all follow the budget without further plumbing. With no budget configured the arithmetic reduces to the previous expression for both model shapes.\n\nThe prompt and subagent footers divide usage by the internal trigger and mark a configured budget with `↓`; the sidebar instead shows usage against the user-controlled active limit and compares that setting with the provider cap. `/status` gained a diagnostic Context block (window, budget + source, reserved, compact-at, used), and `mimocode models \u003cprovider>` prints the same underlying values without `--verbose`. `/context-limit` opens a preset picker (Model default / 200K / 300K / 500K / 1M / Custom…) that writes only the current model's key into the global config, refusing while a session is busy because a config write disposes the instance and cancels in-flight runners.\n\nThe 2026-07-31 follow-up makes `usable()` the only automatic context-switch boundary. Checkpoint thresholds continue to keep the checkpoint fresh, but their final 80%/90% rung no longer triggers an early rebuild. The sidebar presents the user-controlled limit relative to the provider cap, so a 300K budget on a 922K model renders `limit 300K of 922K`; the reserve-adjusted trigger remains an internal detail available in `/status`.\n\nSeparately, the merged PR #1926 was corrected: it assigned `limit.context = 300_000` for every `gpt-*` model under Codex OAuth, which *raised* the window for gpt-4o (128K) and gpt-3.5-turbo (16K), broke the `limit.context === 0` sentinel for image models, and never moved the compaction trigger for the 1M-class models it targeted because `usable()` reads `limit.input` when the catalog publishes one. It is now a clamp on both fields at **372,000** — the capacity OpenAI's Codex registry declares and that a 350,317-token request demonstrably reaches — applied only when a window exists and only when `limit.input` already exists. The 272K figure circulating for Codex is the 2x-input billing boundary, not capacity, so it ships as a documented `compaction.max_context` recipe (see S2.5).\n\n**Verification**\n\n- `bun typecheck` (packages/opencode) — PASS, post-rebase.\n- `bun typecheck` (packages/opencode) — PASS for the 2026-07-31 follow-up.\n- `bun test test/session/auto-overflow-writer-first.test.ts test/session/prune.test.ts test/session/prompt-rebuild-reset.test.ts test/session/overflow.test.ts test/session/checkpoint-thresholds.test.ts test/cli/tui/sidebar-context.test.tsx` — 94 pass / 0 fail for the 2026-07-31 follow-up.\n- `bun test test/session/overflow.test.ts test/plugin/codex.test.ts test/session/checkpoint-thresholds.test.ts test/session/prune.test.ts` — 96 pass / 0 fail.\n- `bun test test/config test/session/checkpoint-thresholds.test.ts` — 188 pass / 4 skip / 0 fail.\n- Full `bun test` before the review fixes — 4359 pass / 4 fail; every failure reproduced at base or passed in isolation (`test/util/ssrf.test.ts` DNS fail-closed fails at base; `test/workflow/runtime.test.ts` has 2 fails at base vs 1 here; `test/session/checkpoint-rebuild-unify.test.ts` passes in isolation in both trees). CI runs the full suite.\n- CLI: `MIMOCODE_CONFIG_CONTENT='{\"compaction\":{\"max_context\":{\"openai/gpt-5*\":\"300K\",\"openai/gpt-5.6\":200000}}}' bun run src/index.ts models openai` → `gpt-5.6` window 922K / budget 200K / compacts at 180K; `gpt-5.6-sol` budget 300K / 280K; `gpt-5.3-codex` (272K cap) shows no budget because 300K clamps away; `gpt-4o` and `o3` unchanged.\n- Live TUI (tmux, isolated `MIMOCODE_HOME`, `xiaomi/mimo-v2.5`): picking 300K wrote `\"xiaomi/mimo-v2.5\": 300000` to the global `mimocode.jsonc`, footer became `33.0K/260K↓ (13%)`, and `/status` showed `window 1.05M · budget 300K · compacts at 260K`. The sidebar follow-up renders the user setting against the model limit (`limit 300K of 1.05M`) and covers it with a TUI render test. Custom `\"50%\"` wrote 524288 (`compacts at 484K`). \"Model default\" wrote `0` and restored `compacts at 1.01M`. Selecting a tier mid-stream left the config untouched and kept the dialog open; the same action once idle wrote 200000.\n\n**Journey log**\n\n1. PR #1926's real defect was not \"insufficient\" but inert: `usable()` prefers `limit.input`, which every 1M-class GPT model publishes (922K), so the 300K assignment only changed the display denominator and the MCP tool budget. Any future provider-cap correction must set `limit.input`, not just `limit.context`.\n2. `Instance.dispose()` — which every config write triggers — cancels all runners via the `SessionRunState` scope finalizer. Any TUI feature that persists config mid-session needs a busy guard; `sync.data.session_status` is the server-authoritative signal (message-derived status can stay \"working\" forever after a crash).\n3. Config merges cannot delete keys, and `null` would fail schema validation, so \"reset to model default\" is expressed as `0`. Writing a single leaf key (not a read-modify-write of the whole map) avoids promoting project-level entries into the user's global file and is safe for both the JSON `mergeDeep` and the JSONC `patchJsonc` writers.\n4. SDK regeneration is currently broken on `main`: `bun dev generate` emits a dangling `#/components/schemas/__schema0` ref from `ToolStateCompleted.providerOutput`, so `@hey-api/openapi-ts` fails. Confirmed at base commit; new config fields therefore need a narrow cast at the TUI boundary until that is fixed.\n5. `usable()` can be 0 for a positive window (window smaller than the reserves, or a large `compaction.reserved`), which would have rendered `Infinity%` in three footers. Any UI that divides by it needs the guard now in `tui/util/model.contextWindow`.\n6. Provider \"context window\" numbers in the wild are frequently a *billing* tier or a client's conservative default, not capacity — Codex ships 372K capacity, a 95% effective window, a 90% auto-compact default, and a 272K price boundary, all four called \"the context window\" somewhere. Ask which one a number is before hard-coding it into `limit`.\n\n## [S1] Problem\n\n### S1.1 Three different quantities are conflated into `model.limit.context`\n\n| Quantity | Meaning | Who owns it | Today |\n| --- | --- | --- | --- |\n| Provider hard cap | max prompt tokens the API will actually accept | provider / auth mode / plan | `limit.context`, sometimes `limit.input` |\n| Working budget | where *we* choose to compact (quality / cost / latency) | user | not expressible |\n| Display denominator | what the `%` in the TUI is a fraction of | UI | `limit.context` (raw) |\n\nBecause there is only one field, any attempt to express (1) or (2) corrupts the other two.\n\n### S1.2 PR #1926 audit — the fix does not fire, and it over-raises other models\n\n`packages/opencode/src/plugin/codex.ts:379` (merged in `94a79289`):\n\n```ts\nif (modelID.startsWith(\"gpt-\")) model.limit.context = 300_000\n```\n\nDefect 1 — **no effect on the auto-compact trigger for the targeted models.**\n`packages/opencode/src/session/overflow.ts:21-23` prefers `limit.input` whenever it is set:\n\n```ts\nreturn input.model.limit.input\n  ? Math.max(0, input.model.limit.input - reserved)\n  : Math.max(0, context - outputReserve - reserved)\n```\n\nmodels.dev catalog (bundled at build time as `packages/opencode/src/provider/models-snapshot.js`, cached at `~/.cache/mimocode/models.json`) for the openai provider:\n\n| model | context | input | usable() before #1926 | usable() after #1926 |\n| --- | --- | --- | --- | --- |\n| `gpt-5.6` / `gpt-5.6-sol` / `gpt-5.5` / `gpt-5.4` | 1,050,000 | 922,000 | 902,000 | **902,000 (unchanged)** |\n| `gpt-5.3-codex` / `gpt-5.2` / `gpt-5.1` | 400,000 | 272,000 | 252,000 | **252,000 (unchanged)** |\n| `gpt-4.1-mini` (no `input`) | 1,047,576 | – | 1,015,576 | 263,616 |\n| `gpt-4o` (no `input`) | 128,000 | – | 91,616 | **263,616 (raised above the real cap)** |\n| `gpt-3.5-turbo` | 16,385 | – | 0 | **263,616** |\n| `gpt-image-1` | 0 | 0 | 0 (guarded) | **300,000 (guard defeated)** |\n\n(`reserved` = `min(20_000, maxOutputTokens)`; `outputReserve` = `min(maxOutputTokens, 20_000)`; `maxOutputTokens` = `min(limit.output, 32_000)`, `packages/opencode/src/provider/transform.ts:1550-1555`.)\n\nSo for every 1M-class GPT model — the exact case the PR was filed for — compaction still triggers at ~900K. What *did* change is the display denominator (`prompt/index.tsx:480`, `sidebar/context.tsx:81`, `subagent-footer.tsx:55`) and the MCP tool-catalog budget (`prompt.ts:1359`). Net effect: the footer now reads `900,000 (300%)` while the engine keeps going. The user-visible symptom moved, the behaviour did not.\n\nDefect 2 — **assignment instead of clamp.** `gpt-4o` (128K real) and `gpt-3.5-turbo` (16K real) are *raised* to 300K, guaranteeing provider-side overflow errors that previously could not happen. `gpt-image-*` has `limit.context: 0`, a sentinel that `overflow.ts:15,28,50` uses to disable overflow handling entirely; setting it to 300K defeats that guard.\n\nDefect 3 — **not overridable and not per-plan.** The plugin auth loader runs at `provider.ts:1310-1329`, *after* the config-driven model merge at `provider.ts:1169-1279`. A user on a plan with a different real window cannot restore or lower the value from `mimocode.json`. The value is also a bare literal with no provenance, so nothing can explain it in the UI.\n\nDefect 4 — **wrong layer for the general need.** Even a correct provider-layer clamp only serves \"the provider lies about its window\". It does not serve \"I want to compact at 200K on a 1M model\" for cost, latency, cache-churn or answer-quality reasons — a request already filed as issue #1837 (\"Context occupancy meter (% + tokens) and adjustable auto-compact threshold\"), and adjacent to #1840 (switching to a smaller-window model mid-session).\n\n### S1.3 Checkpoint thresholds apply a second context-limit discount\n\nCheckpoint percentages use `usable()` as their denominator, and the final 80%/90% threshold also signals the prompt loop to rebuild. A configured 300K active limit therefore reports a 280K trigger but rebuilds at 252K, while a configured `\"90%\"` budget rebuilds at roughly `90% × 90%` of the provider cap. Checkpoint thresholds are snapshot scheduling policy, not a second context limit, so they must not trigger an active-context rebuild.\n\n### S1.4 Existing knobs and why they are insufficient\n\n- `compaction.reserved` (`config.ts:254`) can be abused as an early-compact dial (`reserved = context - target`), but it is global across all models, is also consumed by `compaction.ts:49-54` and `prune.ts:274-292` as a *safety* buffer, and produces a nonsensical number for anyone reading the config.\n- `provider.\u003cid>.models.\u003cid>.limit.input` (`config/provider.ts:40-46`) *does* already move the trigger, but it is per-model JSON archaeology, it lies about the provider's real cap, and for the Codex case it is overwritten by the plugin (Defect 3).\n- `MIMOCODE_DISABLE_AUTOCOMPACT` is all-or-nothing.\n\n### S1.5 Requirement summary\n\n1. A user-settable working budget, distinct from the provider cap, expressible in common tiers (200K / 300K / 500K / 1M) plus \"model default\" and a custom value.\n2. Never exceeds the provider's effective cap — the setting clamps, it never raises.\n3. Discoverable from the TUI without editing JSON, and the resulting number must be printable (\"what is my current context window, and where will it compact?\").\n4. The provider-layer Codex bug fixed correctly and independently of (1)–(3).\n\n### S1.6 A completed high-usage turn is rebuilt twice\n\n`SessionProcessor` marks a successfully completed model turn as `\"overflow\"` when its reported usage reaches `Overflow.usable()`. The post-process overflow handler rebuilds immediately, but the same completed assistant usage remains visible to later prompt loops. The next user turn can therefore consume that usage again in the preflight overflow check, insert a second checkpoint boundary, re-arm checkpoint thresholds, and run tail microcompaction again.\n\nFor a configured 372K budget with the default 20K reserve, the first trigger is 352K (`94.6%` of the configured limit). This is the intended trigger. The defect is processing that one high-water usage record twice, not the trigger percentage.\n\n## [S2] Design — route-independent core\n\n### S2.1 Vocabulary\n\n- `hardCap(model)` = `model.limit.input || model.limit.context` — the largest prompt the API accepts. `0` keeps its current meaning: unknown/not applicable, overflow handling disabled.\n- `budget(cfg, model, …)` = user-requested working budget, or `undefined`.\n- `effectiveCap` = `hardCap === 0 ? 0 : min(hardCap, budget ?? hardCap)`.\n- `usable()` keeps its current meaning: `effectiveCap` minus reserves. It stays the single source of truth for \"when do we compact\".\n- Checkpoint thresholds only schedule checkpoint writers. Crossing the final threshold does not rebuild or compact; `usable()` remains the only automatic context-switch boundary.\n\n### S2.2 `Overflow.usable()` becomes budget-aware\n\n`packages/opencode/src/session/overflow.ts:13-24` is the only place the arithmetic changes:\n\n```ts\nexport function usable(input: { cfg: Config.Info; model: Provider.Model; budget?: number }) {\n  const hard = input.model.limit.input || input.model.limit.context\n  if (hard === 0) return 0\n  const cap = Math.min(hard, resolveBudget(input) ?? hard)\n  const reserved = input.cfg.compaction?.reserved ?? Math.min(COMPACTION_BUFFER, ProviderTransform.maxOutputTokens(input.model))\n  const outputReserve = input.model.limit.input ? 0 : Math.min(ProviderTransform.maxOutputTokens(input.model), OUTPUT_CAP)\n  return Math.max(0, cap - outputReserve - reserved)\n}\n```\n\nInvariants:\n\n- With no budget configured, the returned value is **byte-identical to today** for every model (the `limit.input` branch keeps `outputReserve = 0`; changing that is PR #1265's scope, not ours).\n- A budget larger than `hardCap` is silently clamped, never applied upward.\n- A budget below `reserved + outputReserve` yields `0`; `isOverflow` then fires on the first turn. Reject such values at the *write* boundary (S2.4) rather than letting the session brick.\n- `pressureLevel` / `contextPressureLevel` inherit the new denominator for free, so checkpoint thresholds (`prune.ts:274-292`) and `preserveRecentBudget` (`compaction.ts:49-54`) follow the budget automatically.\n\nNew exported helper for callers that need the numbers without the reserves:\n\n```ts\nexport function window(input: { cfg: Config.Info; model: Provider.Model; budget?: number }): {\n  hard: number        // provider cap\n  effective: number   // after budget clamp\n  usable: number      // compaction trigger\n  source: \"model\" | \"config\" | \"session\" | \"plugin\"\n}\n```\n\n`source` exists so the UI and CLI can explain *why* the number is what it is (fixes Defect 3's opacity).\n\n### S2.3 Budget resolution order\n\nHighest priority wins; each layer is optional:\n\n1. session override (only if Route C is chosen)\n2. `compaction.max_context` keyed by `\"\u003cproviderID>/\u003cmodelID>\"`, longest-match glob allowed (`\"openai/gpt-5*\"`)\n3. `compaction.max_context` scalar (all models)\n4. none → `hardCap`\n\n### S2.4 Config schema\n\nAdded to the existing `compaction` struct (`packages/opencode/src/config/config.ts:239-258`):\n\n```ts\nmax_context: Schema.optional(\n  Schema.Union(TokenBudget, Schema.Record(Schema.String, TokenBudget)),\n).annotate({\n  description:\n    'Compact earlier than the model window. Number of tokens or a string (\"300K\", \"1M\", \"50%\"). ' +\n    'Either one value for all models, or a map keyed by \"\u003cproviderID>/\u003cmodelID>\" (globs allowed). ' +\n    \"Always clamped to the model's real window; never raises it.\",\n})\n```\n\n`TokenBudget` = number | string. String parsing reuses the existing grammar of `prune.parseThreshold` (`packages/opencode/src/session/prune.ts:65-80`: `\"40%\"`, `\"100K\"`, `\"1.5M\"`, plain digits) — extract it into a shared helper rather than writing a second parser. `%` is relative to `hardCap`.\n\nValidation at write time (config load warns, slash command refuses): value must leave at least `reserved + outputReserve + 1` tokens, else it is ignored with a `log.warn` naming the model.\n\n### S2.5 Provider-layer fix for Codex (independent of the user-facing knob)\n\n`packages/opencode/src/plugin/codex.ts` becomes a clamp that also closes the `limit.input` hole and respects the sentinel:\n\n```ts\nconst CODEX_GPT_CONTEXT_CAP = 372_000\nif (modelID.startsWith(\"gpt-\") && limit.context > 0) {\n  limit.context = Math.min(limit.context, CODEX_GPT_CONTEXT_CAP)\n  if (limit.input) limit.input = Math.min(limit.input, CODEX_GPT_CONTEXT_CAP)\n}\n```\n\nClamping `limit.input` is what actually moves the trigger; clamping `limit.context` is what makes the display honest. `limit.input` is only touched when the catalog already publishes one — introducing it would switch `usable()` to the input branch and silently drop the output reserve (that would move gpt-4o from 91,616 to 111,616). `gpt-image-*` / `gpt-3.5-turbo` / `gpt-4o` keep their real windows.\n\nThe cap value, resolved during implementation (2026-07-27):\n\n- **372,000 = capacity.** OpenAI's Codex model registry declares `context_window = max_context_window = 372000` for the gpt-5.6 variants (openai/codex#31860 quotes the served catalog, which also applies `effective_context_window_percent: 95` and a 90% auto-compact default on top), and a direct Codex request with 350,317 input tokens completes (can1357/oh-my-pi#5705). So 272K is not a hard rejection boundary.\n- **272,000 = billing.** Prompts above 272K input are priced at 2x input / 1.5x output for the whole request, and Codex's bundled metadata was lowered from 372000 to 272000 (openai/codex#33972) to keep default sessions inside the cheaper tier — after openai/codex#32486 pointed out the 353.4K effective window ran ~81K past it.\n\nThose are the two quantities S1.1 separates, so the provider layer takes 372K and the 272K line is documented as a `compaction.max_context` recipe rather than baked into the cap. Users on plans with a smaller served catalog window (openai/codex#33069 reports 272K for Pro Lite) can lower it the same way; the clamp form can only reduce, so a stale literal never produces an over-long prompt.\n\n### S2.6 Display / \"how do I see my context window\"\n\nThree surfaces compute `%` independently against raw `limit.context` today, and none of them matches the trigger. All three switch to `Overflow.contextWindow()`:\n\n| Surface | Today | After |\n| --- | --- | --- |\n| prompt footer `packages/opencode/src/cli/cmd/tui/component/prompt/index.tsx:469-486` | `162,000 (15%)` vs raw context | `162.0K/300K (54%)` vs `usable`, with a `↓` marker when a budget is active |\n| sidebar context widget `.../feature-plugins/sidebar/context.tsx:67-95` | `% used` vs raw context | `% used` vs active limit + `limit 300K of 922K` when a 300K budget is active on a 922K model |\n| subagent footer `.../routes/session/subagent-footer.tsx:54-63` | raw context | usage vs internal `usable` trigger, matching the prompt footer |\n| `/status` dialog `.../component/dialog-status.tsx` | no context info at all | new **Context** block: model, provider window, budget + its source, reserved, compact-at, current tokens + `%` |\n| CLI | `mimo models openai --verbose` dumps the whole model JSON | add a `context` column to non-verbose output, or a `--context` flag printing `hard / effective / usable` |\n\nThe TUI may import `Overflow.window` directly — TUI modules already import from `@/session/*` (`app.tsx:55`, `routes/session/index.tsx:100`) — and it already holds `sync.data.config` plus `sync.data.provider[i].models[id].limit`. No new server route is needed for display.\n\nNote this intentionally changes an existing user-visible number: the footer `%` will read higher than before for models whose reserves are large, because it is now measured against the value that actually triggers compaction. That is the point of the change and must be called out in the PR description.\n\n### S2.7 One recovery per assistant usage record\n\nEvery overflow recovery path that successfully frees context in the post-process phase sets `skipOverflowCheck` before continuing the current run loop. Across run loops, a checkpoint or compaction boundary with an ascending message ID newer than the completed assistant marks that usage as already recovered. Boundary timestamps are backdated to the checkpoint watermark, so this comparison uses message IDs rather than timestamps.\n\nThe next iteration or user turn may call the model on the rebuilt or compacted context, but must not run checkpoint scheduling, preflight overflow, or exit-time pruning against the same completed assistant usage. This applies to main-agent checkpoint rebuilds and subagent/fork compaction paths. If recovery inserts nothing (`insert-failed`), no marker exists and the usage remains eligible because no context was freed.\n\nThe invariant is behavioral, not time-based: no cooldown or percentage margin is introduced. A later assistant turn with newly measured high usage may still trigger its own recovery.\n\n## [S3] Routes — decision required\n\nStorage location for the user's budget. All routes share S2.1–S2.2 and S2.6; they differ in where the value lives and therefore in scope, persistence, and cost.\n\n### Route A — config only (`compaction.max_context`), no UI writer\n\n- Add schema (S2.4) + `usable()` (S2.2) + display (S2.6) + docs. Users hand-edit `mimocode.json`.\n- Scope: global or per-model, per project or per user. Persistent. Read by *every* `usable()` call site for free (`cfg` is already an argument at all 6 sites).\n- Cost: smallest. No SDK regeneration beyond the generated `Config` type, no migration, no new dialog.\n- Gap: does not satisfy the user's \"slash option with preset tiers\" ask; not discoverable.\n\n### Route B — Route A + `/context-limit` slash command writing global config **(recommended)**\n\n- Picker dialog: `Model default · 200K · 300K · 500K · 1M · Custom…`, applied to the currently selected `providerID/modelID`, written as `compaction.max_context[\"openai/gpt-5.6\"]`.\n- Mechanism already proven: `sdk.client.global.config.update({ config: patch })` → `sdk.client.instance.dispose()` → `sync.bootstrap()`, exactly as `component/dialog-model.tsx:318-338` and `dialog-modalities.tsx:72-96` do. Server routes exist (`PATCH /global/config`, `server/routes/global.ts:171-195`).\n- Constraint discovered during design: a config write forces `Instance.dispose()`, whose finalizer cancels every runner (`session/run-state.ts:36-51`). The command must therefore be **rejected while the session is busy** (guard on session status) or deferred to idle. This is a hard constraint, not a preference.\n- Scope: per-model, persistent across sessions and projects. Matches \"设置到模型上\".\n- Cost: Route A + one dialog + one command registration + a busy guard.\n\n### Route C — per-session override (session column)\n\n- Nullable `max_context` column on `session` (`session/session.sql.ts:14-48`), migration folder `migration/\u003cts>_session_max_context/migration.sql` (`ALTER TABLE session ADD max_context integer;`), touch `fromRow` / `toRow` / `toPartialRow` (`session.ts:64-112`, `projectors.ts:37-63`), `Session.setMaxContext` next to `setTitle` (`session.ts:681-720`), extend the `session.update` body allow-list (`server/routes/instance/session.ts:378-389`), regenerate the SDK (`./packages/sdk/js/script/build.ts`).\n- Requires threading `sessionID` (or the resolved budget) into the 6 `usable()` call sites: `processor.ts:638`, `prune.ts:274`, `prune.ts:371`, `compaction.ts:53`, `prompt.ts:1334`, `prompt.ts:1346`, `prompt.ts:3203`. All of them have `sessionID` in scope.\n- Writes are safe mid-turn (`patch()` is a `SyncEvent.run`, no dispose) and propagate to the TUI automatically via `session.updated` (`sync/index.ts:215-249`, `server/projectors.ts:11-24`, `tui/context/sync.tsx:439-452`).\n- Scope: per session, survives resume. This is what issue #1837's acceptance criteria literally ask for (\"per-session and restored on resume\", \"does not rewrite global config unless save as default\").\n- Cost: highest — migration + SDK regen + signature churn across 7 call sites.\n\n### Route D — provider-layer fix only (S2.5)\n\n- Fixes the Codex bug correctly. Ships no user-facing knob. Should be done **regardless of A/B/C** because it is a correctness regression fix, and it is independently testable.\n\n### Decision (2026-07-27, user)\n\n**Route D + B**, with A as the substrate. Budget is keyed **per model** — `compaction.max_context[\"\u003cproviderID>/\u003cmodelID>\"]`; a scalar form stays accepted by the schema but `/context-limit` always writes the keyed form. Route C is deferred (see S4).\n\n### Recommendation\n\n**D + B**, with A as the substrate: D closes the shipped regression, A gives the durable expressible policy that every call site already reads, B makes it discoverable with the preset tiers requested. Defer C until per-session divergence is actually demanded — the per-model config value already covers \"I always want 300K on this model\", and C's cost is dominated by plumbing rather than by design risk. If C is chosen later it layers on top of A without changing A's semantics (it is priority 1 in S2.3).\n\nRejected alternatives:\n\n- Overload `provider.*.models.*.limit.context` as the user knob (what #1926 does at plugin level): destroys the distinction in S1.1, lies to the provider-cap consumers (`acp/agent.ts:76`, `prompt.ts:1359`), and cannot express \"compact early\" without also mis-reporting the model.\n- Overload `compaction.reserved`: global-only, and collides with its safety-buffer role in `compaction.ts` and `prune.ts`.\n- TUI KV / `model.json` as the store: the TUI runs in a separate realm from the session engine (Worker + HTTP-shaped transport, `tui/thread.ts:270-335`, `tui/worker.ts:50-68`), so server code cannot read it in memory, and it would not apply to `mimo run` / `serve` / ACP clients.\n- Per-request `PromptInput.maxContext`: not sticky across compaction continuations, retries, or `LoopInput` wakes (`prompt.ts:4460`), and needs threading into `Processor` anyway.\n\n## [S4] Out of scope\n\n- Per-session budget override (Route C) — deferred by the 2026-07-27 decision; layers on top of S2.3 priority 1 when demanded.\n- Multi-pass compaction when history already exceeds the target window (issue #1840). A budget makes that state *rarer*, it does not resolve it.\n- Changing the `limit.input` output-reserve semantics (open PR #1265).\n- Lowering `DEFAULT_CONTEXT_WINDOW` (`provider.ts:35`), repeatedly proposed and closed (#1863, #648, #626).\n- A live slider / drag UI. Preset tiers plus custom entry only.\n- Per-agent or per-subagent budgets.\n- Automatic budget inference from observed provider overflow errors.\n\n## Tasks\n\nRoute D (do first, independent):\n\n- [x] T1: Replace the assignment in `plugin/codex.ts` with a clamp, including `limit.input` and the `limit.context === 0` guard — acceptance: `bun test test/plugin/codex.test.ts` asserts `gpt-5.6-sol` → `{context: 372K, input: 372K}`, `gpt-5.3-codex` → `{context: 372K, input: 272K}`, `gpt-4o` → `{context: 128K}` unchanged and no `input` introduced, `gpt-image-1` → `{context: 0}` unchanged, `o3` → `{context: 200K}` unchanged (covers: S2.5)\n- [x] T2: Confirm the real Codex prompt cap and either keep the literal or make it plan-derived — acceptance: the chosen value is documented in a code comment with its source (covers: S2.5; depends: T1). Resolved to **372,000** with sources in the comment: OpenAI's Codex model registry declares `context_window = max_context_window = 372000` for the gpt-5.6 variants (openai/codex#31860 quotes the served catalog), and a direct Codex request with 350,317 input tokens completes (can1357/oh-my-pi#5705). The 272,000 figure that Codex's bundled metadata was lowered to (openai/codex#33972) is the >272K 2x-input / 1.5x-output billing boundary, i.e. a spending policy — documented as a `compaction.max_context` recipe instead of baked into the cap.\n\nRoute A (substrate):\n\n- [x] T3: Extract the threshold grammar from `prune.ts` into `Token.parseQuantity` and unit-test `\"300K\"` / `\"1.5M\"` / `\"50%\"` / plain number / invalid input — acceptance: `bun test` covers all five, `prune.ts` behaviour and error messages unchanged (covers: S2.4)\n- [x] T4: Add `compaction.max_context` to the config schema with scalar + keyed-map forms and a validation warning — acceptance: a config with `{\"compaction\":{\"max_context\":{\"openai/gpt-5*\":\"300K\"}}}` type-checks and parses; a value below the reserves logs a warning and is ignored (covers: S2.3, S2.4; depends: T3). The warning fires on first use rather than at load, so it names the model it applies to.\n- [x] T5: Make `Overflow.usable()` budget-aware and add `Overflow.contextWindow()` per S2.2 — acceptance: unit tests show (a) no budget → identical numbers to `main` for a `limit.input` model and a context-only model, (b) budget above the cap is clamped, (c) budget `300K` on a 1.05M/922K model yields `usable = 280K` and `isOverflow` fires there (covers: S2.2; depends: T4)\n- [x] T6: Document `compaction.max_context` wherever `compaction.*` is documented — acceptance: the doc states the clamp rule and the `\"\u003cproviderID>/\u003cmodelID>\"` key form (covers: S2.4; depends: T4)\n\nRoute B (UI writer):\n\n- [x] T7: Add `/context-limit` command + preset picker dialog writing `compaction.max_context[\"\u003cprovider>/\u003cmodel>\"]` via `global.config.update` → `instance.dispose()` → `sync.bootstrap()` — acceptance: selecting `300K` on a 1M model persists to the global config, the footer denominator updates without restart, and `Model default` resets the model (covers: S3 Route B; depends: T5). Reset writes `0` instead of deleting the key — a config merge cannot delete.\n- [x] T8: Refuse the write while a session is busy, with an explanatory toast — acceptance: invoking the command mid-turn leaves the config untouched; the same action once idle writes (covers: S3 Route B; depends: T7)\n\nDisplay (needed by any route):\n\n- [x] T9: Switch the prompt footer, sidebar context widget, and subagent footer to `Overflow.contextWindow()` — acceptance: prompt/subagent usage uses the internal trigger, while sidebar usage uses the active setting and compares it with the provider cap (covers: S2.6; depends: T5)\n- [x] T10: Add a Context block to the `/status` dialog showing provider window, budget + source, reserved, compact-at, current tokens and `%` — acceptance: with and without a configured budget the block renders correct numbers and the correct `source` label (covers: S2.6; depends: T5)\n- [x] T11: Surface the context window in the `models` CLI command without `--verbose` — acceptance: `mimocode models openai` prints each model's provider window and compact-at (covers: S2.6; depends: T5)\n- [x] T12: Decouple the final checkpoint threshold from the prompt-loop rebuild condition — acceptance: crossing the final checkpoint threshold below `usable()` writes a checkpoint but inserts no rebuild or compaction boundary; reaching `usable()` still follows the existing rebuild path (covers: S1.3, S2.1; depends: T5)\n- [x] T13: Show the configured active limit relative to the provider hard cap in the sidebar — acceptance: a 300K budget on a 922K model renders `limit 300K of 922K`, while the reserve-adjusted trigger remains internal and available in `/status` (covers: S2.6; depends: T5)\n- [x] T14: Consume each assistant usage at most once during overflow recovery — acceptance: post-process recovery sets the current-loop skip guard; across user turns, a newer boundary prevents the recovered assistant from driving checkpoint scheduling, preflight overflow, or exit-time pruning; equivalent subagent/fork recovery paths set the same guard (covers: S1.6, S2.7; depends: T12)\n- [x] T15: Add regression coverage for duplicate recovery — acceptance: a low-usage initialization turn, a successful high-usage turn, and a following user turn produce two distinct checkpoint boundaries on current `main`, but exactly one boundary and one writer after T14; existing preflight and provider-overflow fallback tests remain green (covers: S1.6, S2.7; depends: T14)\n"},{"path":"compose/spec/desktop-child-process-env.md","title":"Desktop Child Process Environment","group":"spec","content":"---\nfeature: desktop-child-process-env\nstatus: delivered\nupdated: 2026-08-17\nbranch: fix/desktop-runtime-boundaries\ncommits: 17c9cdcb70b27116456f742f2b0d384b76f79108..0d3d0dcadf999cd05cb5ea0ae22e5e43ac1bd305\n---\n\n# Desktop Child Process Environment\n\n## Report\n\n**What was built** — MiMoCode now owns a process-level, replaceable child environment baseline. Embedding hosts can set it at startup through `Server.listen({ childEnv })` or refresh it later through the Node entry's `ChildProcessEnv.set(env)`. Hosts that never set a baseline retain existing behavior and read the current `process.env` for each spawn.\n\nAll inherited external process paths now resolve through the same boundary, including direct and Effect process wrappers, Bash, PTY, LSP, MCP, ripgrep and remaining native `child_process` calls. Inherited credentials are still scrubbed before explicit per-child environment overrides are applied.\n\n**Verification** — `bun typecheck` passed. The affected regression suite passed 99 tests with 0 failures across child-process environment, credential environment, process, PTY, LSP, MCP, ripgrep and Bash coverage. `git diff --check` passed. Independent review passed spec compliance, correctness and codebase consistency after all critical findings were fixed.\n\n**Journey log** —\n\n- A frozen baseline was rejected because a future Desktop environment-sync action must replace the baseline for new child processes without changing session state.\n- The no-host path reads current `process.env` on every spawn; freezing that fallback broke existing CLI runtime environment updates.\n- Review found Effect commands with undefined env and native `child_process` calls could still inherit the engine process; both paths now explicitly resolve the shared baseline.\n- LSP environment deltas are resolved at each spawn so a baseline refresh affects later commands in the same workflow.\n- The structural guard uses the TypeScript AST to validate every native process call; Process wrapper clients pass only env deltas so the final spawn boundary resolves the baseline exactly once.\n\n## [S1] Problem\n\nMiMoCode runs in-process inside MiMo Desktop. Desktop adds engine control variables to the Electron process environment, and external tools currently derive their environment directly from that global state. Bash, PTY, LSP, MCP and shared process spawners can therefore observe Desktop-only values such as engine credentials, permission controls and `NODE_ENV=production` injected by electron-vite.\n\nThe existing `Env.Service` is mutable, instance-scoped configuration state, not a child-process boundary: several spawn paths run outside its Effect context and still read `process.env` directly. Session permission is unrelated and must remain persisted session state; this feature does not change permission semantics.\n\n## [S2] Design\n\nThe process/spawn infrastructure owns one replaceable child environment baseline. A new foundation module exposes two operations:\n\n```ts\nsetChildProcessEnv(env: NodeJS.ProcessEnv): void\nchildProcessEnv(explicit?: NodeJS.ProcessEnv): NodeJS.ProcessEnv\n```\n\nThe Node embedding entry exports the host-facing setter as `ChildProcessEnv.set(env)`. The resolver remains internal to spawn infrastructure. This gives Desktop one stable startup and future refresh contract without exposing arbitrary environment mutation over HTTP.\n\n`setChildProcessEnv` copies the supplied values and atomically replaces the process-wide baseline. Future child processes use the new snapshot immediately; already-running children keep the environment they were spawned with. The baseline is not tied to a project instance or listener and is not reset when a listener stops. If no host sets a baseline, `childProcessEnv` reads the current `process.env` on each call, preserving existing CLI/TUI/ACP/run behavior when those surfaces intentionally mutate their own process environment.\n\nMiMoCode adds an optional `childEnv?: NodeJS.ProcessEnv` field to the public `Server.listen` module contract only as an embedding adapter. `listen` sets `childEnv` before creating the HTTP runtime or initializing any project instance. Desktop supplies the option; ordinary CLI/TUI/ACP/serve callers omit it. Headless `mimo run`, which does not call `Server.listen`, naturally uses the default current `process.env`. A future Desktop environment-sync action can call the same process foundation setter without changing tool or session contracts.\n\nAll external process paths use one helper, `childProcessEnv(explicitEnv?)`, with this order:\n\n```text\nconfigured childEnv (or current process.env when no host set one)\n  -> existing inherited-credential scrub\n  -> explicit tool/plugin/MCP/LSP env overrides\n  -> spawn\n```\n\nThe foundation does not infer or reconstruct variables. The host-provided baseline is authoritative. Existing cleartext credential protection remains on the inherited half (`MIMOCODE_AUTH_CONTENT` and `MIMOCODE_CONFIG_CONTENT`); explicit per-child environment remains authoritative, so an MCP definition, LSP configuration, plugin hook, or future tool caller can intentionally override any value. `NODE_ENV`, user `MIMO_*` values, proxy variables and bundled runtime variables follow the baseline unchanged.\n\nEvery path that currently builds inherited child environment from `process.env` must call `childProcessEnv`: the direct process wrapper, Effect `ChildProcessSpawner`, Bash, PTY, LSP, MCP and ripgrep. Tool-local additions keep their existing order after the baseline, including plugin `shell.env`, Git identity floors, UTF-8 fixes and MCP/LSP explicit env.\n\nMiMo Desktop obtains a complete environment snapshot from the same clean login-shell mechanism used to establish the user's terminal environment, adds bundled runtime variables, and passes the result as `childEnv` to `Server.listen({ childEnv })`. The snapshot is independent from Electron's mutated `process.env`, so Desktop/engine controls added later are absent by construction rather than removed heuristically. `NODE_ENV` is not synthesized or deleted: if the user's clean terminal environment contains it, it remains; if not, Desktop does not add it. Desktop continues to inject `MIMOCODE_PERMISSION` into the engine process; this feature does not move permissions into session storage or change cross-client behavior.\n\nThe engine module declaration in Desktop is expanded only for the `childEnv` option. The Desktop engine spec and bundled-runtimes spec remain the source of truth for the baseline construction and public `MIMO_*` runtime variables.\n\n## [S3] Out of Scope\n\n- Changing `MIMOCODE_PERMISSION`, session permission persistence, or permission precedence.\n- Adding an HTTP endpoint for arbitrary environment mutation.\n- Guessing or overriding `NODE_ENV`; child processes follow the clean terminal environment exactly, including its presence or absence of `NODE_ENV`.\n- Adding model-visible per-call environment controls to the Bash schema.\n- Reusing `Env.Service` for child-process inheritance or making child environment project-instance mutable.\n- Constructing Desktop's clean-terminal environment, updating Desktop's virtual module declaration, adding Desktop E2E coverage, or bumping Desktop's engine pin. Those are downstream consumer work after this MiMoCode foundation lands.\n\n## Tasks\n\n- [x] T1: Add the process-owned replaceable child environment foundation and `Server.listen({ childEnv })` adapter — acceptance: each set replaces the snapshot for future spawns, existing children are unaffected, listener stop does not reset, and no-set callers keep cu
