rprint: **yes**. Cross-repo search / impact / planned multi-edit / TUI `/repos`: **planned**.\n\n## Safety\n\nNo writes to unregistered or `read-only` repos; no auto stash/reset; no auto `submodule update`; secrets must not be dumped into LLM context from cross-search.\n"},{"path":"multi-repo/README.md","title":"マルチリポジトリ利用ガイド（oimo）","group":"multi-repo","content":"# マルチリポジトリ利用ガイド（oimo）\n\n日本語 | [English](./README.en.md)\n\noimo は複数の独立した Git リポジトリを一つの **System Workspace（システムワークスペース）** として扱えます。  \n業務機能単位の依頼に対し、関連リポを登録・識別し、境界を守ったまま横断作業へ進めるための基盤です。\n\n| 文書 | 内容 |\n|------|------|\n| **本ページ** | クイックスタート・使い分け・現状のできること |\n| [config-reference.ja.md](./config-reference.ja.md) | **`repos.txt` / `workspace.yaml` / `.gitmodules` のキー解説** |\n| [samples/](./samples/) | コピペ用サンプル |\n| [current-architecture.md](./current-architecture.md) | 現状アーキテクチャ調査（日本語） |\n| [implementation-plan.md](./implementation-plan.md) | 実装計画・Phase 分割（日本語） |\n| [../oimo-multi-repository-implementation-instructions.md](../oimo-multi-repository-implementation-instructions.md) | 要件・安全条件の指示書（日本語） |\n\n---\n\n## クイックスタート（推奨: `repos.txt`）\n\nGitHub の URL を並べるだけで登録できます。\n\n1. システム用フォルダを作る（親自体は Git でなくてよい）:\n\n```text\nmkdir -p ~/work/customer-platform/.oimo\ncd ~/work/customer-platform\n```\n\n2. サンプルをコピーして URL を書き換える:\n\n```bash\ncp /path/to/oimo/docs/multi-repo/samples/url-list/repos.txt .oimo/repos.txt\n# .oimo/repos.txt を編集 — https://github.com/... を1行1リポ\n```\n\n3. 兄弟ディレクトリへ clone（フォルダ名 = URL 末尾、または `id=`）:\n\n```bash\ngit clone https://github.com/example-org/frontend\ngit clone https://github.com/example-org/backend\n# またはヘルパー\nbash /path/to/oimo/docs/multi-repo/samples/url-list/clone-from-repos-txt.sh\n```\n\n4. 主対象リポで oimo を起動:\n\n```bash\ncd backend && oimo\n```\n\n### 発見順\n\nあるディレクトリを起点に、次の順で探します。\n\n1. `.oimo/workspace.yaml`（`.yml` / `.json` / `.jsonc`、ルート直下も可）\n2. `.oimo/repos.txt`（`repos.list` / `repositories.txt` も可）\n3. `.gitmodules` → **superproject モード**\n\nどれも無ければ従来どおり単一リポジトリ動作です。\n\n### `repos.txt` 早見表\n\n| 行 / トークン | 意味 |\n|---------------|------|\n| `name: \u003c表示名>` | Workspace 表示名（省略時 `workspace`） |\n| `primary: \u003cid>` | 主対象の id（省略時は先頭リポ行） |\n| `https://…` / `git@…` | リモート。ローカルは `\u003cworkspace>/\u003cid>/` を期待 |\n| ローカルパス | 既存 clone（相対は Workspace ルート基準） |\n| `read-only` | 書込禁止 |\n| `id=\u003cid>` | Registry id（省略時は URL/パス末尾） |\n| `role=\u003c文言>` | 短い役割メモ |\n\n詳細表: [config-reference.ja.md §1](./config-reference.ja.md)  \nサンプル: [samples/url-list/](./samples/url-list/)\n\n---\n\n## 方式の選び方\n\n| 状況 | 使うもの |\n|------|----------|\n| GitHub 上の複数リポをすぐ始めたい | **`repos.txt`** |\n| 相対パス・役割・非 Git 補助 dir を細かく指定したい | **`workspace.yaml`** |\n| 既に Git submodule で束ねている | **`.gitmodules` のまま**（追加設定不要） |\n| YAML と `repos.txt` が両方ある | **YAML が優先**（発見順） |\n\n---\n\n## `workspace.yaml`（詳細指定）\n\n役割や相対パスを明示するとき用です。\n\n| キー | 意味 |\n|------|------|\n| `version` | `1` 固定 |\n| `name` | Workspace 表示名 |\n| `primary` | `repositories[].id` のいずれか |\n| `repositories[].id` | 安定 id（表示は `id:相対パス`） |\n| `repositories[].path` | 絶対または相対。`kind: git` なら **worktree ルート必須** |\n| `repositories[].role` | 役割の説明 |\n| `repositories[].access` | `read-only` \\| `read-write` |\n| `repositories[].kind` | `git`（既定）/ `directory` / `superproject` / `submodule` |\n| `defaults.*` | 未登録 read/write・横断計画の要求 |\n\n詳細: [config-reference.ja.md §2](./config-reference.ja.md)  \nサンプル: [samples/siblings-yaml/workspace.yaml](./samples/siblings-yaml/workspace.yaml)\n\n---\n\n## `.gitmodules`（superproject）\n\n`workspace.yaml` / `repos.txt` が無いとき、`.gitmodules` があると自動登録します。\n\n| kind | 役割 |\n|------|------|\n| `superproject` | Workspace 管理用（原則 read-only）。アプリ実装の主戦場にしない |\n| `submodule` | 実装・commit・PR の単位 |\n\noimo が読むキー: セクション名、`path`、`url`、`branch`  \n→ [config-reference.ja.md §3](./config-reference.ja.md)\n\nローカルのみで検査（ネットワークしない）:\n\n- recorded commit（superproject の gitlink）と checked-out commit\n- tracking branch / remote / 初期化済みか / dirty\n- 不一致・behind → **警告**（影響分析継続時も警告を残す）\n\n**安全ルール**\n\n- 通常の兄弟登録での入れ子 Git は拒否。superproject ⊃ submodule だけ許可\n- `submodule update` / fetch / checkout は**自動実行しない**（影響を説明して承認）\n- superproject のポインタ更新は、子リポの変更と**別 Change set**\n\nサンプル: [samples/superproject/gitmodules.sample](./samples/superproject/gitmodules.sample)\n\n---\n\n## このリリースでできること（進行中）\n\n| 能力 | 状態 |\n|------|------|\n| `repos.txt` / `workspace.yaml` / `.gitmodules` で登録 | 対応済み |\n| パス解決、`repo-id:path`、read-only・未登録書込の拒否 | Resolver + 書込ゲート配線済み |\n| doctor・セッション指紋（作成時キャプチャ） | 対応済み |\n| CLI `oimo repos list\\|doctor` / TUI `/repos` | 対応済み |\n| 横断 grep（`repositories: [id…]` 明示時のみ） | Phase 2 一部対応 |\n| 影響グラフ・計画付き横断編集・リポ別検証 | 予定（Phase 3–5） |\n\n設定ファイルが無い単一リポ利用は従来どおりです。  \nFDE（`oimo --fde`）と組み合わせると、API + UI + schema にまたがる現場スパイクに向きます（infra は `read-only` 推奨）。\n\n---\n\n## 常時の安全規則\n\n1. 未登録パスへ書込まない  \n2. `read-only` リポへ書込まない  \n3. dirty な作業ツリーを勝手に stash / reset しない  \n4. 検出した依存を根拠なしに事実扱いしない（Phase 3）  \n5. `.env` や鍵を横断検索結果として LLM 文脈へ不用意に入れない  \n\n---\n\n## 関連リンク\n\n- オリジナル機能一覧（§12 マルチリポ）: [`オリジナル実装.md`](../../オリジナル実装.md)\n- リリース: [v1.2.0](https://github.com/kuwa2005/oimo/releases/tag/v1.2.0)\n"},{"path":"multi-repo/config-reference.ja.md","title":"マルチリポジトリ設定リファレンス","group":"multi-repo","content":"# マルチリポジトリ設定リファレンス\n\n利用手順の入口: [README.md](./README.md)  \nEnglish overview: [README.en.md](./README.en.md)\n\n発見順（あるディレクトリを起点）:\n\n1. `.oimo/workspace.yaml`（または `.yml` / `.json` / `.jsonc`。ルート直下の同名も可）\n2. `.oimo/repos.txt`（または `repos.list` / `repositories.txt`）\n3. `.gitmodules` → superproject モード\n\nどれも無い場合は従来どおり単一リポジトリ動作。\n\n---\n\n## 1. `repos.txt`（推奨・最速）\n\n置き場所の例: `\u003cworkspace>/.oimo/repos.txt`  \n`\u003cworkspace>` は兄弟クローンを置く親フォルダ（それ自体が Git である必要はない）。\n\n### 1.1 全体の形\n\n```text\n# コメント（# から行末まで）と空行は無視\n\nname: customer-platform\nprimary: backend\n\nhttps://github.com/org/frontend\nhttps://github.com/org/backend\nhttps://github.com/org/shared-schema\nhttps://github.com/org/infra read-only\nhttps://github.com/org/api-server id=backend role=REST-API\n../already-cloned-billing\n```\n\n### 1.2 ヘッダ行（任意・ファイル全体に 1 回ずつ）\n\n| 行 | 必須 | 意味 |\n|----|------|------|\n| `name: \u003c表示名>` | 任意 | Workspace の表示名。省略時は `workspace`。 |\n| `primary: \u003cid>` | 任意 | 主対象リポジトリの **id**。省略時は**最初に書いたリポ行**の id。ツールで `repositoryId` を省略したときの既定先。 |\n\n`name` / `primary` はリポ行ではなくメタ情報。`primary` に書く値は、下のリポ行から決まる **id** と一致させる。\n\n### 1.3 リポジトリ行（1 行 = 1 リポ）\n\n先頭トークンが対象、続きがオプション。\n\n| 先頭トークン | 意味 |\n|--------------|------|\n| `https://...` / `http://...` / `git@...` | リモート URL。ローカル clone は `\u003cworkspace>/\u003cid>/` を期待（`.git` 接尾辞は無視）。 |\n| それ以外（例: `../billing`, `/abs/path`） | すでに clone 済みの**ローカルパス**（相対は `repos.txt` がある Workspace ルート基準）。 |\n\n| 後ろに付けられるパラメータ | 意味 | 省略時 |\n|---------------------------|------|--------|\n| （なし） | 読取・書込可の Git リポとして登録 | — |\n| `read-only` または `readonly` | 書込禁止（Resolver が拒否） | `read-write` |\n| `read-write` / `readwrite` | 明示的に書込可 | 既定と同じ |\n| `id=\u003c識別子>` | Registry 上の安定 id（検索結果・計画・`primary` で使う） | URL/パスの**最終セグメント**（`api-server.git` → `api-server`） |\n| `role=\u003c文言>` | 人間向けの役割メモ（空白を含む場合は非対応。短い英数字推奨） | URL 行なら `clone of \u003curl>` |\n\n**id の規則:** `A-Za-z0-9_.-` のみ。`id=` で上書きしないと、GitHub のリポ名がそのままフォルダ名になる想定。\n\n### 1.4 クローン配置との対応\n\n| `repos.txt` | 期待するローカルパス |\n|-------------|----------------------|\n| `https://github.com/org/frontend` | `\u003cworkspace>/frontend/` |\n| `https://github.com/org/api-server id=backend` | `\u003cworkspace>/backend/` |\n| `../billing` | `repos.txt` の基準ディレクトリから見た `../billing` |\n\n未 clone の場合は doctor が `git clone \u003curl> \u003cpath>` を提示する（**自動 clone しない**）。  \nヘルパー: `docs/multi-repo/samples/url-list/clone-from-repos-txt.sh`\n\n### 1.5 やってはいけないこと\n\n- 同じ `id` を二行に書く → `duplicate_id` で失敗\n- `primary` に存在しない id を書く → 後段の materialize で失敗\n- 入れ子になった別 Git ルートを兄弟として並べる（superproject 以外）→ `nested_repositories`\n\n---\n\n## 2. `workspace.yaml`（詳細指定）\n\n置き場所の例: 主リポの `.oimo/workspace.yaml`、または Workspace ルートの `.oimo/workspace.yaml`。  \n同等: `workspace.yml` / `workspace.json` / `workspace.jsonc`。\n\n相対 `path` の基準:\n\n- ファイルが `.oimo/` 配下 → **その親ディレクトリ**（Workspace / 主 checkout ルート）\n- それ以外 → 設定ファイルのあるディレクトリ\n\n### 2.1 トップレベル\n\n| キー | 型 | 必須 | 意味 |\n|------|----|------|------|\n| `version` | `1` のみ | 必須 | スキーマ版。将来拡張用。 |\n| `name` | string | 必須 | Workspace 表示名。 |\n| `primary` | string | 必須 | `repositories[].id` のいずれか。主対象。 |\n| `repositories` | array（1 件以上） | 必須 | 登録リポ一覧。 |\n| `defaults` | object | 任意 | 未登録パスや横断計画の既定ポリシー。 |\n\n### 2.2 `repositories[]` の各要素\n\n| キー | 型 | 必須 | 意味 |\n|------|----|------|------|\n| `id` | string | 必須 | 安定識別子（`backend` 等）。結果表示は `id:相対パス`。 |\n| `path` | string | 必須 | 絶対パス、または上記基準からの相対パス。**Git リポなら worktree ルート**（サブディレクトリ不可）。 |\n| `role` | string | 任意 | 役割の説明（「REST API」「Web UI」など）。 |\n| `access` | `read-only` \\| `read-write` | 任意 | 書込可否。省略時は `kind` 依存（下表）。 |\n| `kind` | 下表 | 任意 | リポの種類。省略時 `git`。 |\n\n#### `kind`\n\n| 値 | 意味 | 既定 `access` |\n|----|------|----------------|\n| `git` | 独立した Git checkout。`.git` がルートにあること。 | `read-write` |\n| `directory` | Git ではない補助ディレクトリ（ドキュメント置き場など）。**明示が必須**。 | `read-only` |\n| `superproject` | `.gitmodules` を持つ親（通常は自動検出で付与）。アプリ実装先にしない。 | `read-only` |\n| `submodule` | superproject 配下の submodule（通常は自動検出）。 | `read-write` |\n\n#### `access`\n\n| 値 | 挙動 |\n|----|------|\n| `read-write` | 登録済みなら編集・書込ツール可（Execution scope 導入後も scope 内が前提）。 |\n| `read-only` | 読取・検索は可、書込は Resolver が拒否（例: infra）。 |\n\n### 2.3 `defaults`\n\n| キー | 型 | 省略時 | 意味 |\n|------|----|--------|------|\n| `allow_unregistered_reads` | bool | `false` | `true` でも Phase 1 では未登録読取を安易に広げない方針。将来の緩和用。 |\n| `allow_unregistered_writes` | bool | `false` | 未登録パスへの書込。`true` は非推奨（doctor が警告）。 |\n| `require_cross_repo_plan` | bool | `true` | 複数リポへの書込前に横断計画を要求する方針フラグ（Phase 4 で強制が本格化）。 |\n\n### 2.4 検証ルール（ロード時）\n\n- `primary` が一覧に無い → エラー\n- `id` 重複 / 正規化後パス重複 → エラー\n- `kind: git` なのに Git ルートでない、またはサブディレクトリ → エラー\n- `kind: directory` なのに Git ルート → エラー（`kind: git` を使え）\n- 兄弟リポ同士の入れ子 → エラー（**superproject ⊃ submodule は例外で許可**）\n\n### 2.5 最小例\n\n```yaml\nversion: 1\nname: customer-platform\nprimary: backend\nrepositories:\n  - id: backend\n    path: .\n    role: REST API and domain logic\n  - id: frontend\n    path: ../frontend\n    role: Web UI\n  - id: infra\n    path: ../customer-infra\n    role: deployment\n    access: read-only\n  - id: notes\n    path: ../notes\n    kind: directory\n    access: read-only\ndefaults:\n  allow_unregistered_writes: false\n  require_cross_repo_plan: true\n```\n\nサンプル: `docs/multi-repo/samples/siblings-yaml/workspace.yaml`\n\n---\n\n## 3. `.gitmodules`（Git submodule superproject）\n\n標準の Git 設定ファイル。oimo 用の独自キーは増やさない。  \n`workspace.yaml` / `repos.txt` が**無い**とき、起点ディレクトリに `.gitmodules` があると自動で Workspace 化する。\n\n### 3.1 Git が使うキー（oimo が読むもの）\n\n各 `[submodule \"\u003cname>\"]` セクション:\n\n| キー | 必須（Git） | oimo での意味 |\n|------|-------------|---------------|\n| （セクション名）`name` | 実質必須 | submodule 論理名。id の候補。 |\n| `path` | 必須 | superproject ルートからの相対パス。checkout 位置。 |\n| `url` | 推奨 | clone / 追跡用リモート。role 文言にも使う。 |\n| `branch` | 任意 | 追跡したいブランチ名。behind 判定のヒント（ローカルに `origin/\u003cbranch>` がある場合のみ。**fetch はしない**）。 |\n\nサンプル: `docs/multi-repo/samples/superproject/gitmodules.sample`\n\n### 3.2 oimo が自動登録する内容\n\n| Registry 上 | `kind` | 既定 `access` | 役割 |\n|-------------|--------|---------------|------|\n| 親ディレクトリ（basename を id に） | `superproject` | `read-only` | ポインタ管理・Workspace の器。アプリ実装の主戦場にしない。 |\n| 各 submodule | `submodule` | `read-write` | 実装・commit・PR の単位。 |\n\n- **primary:** 初期化済み submodule があればその先頭、無ければ一覧上の先頭 submodule（superproject 自身は primary にしない方針）。\n- **入れ子:** 通常の兄弟登録では禁止される「親の中の別 Git」を、superproject/submodule 関係として許可。\n\n### 3.3 検査する状態（ネットワーク無し・ローカルのみ）\n\n各 submodule について doctor / 指紋が持つ情報:\n\n| 項目 | 意味 |\n|------|------|\n| recorded commit | superproject の gitlink（`ls-tree`）が指す commit |\n| checked-out commit | submodule 作業ツリーの `HEAD` |\n| tracking branch | `.gitmodules` の `branch` |\n| remote | submodule 内の `git remote` |\n| initialized | 配下に `.git` があるか |\n| dirty | `git status --porcelain` が空でないか |\n| commit mismatch | recorded ≠ checked-out → 影響分析に警告 |\n| behind tracking | ローカル `origin/\u003cbranch>` より後ろ → 警告（自動更新しない） |\n\n### 3.4 運用上の約束\n\n1. コード変更・commit・PR は **各 submodule 内**で行う。  \n2. superproject の submodule ポインタ更新は **別 Change set / 別 Step**。  \n3. `git submodule update` / `checkout` / `remote update` は **自動実行しない**。ネットワークと作業ツリーへの影響を説明して承認を取る。  \n4. 未初期化のまま影響分析を続ける場合は警告を残す。\n\n### 3.5 手動で YAML に書く場合\n\n通常は不要。明示するなら:\n\n```yaml\nversion: 1\nname: monorepo-super\nprimary: backend\nrepositories:\n  - id: monorepo-super\n    path: .\n    kind: superproject\n    access: read-only\n  - id: backend\n    path: backend\n    kind: submodule\n  - id: frontend\n    path: frontend\n    kind: submodule\n```\n\n---\n\n## 4. 形式の選び方\n\n| 状況 | 推奨 |\n|------|------|\n| GitHub 上の複数リポを並べてすぐ始めたい | `repos.txt` |\n| 相対パス・役割・directory 補助を細かく指定したい | `workspace.yaml` |\n| 既に Git submodule でシステムを束ねている | `.gitmodules` のまま（追加設定なし） |\n| YAML と repos.txt が両方ある | **YAML が勝つ**（発見順） |\n\n詳細な利用手順・安全規則: 同ディレクトリの [README.md](./README.md)\n"},{"path":"multi-repo/current-architecture.md","title":"oimo 現状アーキテクチャ（マルチリポジトリ準備）","group":"multi-repo","content":"# oimo 現状アーキテクチャ（マルチリポジトリ準備）\n\n利用ガイド: [README.md](./README.md) · 設定キー: [config-reference.ja.md](./config-reference.ja.md)\n\n調査日: 2026-09-03  \n対象: `packages/opencode/src` を中心とした実行時  \n指示書: `docs/oimo-multi-repository-implementation-instructions.md`\n\n本ドキュメントは Phase 0 の調査結果である。推測で新しい基盤を設計する前に、既存の cwd / Git / 権限 / セッション / TUI / skills / workflows / evolve の実態を固定する。\n\n---\n\n## 1. 作業ディレクトリ・Git・セッションの保持\n\n### 1.1 実行時の単一境界: Instance\n\n| 概念 | 型 / 置き場 | 意味 |\n|------|-------------|------|\n| `directory` | `InstanceContext.directory` | 起動・切替時の作業ディレクトリ（実質の cwd） |\n| `worktree` | `InstanceContext.worktree` | Git ルート（sandbox）。非 Git は `\"/\"` |\n| `project` | `Project.Info` | DB 上の Project（`id`, `worktree`, `vcs`, `sandboxes[]` 等） |\n\n- 実装: `project/instance.ts`\n- 保持: `LocalContext`（AsyncLocalStorage）+ `directory` キーの Promise キャッシュ\n- Effect 側: `effect/instance-state.ts` / `instance-ref.ts`（`InstanceRef`, `WorkspaceRef`）\n- 境界判定: `Instance.containsPath` = `directory` 内 **または** `worktree` 内（`worktree === \"/\"` のときは worktree 判定をスキップし、`external_directory` を維持）\n\n**含意:** 1 Instance ≈ 1 checkout。複数独立 Git ルートを同時に「内側」とは扱わない。\n\n### 1.2 Project 解決\n\n- `project/project.ts` `fromDirectory`: 上方向に `.git` を探索し `worktree` / sandbox を決定\n- `project/project-id.ts`: `.git/oimo-project-id`（または `.oimo-project-id`）で安定 `ProjectID`\n- 永続: `project/project.sql.ts`（`ProjectTable`）\n\n### 1.3 Session\n\n- `session/session.sql.ts`: `project_id`, 任意の `workspace_id`（**control-plane** 用）、`directory`（作成時スナップショット）, messages / parts / todos / permission\n- 作成時の `directory` / `projectID` は現在の Instance から取得（`session/session.ts`）\n- bash のカレント: `tool/session-cwd.ts`（**プロセス内メモリのみ**。DB 非永続。既定は `Instance.directory`）\n\n### 1.4 既存の「Workspace」語（衝突注意）\n\n| 名前 | 場所 | 意味（現行） |\n|------|------|--------------|\n| Control-plane Workspace | `control-plane/workspace*.ts` | 隔離ホスト（worktree 等）、`WorkspaceID`、同期・復元。実験フラグあり |\n| Instance.worktree | `Instance.worktree` | 現 checkout の Git ルート |\n| Git worktree 隔離 | `worktree/index.ts`, adaptors | `\u003cdata>/worktree/\u003cprojectID>/\u003cname>` |\n| Workflow workspace jail | `workflow/workspace.ts` | オーケストレータ script のファイル IO 脱獄防止。既定 root = `Instance.worktree` |\n| Workspace trust | `project/workspace-trust.ts` | 起動ディレクトリ信頼リスト（`trusted-workspaces.json`） |\n\n指示書の **Workspace = 複数 Repository の集合** は、上記のいずれとも一致しない。実装時は製品名を分離する（推奨: `RepoWorkspace` / `SystemWorkspace`、設定キー `repositories`、CLI `/repos` または `/sys`）。本計画では設定上 `workspace` を使う場合でも、コード識別子は control-plane と衝突しない名前を優先する。\n\n---\n\n## 2. パス制約・権限ゲート\n\n### 2.1 読取・書込の共通境界\n\n- 入口: `tool/external-directory.ts`\n  - `assertExternalDirectoryEffect`: Instance 外 → `external_directory` 許可確認\n  - 例外（信頼エスケープ）: `\u003cdata>/memory`, `~/.oimo/evolve`, `\u003cdata>/worktree`\n  - `assertWriteAllowed`: external_directory → memory-path-guard → reliability Scope\n- 読取ツール: `assertExternalDirectory` + `permission: \"read\"`\n- 書込ツール: `assertWriteAllowed` + `edit` ask\n- bash: パス接触コマンドに external_directory。cwd は `SessionCwd`\n\n### 2.2 Permission エンジン\n\n- `permission/index.ts`: ruleset、skip-all、forced-ask、親セッション転送\n- セッション / プロジェクト単位のルール（`PermissionTable` 等）\n- Agent 既定に `external_directory` の ask/allow パターン（`agent/agent.ts`）\n\n**マルチリポへの影響:** 「登録済み sibling repo」は今日はすべて Instance 外 = `external_directory`。レジストリ導入後は Resolver が **登録済み read-only / read-write** を判定し、未登録への書込を拒否する単一境界にする必要がある。ツールごとの独自 path 判定を増やさないこと。\n\n---\n\n## 3. システムプロンプト・ツール・コンテキスト入口\n\n| 層 | 入口 | 現行の cwd 依存 |\n|----|------|-----------------|\n| System prompt | `session/system.ts` | `Instance.directory` / `worktree`、（Anthropic）`git status` / branch |\n| LLM 組み立て | `session/llm.ts` | agent prompt + memory（`projectID` キー） |\n| ターン本体 | `session/prompt.ts` | tools に `path: { cwd: ctx.directory, root: ctx.worktree }` |\n| Tool 登録 | `tool/registry.ts` | builtin + project `{tool,tools}/*`、skill/workflow describe |\n| Instruction / skills XML | `skill/index.ts` | discovery は `directory → worktree` ウォーク |\n\n**含意:** コンテキストは単一 root 前提。Workspace summary / registry / graph の段階投入は未実装。\n\n---\n\n## 4. TUI 表示（リポ名・ブランチ・変更）\n\n| UI | ファイル | 表示内容 |\n|----|----------|----------|\n| Sidebar / Home footer | `feature-plugins/sidebar/footer.tsx`, `home/footer.tsx` | `path.directory`（`~` 短縮）+ 任意で `:` + `vcs.branch` |\n| VCS 同期 | `project/vcs.ts`, sync `vcs.branch.updated` | `VcsInfo { branch, default_branch }`。`/vcs`, `/vcs/diff` |\n| 変更ファイル | `sidebar/files.tsx` | セッション diff（+/-）。footer に dirty バッジは無し |\n| プロジェクト名 | DB `Project.name` | TUI の主アイデンティティには未使用（パス末尾 + branch） |\n\nマルチリポ TUI は footer 拡張（Workspace 名 / primary / repo 数 / scope）と、表示パスの `repo-id:relpath` が最小追加点。\n\n---\n\n## 5. セッション再開で復元されるもの\n\n| 項目 | 復元元 | 備考 |\n|------|--------|------|\n| メッセージ / parts / todos / permission | SQLite + sync bootstrap | 現在の Instance `directory` 前提 |\n| `SessionTable.directory` | DB | 記録されるが、再開時に cwd を自動切替しない（TUI `-c` は現 Instance のまま） |\n| control-plane `workspace_id` | DB + `control-plane/workspace.ts` `sessionRestore` | 別 Workspace なら set + re-bootstrap |\n| `SessionCwd` | なし | プロセス再起動で消失 |\n| multi-repo registry / change set | なし | **未実装** |\n\n---\n\n## 6. skills / workflows の作業パス\n\n### skills\n\n- `skill/index.ts` `discoverSkills(directory, worktree)`:\n  - builtin / compose / グローバル skills\n  - `directory → worktree` の `.oimo` 等\n  - `cfg.skills.paths`（相対は `directory` 基準）\n- 実行時のエージェント cwd は依然 Instance。skill はパッケージパスを見せるだけ。\n\n### workflows\n\n- `workflow/runtime.ts`: `workspaceRoot = input.workspace ?? Instance.worktree`\n- `isolation: \"worktree\"` → `\u003cdata>/worktree/\u003cprojectID>/...`\n- `workflow/workspace.ts`: ルート脱獄防止の jail\n- 承認: `workflow_tool_approval`（`llm.ts` + `Instance.bind`）\n\n---\n\n## 7. evolve の自己改変範囲\n\n- タスク文: `session/auto-evolve.ts` — skills は `\u003cworktree>/.oimo/skills/`、ログは `~/.oimo/evolve/\u003cprojectID>/`\n- ストア: `evolve/store.ts` — `evolveRoot(projectID)`\n- 書込 sandbox: `memory-path-guard.ts` — dream/distill/evolve は memory + `.oimo` + evolve root\n- TUI: `{ projectID, worktree }`（`dialog-evolve.tsx` 等）\n\n**含意:** 1 ProjectID + 1 worktree。顧客 multi-repo Change set と evolve 改変を混ぜない要件は、現状の単一境界と整合しやすいが、明示的な対象 Repository 指定が必要。\n\n---\n\n## 8. Git・差分・テスト・承認\n\n| 領域 | 実装 | 備考 |\n|------|------|------|\n| Branch / diff | `project/vcs.ts`, `Git.Service`, HTTP `/vcs` | 単一 cwd |\n| Snapshot diff | `snapshot/index.ts` | プロジェクト配下 shadow git |\n| セッション差分要約 | `SessionTable.summary_*` | |\n| テスト実行 | 専用 API なし | agent の `bash` + reliability evidence 慣習 |\n| 承認 | permission UI、autonomy / never-ask、workflow approval、workspace trust | 横断計画承認は未実装 |\n\nGit 境界は既に「1 checkout」。疑似単一リポ化はしていない（良い前提）。\n\n---\n\n## 9. 設定ファイル置き場（レジストリ候補）\n\n| 場所 | 用途例 |\n|------|--------|\n| `Global.Path.config`（`oimo.json(c)`） | グローバル設定 |\n| `directory → worktree` の `oimo.json(c)` / `.oimo/` | プロジェクト設定（`config/paths.ts`） |\n| `Global.Path.data/trusted-workspaces.json` | 信頼ディレクトリ |\n| `~/.oimo/evolve/\u003cprojectID>/` | evolve ログ（home 側） |\n| SQLite `project` / session | 実行時状態 |\n\n**推奨（後続計画で確定）:** Primary repository の `.oimo/workspace.yaml`（または `oimo.json` 内 `workspace` キー）にレジストリを置き、セッションにはパス + fingerprint を保存。グローバル一覧は任意。\n\n---\n\n## 10. 単一 cwd 依存のホットスポット一覧\n\n実装時に Resolver / Execution scope へ段階移行する候補（一括置換禁止）。\n\n1. `Instance.containsPath` / `assertExternalDirectory*`\n2. `session/prompt.ts` の `path: { cwd, root }`\n3. `session/system.ts` の environment / git 注入\n4. `tool/session-cwd.ts` + `bash.ts` cwd\n5. `file/*` / `ripgrep` / grep・glob ツールの検索ルート\n6. `skill/index.ts` / `workflow/resolve.ts` の walk stop = worktree\n7. `project/vcs.ts` の単一 cwd\n8. TUI footer / sync `vcs` 単一ブランチ\n9. evolve / memory の projectID + worktree キー\n10. control-plane Workspace との命名・ID 衝突\n\n---\n\n## 11. 再利用できる既存抽象（作り直し禁止の根拠）\n\n- **InstanceState + ALS**: 実行コンテキストの受け渡しパターン（マルチリポでも「現在の primary Instance」は維持し、Resolver を横に足す）\n- **Permission / external_directory**: 境界外アクセスの ask/deny フロー\n- **AppFileSystem.contains / resolve**: symlink・正規化の土台（Resolver はこれを包む）\n- **Session 永続 + sync**: Change set / registry 指紋の載せ先候補\n- **VCS サービス**: Repository ごとの並列呼び出しに拡張可能\n- **Workflow jail**: 「ルート単位の脱獄防止」の先行事例\n- **TUI permission / plan 確認**: 横断 change plan の UI フック\n\n---\n\n## 12. ギャップ（指示書要件との差分）\n\n| 要件 | 現状 |\n|------|------|\n| Workspace 登録・復元 | なし（control-plane Workspace は別物） |\n| Repository Resolver | なし（Instance.containsPath のみ） |\n| 横断検索（repo-id 付き） | なし（単一 root + external_directory） |\n| Dependency graph | なし |\n| Cross-repo change plan / Change set | なし |\n| Execution scope / read-only 強制 | access 次元なし |\n| Repo 別検証集約 | なし（bash 任せ） |\n| skills multi-repo capability | なし（暗黙 single-repo） |\n| TUI Workspace 表示 | なし |\n\n---\n\n## 13. Threat model（概要）\n\n| 脅威 | 現行緩和 | マルチリポで増えるリスク |\n|------|----------|---------------------------|\n| worktree 外書込 | external_directory ask | 登録拡張で「許可範囲が広がる」ことをユーザーに明示しないと過剰権限 |\n| symlink 脱獄 | 一部 AppFileSystem / workflow jail | Resolver で実パス正規化必須。prefix 文字列比較禁止 |\n| 秘密情報のコンテキスト混入 | 限定的 | 横断検索で `.env` 等を吸い上げやすい → 除外・マスク必須 |\n| dirty 上書き | 明示操作依存 | 他リポの既存 dirty を oimo 変更と混同 |\n| evolve 混入 | project 単位 sandbox | 顧客リポと oimo 本体の Change set 混在 |\n| control-plane Workspace 誤用 | 実験的 | 同名で誤った復元・同期を誘発 |\n\n詳細な緩和は `implementation-plan.md` Phase 1 以降の Acceptance に落とす。\n"},{"path":"multi-repo/implementation-plan.md","title":"oimo マルチリポジトリ実装計画","group":"multi-repo","content":"# oimo マルチリポジトリ実装計画\n\n利用ガイド: [README.md](./README.md) · 設定キー: [config-reference.ja.md](./config-reference.ja.md)\n\n根拠: `docs/oimo-multi-repository-implementation-instructions.md`  \n現状: `docs/multi-repo/current-architecture.md`  \n方針日: 2026-09-03\n\n## 置き場（feature placement）\n\n| 能力 | 層 | 理由 |\n|------|----|------|\n| Repository Resolver、Execution scope、書込拒否、セッション指紋、ツール引数 `repositoryId`、TUI 境界表示、設定 schema | **Core** (`packages/opencode/src/**`) | 実行時の安全不変条件・権限・セッション・TUI |\n| 横断影響分析の手順、契約検出の運用ノウハウ、E2E シナリオ説明 | **Builtin skill**（後続 Phase、ポータブルなら agent-skills ミラー） | ホスト横断で有用な「使い方」はスキル側。境界そのものはコア |\n\n大規模リファクタ禁止。既存 Instance / Permission / VCS / sync を拡張する。\n\n---\n\n## 後方互換\n\n1. Workspace 未設定 = 今日と同一（単一 Instance、`repositoryId` 省略 = primary = 現 `directory`/`worktree`）\n2. 既存ツール API に必須引数を足さない。任意 `repositoryId` / 明示 Workspace tool のみ\n3. 横断検索・横断書込は暗黙 `all` にしない\n4. control-plane `WorkspaceID` の意味・API を壊さない（製品マルチリポは別名で導入）\n\n### 命名方針\n\n| 製品語（指示書） | コード推奨識別子 | 設定ファイル例 |\n|------------------|------------------|----------------|\n| Workspace（複数 repo） | `RepoWorkspace` / `SystemWorkspace` | Primary の `.oimo/workspace.yaml` または `oimo.json` の `repoWorkspace` |\n| Repository | `RegisteredRepo` | `repositories[]` |\n| CLI | `/workspace` は control-plane と紛らわしい場合 `/repos` も検討。TUI 文言は「System workspace」 | |\n\n実装 PR で最終文字列を決めるが、**SQLite / Effect Context の型名は control-plane `Workspace` と衝突させない**。\n\n---\n\n## 中核モデル（段階導入）\n\n```ts\n// 概念。実際の配置は packages/opencode/src/repo-workspace/ を推奨\ntype RepositoryId = string\n\ntype RepositoryDescriptor = {\n  id: RepositoryId\n  rootPath: string       // 正規化済み絶対パス\n  canonicalPath: string  // realpath 後\n  kind: \"git\" | \"directory\"\n  role?: string\n  access: \"read-only\" | \"read-write\"\n  git?: { branch?: string; head?: string; remoteNames: string[]; dirty: boolean }\n}\n\ntype RepoWorkspace = {\n  id: string\n  name: string\n  configPath: string\n  primaryRepositoryId: RepositoryId\n  repositories: Map\u003cRepositoryId, RepositoryDescriptor>\n  dependencyGraph?: RepositoryGraph\n  executionScope: Set\u003cRepositoryId>\n}\n```\n\n内部参照は可能な限り `RepositoryLocation { repositoryId, relativePath }`。OS 直前だけ絶対パスへ解決。\n\n### Repository Resolver（単一境界）\n\n責務: ID→root、パス→repo（最長一致）、symlink 正規化、traversal 拒否、未登録拒否。\n\n読取・書込・検索・shell・Git は Resolver 経由。`Instance.containsPath` は「primary + 登録済み（access に応じる）」へ拡張するか、Resolver が先に判定してから既存 gate に落とす。\n\n---\n\n## Phase 0 — 現状調査と設計 ✅（本ドキュメント群）\n\n**成果物**\n\n- [x] `docs/multi-repo/current-architecture.md`\n- [x] `docs/multi-repo/implementation-plan.md`（本書）\n\n**残作業（Phase 0 締め）**\n\n- threat model を実装チケットへ分割済みであること（本書 Threat 節）\n- 単一 cwd ホットスポット一覧の合意（architecture §10）\n\n---\n\n## Phase 1 — Workspace Registry（横断書込なし）\n\n**目標:** 複数ローカル Git（および明示 `kind: directory`）を登録・検証・一覧・doctor・セッション復元できる。書込は primary のみ（従来どおり）。登録 sibling への書込はまだ実装しない（または明示 deny）。\n\n**実装単位（小さめ PR）**\n\n1. 設定 schema + 読込（YAML/JSON、パス正規化、存在・Git ルート・重複・入れ子検証）\n2. `RepoWorkspace` サービス（load / list / add / remove / doctor）+ 単体テスト\n3. Resolver 骨格（逆引き・未登録拒否）。書込パスは primary のみ allow（従来）\n4. セッションに `repo_workspace` 指紋（config path、primary、repo ids、開始時 HEAD/dirty）を保存・復元。移動・削除時は推測せず再解決要求\n5. TUI/CLI: `/workspace` または `/repos` の list / doctor（最小表示）\n6. mimocode-docs: 設定例と安全制約（未登録書込なし）\n\n**Acceptance**\n\n- 単一リポ（設定なし）回帰テスト緑\n- 3 repo 登録・list・doctor\n- nested / 非 Git（明示なし）を拒否\n- セッション再開で registry 指紋復元、欠損パスはエラー\n\n**テスト:** `fixtures/multi-repo/` 骨格作成開始。ケース 1, 12, 13 の一部。\n\n---\n\n## Phase 2 — 読取専用横断探索\n\n**目標:** 登録 repo 全体の検索・読取。結果は必ず `repositoryId` + 相対パス。context budget 制御。\n\n**実装**\n\n1. `search` / `grep` / `glob` / `read` に任意 `repositoryIds`（明示時のみ横断）\n2. 結果型に `RepositoryLocation`\n3. `.gitignore` / 巨大 / バイナリ / 秘密候補の除外・マスク\n4. Workspace summary（言語・manifest・テストコマンドの軽量キャッシュ）\n5. TUI: 検索・読取表示を `repo-id:path`\n6. System prompt に registry 要約のみ（全ファイル投入禁止）\n\n**Acceptance:** 指示書テスト 2, 3, 15。sibling への書込は依然拒否。\n\n---\n\n## Phase 3 — Dependency graph と影響分析\n\n**目標:** evidence + confidence 付きグラフ。検出と user-declared を分離。推測を事実扱いしない。\n\n**実装**\n\n1. 検出器: package manifest/lock、local path deps、OpenAPI/GraphQL/proto、compose/k8s/tf/CI、DB schema、events、docs/ADR\n2. `RepositoryEdge` 型（指示書どおり）\n3. graph cache（HEAD / 設定変更で無効化）\n4. Impact report + 実行順（production / test / generated / docs / infra 分類）\n5. 計画を permission / 確認 UI に載せるフック（まだ自動書込しない）\n\n**Acceptance:** テスト 4, 11。confidence なしの確定表示なし。\n\n---\n\n## Phase 4 — 計画付き横断編集\n\n**目標:** Execution scope + read-only 強制 + Change set。\n\n**実装**\n\n1. Execution scope をセッションに保持。scope 外・read-only はツール層で拒否\n2. Cross-repository change plan 確認（既存承認に統合。auto でもログ必須）\n3. edit/write/apply_patch を Resolver + access 経由に\n4. Change set: `complete | partial | failed | cancelled`、repo 別ファイル一覧\n5. 生成元優先（generated 直編集の禁止を prompt + 可能なら検出）\n6. repo ごとの AGENTS.md / lint 設定を混同しない\n\n**Acceptance:** テスト 5, 6, 7, 8, 10。symlink / traversal 拒否。\n\n---\n\n## Phase 5 — 横断検証\n\n**目標:** repo 別 format/lint/typecheck/test/build 検出と依存順実行。未実行を成功扱いしない。\n\n**実装**\n\n1. コマンド検出（package.json scripts、既存 reliability 慣習）\n2. `runCommand({ repositoryId, ... })` — API の `cwd` に root を渡す（`cd &&` 連結を基本にしない）\n3. 結果集約（repo 単位 + Change set 全体）\n4. partial failure 表示\n\n**Acceptance:** テスト 9。最終報告フォーマット（指示書 4.6）。\n\n---\n\n## Phase 6 — Git・workflow·evolve·dream 統合\n\n**実装**\n\n1. repo 別 status/diff/commit/PR 情報（疑似単一 commit 禁止）\n2. workflow step に `repositoryId` / selector\n3. skill metadata capability（既定 `single-repo`）\n4. dream: repo 固有知識 vs workspace 横断知識の分離、依存に evidence/confidence/時点\n5. evolve: 顧客 Change set と oimo 自己改変の分離、対象 repo 明示\n\n**Acceptance:** テスト 10–14 の残り、E2E シナリオ（displayName 追加）。\n\n---\n\n## テスト計画\n\n### Fixture\n\n```text\npackages/opencode/test/fixtures/multi-repo/\n  frontend/\n  backend/\n  shared-schema/\n  infra/\n  outside-workspace/\n```\n\n（配置はパッケージ慣例に合わせて調整可。リポジトリルート直下 `fixtures/` でも可。）\n\n### 必須ケース（指示書 §11）\n\nPhase 完了ゲートとして番号を追跡する。E2E 合格基準は shared-schema → backend → frontend、infra は確認のみ。\n\n### 回帰\n\n各 Phase 終了時: 既存単一リポの typecheck + 関連 unit/integration。`bun typecheck` / テストは `packages/opencode` から実行。\n\n---\n\n## Threat model（実装チェックリスト）\n\n1. 未登録・親ディレクトリへの書込拒否（ツール層）\n2. symlink 経由の外書き拒否（realpath）\n3. read-only 強制\n4. 秘密候補の graph/LLM 除外・マスク\n5. destructive / push は既存承認維持\n6. 一リポの許可を他へ自動拡張しない\n7. repo 追加時に権限拡張を明示\n8. evolve と顧客修正の Change set 分離\n9. 失敗時の自動破壊的 rollback 禁止\n10. dirty の stash/reset 禁止\n\n---\n\n## 完了条件（Goal 監査用）\n\n指示書 §12 をそのまま監査チェックリストとする。すべてについてリポジトリ上の証拠（コード・テスト出力・文書）が揃うまで Goal を complete にしない。\n\n---\n\n## 直近の次アクション\n\n1. [done] Phase 1 registry + Resolver + doctor + fingerprint + samples\n2. [done] CLI `oimo repos` / TUI `/repos` + write-gate wiring + session capture\n3. [partial] Phase 2: grep `repositories[]` cross-search（glob/read の repo 指定は未）\n4. Phase 3: dependency graph + impact report\n\n本計画の更新は Phase 完了時に行い、逸脱は「安全条件を落とさない」範囲でのみ許可する。\n"},{"path":"multi-repo/samples/README.md","title":"サンプル一覧","group":"multi-repo","content":"# サンプル一覧\n\nコピペして使う設定例です。キーの意味は [../config-reference.ja.md](../config-reference.ja.md) を参照してください。\n\n| ディレクトリ | 内容 |\n|--------------|------|\n| [url-list/](./url-list/) | **推奨** `.oimo/repos.txt` + clone スクリプト |\n| [siblings-yaml/](./siblings-yaml/) | 詳細な `.oimo/workspace.yaml` |\n| [superproject/](./superproject/) | 標準 `.gitmodules` の雛形（`gitmodules.sample`） |\n\n利用手順の全体: [../README.md](../README.md)\n"},{"path":"oimo-differentiators.ja.md","title":"oimo の強み — 他コーディングエージェントとの比較","group":"トップ","content":"# oimo の強み — 他コーディングエージェントとの比較\n\nOpen Mimo Code（CLI: `oimo`）が、一般的なコーディングエージェント・Codex・Claude Code・Cursor・OpenCode と比べて**何を得意とする製品か**を整理したドキュメントです。\n\n> **前提:** oimo は [OpenCode](https://github.com/anomalyco/opencode) フォークです。TUI・LSP・MCP・プラグイン・多プロバイダー接続など OpenCode 系の基盤は共有します。本稿は **oimo 固有の追加価値** に焦点を当てます。  \n> 競合製品の機能は日々変わるため、表は「2026-09 時点の oimo 実装」基準です。各製品の最新仕様は公式ドキュメントを参照してください。\n\n---\n\n## 一言サマリー\n\n| 製品 | 主な形態 | oimo との関係 |\n|------|----------|----------------|\n| **一般的なコーディングエージェント**（Aider, Cline, Continue 等） | CLI / IDE 拡張 / 単機能スクリプト | ターミナルネイティブ + **長期記憶・自己改善・マルチリポ**まで一体 |\n| **Codex**（OpenAI / ChatGPT 連携 CLI） | OpenAI エコシステム前提のエージェント | Codex OAuth **取り込み可**。加えて Zen 無料ルーター・evolve 等 |\n| **Claude Code** | Anthropic 公式 CLI エージェント | 認証・設定の **インポート可**。oimo 側でメモリ / evolve / Auto(無料) を追加 |\n| **Cursor** | IDE 一体型（エディタ + Agent） | **IDE ではない**。TUI + `serve`/`attach` でリモート分離。自己進化・Compose は oimo 固有 |\n| **OpenCode** | オープンソース TUI エージェント（oimo の upstream） | 同一コア。**記憶・evolve・Auto(無料) failover・マルチリポ** 等を oimo が拡張 |\n\n**oimo のポジション:** 「その場で書く」だけでなく、**案件をまたいで学び、無料枠を運用し、複数リポを安全に扱う** ターミナル製品。\n\n---\n\n## 比較マトリクス（oimo 固有の強み）\n\n凡例: ● = oimo が製品として標準搭載 / 深く統合、◐ = 限定的・設定依存、— = oimo の主戦場外または upstream 同等\n\n| 能力 | oimo | OpenCode | Cursor | Claude Code | Codex | 一般 CLI エージェント |\n|------|:----:|:--------:|:------:|:-----------:|:-----:|:---------------------:|\n| ターミナル TUI（SSH / サーバ分離） | ● | ● | — | ● | ● | ◐ |\n| 多プロバイダー / MCP / LSP | ● | ● | ◐ | ◐ | — | ◐ |\n| **SQLite FTS 持続メモリ**（`MEMORY.md` 等） | ● | — | ◐ | ◐ | ◐ | ◐ |\n| **自動チェックポイント + コンテキスト再構築** | ● | — | ◐ | ◐ | ◐ | — |\n| **`/context-limit` モデル別圧縮予算** | ● | — | — | — | — | — |\n| **Self Evolution（`/evolve`）** | ● | — | — | — | — | — |\n| **Friction / HAC 学習** | ● | — | — | — | — | — |\n| **`/dream` / `/distill` 知識・ワークフロー結晶化** | ● | — | — | — | — | — |\n| **Compose + `/compose-next` 仕様駆動** | ● | — | — | — | — | — |\n| **ゴール / 停止条件 + ジャッジ** | ● | — | — | — | — | — |\n| **Auto Model (無料) + first-frame failover** | ● | — | — | — | — | — |\n| **マルチリポ System Workspace** | ● | — | — | — | — | — |\n| **`--warm` ソフト continue** | ● | — | — | — | — | — |\n| **同梱ビルトインスキル**（PDF/DOCX/research 等） | ● | ◐ | — | — | — | — |\n| **Claude Code 認証インポート** | ● | — | — | （本体） | — | — |\n| **Codex (ChatGPT) OAuth** | ● | ◐ | — | — | （本体） | — |\n| **IDE 内インライン編集・Tab 補完** | — | — | ● | — | — | ◐ |\n\n---\n\n## カテゴリ別 — oimo にないもの / 向いていないこと\n\n公平のため、先に限界を書きます。\n\n- **IDE 一体体験** — Cursor のようなエディタ内 diff・Tab 補完・GUI Agent パネルは oimo の主眼ではありません（TUI + 外部エディタ併用が前提）。\n- **単一ベンダー最適化の深さ** — Codex / Claude Code は各社モデル・課金・ポリシーに最適化されています。oimo は **横断ルーター + 拡張** です。\n- **クラウド専用 SaaS ダッシュボード** — oimo はローカル CLI + 任意 `oimo serve` です。\n\n---\n\n## 1. 一般的なコーディングエージェントとの差\n\n「エージェント」と呼ばれるツールは多く、**1 セッションで patch を出す** 点では共通です。oimo が厚いのは **セッションをまたぐ運用層** です。\n\n### oimo 側\n\n- **記憶:** プロジェクトメモリ・チェックポイント・タスクツリー（`T1` / `T1.1` …）が SQLite で永続化され、再開時に自動注入。\n- **コンテキスト:** ウィンドウ逼迫前の自動チェックポイント、予算制御付きインジェクション、モデル別 `/context-limit`。\n- **自己改善:** 摩擦をログし、`.oimo/skills/` や `~/.oimo/evolve/` に結晶化（後述）。\n- **サブエージェント:** 並列 spawn・キャンセル・ライフサイクル追跡を本隊が所有。\n- **スキル:** BM25 検索 + 同梱ビルトイン + `.oimo/skills/` ホットリロード。\n\n### 一般エージェント側（典型）\n\n- リポジトリ内の `AGENTS.md` / ルールファイル + 会話履歴が中心。\n- 長期記憶やチェックポイントは製品・設定次第（多くは oimo ほど一体ではない）。\n- 自己改善ループ（観測→定量化→スキル化→PR 草案）は標準装備されにくい。\n\n**向いているユーザー:** 単発修正より、**同じコードベースを weeks 単位で回す** 人。\n\n---\n\n## 2. OpenCode との差（upstream）\n\nOpenCode は oimo の土台です。以下は **oimo が追加した製品能力** です（OpenCode 本体には通常含まれません）。\n\n| 領域 | oimo の追加 |\n|------|-------------|\n| 記憶 | FTS5 メモリ、チェックポイントライター、タスク進捗連携 |\n| 自律 | `/goal` 停止条件、try-best / reliability loop |\n| ワークフロー | Compose、`/compose-next`、`.oimo/workflows/` |\n| 自己進化 | evolve / friction / dream / distill、backlog・briefs |\n| ルーティング | **Auto Model (無料)** — Zen active 7 モデル + first-frame failover（[auto-free-fcc-sync.md](./auto-free-fcc-sync.md)） |\n| 現場 | マルチリポ（[multi-repo/README.md](./multi-repo/README.md)）、`--fde` / `--se`、`--warm` |\n| 製品 | `oimo.jsonc` + JSON Schema、MiMo OAuth・音声、Claude/Codex インポート UX |\n\nOpenCode ユーザーが oimo に移る典型理由: **無料モデルの自動切替が止まらないこと**、**evolve でチーム知識が溜まること**、**マルチリポ案件を 1 TUI で扱うこと**。\n\n---\n\n## 3. Cursor との差\n\nCursor は **エディタが本体** の Agent です。oimo は **ターミナルが本体** です。\n\n### Cursor が強い領域\n\n- ファイル内インライン編集、マルチファイル diff レビュー\n- Tab 補完、@ シンボル参照、GUI からの Agent 操作\n- 非エンジニアにも触れやすい UX\n\n### oimo が強い領域\n\n- **サーバ上のみ `oimo serve`、手元は `oimo attach`** — SSH 先の重い TUI を避けられる（[README](../README.md) 参照）\n- **evolve 閉ループ** — 運用摩擦をスキル・ルール・backlog に変換（IDE 外の資産）\n- **Auto(無料)** — API キーなしで Zen 無料プールを failover（Cursor のモデル選択とは別レイヤ）\n- **Compose** — 仕様→実装→検証の段階オーケストレーションを CLI ワークフローとして固定\n- **マルチリポ** — 1 セッションで複数 Git ルートをスコープ付きで操作\n\n**併用イメージ:** 日常編集は Cursor、**長時間自律バッチ・サーバ作業・evolve** は oimo、という分担が多いです。\n\n---\n\n## 4. Claude Code との差\n\nClaude Code は Anthropic 公式のターミナルエージェントです。oimo は **Claude 認証・設定のインポート** に対応していますが、製品の芯は異なります。\n\n### Claude Code が強い領域\n\n- Claude モデル・課金・ツール仕様への最短経路\n- `CLAUDE.md` / hooks エコシステム（コミュニティ慣習が成熟）\n\n### oimo が強い領域\n\n- **プロバイダ非依存** — Claude に加え OpenRouter / Codex / Zen / MiMo 等を同一 TUI で切替\n- **Auto Model (無料)** — Claude 契約なしでも Zen 無料 7 モデルを router 可能\n- **持続メモリ + チェックポイント** — oimo 形式の `MEMORY.md` / checkpoint / tasks 一体\n- **Self Evolution** — `/evolve`、friction ルール、AI-to-AI briefs（Claude Code 単体にはない製品ループ）\n- **マルチリポ・Compose・ゴール駆動** — 大規模・長期案件向けの本隊機能\n\n**移行:** 初回セットアップの「Claude Code からインポート」で認証を移しつつ、**記憶と evolve は oimo 側に蓄積** させる使い方が想定されています。\n\n---\n\n## 5. Codex との差\n\nCodex（ChatGPT Pro/Plus 連携の OpenAI コーディング CLI）も **OAuth で oimo に接続可能** です。\n\n### Codex が強い領域\n\n- OpenAI サブスクリプション枠内での Codex モデル利用\n- ChatGPT エコシステムとの一体課金・ポリシー\n\n### oimo が強い領域\n\n- **マルチプロバイダー** — Codex だけでなく Claude / MiMo / カスタム OpenAI 互換を同一セッション運用\n- **Auto(無料)** — サブスク外の Zen 無料プールを first-frame failover（502/429 等の transient も router 側で処理）\n- **記憶・evolve・Compose** — Codex セッションをまたいだプロジェクト知識の保持\n- **マルチリポ** — モノレポ / 複数サービス repo の横断\n\n**典型:** 難しいタスクは Codex モデル、定常タスクは Auto(無料) や lite グループ、という **コスト分散**。\n\n---\n\n## 6. oimo 固有機能の詳細\n\n### 6.1 Self Evolution（Co-Evolve）\n\n```text\n案件で使う\n  → /evolve（Self Improvement Session）\n  → 摩擦 / Human Attention Cost を定量化\n  → プロジェクト知識 → .oimo/skills/\n  → 製品改善 → ~/.oimo/evolve/\u003cprojectID>/briefs/\n  → evolve-review → 人間承認 → evolve-apply（draft PR）\n```\n\n- ログは **`~/.oimo/evolve/\u003cprojectID>/`** に集約（作業ツリーを汚さない）\n- ソースの **自動マージはしない** — Human-in-the-loop が前提\n- README の *Where Models and Agents Co-Evolve* はこのループを指す\n\n関連: ビルトイン `evolve` スキル、`/dream`、`/distill`\n\n### 6.2 Auto Model (無料)\n\n- 公開 ID: `auto/free`（TUI: **Auto Model (無料)**）\n- OpenCode Zen の **active 無料 7 モデル** を zero-config で候補化\n- **first-frame failover** — 429 / 5xx / upstream 過負荷等、コミット前なら次モデルへ（[auto-free-fcc-sync.md](./auto-free-fcc-sync.md)）\n- FCC 由来 OpenRouter / NVIDIA / Groq は API キー設定時にボーナス候補\n\n将来: `auto/paid` / `auto/hybrid`（[auto-mode-roadmap.md](./auto-mode-roadmap.md)）\n\n### 6.3 マルチリポジトリ\n\n- `.oimo/repos.txt` または `.oimo/workspace.yaml` で複数 Git ルートを登録\n- `oimo repos doctor`、`/repos`、書込スコープゲート\n- 詳細: [multi-repo/README.md](./multi-repo/README.md)\n\n### 6.4 コンテキスト・継続性\n\n| 機能 | 用途 |\n|------|------|\n| 自動チェックポイント | 長セッションの状態スナップショット |\n| `--warm` | 新規セッションへ前回要約を 1 ターン注入（`-c` よりソフト） |\n| `--warm=deep` | compaction 境界まで `contextFrom` 継承 |\n| `/context-limit` | モデル別に早め圧縮（コスト・品質調整） |\n\n---\n\n## 7. 選び方（クイックガイド）\n\n| あなたの優先 | おすすめ |\n|--------------|----------|\n| IDE 内で書きながら Agent | **Cursor**（oimo は補助） |\n| Claude だけ・公式 CLI で十分 | **Claude Code** |\n| ChatGPT サブスクで Codex だけ | **Codex** |\n| OSS TUI・自分で最小構成 | **OpenCode** |\n| 無料枠 failover + 長期記憶 + 自己改善 + マルチリポ | **oimo** |\n| 既に OpenCode ユーザーで evolve / Auto(無料) が欲しい | **oimo** へ |\n\n---\n\n## 8. 関連ドキュメント\n\n| ドキュメント | 内容 |\n|--------------|------|\n| [README.md](../README.md) | クイックスタート・機能一覧 |\n| [architecture/core-vs-skills.ja.md](./architecture/core-vs-skills.ja.md) | 本隊 / ビルトイン / スキルの境界 |\n| [auto-free-fcc-sync.md](./auto-free-fcc-sync.md) | Auto(無料) カタログと Zen プール |\n| [auto-mode-roadmap.md](./auto-mode-roadmap.md) | Auto paid / hybrid ロードマップ |\n| [multi-repo/README.md](./multi-repo/README.md) | マルチリポ利用ガイド |\n| ビルトイン `mimocode-docs` | TUI 内リファレンス（`/` でスキル検索） |\n\n---\n\n## 更新方針\n\n- 競合製品の機能追加が oimo の差分を埋める場合は、本稿の表を更新する。\n- oimo 側の新機能（例: `auto/hybrid` 実装）が出たら、該当セクションと [auto-mode-roadmap.md](./auto-mode-roadmap.md) を同期する。\n"},{"path":"oimo-multi-repository-implementation-instructions.md","title":"oimo マルチリポジトリ対応 実装指示書","group":"トップ","content":"# oimo マルチリポジトリ対応 実装指示書\n\n## 1. この指示書の目的\n\n既存のAIコーディングエージェント `oimo` に、複数の独立したGitリポジトリを一つのシステムとして認識し、横断的に調査・影響分析・変更・検証できる機能を実装する。\n\n今回実現するものは、単に複数ディレクトリを検索できる機能ではない。利用者が「このAPI仕様を変更して」「ログイン処理をOAuth2対応にして」のように業務機能・システム単位で依頼したとき、oimo自身が関連リポジトリを特定し、依存関係と変更範囲を説明し、安全に実装できる状態を目標とする。\n\n基本思想は次のとおりとする。\n\n> Repositoryを操作するAIから、Systemを保守するAIへ拡張する。\n\n---\n\n## 2. 最初に実施すること\n\n実装前に既存コードを調査し、以下を文書化すること。推測で新しい基盤を作らず、既存の設計、命名、ツール実行、権限確認、セッション管理、TUI、`skills`、`workflows`、`evolve`、`dream` の仕組みを可能な限り再利用する。\n\n1. oimoが現在「作業ディレクトリ」「Gitリポジトリ」「セッション」をどのように保持しているか\n2. ファイル検索・読取・編集・コマンド実行の際にルート制約をどこで判定しているか\n3. システムプロンプト、ツール定義、コンテキスト生成の入口\n4. TUIで現在のリポジトリ名・ブランチ・変更状態を表示している箇所\n5. セッション再開時に復元される情報と保存形式\n6. `skills` と `workflows` が作業対象パスをどのように受け取るか\n7. `evolve` が自己改変対象をどのように限定しているか\n8. Git操作、差分取得、テスト実行、承認フローの既存実装\n\n調査結果を `docs/multi-repo/current-architecture.md` に記録し、その後に実装計画を `docs/multi-repo/implementation-plan.md` として作成すること。既存コードの実態に応じて本指示書の型名や配置は変更してよいが、要件と安全条件は落とさないこと。\n\n## 3. 用語定義\n\n- **Repository**: `.git` を境界とする一つのGitリポジトリ\n- **Workspace**: 一つのシステムとして扱う複数Repositoryの集合\n- **Primary repository**: oimoを起動した、または利用者が主対象に指定したRepository\n- **Repository registry**: Workspace内のRepository一覧と役割を保持する台帳\n- **Dependency graph**: Repository間の依存・通信・成果物利用関係を表すグラフ\n- **Change set**: 一つの依頼によって複数Repositoryに発生した変更の集合\n- **Execution scope**: そのタスクで読取・編集・コマンド実行を許可されたRepository群\n\n## 4. 必須ユースケース\n\n最低限、次を実現すること。\n\n### 4.1 Workspaceの登録と再利用\n\n- 複数の既存ローカルRepositoryを一つのWorkspaceとして登録できる。\n- 相対パスと絶対パスの両方を受け付けるが、保存時は正規化する。\n- Workspace設定をプロジェクト側の設定ファイルとして保存し、次回起動時に再利用できる。\n- 登録時にRepositoryの存在、Gitルート、重複、入れ子、アクセス可否を検証する。\n- Gitリポジトリでない補助ディレクトリは、明示的に `kind: directory` とした場合だけ読取対象として登録できる。\n\n設定例。実際のファイル名は既存設定体系に合わせてよい。\n\n```yaml\nversion: 1\nname: customer-platform\nprimary: backend\nrepositories:\n  - id: frontend\n    path: ../customer-frontend\n    role: Web UI\n    access: read-write\n  - id: backend\n    path: .\n    role: REST API and domain logic\n    access: read-write\n  - id: shared-schema\n    path: ../shared-schema\n    role: API schema and generated types\n    access: read-write\n  - id: infra\n    path: ../customer-infra\n    role: deployment and cloud resources\n    access: read-only\ndefaults:\n  allow_unregistered_reads: false\n  allow_unregistered_writes: false\n  require_cross_repo_plan: true\n```\n\n### 4.2 横断検索\n\n- ファイル名、文字列、シンボル、設定キー、APIパス、DB項目を登録済みRepository全体から検索できる。\n- 検索結果には必ずRepository IDとRepository相対パスを付ける。\n- 同名ファイルや同名シンボルを混同しない。\n- `.gitignore`、既存の除外設定、巨大ファイル、バイナリ、秘密情報候補を考慮する。\n- 検索対象を `all`、特定Repository、read-writeのみ等で絞り込める。\n- 検索結果をすべてLLMへ投入せず、候補抽出、ランキング、必要箇所の読取という段階処理にする。\n\n### 4.3 Repository間依存の検出\n\n次の情報源を解析し、確信度と根拠付きでDependency graphを生成する。\n\n- package manifestとlock file\n- workspace設定\n- import、package名、ローカルパス依存\n- OpenAPI、GraphQL、Protocol Buffers等の契約\n- HTTP URL、ルート、クライアント生成設定\n- Docker Compose、Kubernetes、Terraform、CI/CD設定\n- DB migration、schema、ORMモデル\n- イベント名、queue、topic、consumer/producer\n- README、architecture document、ADR\n\n自動検出結果と利用者が明示した関係を区別すること。推測した依存を事実として扱わない。\n\n依存関係には最低限、次の情報を持たせる。\n\n```ts\ntype RepositoryEdge = {\n  from: RepositoryId\n  to: RepositoryId\n  kind: 'build' | 'runtime' | 'api' | 'schema' | 'event' | 'deploy' | 'docs' | 'unknown'\n  evidence: Array\u003c{ repositoryId: RepositoryId; path: string; line?: number; description: string }>\n  confidence: 'confirmed' | 'high' | 'medium' | 'low'\n  source: 'declared' | 'detected' | 'user'\n}\n```\n\n### 4.4 影響分析\n\n利用者の依頼に対し、編集前に次を行う。\n\n1. 起点となる仕様、シンボル、API、schema、設定を特定\n2. 直接参照箇所を全Repositoryから検索\n3. Dependency graphを使って間接影響候補を列挙\n4. production code、test、generated code、docs、infraに分類\n5. 変更が必要、確認が必要、影響なし、判断不能に分類\n6. 根拠ファイルを示したCross-repository change planを生成\n\n計画表示例。\n\n```text\n変更対象\n- shared-schema: OpenAPI schemaと生成元を更新\n- backend: DTO、handler、contract testを更新\n- frontend: generated type、API adapter、画面テストを更新\n\n確認のみ\n- infra: API gateway設定には該当項目なし\n\n実行順序\n1. shared-schema\n2. backend\n3. frontend\n```\n\n複数Repositoryへの書込みが発生する場合、既存の承認方式に統合して変更計画を提示する。自動承認モードが既に存在する場合も、計画と対象Repositoryはログへ残す。\n\n### 4.5 横断変更\n\n- Execution scope外のRepositoryには書き込まない。\n- read-only指定のRepositoryには書き込まない。\n- 各編集結果にRepository IDを保持する。\n- schemaや生成元がある場合、生成物だけを直接修正せず、生成元を更新して既存の生成コマンドを使う。\n- Repositoryごとの規約ファイル、AGENTS.md、CONTRIBUTING.md、lint/test設定を個別に適用する。\n- 一つのRepositoryのルールを他Repositoryへ無条件に流用しない。\n- 途中で一部の変更に失敗した場合、成功済み変更を隠さず、Change setを `complete`、`partial`、`failed`、`cancelled` のいずれかで記録する。\n- 自動的なcommit、push、PR作成は既存の権限・承認ルールに従い、今回の機能追加だけを理由に有効化しない。\n\n### 4.6 Repositoryごとの検証と統合検証\n\n- 各Repositoryで適切なformat、lint、typecheck、unit test、buildを検出して実行できる。\n- コマンドの作業ディレクトリを必ず明示し、別Repositoryで誤実行しない。\n- 依存順に検証する。\n- 可能な場合は契約テストまたは統合テストを最後に実行する。\n- テストが存在しない、実行不能、環境変数不足、外部サービス依存の場合は「成功」扱いにしない。\n- 結果をRepository単位とChange set全体の両方で集約する。\n\n最終報告には少なくとも以下を含める。\n\n- 変更したRepository\n- Repositoryごとの変更ファイル\n- 実行した検証と結果\n- 実行できなかった検証と理由\n- 残存リスク\n- commitまたはPRを作成した場合はRepositoryごとの識別情報\n\n## 5. アーキテクチャ要件\n\n### 5.1 単一のcwd依存を除去する\n\n既存実装にグローバルな `cwd`、`repoRoot`、`gitRoot` への暗黙依存がある場合、すべてを一括置換してはならない。境界インターフェースを導入し、段階的にRepository-awareへ移行する。\n\n推奨する中核モデルは次のとおり。\n\n```ts\ntype RepositoryId = string\n\ntype RepositoryDescriptor = {\n  id: RepositoryId\n  rootPath: string\n  canonicalPath: string\n  kind: 'git' | 'directory'\n  role?: string\n  access: 'read-only' | 'read-write'\n  git?: {\n    branch?: string\n    head?: string\n    remoteNames: string[]\n    dirty: boolean\n  }\n}\n\ntype WorkspaceContext = {\n  id: string\n  name: string\n  primaryRepositoryId: RepositoryId\n  repositories: Map\u003cRepositoryId, RepositoryDescriptor>\n  dependencyGraph: RepositoryGraph\n  executionScope: Set\u003cRepositoryId>\n}\n\ntype RepositoryLocation = {\n  repositoryId: RepositoryId\n  relativePath: string\n}\n```\n\nファイルを内部で参照するときは、可能な限り裸の絶対パスではなく `RepositoryLocation` を使う。OSアクセス直前に正規化済み絶対パスへ解決する。\n\n### 5.2 Repository Resolver\n\n次を担当する単一の解決層を作る。\n\n- Repository IDからroot pathへの解決\n- 任意パスから所属Repositoryへの逆引き\n- symlink解決後の境界検査\n- `..` を含むpath traversal防止\n- 大文字小文字、Windows drive、UNC、WSL等を考慮した正規化\n- 入れ子Repositoryの最長一致判定\n- 未登録パスへのアクセス拒否\n\n読取・書込・検索・shell・Gitの各ツールが独自にパス判定を実装しないよう、このResolverを共通利用する。\n\n### 5.3 Tool層の変更\n\n既存ツールとの後方互換を維持しつつ、次のようにRepository指定を追加する。\n\n```ts\nreadFile({ repositoryId?, path })\nwriteFile({ repositoryId?, path, content })\nsearch({ repositoryIds?, query, options? })\nrunCommand({ repositoryId?, command, args?, timeout? })\ngitStatus({ repositoryId })\ngitDiff({ repositoryId, base? })\n```\n\n`repositoryId` 省略時はPrimary repositoryを使い、既存の単一Repository動作を壊さない。ただし、検索や変更計画で `all repositories` を暗黙指定しない。横断操作は明示的なWorkspace toolまたは明示フラグを使う。\n\nshell commandは文字列連結による `cd path && ...` を基本方式にせず、実行APIの `cwd` 引数へRepository rootを渡す。ログにもRepository IDを付ける。\n\n### 5.4 Context構築\n\nLLMへ毎回全Repositoryの全情報を渡さない。次の階層でコンテキストを作る。\n\n1. Workspace summary\n2. Repository registry\n3. Dependency graphの関連部分\n4. タスクに関連する検索結果\n5. 必要なファイル本文\n\nRepositoryごとに概要、主要言語、主要manifest、テストコマンド、規約、主要entry pointをキャッシュする。ファイル変更、HEAD変更、設定変更を検出したときだけ該当部分を無効化する。\n\n### 5.5 セッションと永続化\n\nセッションには最低限、以下を保存・復元する。\n\n- Workspace IDと設定ファイルの位置\n- Primary repository\n- 登録Repository一覧\n- 各Repositoryの開始時HEADとdirty状態\n- Execution scope\n- Dependency graphの版またはfingerprint\n- Change setと承認状態\n- Repository単位の変更・検証結果\n\nRepositoryが移動・削除された場合は黙って別パスを推定せず、再解決を求める。開始時とHEADが変わった場合は依存グラフ、差分、変更計画の再評価を行う。\n\n## 6. TUI要件\n\n既存TUIへ過剰な新画面を増やさず、最低限次を追加する。\n\n- 現在のWorkspace名\n- Primary repository\n- 登録Repository数\n- Repositoryごとのaccess、branch、dirty状態\n- 現在のExecution scope\n- 検索結果・編集差分・コマンド出力のRepository識別表示\n- Cross-repository change planの確認画面\n- Repository別検証結果\n\n同じファイル名が並んでも区別できるよう、表示は原則として `repo-id:path/to/file` とする。\n\n推奨コマンド例。既存のコマンド体系に合わせて名称は調整してよい。\n\n```text\n/workspace init\n/workspace add \u003cpath> [--id \u003cid>] [--read-only]\n/workspace remove \u003cid>\n/workspace list\n/workspace graph\n/workspace scope \u003cid...|all>\n/workspace refresh\n/workspace doctor\n```\n\n## 7. Gitの扱い\n\n複数Repositoryを一つの疑似Repositoryとして扱わない。Gitの境界は必ず維持する。\n\n- status、diff、branch、commit、remoteはRepositoryごとに取得する。\n- 作業開始時のHEADとdirty状態を記録する。\n- 利用者の既存変更をoimoの変更として報告しない。\n- 既存の未コミット変更を上書き・巻き戻し・stashしない。\n- branch名がRepository間で異なっていても許容する。\n- commitする場合はRepositoryごとに独立commitとする。\n- 複数PRが必要な場合は依存順とマージ順を提示する。\n- submodule、worktree、nested repositoryは検出し、通常の兄弟Repositoryと区別する。\n\nChange setはGit commitとは別のoimo内部概念として保持する。これにより、3 Repositoryにまたがる一つの依頼を一単位として追跡できるようにする。\n\n## 8. 安全要件\n\n以下は必須とする。\n\n1. 登録されていないRepositoryや親ディレクトリへ書き込まない。\n2. symlink経由のWorkspace外書込みを拒否する。\n3. read-only Repositoryへの書込みをツール層で拒否する。\n4. `.env`、秘密鍵、credential、token候補をDependency graphやLLM contextへ不用意に取り込まない。\n5. 横断検索結果に秘密値そのものを表示しない。\n6. destructive command、migration、deployment、pushは既存の承認ルールを維持する。\n7. 一つのRepositoryで許可された操作を他Repositoryへ自動拡張しない。\n8. Repository追加時に、許可範囲が拡張されることを利用者へ明示する。\n9. `evolve` がoimo自身を変更する場合も、対象Repositoryを明示し、顧客コードのRepositoryへ自己改変を混入させない。\n10. 途中失敗時に自動で破壊的rollbackを行わない。差分と復旧案を提示する。\n\n## 9. `skills`、`workflows`、`evolve`、`dream` との統合\n\n### skills\n\n- Skill metadataに対応scopeを持たせられるようにする。\n- `single-repo`、`multi-repo`、`workspace-read-only` 等のcapabilityを宣言できるようにする。\n- 既存Skillは指定がなければ `single-repo` として動作させ、後方互換を守る。\n\n### workflows\n\n- Stepごとに `repositoryId` または `repositorySelector` を指定できるようにする。\n- 前Stepの出力から対象Repositoryを動的決定できるようにする。\n- Repository間の依存順、並列実行可能性、失敗時の停止条件を表現できるようにする。\n- 最終結果はChange setとして集約する。\n\n### evolve\n\n- マルチリポジトリ作業中に検出したoimo自身の問題点は、従来どおり改良提案または改造指示へ出力する。\n- 顧客システムの修正とoimo自身の改造を同じChange setへ混在させない。\n- 自己改変は明示的にoimo本体Repositoryを対象とした別タスクとして扱う。\n\n### dream\n\n- Repository固有の知識とWorkspace横断知識を分離して保存する。\n- 一時的なbranch名、古いHEAD、過去の検出結果を永続的事実として固定しない。\n- 記憶した依存関係には根拠、取得時点、confidenceを持たせる。\n\n## 10. 段階的な実装順序\n\n大規模な一括改修は禁止する。以下の順に、小さなPRまたは変更単位で実装・検証する。\n\n### Phase 0: 現状調査と設計\n\n- 既存アーキテクチャ調査\n- 単一cwd依存箇所の一覧化\n- 後方互換方針\n- threat model\n- 実装計画とテスト計画\n\n### Phase 1: Workspace Registry\n\n- 設定schema\n- Repository登録・削除・一覧\n- path正規化と境界検査\n- セッション復元\n- `/workspace doctor`\n\nこの時点では横断書込みを実装しない。\n\n### Phase 2: 読取専用の横断探索\n\n- 全Repository検索\n- Repository別ファイル読取\n- Workspace summary\n- TUIのRepository識別表示\n- context budget制御\n\n### Phase 3: Dependency graphと影響分析\n\n- manifest、API schema、infra等の検出器\n- evidenceとconfidence\n- graph cacheと更新\n- Cross-repository impact report\n\n### Phase 4: 計画付き横断編集\n\n- Execution scope\n- read-only enforcement\n- Cross-repository change plan\n- Repository-aware edit tools\n- Change set追跡\n\n### Phase 5: 横断検証\n\n- Repository別コマンド検出\n- 依存順実行\n- 結果集約\n- partial failure処理\n\n### Phase 6: Git・workflow・evolve・dream統合\n\n- Repository別diff/commit/PR情報\n- workflow scope\n- skill capability\n- knowledge分離\n- 自己改変境界\n\n各Phase終了時に、既存の単一Repository利用が壊れていないことを回帰テストする。\n\n## 11. テスト要件\n\nunit testだけで完了としない。fixtureとして複数の小規模Repositoryを生成し、end-to-end testを行う。\n\n最低限、次の構成を用意する。\n\n```text\nfixtures/multi-repo/\n  frontend/\n  backend/\n  shared-schema/\n  infra/\n  outside-workspace/\n```\n\n必須テストケースは次のとおり。\n\n1. 単一Repositoryモードが従来どおり動く\n2. 3 Repositoryを登録して横断検索できる\n3. 同名ファイルをRepository ID付きで区別できる\n4. OpenAPI変更からbackendとfrontendの影響を検出できる\n5. read-onlyのinfraに書き込もうとすると拒否される\n6. 未登録のoutside-workspaceへの書込みが拒否される\n7. symlinkを使った境界外書込みが拒否される\n8. path traversalが拒否される\n9. 一つのRepositoryでテスト失敗した場合に全体を成功扱いしない\n10. 既存dirty fileを識別し、oimoの変更と混同しない\n11. RepositoryのHEAD変更後に古い影響分析を使わない\n12. 中断・再開後にWorkspaceとChange setが復元される\n13. nested repo、submodule、worktreeを誤認しない\n14. Windows/WSLをサポート対象とする場合、そのpath正規化を検証する\n15. 大量検索結果を無制限にLLM contextへ投入しない\n\n可能であれば、以下のシナリオをE2Eの合格基準とする。\n\n> shared-schemaのAPI responseに `displayName` を追加せよ、と依頼する。oimoがshared-schema、backend、frontendを変更対象として特定し、infraは確認のみと判断する。計画承認後、生成元、実装、型、テスト、文書を適切な順序で更新し、Repository別と全体の検証結果を報告する。\n\n## 12. 完了条件\n\n以下をすべて満たした場合にのみ、マルチリポジトリ対応の初版を完了とする。\n\n- Workspaceに複数Repositoryを安全に登録・復元できる\n- 横断検索結果をRepository単位で追跡できる\n- 根拠とconfidence付きのRepository依存グラフを生成できる\n- 変更前に横断影響分析と実行順を提示できる\n- Execution scopeとread-only制約がツール層で強制される\n- 複数Repositoryの変更を一つのChange setとして管理できる\n- RepositoryごとのGit境界と既存変更を保持できる\n- Repository別検証と全体結果を正しく報告できる\n- 途中失敗を成功と誤表示しない\n- 単一Repository利用との後方互換がある\n- 必須unit/integration/E2E testが通る\n- 設定方法、操作方法、安全制約、既知の制限が文書化されている\n\n## 13. 実装時の禁止事項\n\n- 既存アーキテクチャを調べずに全面的な作り直しを始めない。\n- すべてのRepositoryを一つの巨大なプロンプトへ投入しない。\n- 文字列のpath prefix比較だけで境界判定しない。\n- `cd` の連結だけでRepositoryを切り替えない。\n- 全Repositoryへ無条件に書込み権限を与えない。\n- dirtyな作業ツリーを自動でstash、reset、checkoutしない。\n- generated fileだけを直接編集して完了にしない。\n- 検出した依存関係を根拠なしで確定扱いしない。\n- テスト未実行をテスト成功として表示しない。\n- 複数Repositoryを一つのGit commitへまとめようとしない。\n- マルチリポジトリ機能の実装と無関係な大規模リファクタリングを混在させない。\n\n## 14. AIコーディングエージェントへの最終指示\n\nこの実装は、機能数よりも境界の正確さと説明可能性を優先すること。\n\nまず既存コードを調査し、現状設計、変更候補、互換性リスクを報告する。その後、Phase 1から順に実装する。各Phaseで、変更ファイル、設計判断、テスト結果、残課題を示し、動作確認が取れてから次へ進むこと。\n\n不明点があっても安易に新しい仕組みを並立させず、既存の抽象化へ統合可能かを先に調べる。一方、安全境界、Git境界、Repository識別が既存設計では表現できない場合は、最小の新しい抽象化を追加する。\n\n最終的に利用者が次のように指示できる状態を作ること。\n\n> この業務機能がどのRepositoryで実現されているか調べ、変更の影響範囲を根拠付きで示してください。計画を提示し、許可されたRepositoryだけを変更し、各Repositoryとシステム全体を検証してください。\n\n"},{"path":"openrouter-free.md","title":"OpenRouter (無料) ルーター","group":"トップ","content":"# OpenRouter (無料) ルーター\n\n`openrouter-free/free` は **OpenRouter の `:free` モデル専用**の仮想モデルです。Auto(無料) `auto/free` とは独立しており、Zen 無料プールや他プロバイダーにはフォールバックしません。\n\n## 前提\n\n- **OPENROUTER_API_KEY 必須**（[openrouter.ai/keys](https://openrouter.ai/keys)）\n- Auto(無料) には影響しません\n\n## カタログ同期\n\nOpenRouter 公開 API から `:free` かつ tool 対応・context ≥ 32k のモデルを取り込みます。\n\n```bash\nbun script/sync-openrouter-free-catalog.ts\n```\n\n出力: [`packages/opencode/src/provider/openrouter-free-catalog.json`](../packages/opencode/src/provider/openrouter-free-catalog.json)\n\n## フォールバック（二段）\n\n1. **OpenRouter ネイティブ** — 1 リクエストで `models[]` に **最大 3 件**（OpenRouter API 上限）を渡し、OpenRouter 側で切替\n2. **oimo クライアント** — first-frame 規則で候補を 1 件ずつ試行（Auto(無料) と同型）\n\n## 設定 (`oimo.json`)\n\n```json\n{\n  \"openrouter_free\": {\n    \"fallbacks\": [\n      \"openrouter/nvidia/nemotron-3-super-120b-a12b:free\",\n      \"openrouter/poolside/laguna-s-2.1:free\"\n    ],\n    \"preferred_order\": [\n      \"nvidia/nemotron-3-super-120b-a12b:free\"\n    ]\n  }\n}\n```\n\n- `fallbacks` — 明示リスト（設定時はカタログ先頭列を置換）\n- `preferred_order` — カタログ内の並び替え（model id のみ、`openrouter/` なし）\n\n## TUI\n\nモデル選択のピンに **OpenRouter (無料)** が表示されます。キー未設定時は無料プロバイダ設定ダイアログへ誘導します。\n\n## Auto(無料) との関係\n\n将来、FCC 同期スクリプトが本カタログを参照する拡張は可能ですが、**現状は連動しません**。Auto(無料) の Zen バックボーンと FCC カタログは従来どおりです。\n"}]</script>

<script>
(function () {
  "use strict";
  var DOCS = JSON.parse(document.getElementById("docs-manifest").textContent);
  var groupsEl = document.getElementById("groups");
  var filterEl = document.getElementById("filter");
  var contentEl = document.getElementById("content");
  var metaEl = document.getElementById("doc-meta");
  var noResultsEl = document.getElementById("no-results");
  var GROUP_ORDER = ["トップ", "specs", "spec", "plans", "reports", "architecture", "harness"];
  var GROUP_LABELS = { "トップ": "トップ", specs: "Specs", spec: "Spec", plans: "Plans", reports: "Reports", architecture: "Architecture", harness: "Harness" };

  document.getElementById("doc-count").textContent = DOCS.length + " 文書";

  function groupLabel(g) { return GROUP_LABELS[g] || g; }

  function renderNav(query) {
    var q = (query || "").toLowerCase();
    var visible = DOCS.filter(function (d) {
      return !q || d.title.toLowerCase().indexOf(q) !== -1 || d.path.toLowerCase().indexOf(q) !== -1;
    });
    var byGroup = {};
    visible.forEach(function (d) {
      (byGroup[d.group] = byGroup[d.group] || []).push(d);
    });
    var groups = Object.keys(byGroup).sort(function (a, b) {
      var i = GROUP_ORDER.indexOf(a), j = GROUP_ORDER.indexOf(b);
      return (i === -1 ? 99 : i) - (j === -1 ? 99 : j) || a.localeCompare(b);
    });
    groupsEl.innerHTML = "";
    groups.forEach(function (g) {
      var section = document.createElement("section");
      var h = document.createElement("h2");
      h.textContent = groupLabel(g) + " (" + byGroup[g].length + ")";
      section.appendChild(h);
      byGroup[g].forEach(function (d) {
        var a = document.createElement("a");
        a.href = "#" + encodeURIComponent(d.path);
        a.dataset.path = d.path;
        a.textContent = d.title;
        a.title = d.path;
        a.addEventListener("click", function (e) { e.preventDefault(); openDoc(d); });
        section.appendChild(a);
      });
      groupsEl.appendChild(section);
    });
    noResultsEl.hidden = visible.length !== 0;
  }

  function showMarkdown(doc, markdown) {
    var links = groupsEl.querySelectorAll("a[data-path]");
    for (var i = 0; i < links.length; i++) links[i].classList.toggle("active", links[i].dataset.path === doc.path);
    metaEl.innerHTML = "";
    var h = document.createElement("h1");
    h.textContent = doc.title;
    var p = document.createElement("code");
    p.textContent = doc.path;
    metaEl.appendChild(h);
    metaEl.appendChild(p);
    var html = marked.parse(markdown);
    var parsed = new DOMParser().parseFromString(html, "text/html");
    var unsafe = parsed.querySelectorAll("script, iframe, object, embed");
    for (var j = 0; j < unsafe.length; j++) unsafe[j].remove();
    contentEl.innerHTML = parsed.body.innerHTML;
    contentEl.scrollTop = 0;
    history.replaceState(null, "", "#" + encodeURIComponent(doc.path));
  }

  function openDoc(doc) {
    if (typeof doc.content === "string") {
      showMarkdown(doc, doc.content);
      return;
    }
    if (!doc.contentUrl) {
      contentEl.textContent = "文書本文がありません";
      return;
    }
    contentEl.textContent = "読み込み中…";
    fetch(doc.contentUrl)
      .then(function (r) {
        if (!r.ok) throw new Error(String(r.status));
        return r.text();
      })
      .then(function (text) { showMarkdown(doc, text); })
      .catch(function () { contentEl.textContent = "読み込みに失敗しました"; });
  }

  function openFromHash() {
    var h = decodeURIComponent(location.hash.slice(1));
    var doc = DOCS.filter(function (d) { return d.path === h; })[0];
    if (doc) openDoc(doc);
  }

  filterEl.addEventListener("input", function () { renderNav(filterEl.value); });
  window.addEventListener("hashchange", openFromHash);

  var THEME_KEY = "oimo-docs-theme";
  var rootEl = document.documentElement;
  var themeBtn = document.getElementById("theme-toggle");
  function applyTheme(t) {
    rootEl.dataset.theme = t;
    themeBtn.textContent = t === "dark" ? "☀" : "☾";
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  var saved;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(saved || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  themeBtn.addEventListener("click", function () {
    applyTheme(rootEl.dataset.theme === "dark" ? "light" : "dark");
  });

  renderNav("");
  openFromHash();
})();
</script>
</body>
</html>
