ia une notification d'inbox à sa fin.\n- Un enfant est un peer, pas un subagent intra-session — vous pouvez vous **attacher entièrement** à n'importe quelle session enfant pour la consulter/reprendre, comme `mimo -c \u003cid>`.\n\n## 3. L'outil `session` (la capacité centrale de l'Orchestrator)\n\nSeul le mode Orchestrator peut voir et appeler l'outil `session` (protégé par nom d'agent + par le drapeau). Il offre les formes d'appel JSON et shell (la syntaxe exacte est donnée par la description de l'outil). Huit verbes au total :\n\n| verbe | rôle | paramètres clés |\n|---|---|---|\n| `create` | distribuer une nouvelle session enfant en arrière-plan | `task` (tâche du premier tour, requis) ; optionnel `mode` (build\\|plan\\|compose, défaut build), `model`, `title`, `dir` (répertoire où tourne l'enfant — tout projet/chemin, défaut : celui de l'Orchestrator), `isolate` (tourner dans un git worktree dédié de `dir` pour éviter les conflits d'écriture concurrents) |\n| `switch` | déplacer le panneau frontal vers une session | `sessionID` (résoudre d'abord le langage naturel en id via `list`, puis switch) |\n| `list` | lister les sessions enfants de cet Orchestrator (id / title / mode / status) | — |\n| `cancel` | arrêter un enfant devenu inutile ; s'il était `--isolate`, supprimer aussi son worktree et sa branche | `sessionID` |\n| `ask` | poser à une session une question latérale **en lecture seule, ponctuelle** (répondue depuis un instantané figé de son historique, sans interrompre son exécution) | `session_id` + `question` |\n| `setmode` | changer le mode sous lequel un enfant tourne pour ses **tours suivants** (ex. un enfant plan, une fois la planification finie, passe à build pour exécuter dans la **même session**, sans nouvelle session) | `sessionID` + `mode` (build\\|plan\\|compose) |\n| `approve` | approuver la requête de permission **actuellement en attente** d'un enfant (voir §4) | `sessionID` |\n| `grant-approval` | pré-autoriser : approuver automatiquement les futures requêtes de permission (sans demander à chaque fois) | `target` (le sessionID d'un enfant, ou `all` pour tous les enfants) |\n\nImplémentation : `packages/opencode/src/tool/session.ts` (liste des verbes `KNOWN_VERBS`).\n\n### 3.1 Répertoire et isolation (`--dir` / `--isolate`)\n\nL'Orchestrator est un coordinateur **généraliste** pouvant travailler à travers différents projets ; le répertoire et l'isolation de chaque enfant sont donc **décidés par tâche**, sans présumer du projet courant :\n\n- `dir` — le répertoire où tourne l'enfant. Pointez-le vers le projet/sous-projet/répertoire de travail auquel appartient la tâche ; omettez-le pour utiliser celui de l'Orchestrator.\n- `isolate` — activé, l'enfant tourne dans **son propre git worktree** du dépôt de `dir` (branche `mimocode/\u003ctâche>`), afin que plusieurs enfants éditant le même dépôt n'entrent pas en collision entre eux ni avec l'Orchestrator. À utiliser pour « va éditer des fichiers, possiblement en concurrence » ; laissez désactivé pour le lecture seule/écrivain unique, ou un `dir` non-git (qui bascule alors sur une exécution directe dans `dir`).\n\nLe worktree est créé/supprimé dans l'Instance du dépôt de `dir` (correct entre projets) ; un worktree enfant se trouve à `\u003cdata>/worktree/\u003cprojID>/\u003ctask-slug>`, sur la branche `mimocode/\u003ctask-slug>`.\n\n### 3.2 Intégration et nettoyage\n\n- Les commits d'un enfant isolé vivent sur sa propre branche `mimocode/\u003c...>`. L'Orchestrator les intègre lui-même avec git (il a `bash`) : `git log \u003cbranch>` / `git diff \u003cbase>...\u003cbranch>` / `git merge-tree` pour prévisualiser les conflits → `git merge \u003cbranch>` (ou cherry-pick). Trouvez la branche d'un enfant via `git worktree list` / `git branch --list 'mimocode/*'`.\n- **Ne `cancel` un enfant isolé qu'une fois son travail fusionné, ou la tâche abandonnée** — `cancel` supprime le worktree et la branche, donc le faire sur du travail **non fusionné** perd ce travail définitivement. Ne `cancel` pas un enfant simplement parce qu'il a « fini » (finir produit des commits sur sa branche encore à fusionner).\n\n### 3.3 Cycle de vie (no-poll / interrupt / resume)\n\n- **Pas de polling** : `create` revient immédiatement, l'enfant tourne en arrière-plan, et un message dans l'inbox réveille l'Orchestrator à sa fin. Après la distribution, revenez / répondez à l'utilisateur / terminez le tour — ne bouclez pas sur `list`/statut en gaspillant des tours.\n- **Interruption** : interrompre l'Orchestrator n'**arrête pas** ses enfants — ils continuent en arrière-plan et notifient à la fin. Pour arrêter un enfant précis, `session cancel \u003cid>`. Quand toute la session se termine, tous les enfants se terminent avec elle.\n- **Tout reprendre** : `session list` énumère les enfants ; pour tout enfant dont le dernier résultat n'était pas un succès (annulé/échoué/jamais rapporté) ou qui a encore des tâches ouvertes, transférez-lui un message via l'action send de `actor` pour continuer. Pas de commande resume dédiée — pilotez la reprise avec list + relais.\n\n## 4. Routage d'approbation des permissions des sessions enfants\n\n**Problème** : un enfant en arrière-plan n'a pas de panneau interactif face à l'utilisateur. Par défaut, une session en arrière-plan qui atteint une porte de permission nécessitant un `ask` (ex. accéder à un répertoire hors de son espace de travail, lire `.env`) est **refusée d'emblée** (`interactive:false` → `DeniedError`) — l'utilisateur ne la voit pas et ne peut pas l'approuver.\n\nUn enfant d'Orchestrator a bien un chemin vers un humain — sa session parente et l'utilisateur regardant la TUI. Donc pour un **enfant peer d'Orchestrator**, un `ask` de permission est **transféré pour approbation** plutôt que refusé en silence :\n\n- **Décision** : `decideAskRouting` (`src/agent/config.ts`) se divise en trois : agents système (checkpoint-writer/dream/distill) → toujours auto-refus ; **peer d'Orchestrator** (background + `mode:peer` + a un parent) → transféré pour approbation ; autre arrière-plan (subagents compose, etc.) → toujours auto-refus.\n- **Qui approuve** : une requête transférée peut être résolue par (a) l'**utilisateur directement** (basculer dans l'enfant, via l'UI de permission par session habituelle), ou (b) l'**Orchestrator en votre nom** — quand il détient une autorisation déléguée correspondante.\n- **Autorisations déléguées** :\n  - `session grant-approval \u003cchildSessionID>` — pré-autoriser les futurs asks d'un enfant donné à passer automatiquement ;\n  - `session grant-approval all` — pré-autoriser **tous** les enfants de cet Orchestrator ;\n  - `session approve \u003cchildSessionID>` — approuver ponctuellement la requête actuellement en attente de l'enfant.\n- **Déduplication** : il n'existe qu'une seule copie de chaque requête de permission. Le chemin utilisateur direct (`Permission.reply`) et le chemin Orchestrator (`session approve`) convergent sur le même Deferred ; le second est un no-op idempotent. Dès que l'un approuve, la copie transférée de l'Orchestrator est abandonnée — pas de double traitement, pas de requête périmée.\n- **Ne bloque jamais** : un ask transféré auquel personne ne répond est **auto-refusé** après `FORWARD_DENY_TIMEOUT_MS` (5 minutes, `src/permission/index.ts`), préservant la garantie « ne bloque jamais » de l'auto-refus d'origine ; l'abortSignal peut l'annuler à tout moment.\n- **Notifications** : enregistrer une requête transférée **réveille l'Orchestrator** (note d'inbox avec l'id de l'enfant et comment approuver) et affiche un toast pour l'utilisateur ; la **fin** d'un enfant affiche aussi un toast pour l'utilisateur (pas seulement pour l'Orchestrator).\n\n## 5. L'espace de travail Orchestrator globalement unique\n\nLe mode Orchestrator utilise un **répertoire de travail global fixe** (`\u003cdata>/orchestrator`, via `orchestratorDir()` dans `src/global/index.ts`) :\n\n- Peu importe le répertoire depuis lequel vous lancez MiMoCode, **basculer en mode Orchestrator** bascule le répertoire de travail de la TUI vers ce répertoire global et atterrit sur l'**unique** session Orchestrator racine (find-or-create).\n- C'est donc toujours la même session Orchestrator quel que soit le point de lancement — les sessions enfants créées auparavant sont toujours visibles et accessibles. Sinon, un lancement depuis des répertoires différents donnerait des sessions Orchestrator différentes, et vous ne retrouveriez pas les enfants créés avant.\n\nLe basculement réutilise la séquence de la boîte de dialogue worktree : `instance.dispose → switchDirectory → sync.bootstrap →` trouver/créer la session racine et naviguer. Le contrôle de confinement au cwd du serveur autorise ce répertoire global appartenant à l'app (uniquement quand la fonctionnalité est activée).\n\n## 6. Drapeau, désactivé par défaut\n\nUn unique drapeau protège toute la capacité, **désactivé par défaut**, opt-in explicite :\n\n```\nMIMOCODE_EXPERIMENTAL_ORCHESTRATOR: MIMOCODE_EXPERIMENTAL || truthy(\"MIMOCODE_EXPERIMENTAL_ORCHESTRATOR\")\n```\n\n- Défaut **OFF** ; mettez `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true` pour activer (le parapluie `MIMOCODE_EXPERIMENTAL=1` l'active aussi).\n- **Deux portes porteuses** font disparaître complètement la fonctionnalité désactivée :\n  1. **Enregistrement de l'agent** (`src/agent/agent.ts`) — l'agent orchestrator n'est enregistré que lorsque le drapeau est activé, via un spread conditionnel (comme pour le mode `max`). Désactivé, il n'est pas dans l'ensemble des agents, donc n'apparaît pas dans le cycle de modes de la TUI (Tab), la boîte de dialogue des agents, ni `defaultAgent`, et aucun peer ne peut être distribué.\n  2. **Enregistrement de l'outil** (`src/tool/registry.ts`) — l'outil `session` n'est enregistré que lorsque le drapeau est activé. Désactivé, aucun agent ne peut l'obtenir.\n- **Défense en profondeur** (code mort une fois désactivé, mais explicite) : l'effet de changement de répertoire à l'entrée Orchestrator de la TUI fait un early-return quand désactivé ; l'exception de répertoire global du middleware serveur ne s'applique que quand activé ; `decideAskRouting` avec `orchestratorEnabled:false` retombe sur l'auto-refus pour les peers.\n\nLe drapeau est évalué une fois à l'import (lit `process.env`). Les tests le mettent à `true` tôt dans `test/preload.ts` (les suites Orchestrator exercent la fonctionnalité).\n\n## 7. Démarrage rapide\n\n1. Activez la fonctionnalité : `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true` (ou `MIMOCODE_EXPERIMENTAL=1`).\n2. Lancez MiMoCode et appuyez sur **Tab** pour cycler jusqu'au mode **Orchestrator** — le répertoire de travail bascule automatiquement vers l'espace de travail Orchestrator global et atterrit sur l'unique session Orchestrator.\n3. Confiez-lui du travail, ex. : *« Crée un enfant en mode build pour ajouter une page de connexion à repo1, dir réglé sur /path/to/repo1, avec isolate activé ; et un enfant compose pour concevoir le schéma de facturation dans repo2. »*\n4. Utilisez `/sessions` (ou faites faire `session list` à l'Orchestrator) pour voir les enfants étiquetés `↳` ; sélectionnez-en un pour vous y attacher entièrement afin de consulter/reprendre, et revenez avec le raccourci session-parent.\n5. La fin d'un enfant réveille l'Orchestrator et vous affiche un toast ; les opérations nécessitant une approbation vous sont transférées (ou auto-approuvées selon votre `grant-approval`).\n6. Une fois satisfait, faites fusionner/intégrer par l'Orchestrator la branche `mimocode/*` de chaque enfant isolé.\n\n## 8. Sources associées\n\n| Sujet | Emplacement |\n|---|---|\n| Définition de l'agent Orchestrator + porte du drapeau | `packages/opencode/src/agent/agent.ts` |\n| Prompt système Orchestrator (identité de délégateur) | `packages/opencode/src/session/prompt/orchestrator.txt` |\n| Outil `session` (8 verbes) | `packages/opencode/src/tool/session.ts` |\n| Enregistrement de l'outil + porte du drapeau | `packages/opencode/src/tool/registry.ts` |\n| Décision de routage d'approbation des permissions | `packages/opencode/src/agent/config.ts` (`decideAskRouting`) |\n| Ref de transfert/autorisation + déduplication | `packages/opencode/src/permission/permission-forward-ref.ts`, `src/permission/index.ts` |\n| Espace de travail Orchestrator global | `packages/opencode/src/global/index.ts` (`orchestratorDir`), `src/cli/cmd/tui/app.tsx` |\n| Définition du drapeau | `packages/opencode/src/flag/flag.ts` (`MIMOCODE_EXPERIMENTAL_ORCHESTRATOR`) |\n"},{"path":"harness/MiMo Orchestrator Mode.ja.md","title":"MiMo Orchestrator Mode","group":"harness","content":"# MiMo Orchestrator Mode\n\n**一言で**：「調整役（コーディネーター）」のプライマリモード。**単一ウィンドウ・単一セッション・純粋な自然言語**ですべてのタスクを管理する。作業を子セッション（child session）に委譲し、自身は調整・統合・報告を担うことで、複数のウィンドウ／セッションを行き来する必要をなくす（実験的機能、デフォルト無効）。\n\n## 1. 背景と目的\n\n複数の作業を同時に進めようとすると、通常は端末ウィンドウを複数開き、それぞれでコーディングセッションを走らせ、絶えず切り替えることになる——どれが終わったか、どれが承認待ちで止まっているか、どれに次の指示を出すか。本当の負担はマシンの計算力ではなく、**あなたの注意力とエネルギー**だ。コンテキストがウィンドウ間を往復し、人が「多重化」で消耗する。\n\nOrchestrator モードが解決するのはまさにこの問題だ：**ひとつのウィンドウ、ひとつのセッション、純粋な自然言語ですべてのタスクを管理できるようにする**。目標を自然言語で Orchestrator に渡せば、作業を分解し、割り当て、進捗を見張り、判断が必要なときはあなたに戻り、完了したら要約する——あなたは終始同じ会話の中にいて、ウィンドウ間を飛び回らない。\n\nそのために Orchestrator は「**リーダー／マネージャー**」の役割を担う：\n\n- あなたの目標を**成果物単位に分解**（decomposition）し、\n- 各単位に**子セッションを割り当て**（child session。自身の mode・model・タスクパネル・メモリで動く）、\n- そのうえで**調整・統合（git マージ）・報告**を行う。\n\n通常のコーディングモード（build / plan / compose）は「実行者」：ひとつのディレクトリで自らコードを読み書きしコマンドを走らせる——並行して複数を進めるにはウィンドウを複数開く必要がある。Orchestrator は「管理者」：並行する複数の子セッションはバックグラウンドで走り、あなたが向き合うのは常に**この一つ**の調整セッションだ。\n\n**中核の境界**：Orchestrator は**実質的な作業を自分では行わない**——コードを書かず、具体的な実装計画も、品質レビューもしない。それらはすべて委譲する：計画が要る単位は `plan`（あるいは `compose`。そのワークフローに plan/review フェーズが内蔵されている）へ、コードは `build` へ。「委譲単位への分解」がその仕事であり、「ある単位をどう実装するか」と「結果のレビュー」は委譲する仕事だ。\n\n**デフォルト無効**：機能全体は単一のフラグ `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR` で制御される（§6 参照）。無効時、MiMoCode は従来どおり——Orchestrator モードも、`session` ツールも、承認ルーティングも、ワークスペース切替もない。\n\n## 2. 全体モデル\n\n```\nユーザーの目標\n   │  分解（decomposition）\n   ▼\nOrchestrator セッション（グローバルに一意、§5 参照）\n   │  session create ──► child A (build,  dir=repo1, --isolate)  ┐\n   │  session create ──► child B (plan,   dir=repo2)             │  バックグラウンドで並行\n   │  session create ──► child C (compose,dir=repo1, --isolate)  ┘\n   │\n   │  子が完了 → actor_notification が inbox に戻る → Orchestrator を起こす\n   ▼\n調整 / 統合（各 child の mimocode/* ブランチを git merge）/ ユーザーへ報告\n```\n\n- 各 child は**独立したセッション**（固有の session id・タスクパネル・メモリを持つ）で、`mode: \"peer\"` として**バックグラウンド**で動く。\n- Orchestrator は割り当て後**即座に戻り**、ポーリングしない。child は完了時に inbox 通知で**能動的に起こす**。\n- child は peer であり、セッション内 subagent ではない——`mimo -c \u003cid>` と同様に、任意の child セッションへ**完全に attach** して閲覧／引き継ぎができる。\n\n## 3. `session` ツール（Orchestrator の中核能力）\n\n`session` ツールを見て呼べるのは Orchestrator モードだけ（エージェント名による制御＋フラグ制御）。JSON と shell の両形態で呼べる（具体的な構文はツール説明が示す）。verb は 8 つ：\n\n| verb | 役割 | 主なパラメータ |\n|---|---|---|\n| `create` | 新しい子セッションをバックグラウンドで割り当てる | `task`（初回タスク、必須）；任意で `mode`（build\\|plan\\|compose、既定 build）・`model`・`title`・`dir`（child が動くディレクトリ。任意のプロジェクト／パス、既定は Orchestrator 自身のディレクトリ）・`isolate`（`dir` のリポジトリ内の専用 git worktree で走らせ、並行書き込み衝突を避ける） |\n| `switch` | フロントのパネルをあるセッションに切り替える | `sessionID`（まず `list` で自然言語を id に解決してから switch） |\n| `list` | この Orchestrator の全子セッションを列挙（id / title / mode / status） | — |\n| `cancel` | 不要になった子を停止；`--isolate` 済みなら worktree とブランチも削除 | `sessionID` |\n| `ask` | あるセッションに**読み取り専用・一回限り**の傍流質問（履歴の凍結スナップショットから回答、実行は中断しない） | `session_id` + `question` |\n| `setmode` | 子の**以降のターン**が動く mode を変更（例：plan の子が計画後 build に切り替え、**同じセッション**で実行。新規セッション不要） | `sessionID` + `mode`（build\\|plan\\|compose） |\n| `approve` | 子の**現在保留中**の権限リクエストを承認（§4 参照） | `sessionID` |\n| `grant-approval` | 事前承認：以降の権限リクエストを自動承認（毎回聞かない） | `target`（ある child の sessionID、または全子を表す `all`） |\n\n実装：`packages/opencode/src/tool/session.ts`（verb 一覧 `KNOWN_VERBS`）。\n\n### 3.1 ディレクトリと隔離（`--dir` / `--isolate`）\n\nOrchestrator は**汎用**の調整役で、異なるプロジェクトをまたいで作業できる。よって各 child のディレクトリと隔離は**タスクごとに決める**——現在のプロジェクトを前提にしない：\n\n- `dir` —— child が動くディレクトリ。タスクが属するプロジェクト／サブプロジェクト／作業用ディレクトリを指す。省略すれば Orchestrator 自身のディレクトリ。\n- `isolate` —— 有効時、child は `dir` のリポジトリ内の**専用 git worktree**（ブランチ `mimocode/\u003ctask>`）で走る。これにより複数の child が同じリポジトリを編集しても互いに、また Orchestrator と衝突しない。「ファイルを編集し、並行の可能性がある」場面向け。読み取り専用／単一書き込み、あるいは非 git ディレクトリでは無効に（非 git 時は `dir` で直接走るよう自動フォールバック）。\n\nworktree は `dir` のリポジトリ自身の Instance 上で作成／削除される（プロジェクト横断で正しい）。child worktree は `\u003cdata>/worktree/\u003cprojID>/\u003ctask-slug>` に置かれ、ブランチは `mimocode/\u003ctask-slug>`。\n\n### 3.2 統合とクリーンアップ\n\n- isolated child のコミットは自身の `mimocode/\u003c...>` ブランチ上にある。Orchestrator が自ら git で統合する（`bash` を持つ）：`git log \u003cbranch>` / `git diff \u003cbase>...\u003cbranch>` / `git merge-tree` で衝突を予見 → `git merge \u003cbranch>`（または cherry-pick）。child のブランチは `git worktree list` / `git branch --list 'mimocode/*'` で探す。\n- **作業がマージ済み、またはタスク放棄後にのみ** isolated child を `cancel` する——`cancel` は worktree とブランチを削除するので、**未マージ**の作業に対して行うとその作業を永久に失う。child が「完了した」からといって `cancel` してはいけない（完了はブランチ上のマージ待ちコミットを生む）。\n\n### 3.3 ライフサイクル（no-poll / interrupt / resume）\n\n- **ポーリングしない**：`create` は即座に戻り、child はバックグラウンドで走り、完了時に inbox へのメッセージが Orchestrator を起こす。割り当て後は戻る／ユーザーに答える／ターンを終える——`list`／状態確認をループしてターンを浪費しない。\n- **中断**：Orchestrator を中断しても child は**止まらない**——バックグラウンドで走り続け、完了時に通知する。特定の child を止めるには `session cancel \u003cid>`。セッション全体が終了するとすべての child も終了する。\n- **全再開**：`session list` で子を列挙し、最後の結果が成功でない（取消／失敗／未報告）か未完了タスクが残る child には、`actor` の send でメッセージを転送して続行させる。専用の resume コマンドはない——list ＋ リレーで駆動する。\n\n## 4. 子セッションの権限承認ルーティング\n\n**問題**：バックグラウンドで動く child にはユーザーに直接向き合う対話パネルがない。既定では、バックグラウンドセッションが「確認（ask）」を要する権限ゲート（ワークスペース外ディレクトリへのアクセス、`.env` の読み取りなど）に当たると**即座に拒否**される（`interactive:false` → `DeniedError`）——ユーザーには見えず、承認もできない。\n\nOrchestrator の child には人へ至る経路がある——その親セッションと TUI を見るユーザーだ。よって **Orchestrator の peer child** では、権限 `ask` は黙殺拒否せず**承認へ転送**される：\n\n- **判定**：`decideAskRouting`（`src/agent/config.ts`）は三分岐する：システムエージェント（checkpoint-writer/dream/distill）→ 従来どおり自動拒否；**Orchestrator peer**（background ＋ `mode:peer` ＋ 親あり）→ 承認へ転送；その他のバックグラウンド（compose の subagent 等）→ 従来どおり自動拒否。\n- **誰が承認するか**：転送されたリクエストは (a) **ユーザーが直接**（その child に切り替え、通常のセッション別権限 UI で）、または (b) **Orchestrator が代理で**——一致する委譲権限を持つとき——解決できる。\n- **委譲権限**：\n  - `session grant-approval \u003cchildSessionID>` —— ある child の以降の ask を自動通過に事前承認；\n  - `session grant-approval all` —— この Orchestrator の**すべての** child を事前承認；\n  - `session approve \u003cchildSessionID>` —— その child の現在保留中のリクエストを一回限り承認。\n- **重複排除**：各権限リクエストの実体は一つだけ。ユーザー直接（`Permission.reply`）と Orchestrator（`session approve`）はどちらも同じ Deferred に収束し、二回目は冪等な no-op。いずれかが承認すると Orchestrator の転送コピーは破棄される——二重処理も残留リクエストもない。\n- **ハングしない**：誰も応答しない転送 ask は `FORWARD_DENY_TIMEOUT_MS`（5 分、`src/permission/index.ts`）後に**自動拒否**され、元の自動拒否の「決してハングしない」保証を保つ。abortSignal はいつでも取り消せる。\n- **通知**：転送リクエストの記録時に **Orchestrator を起こし**（child id と承認方法を伴う inbox 通知）、ユーザーには toast を出す。child の**完了**時にもユーザーへ toast（Orchestrator への通知だけでない）。\n\n## 5. グローバルに一意な Orchestrator ワークスペース\n\nOrchestrator モードは**固定のグローバル作業ディレクトリ**（`\u003cdata>/orchestrator`、`src/global/index.ts` の `orchestratorDir()`）を使う：\n\n- どのディレクトリから MiMoCode を起動しても、**Orchestrator モードへ切り替える**と TUI の作業ディレクトリがこのグローバルディレクトリに切り替わり、そこにある**唯一の**ルート Orchestrator セッションに着地する（find-or-create）。\n- したがって、どこで起動しても常に同じ Orchestrator セッションになる——以前作った child セッションが常に見え、アクセスできる。さもなくば、異なるディレクトリでの起動が異なる Orchestrator セッションになり、以前作った子が見つからなくなる。\n\n切替は worktree ダイアログの手順を再利用する：`instance.dispose → switchDirectory → sync.bootstrap →` ルートセッションを探す／作って遷移。サーバーの cwd 包含チェックは、この app 所有のグローバルディレクトリを許可する（機能が有効なときのみ）。\n\n## 6. フラグ、デフォルト無効\n\n単一フラグが機能全体を制御し、**デフォルト無効**、明示的なオプトイン：\n\n```\nMIMOCODE_EXPERIMENTAL_ORCHESTRATOR: MIMOCODE_EXPERIMENTAL || truthy(\"MIMOCODE_EXPERIMENTAL_ORCHESTRATOR\")\n```\n\n- 既定 **OFF**；`MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true` で有効化（傘となる `MIMOCODE_EXPERIMENTAL=1` でも同時に有効になる）。\n- **二つの要となるゲート**が、無効時に機能を完全に消す：\n  1. **エージェント登録**（`src/agent/agent.ts`）—— orchestrator エージェントはフラグ有効時にのみ条件付き展開で登録される（`max` モードのやり方に合わせる）。無効時はエージェント集合に入らず、TUI のモード巡回（Tab）、エージェントダイアログ、`defaultAgent` に現れず、peer も割り当てられない。\n  2. **ツール登録**（`src/tool/registry.ts`）—— `session` ツールはフラグ有効時にのみ登録される。無効時はどのエージェントも取得できない。\n- **多層防御**（無効時はデッドコードだが明示的に）：TUI の Orchestrator 入場ディレクトリ切替 effect は無効時に早期 return；サーバーミドルウェアのグローバルディレクトリ例外は有効時のみ；`decideAskRouting` は `orchestratorEnabled:false` を受けると peer を自動拒否にフォールバックする。\n\nフラグは import 時に一度だけ評価される（`process.env` を読む）。テストでは `test/preload.ts` で早期に `true` に設定する（Orchestrator のテスト群が機能を行使するため）。\n\n## 7. クイックスタート\n\n1. 機能を有効化：`MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true`（または `MIMOCODE_EXPERIMENTAL=1`）。\n2. MiMoCode を起動し、**Tab** で **Orchestrator** モードに巡回する——作業ディレクトリは自動でグローバル Orchestrator ワークスペースに切り替わり、唯一の Orchestrator セッションに着地する。\n3. 作業を任せる。例：*「build モードの子を作り、repo1 にログインページを追加。dir は /path/to/repo1、isolate を有効に。さらに compose の子を作り repo2 の課金スキーマを設計。」*\n4. `/sessions`（または Orchestrator に `session list` させる）で `↳` 付きの子を確認；選べば完全に attach して閲覧／引き継ぎでき、session-parent キーバインドで戻れる。\n5. 子の完了は Orchestrator を起こしあなたに toast する；承認が要る操作はあなたに転送される（または `grant-approval` の授権により自動承認）。\n6. 満足したら、各 isolated child の `mimocode/*` ブランチを Orchestrator にマージ／統合させる。\n\n## 8. 関連ソース\n\n| 関心事 | 位置 |\n|---|---|\n| Orchestrator エージェント定義 + フラグゲート | `packages/opencode/src/agent/agent.ts` |\n| Orchestrator システムプロンプト（委譲者アイデンティティ） | `packages/opencode/src/session/prompt/orchestrator.txt` |\n| `session` ツール（8 verb） | `packages/opencode/src/tool/session.ts` |\n| ツール登録 + フラグゲート | `packages/opencode/src/tool/registry.ts` |\n| 権限承認ルーティング判定 | `packages/opencode/src/agent/config.ts`（`decideAskRouting`） |\n| 転送／授権 ref + 重複排除 | `packages/opencode/src/permission/permission-forward-ref.ts`、`src/permission/index.ts` |\n| グローバル Orchestrator ワークスペース | `packages/opencode/src/global/index.ts`（`orchestratorDir`）、`src/cli/cmd/tui/app.tsx` |\n| フラグ定義 | `packages/opencode/src/flag/flag.ts`（`MIMOCODE_EXPERIMENTAL_ORCHESTRATOR`） |\n"},{"path":"harness/MiMo Orchestrator Mode.md","title":"MiMo Orchestrator Mode","group":"harness","content":"# MiMo Orchestrator Mode\n\n**一句话总结**：一个\"调度者\"主模式——用**单一窗口、单一会话、纯自然语言**管理所有任务：把工作委派给子会话（child session），自己负责协调、集成与汇报，让你不必在多个窗口/会话间来回切换（实验功能，默认关闭）。\n\n## 1. 背景与目标\n\n当你要同时推进多件工作时，常见做法是开好几个终端窗口、每个跑一个编码会话，然后不停地在它们之间切来切去：盯哪个跑完了、哪个卡在等审批、哪个该给下一步指令。真正的负担不是机器算力，而是**你的注意力和精力**——上下文在窗口之间反复切换，人被\"多路复用\"拖垮。\n\nOrchestrator 模式要解决的正是这个问题：**让你只用一个窗口、一个会话，用纯自然语言就能管理全部任务**。你把目标用自然语言交给 Orchestrator，它替你把活拆开、派发、盯进度、需要你拍板时来找你、完成后汇总——你始终待在同一个对话里，不再在多个窗口间跳转。\n\n为此，Orchestrator 扮演一个\"**leader / manager**\"角色：\n\n- 把你的目标**拆分成可交付的工作单元**（decomposition），\n- 为每个单元**派发一个子会话**（child session，跑在自己的 mode、model、任务面板与记忆里），\n- 然后**协调、集成（git 合并）、汇报**。\n\n普通编码模式（build / plan / compose）是\"执行者\"：一个会话在一个目录里，自己读写代码、跑命令——要并行推进多件事，你就得开多个窗口。Orchestrator 是\"管理者\"：并行的多个子会话在后台跑，而你面对的始终是**这一个**协调会话。\n\n**核心边界**：Orchestrator 自己**不做实质工作**——不写代码、不做具体实现规划、不做质量评审。这些都委派出去：需要规划的单元派 `plan`（或 `compose`，其工作流内含 plan/review 阶段）；写代码派 `build`。\"拆分成派发单元\"是它的活；\"某个单元怎么实现\"和\"评审结果\"是它委派的活。\n\n**默认关闭**：整套能力由单一 flag `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR` 门控（见第 6 章）。关闭时 MiMoCode 与从前完全一致——没有 Orchestrator 模式、没有 `session` 工具、没有审批路由、没有工作区切换。\n\n## 2. 整体模型\n\n```\n用户目标\n   │  拆分（decomposition）\n   ▼\nOrchestrator 会话（全局唯一，见 §5）\n   │  session create ──► child A (build,  dir=repo1, --isolate)  ┐\n   │  session create ──► child B (plan,   dir=repo2)             │  后台并行\n   │  session create ──► child C (compose,dir=repo1, --isolate)  ┘\n   │\n   │  子会话完成 → actor_notification 回到 inbox → 唤醒 Orchestrator\n   ▼\n协调 / 集成（git merge 各 child 的 mimocode/* 分支）/ 汇报给用户\n```\n\n- 每个 child 是一个**独立会话**（有自己的 session id、任务面板、记忆），以 `mode: \"peer\"` 在**后台**运行。\n- Orchestrator 派发后**立即返回**，不轮询；child 完成时通过 inbox 通知**主动唤醒**它。\n- child 是 peer，不是 in-session 的 subagent —— 用户可以像 `mimo -c \u003cid>` 一样**完整 attach** 进任意 child 会话查看/接管。\n\n## 3. `session` 工具（Orchestrator 的核心能力）\n\n只有 Orchestrator 模式能看到并调用 `session` 工具（按 agent 名门控 + flag 门控）。它同时提供 JSON 与 shell 两种调用形态（由工具描述给出具体语法）。共 8 个 verb：\n\n| verb | 作用 | 关键参数 |\n|---|---|---|\n| `create` | 后台派发一个新的子会话 | `task`（首轮任务，必填）；可选 `mode`（build\\|plan\\|compose，默认 build）、`model`、`title`、`dir`（child 运行的目录，任意项目/路径，默认 Orchestrator 自己的目录）、`isolate`（在 `dir` 的仓库里开一个独立 git worktree 跑，避免并发写冲突） |\n| `switch` | 把前端面板切到某个会话 | `sessionID`（先 `list` 把自然语言解析成 id，再 switch） |\n| `list` | 列出本 Orchestrator 的所有子会话（id / title / mode / status） | — |\n| `cancel` | 停止一个不再需要的子会话；若曾 `--isolate` 会一并删除其 worktree 与分支 | `sessionID` |\n| `ask` | 对某会话发一次**只读、一次性**的旁路提问（基于其历史的冻结快照回答，不打断它的运行） | `session_id` + `question` |\n| `setmode` | 改变一个子会话**后续轮次**运行的 mode（如 plan child 规划完切成 build 在**同一会话**里执行，无需新开会话） | `sessionID` + `mode`（build\\|plan\\|compose） |\n| `approve` | 批准某个子会话**当前挂起**的权限请求（见 §4） | `sessionID` |\n| `grant-approval` | 预授权：让未来的权限请求自动批准（免每次询问） | `target`（某 child 的 sessionID，或 `all` 表示所有子会话） |\n\n实现见 `packages/opencode/src/tool/session.ts`（verb 列表 `KNOWN_VERBS`）。\n\n### 3.1 目录与隔离（`--dir` / `--isolate`）\n\nOrchestrator 是**通用**协调者，可跨不同项目干活，所以每个 child 的目录与隔离**按任务逐个决定**，不假设当前项目：\n\n- `dir` —— child 运行的目录。指向任务所属的项目/子项目/临时目录；省略则用 Orchestrator 自己的目录。\n- `isolate` —— 打开后，child 在 `dir` 所属仓库里跑在**它自己的 git worktree**（分支 `mimocode/\u003c任务>`），这样多个 child 编辑同一仓库时互不冲突、也不与 Orchestrator 冲突。适合\"会改文件、且可能并发\"的场景；只读/单写、或非 git 目录则关闭（非 git 时自动降级为直接在 `dir` 里跑）。\n\nworktree 在 `dir` 所属仓库自己的 Instance 上创建/删除（跨项目正确）；child worktree 位于 `\u003cdata>/worktree/\u003cprojID>/\u003ctask-slug>`，分支为 `mimocode/\u003ctask-slug>`。\n\n### 3.2 集成与清理\n\n- 一个 isolated child 的提交在它自己的 `mimocode/\u003c...>` 分支上。Orchestrator 自己用 git 集成（它有 `bash`）：`git log \u003cbranch>` / `git diff \u003cbase>...\u003cbranch>` / `git merge-tree` 预览冲突 → `git merge \u003cbranch>`（或 cherry-pick）。用 `git worktree list` / `git branch --list 'mimocode/*'` 找 child 分支。\n- **只在工作已合并、或任务被放弃后才 `cancel`** 一个 isolated child —— `cancel` 会删 worktree 和分支，对**未合并**的工作执行会永久丢失该工作。不要因为 child \"完成了\"就 cancel（完成产生的是它分支上待合并的提交）。\n\n### 3.3 生命周期（no-poll / interrupt / resume）\n\n- **不轮询**：`create` 立即返回，child 后台运行，完成时消息进入 inbox 唤醒 Orchestrator。派发后就返回、答复用户或结束本轮，不要循环 `list`/查状态空耗轮次。\n- **中断**：中断 Orchestrator **不会**停掉它的 child ——它们继续后台运行并在完成时通知。要停某个 child 用 `session cancel \u003cid>`。整个会话退出时所有 child 随之退出。\n- **恢复全部**：`session list` 枚举子会话，对\"最后结果不是成功（被取消/失败/从未汇报）或仍有未完成任务\"的 child，用 `actor` 的 send 转发一条消息让它继续。没有单独的 resume 命令——用 list + 转发驱动。\n\n## 4. 子会话权限审批路由\n\n**问题**：后台运行的 child 没有直接面对用户的交互面板。默认情况下，一个后台会话碰到\"需要询问（ask）\"的权限门（如访问工作区外的目录、读 `.env`）会被**直接拒绝**（`interactive:false` → `DeniedError`），用户看不到、也无从批准。\n\nOrchestrator 的 child 有一条通往人的路径——它的父会话与看 TUI 的用户。所以对 **Orchestrator peer child**，权限 `ask` 被**转发审批**而不是静默拒绝：\n\n- **决策**：`decideAskRouting`（`src/agent/config.ts`）三分：系统 agent（checkpoint-writer/dream/distill）→ 仍自动拒绝；**Orchestrator peer**（background + `mode:peer` + 有父会话）→ 转发审批；其他后台（compose 的 subagent 等）→ 仍自动拒绝。\n- **谁来批**：转发后的请求可由 (a) **用户直接批**（切进该 child，用普通的按会话权限 UI），或 (b) **Orchestrator 代批**——当它持有匹配的**委派授权**时。\n- **委派授权**：\n  - `session grant-approval \u003cchildSessionID>` —— 预授权某个 child 的未来 ask 自动通过；\n  - `session grant-approval all` —— 预授权本 Orchestrator 的**所有** child；\n  - `session approve \u003cchildSessionID>` —— 一次性批准该 child 当前挂起的那一个请求。\n- **去重**：同一个权限请求只有一份。用户直接批（`Permission.reply`）和 Orchestrator 批（`session approve`）都收敛到同一个 Deferred 上，第二次是幂等 no-op；任一方批准后，Orchestrator 那份转发副本自动丢弃——不会重复处理、不会残留过期请求。\n- **不会挂死**：转发的 ask 若无人应答，会在 `FORWARD_DENY_TIMEOUT_MS`（5 分钟，`src/permission/index.ts`）后**自动拒绝**，保留了原自动拒绝机制的\"永不挂起\"保证；abortSignal 仍可随时取消。\n- **通知**：产生转发请求时会**唤醒 Orchestrator**（inbox 通知，带 child id 与如何批准）并给用户弹一条 toast；child **完成**时也给用户 toast（不只是通知 Orchestrator）。\n\n## 5. 全局唯一的 Orchestrator 工作区\n\nOrchestrator 模式使用一个**固定的全局工作目录**（`\u003cdata>/orchestrator`，`src/global/index.ts` 的 `orchestratorDir()`）：\n\n- 无论从哪个目录启动 MiMoCode，**切到 Orchestrator 模式**都会把 TUI 的工作目录切到这个全局目录，并落到那里**唯一的**根 Orchestrator 会话（find-or-create）。\n- 因此不管在哪启动，永远是同一个 Orchestrator 会话——之前建过的 child 会话始终可见、可访问。否则在不同目录启动会得到不同的 Orchestrator 会话，用户就找不到之前创建的子会话了。\n\n切换序列复用 worktree 对话框的模式：`instance.dispose → switchDirectory → sync.bootstrap →` 找到/新建根会话并导航。服务器的目录 cwd 包含性校验对这个 app 自有的全局目录放行（仅在功能开启时）。\n\n## 6. Flag、默认关\n\n单一 flag 门控整套能力，**默认关闭**、显式 opt-in：\n\n```\nMIMOCODE_EXPERIMENTAL_ORCHESTRATOR: MIMOCODE_EXPERIMENTAL || truthy(\"MIMOCODE_EXPERIMENTAL_ORCHESTRATOR\")\n```\n\n- 默认 **OFF**；设 `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true` 开启（伞形 `MIMOCODE_EXPERIMENTAL=1` 也会一并开启）。\n- **两个承重门控**让功能在关闭时彻底消失：\n  1. **agent 注册**（`src/agent/agent.ts`）—— orchestrator agent 仅在 flag 开启时以条件展开注册（对齐 `max` 模式的写法）。关闭时它不进 agent 集合，因而不出现在 TUI 模式循环（Tab）、agent 对话框、`defaultAgent`，也无从派发 peer。\n  2. **工具注册**（`src/tool/registry.ts`）—— `session` 工具仅在 flag 开启时注册。关闭时任何 agent 都拿不到它。\n- **纵深防御**（关闭时本已是死代码，但显式加固）：TUI 的进入-Orchestrator 目录切换 effect 在 flag 关时提前返回；服务器中间件的全局目录例外仅在 flag 开时生效；`decideAskRouting` 收到 `orchestratorEnabled:false` 时 peer 回退为自动拒绝。\n\nFlag 在 import 时求值一次（读 `process.env`）。测试里在 `test/preload.ts` 提前置为 `true`（Orchestrator 测试套件需要功能开启）。\n\n## 7. 快速上手\n\n1. 开启功能：`MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true`（或 `MIMOCODE_EXPERIMENTAL=1`）。\n2. 启动 MiMoCode，按 **Tab** 循环到 **Orchestrator** 模式——工作目录会自动切到全局 Orchestrator 工作区，落到唯一的 Orchestrator 会话。\n3. 让它派活，例如：*\"创建一个 build 模式的子会话，任务是给 repo1 加登录页，目录设为 /path/to/repo1，启用 isolate；再创建一个 compose 子会话去 repo2 设计计费 schema。\"*\n4. 用 `/sessions`（或让 Orchestrator `session list`）查看带 `↳` 的子会话；选中即可完整 attach 进去查看/接管，用 session-parent 快捷键返回。\n5. 子会话完成会唤醒 Orchestrator 并给你 toast；需要审批的操作会转发给你（或按你的 `grant-approval` 授权自动批）。\n6. 满意后让 Orchestrator 把各 isolated child 的 `mimocode/*` 分支合并集成。\n\n## 8. 相关源码\n\n| 关注点 | 位置 |\n|---|---|\n| Orchestrator agent 定义 + flag 门控 | `packages/opencode/src/agent/agent.ts` |\n| Orchestrator 系统提示词（委派者身份） | `packages/opencode/src/session/prompt/orchestrator.txt` |\n| `session` 工具（8 个 verb） | `packages/opencode/src/tool/session.ts` |\n| 工具注册 + flag 门控 | `packages/opencode/src/tool/registry.ts` |\n| 权限审批路由决策 | `packages/opencode/src/agent/config.ts`（`decideAskRouting`） |\n| 转发/授权 ref + 去重 | `packages/opencode/src/permission/permission-forward-ref.ts`、`src/permission/index.ts` |\n| 全局 Orchestrator 工作区 | `packages/opencode/src/global/index.ts`（`orchestratorDir`）、`src/cli/cmd/tui/app.tsx` |\n| flag 定义 | `packages/opencode/src/flag/flag.ts`（`MIMOCODE_EXPERIMENTAL_ORCHESTRATOR`） |\n"},{"path":"harness/MiMo Orchestrator Mode.ru.md","title":"MiMo Orchestrator Mode","group":"harness","content":"# MiMo Orchestrator Mode\n\n**В одну строку**: основной режим-«координатор» — управляйте всеми задачами из **одного окна, одной сессии, на чистом естественном языке**: он делегирует работу дочерним сессиям (child session) и берёт на себя координацию, интеграцию и отчётность, чтобы вам не приходилось переключаться между несколькими окнами/сессиями (экспериментальная функция, по умолчанию выключена).\n\n## 1. Предпосылки и цели\n\nКогда вы одновременно продвигаете несколько задач, обычный подход — открыть несколько окон терминала, запустить в каждом сессию кодинга и затем постоянно между ними переключаться: следить, какая завершилась, какая застряла в ожидании одобрения, какой нужна следующая инструкция. Настоящая нагрузка — не вычислительная мощность, а **ваше внимание и энергия**: контекст мечется между окнами, и вы изматываете себя «мультиплексированием».\n\nИменно это решает режим Orchestrator: **позволить вам управлять всеми задачами из одного окна, одной сессии, на чистом естественном языке**. Вы передаёте цель Orchestrator на естественном языке, а он разбивает работу, распределяет её, следит за прогрессом, возвращается к вам, когда нужно решение, и подводит итог по завершении — вы всё время остаётесь в одном и том же диалоге, не прыгая между окнами.\n\nДля этого Orchestrator играет роль «**лидера / менеджера**»:\n\n- **декомпозирует** вашу цель на поставляемые единицы работы (decomposition),\n- **распределяет дочернюю сессию** на каждую единицу (работающую в своём mode, модели, панели задач и памяти),\n- затем **координирует, интегрирует (git merge) и отчитывается**.\n\nОбычные режимы кодинга (build / plan / compose) — «исполнители»: одна сессия в одном каталоге сама читает/пишет код и запускает команды — чтобы вести несколько дел параллельно, пришлось бы открыть несколько окон. Orchestrator — «менеджер»: параллельные дочерние сессии работают в фоне, а перед вами всегда **эта одна** координирующая сессия.\n\n**Ключевая граница**: Orchestrator **не делает существенной работы сам** — не пишет код, не занимается конкретным планированием реализации, не делает ревью качества. Всё это делегируется: единица, требующая планирования, идёт в `plan` (или `compose`, чей рабочий процесс содержит фазы plan/review); код — в `build`. «Декомпозиция на распределяемые единицы» — его работа; «как реализуется конкретная единица» и «ревью результата» — работа, которую он делегирует.\n\n**Выключено по умолчанию**: вся возможность закрыта единственным флагом `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR` (см. §6). При выключении MiMoCode ведёт себя как раньше — нет режима Orchestrator, нет инструмента `session`, нет маршрутизации одобрений, нет переключения рабочего пространства.\n\n## 2. Общая модель\n\n```\nцель пользователя\n   │  декомпозиция\n   ▼\nсессия Orchestrator (глобально единственная, см. §5)\n   │  session create ──► child A (build,  dir=repo1, --isolate)  ┐\n   │  session create ──► child B (plan,   dir=repo2)             │  параллельно, в фоне\n   │  session create ──► child C (compose,dir=repo1, --isolate)  ┘\n   │\n   │  дочерняя завершилась → actor_notification обратно в inbox → будит Orchestrator\n   ▼\nкоординировать / интегрировать (git merge ветку mimocode/* каждого дочернего) / отчитаться\n```\n\n- Каждый дочерний — **независимая сессия** (свой session id, панель задач, память), работающая в **фоне** с `mode: \"peer\"`.\n- Orchestrator **сразу возвращается** после распределения и не опрашивает; дочерний **активно будит** его уведомлением в inbox по завершении.\n- Дочерний — это peer, а не внутрисессионный subagent — вы можете **полностью подключиться** к любой дочерней сессии для просмотра/перехвата, как `mimo -c \u003cid>`.\n\n## 3. Инструмент `session` (ключевая возможность Orchestrator)\n\nВидеть и вызывать инструмент `session` может только режим Orchestrator (закрыт по имени агента + флагом). Он предлагает формы вызова JSON и shell (точный синтаксис задаётся описанием инструмента). Всего восемь глаголов:\n\n| глагол | назначение | ключевые параметры |\n|---|---|---|\n| `create` | распределить новую дочернюю сессию в фоне | `task` (задача первого хода, обязательно); опционально `mode` (build\\|plan\\|compose, по умолчанию build), `model`, `title`, `dir` (каталог, где работает дочерний — любой проект/путь, по умолчанию каталог Orchestrator), `isolate` (работать в выделенном git worktree каталога `dir`, чтобы избежать конфликтов конкурентной записи) |\n| `switch` | переместить панель фронтенда к сессии | `sessionID` (сначала разрешите естественный язык в id через `list`, затем switch) |\n| `list` | перечислить дочерние сессии этого Orchestrator (id / title / mode / status) | — |\n| `cancel` | остановить ненужного дочернего; если был `--isolate`, также удалить его worktree и ветку | `sessionID` |\n| `ask` | задать сессии **только для чтения, разовый** побочный вопрос (ответ из замороженного снимка её истории, не прерывая её выполнение) | `session_id` + `question` |\n| `setmode` | сменить mode, под которым дочерний работает на **последующих ходах** (например, plan-дочерний, закончив планирование, переходит в build для исполнения в **той же сессии**, без новой сессии) | `sessionID` + `mode` (build\\|plan\\|compose) |\n| `approve` | одобрить **текущий ожидающий** запрос разрешения дочернего (см. §4) | `sessionID` |\n| `grant-approval` | предварительно авторизовать: автоматически одобрять будущие запросы разрешений (без запроса каждый раз) | `target` (sessionID дочернего или `all` для всех дочерних) |\n\nРеализация: `packages/opencode/src/tool/session.ts` (список глаголов `KNOWN_VERBS`).\n\n### 3.1 Каталог и изоляция (`--dir` / `--isolate`)\n\nOrchestrator — **универсальный** координатор, способный работать через разные проекты, поэтому каталог и изоляция каждого дочернего **решаются для каждой задачи**, не предполагая текущий проект:\n\n- `dir` — каталог, где работает дочерний. Укажите проект/подпроект/рабочий каталог, к которому относится задача; опустите, чтобы использовать каталог Orchestrator.\n- `isolate` — при включении дочерний работает в **своём git worktree** репозитория `dir` (ветка `mimocode/\u003cзадача>`), чтобы несколько дочерних, редактирующих один репозиторий, не сталкивались друг с другом и с Orchestrator. Используйте для «будет редактировать файлы, возможно конкурентно»; оставьте выключенным для только-чтения/единственного писателя или не-git каталога (тогда происходит откат к прямому запуску в `dir`).\n\nWorktree создаётся/удаляется в Instance репозитория `dir` (корректно между проектами); дочерний worktree находится в `\u003cdata>/worktree/\u003cprojID>/\u003ctask-slug>`, на ветке `mimocode/\u003ctask-slug>`.\n\n### 3.2 Интеграция и очистка\n\n- Коммиты изолированного дочернего живут на его собственной ветке `mimocode/\u003c...>`. Orchestrator интегрирует их сам через git (у него есть `bash`): `git log \u003cbranch>` / `git diff \u003cbase>...\u003cbranch>` / `git merge-tree` для предпросмотра конфликтов → `git merge \u003cbranch>` (или cherry-pick). Найдите ветку дочернего через `git worktree list` / `git branch --list 'mimocode/*'`.\n- **`cancel` изолированного дочернего только после слияния его работы или отказа от задачи** — `cancel` удаляет worktree и ветку, поэтому его выполнение на **неслитой** работе безвозвратно теряет эту работу. Не `cancel` дочернего лишь потому, что он «завершился» (завершение порождает коммиты на его ветке, которые ещё нужно слить).\n\n### 3.3 Жизненный цикл (no-poll / interrupt / resume)\n\n- **Без опроса**: `create` возвращается сразу, дочерний работает в фоне, а сообщение в inbox будит Orchestrator по завершении. После распределения — вернитесь / ответьте пользователю / завершите ход — не зацикливайтесь на `list`/статусе, тратя ходы.\n- **Прерывание**: прерывание Orchestrator **не останавливает** его дочерних — они продолжают работать в фоне и уведомляют по завершении. Чтобы остановить конкретного дочернего — `session cancel \u003cid>`. Когда завершается вся сессия, все дочерние завершаются вместе с ней.\n- **Возобновить всё**: `session list` перечисляет дочерних; для любого дочернего, чей последний исход не был успехом (отменён/провален/не отчитался) или у которого остались открытые задачи, перешлите ему сообщение через действие send инструмента `actor`, чтобы он продолжил. Отдельной команды resume нет — управляйте возобновлением через list + ретрансляцию.\n\n## 4. Маршрутизация одобрения разрешений дочерних сессий\n\n**Проблема**: у фонового дочернего нет интерактивной панели, обращённой напрямую к пользователю. По умолчанию фоновая сессия, наткнувшись на ворота разрешения, требующие `ask` (например, доступ к каталогу вне своего рабочего пространства, чтение `.env`), **сразу отклоняется** (`interactive:false` → `DeniedError`) — пользователь этого не видит и не может одобрить.\n\nУ дочернего Orchestrator есть путь к человеку — его родительская сессия и пользователь, смотрящий TUI. Поэтому для **peer-дочернего Orchestrator** запрос разрешения `ask` **пересылается на одобрение**, а не молча отклоняется:\n\n- **Решение**: `decideAskRouting` (`src/agent/config.ts`) делится на три: системные агенты (checkpoint-writer/dream/distill) → по-прежнему авто-отказ; **peer Orchestrator** (background + `mode:peer` + есть родитель) → переслать на одобрение; прочий фон (subagent'ы compose и т.д.) → по-прежнему авто-отказ.\n- **Кто одобряет**: пересланный запрос может быть решён (a) **пользователем напрямую** (переключиться в дочернего, через обычный UI разрешений на сессию) или (b) **Orchestrator от вашего имени** — когда у него есть соответствующее делегированное разрешение.\n- **Делегированные разрешения**:\n  - `session grant-approval \u003cchildSessionID>` — предварительно авторизовать будущие asks данного дочернего проходить автоматически;\n  - `session grant-approval all` — предварительно авторизовать **всех** дочерних этого Orchestrator;\n  - `session approve \u003cchildSessionID>` — разово одобрить текущий ожидающий запрос дочернего.\n- **Дедупликация**: у каждого запроса разрешения есть лишь одна копия. И путь прямого пользователя (`Permission.reply`), и путь Orchestrator (`session approve`) сходятся на одном и том же Deferred; второй — идемпотентный no-op. Как только одна из сторон одобряет, пересланная копия Orchestrator отбрасывается — нет двойной обработки, нет устаревшего запроса.\n- **Никогда не зависает**: пересланный ask, на который никто не ответил, **авто-отклоняется** после `FORWARD_DENY_TIMEOUT_MS` (5 минут, `src/permission/index.ts`), сохраняя гарантию «никогда не зависает» исходного авто-отказа; abortSignal может отменить его в любой момент.\n- **Уведомления**: регистрация пересланного запроса **будит Orchestrator** (заметка в inbox с id дочернего и как одобрить) и показывает пользователю toast; **завершение** дочернего также показывает пользователю toast (не только уведомляет Orchestrator).\n\n## 5. Глобально единственное рабочее пространство Orchestrator\n\nРежим Orchestrator использует **фиксированный глобальный рабочий каталог** (`\u003cdata>/orchestrator`, через `orchestratorDir()` в `src/global/index.ts`):\n\n- Из какого бы каталога вы ни запускали MiMoCode, **переключение в режим Orchestrator** переключает рабочий каталог TUI на этот глобальный каталог и приземляется на **единственную** корневую сессию Orchestrator там (find-or-create).\n- Поэтому это всегда одна и та же сессия Orchestrator независимо от места запуска — созданные ранее дочерние сессии всегда видимы и доступны. Иначе запуск из разных каталогов давал бы разные сессии Orchestrator, и вы не нашли бы созданных ранее дочерних.\n\nПереключение переиспользует последовательность диалога worktree: `instance.dispose → switchDirectory → sync.bootstrap →` найти/создать корневую сессию и перейти. Проверка сервера на вхождение в cwd разрешает этот принадлежащий приложению глобальный каталог (только когда функция включена).\n\n## 6. Флаг, выключен по умолчанию\n\nЕдинственный флаг закрывает всю возможность, **выключен по умолчанию**, явный opt-in:\n\n```\nMIMOCODE_EXPERIMENTAL_ORCHESTRATOR: MIMOCODE_EXPERIMENTAL || truthy(\"MIMOCODE_EXPERIMENTAL_ORCHESTRATOR\")\n```\n\n- По умолчанию **OFF**; задайте `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true`, чтобы включить (зонтичный `MIMOCODE_EXPERIMENTAL=1` тоже включает).\n- **Двое несущих ворот** заставляют функцию полностью исчезнуть при выключении:\n  1. **Регистрация агента** (`src/agent/agent.ts`) — агент orchestrator регистрируется только при включённом флаге, через условный spread (как сделан режим `max`). При выключении его нет в наборе агентов, поэтому он не появляется в цикле режимов TUI (Tab), диалоге агентов или `defaultAgent`, и ни один peer не может быть распределён.\n  2. **Регистрация инструмента** (`src/tool/registry.ts`) — инструмент `session` регистрируется только при включённом флаге. При выключении ни один агент не может его получить.\n- **Глубокая защита** (мёртвый код при выключении, но явно): эффект переключения каталога при входе в Orchestrator в TUI делает ранний return при выключении; исключение глобального каталога в серверном middleware применяется только при включении; `decideAskRouting` при `orchestratorEnabled:false` откатывается к авто-отказу для peer'ов.\n\nФлаг вычисляется один раз при импорте (читает `process.env`). Тесты устанавливают его в `true` рано в `test/preload.ts` (наборы Orchestrator задействуют функцию).\n\n## 7. Быстрый старт\n\n1. Включите функцию: `MIMOCODE_EXPERIMENTAL_ORCHESTRATOR=true` (или `MIMOCODE_EXPERIMENTAL=1`).\n2. Запустите MiMoCode и нажимайте **Tab** для перехода в режим **Orchestrator** — рабочий каталог автоматически переключается на глобальное рабочее пространство Orchestrator и приземляется на единственную сессию Orchestrator.\n3. Поручите ему работу, например: *«Создай дочернего в режиме build, чтобы добавить страницу входа в repo1, dir установи в /path/to/repo1, с включённым isolate; и дочернего compose, чтобы спроектировать схему биллинга в repo2.»*\n4. Используйте `/sessions` (или попросите Orchestrator `session list`), чтобы увидеть дочерних с меткой `↳`; выберите одного, чтобы полностью подключиться для просмотра/перехвата, и вернитесь по горячей клавише session-parent.\n5. Завершение дочернего будит Orchestrator и показывает вам toast; операции, требующие одобрения, пересылаются вам (или авто-одобряются согласно вашему `grant-approval`).\n6. Когда вы довольны, поручите Orchestrator слить/интегрировать ветку `mimocode/*` каждого изолированного дочернего.\n\n## 8. Связанные исходники\n\n| Тема | Расположение |\n|---|---|\n| Определение агента Orchestrator + ворота флага | `packages/opencode/src/agent/agent.ts` |\n| Системный промпт Orchestrator (идентичность делегатора) | `packages/opencode/src/session/prompt/orchestrator.txt` |\n| Инструмент `session` (8 глаголов) | `packages/opencode/src/tool/session.ts` |\n| Регистрация инструмента + ворота флага | `packages/opencode/src/tool/registry.ts` |\n| Решение маршрутизации одобрения разрешений | `packages/opencode/src/agent/config.ts` (`decideAskRouting`) |\n| Ref пересылки/разрешения + дедупликация | `packages/opencode/src/permission/permission-forward-ref.ts`, `src/permission/index.ts` |\n| Глобальное рабочее пространство Orchestrator | `packages/opencode/src/global/index.ts` (`orchestratorDir`), `src/cli/cmd/tui/app.tsx` |\n| Определение флага | `packages/opencode/src/flag/flag.ts` (`MIMOCODE_EXPERIMENTAL_ORCHESTRATOR`) |\n"},{"path":"harness/MiMo Token Efficient Mode.en.md","title":"MiMo Token Efficient Mode","group":"harness","content":"# MiMo Token Efficient Mode\n\n**One-line summary**: Uses a generic regex filter pipeline + heuristic filter pipeline to strip redundant tokens from Bash output (experimental feature, disabled by default).\n\n## 1. Background & Goals\n\nThe bash tool's stdout/stderr are often \"blown up\" with the following noise:\n\n- ANSI color codes, OSC hyperlinks, DCS terminal control sequences\n\n- `\\r` progress bar multi-frame overlays\n\n- Accidentally printed API keys / JWTs / PEM certificates\n\n- Ultra-long lines like minified JS / single-line JSON\n\n- Useless info from pytest/go test/...\n\n**Core constraint**: Cleaning only targets the LLM view; TUI live preview and on-disk archives keep the raw bytes intact for human debugging.\n\n## 2. Overall Flow\n\nThe diagram below shows the end-to-end cleanup path for bash tool output from capture to delivery to the LLM. It integrates the generic filter pipeline (Chapter 3), heuristic filter pipeline (Chapter 4), and the three-way split constraints for inline / on-disk / TUI (Chapter 5).\n\nThe three core constraints and where they sit in the diagram:\n\n- **Clean inline only, not on-disk** — the two leftmost paths at the entrance split (disk archive / TUI preview) bypass the entire pipeline.\n\n- **Never-worse gate** — unified rollback at the pipeline tail: any stage that makes the output larger is discarded, falling back to the Raw path.\n\n- **Single flag, off by default** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` is the only switch that enters the cleanup pipeline, and it's disabled by default; otherwise output goes straight through Raw.\n\n\n\n\n## 3. Generic Filter Pipeline\n\n\n\n|**Layer**|**Responsibility**|**Key regex / algorithm**|**Ordering constraint**|\n|---|---|---|---|\n|clean_progress_pipeline|Per-line, collapse \\r progress bars, keep only the last frame|Split by lines, take the segment after the last \\r on each line|Must run before clean_ansi_pipeline|\n|clean_ansi_pipeline|Strip ANSI CSI/OSC/DCS, backspace overstrike, control bytes|4 ESC sequence regexes + control-byte character class|After progress, before downstream regexes|\n|clean_redact_pipeline|PEM, Bearer, JWT, AWS/GH/OpenAI/Anthropic/Slack keys|8 regex groups + cross-line PEM block whole-match replacement|Must run before dedup/truncation|\n|clean_longline_pipeline|Compress single lines over 500 chars to a 160-char head + elision hint|Per-line scan, length-threshold check|Placed last as a safety net|\n|never-worse gate|If cleanup didn't shrink bytes, roll back to original text|When bytesOut ≥ bytesIn, return the original text|Pipeline tail|\n\n### 3.1 Regex Quick Reference per Layer\n\nThe constants below correspond directly to the implementation in `packages/opencode/src/tool/bash_token_efficient.ts`. L1 / L4 are per-line scan algorithms with no standalone regex; L0 / L3 together define 14 regexes (4 ESC + 1 control byte + 1 cross-line PEM + 8 inline secrets).\n\n**L0 clean_ansi — 4 ESC regexes + 1 control-byte character class**\n\n```ts\nconst ANSI_CSI   = /\\x1b\\[[0-?]*[ -/]*[@-~]/g              // CSI sequence  ESC[ ... terminator\nconst ANSI_OSC   = /\\x1b\\][^\\x07\\x1b]*(?:\\x07|\\x1b\\\\)/g    // OSC sequence  ESC] ... BEL or ESC\\\nconst ANSI_DCS   = /\\x1b[PX^_][\\s\\S]*?\\x1b\\\\/g             // DCS/SOS/PM/APC cross-line sequence\nconst BACKSPACE  = /[^\\n]\\x08/g                            // Backspace overstrike  loop-replace until no matches\nconst CTRL_BYTES = /[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F]/g     // Control bytes  keep \\t \\n \\r\n```\n\n**L3 clean_redact — 1 cross-line PEM whole block + 8 inline secret patterns**\n\n```ts\n// Cross-line PEM block whole replacement → \u003credacted-pem-block>\nconst PEM_BLOCK = /-----BEGIN [A-Z ]+-----[\\s\\S]*?-----END [A-Z ]+-----/g\n\nconst REDACT_PATTERNS: Array\u003c[RegExp, string]> = [\n  // Bearer / Token \u003copaque>\n  [/\\b(Bearer|Token)\\s+[A-Za-z0-9._\\-+/=]{16,}/gi,                          \"$1 \u003credacted>\"],\n  // JWT  eyJ three base64url segments (each ≥10 chars)\n  [/\\beyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}/g,    \"\u003credacted-jwt>\"],\n  // AWS access key  AKIA / ASIA prefix + 16 uppercase alphanumeric\n  [/\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b/g,                                        \"\u003credacted-aws-key>\"],\n  // GitHub fine-grained / classic  gh[pousr]_ + ≥20 chars\n  [/\\bgh[pousr]_[A-Za-z0-9]{20,}\\b/g,                                       \"\u003credacted-gh-token>\"],\n  // OpenAI  sk- + ≥20 chars\n  [/\\bsk-[A-Za-z0-9_\\-]{20,}\\b/g,                                           \"\u003credacted-openai-key>\"],\n  // Anthropic  sk-ant- + ≥20 chars\n  [/\\bsk-ant-[A-Za-z0-9_\\-]{20,}\\b/g,                                       \"\u003credacted-anthropic-key>\"],\n  // Slack  xox[abprs]- + ≥10 chars\n  [/\\bxox[abprs]-[A-Za-z0-9\\-]{10,}\\b/g,                                    \"\u003credacted-slack-token>\"],\n  // Generic KEY=VALUE / \"key\": \"value\"  value ≥12 chars\n  [\n    /\\b((?:api|access|refresh|secret|client|auth)[_-]?(?:key|token|secret|password))(\\s*[:=]\\s*)[\"']?[A-Za-z0-9._\\-+/=]{12,}[\"']?/gi,\n    \"$1$2\u003credacted>\",\n  ],\n]\n```\n\n**L1 clean_progress — Per-line collapse of `\\r` progress bars**\n\n```ts\n// Algorithm  no standalone regex\ntext.split(\"\\n\").map(line => {\n  const stripped = line.endsWith(\"\\r\") ? line.slice(0, -1) : line\n  const idx = stripped.lastIndexOf(\"\\r\")\n  return idx === -1 ? stripped : stripped.slice(idx + 1)   // keep only the last frame\n}).join(\"\\n\")\n```\n\n**L4 clean_longline — Ultra-long single-line compression**\n\n```ts\nconst MAX_LINE_CHARS = 500\nconst LINE_HEAD_KEEP = 160\n\ntext.split(\"\\n\").map(line => {\n  if (line.length \u003c= MAX_LINE_CHARS) return line\n  return `${line.slice(0, LINE_HEAD_KEEP)}…\u003celided ${line.length - LINE_HEAD_KEEP} chars>`\n}).join(\"\\n\")\n```\n\n**never-worse gate — Pipeline-tail rollback**\n\n```ts\nconst bytesOut = Buffer.byteLength(out, \"utf-8\")\nif (bytesOut + NEVER_WORSE_MARGIN >= bytesIn) {\n  return { text, bytesIn, bytesOut: bytesIn, degraded: true }   // no savings  return original\n}\n```\n\n## 4. Heuristic Filter Pipeline\n\n### 4.1 Two-Channel Shape Detection\n\nWe can't rely on the command name alone (users often nest pipes: `bash -c \"cd x && pytest\"`), nor on the start of the output alone (the first 30 lines might be all ANSI noise). Two channels run in series:\n\n```ts\n// Command-name channel\nconst COMMAND_PATTERNS: Array\u003c[RegExp, ShapeID]> = [\n  [/^pytest(\\s|$)/,                \"pytest\"],\n  [/^(npm|pnpm|yarn)\\s+(install|i|add)/, \"npm\"],\n  [/^(make|cmake|automake)/,       \"make\"],\n  [/^git\\s+diff/,                  \"gitdiff\"],\n  [/^tsc(\\s|$)/,                   \"tsc\"],\n  [/^kubectl\\s+get\\s+pods?/,       \"kubectl\"],\n  [/^go\\s+test.*-json/,            \"gostest\"],\n  [/^gh\\s+(pr|issue)\\s+view/,      \"md\"],\n]\n\n// Content-fingerprint channel (fallback when command name doesn't match)\nconst BODY_FINGERPRINTS: Array\u003c[RegExp, ShapeID]> = [\n  [/^={5,}\\s+test session starts\\s+={5,}/m, \"pytest\"],\n  [/^diff --git /m,                          \"gitdiff\"],\n  [/^Traceback \\(most recent call last\\)/m,  \"stacktrace\"],\n  [/^\\s*at .+:\\d+:\\d+/m,                     \"stacktrace\"],\n  [/^error\\[E\\d+\\]:/m,                       \"stacktrace\"],\n]\n```\n\n### 4.2 Shape Strategy Quick Reference\n\n|**Command match**|**Core trimming rule**|**Expected reduction**|\n|---|---|---|\n|git diff / git show|Whole-block suppress by lockfile / min.js / dist path allowlist; single-hunk 100-line cap; append +added -removed at file tail|85%|\n|pytest|4-state machine Header → TestProgress → Failures → Summary, keep collected / E lines / file:line: / FAILED / short summary|90%|\n|npm/pnpm/yarn install|Fold consecutive \"npm warn deprecated\" into [×N deprecation warnings: top: A, B, C], keep added/vuln/funding summary|65%|\n|make / cmake / automake|Drop Entering/Leaving directory, bare compile commands, carets; keep file:line:col: error: and the note: below|53%|\n|Traceback / at ...:N:N / error[E...]|Fold site-packages / .venv / node_modules / stdlib frames; merge ≥2 consecutive into [N dependency frame(s) suppressed]|69%|\n|tsc|Group by error code Top-5 with one-line summary; group by file Top-8; keep 1 sample per group|80%|\n|kubectl get pods|Trailer suggests -o json; client-side only folds \"all Running/0 restart\" consecutive lines, doesn't rewrite columns|70%|\n|Output starting with { or [|Two modes: default trims embedding/raw_html/body/content/base64 large fields; schema-only mode infers keys plus types|95%|\n|gh pr view / gh issue view|Clean HTML comments, badge lines, pure image lines, decorative ---, extra blank lines|~50%|\n|go test ... -json|NDJSON stream aggregation: accumulate pass/fail/skip per pkg; on fail use accumulated output as cause|90%|\n\n### 4.2 Command-Level Passthrough\n\nLet output through unmodified when the user is already doing projection:\n\n- Command contains `--json` / `--format json` / `-o json` / `--no-color`\n\n- Command tail contains `| tee` / `| xxd` / `| hexdump`\n\n- Command contains `# nofilter` / `# raw` (already implemented)\n\n### 4.5 Extension Contract\n\nNew shapes just need to implement the `Shape { match, apply }` interface, no changes needed at the main entry point:\n\n```TypeScript\nexport interface Shape {\n  id: string\n  match: (command: string, head4k: string, tail4k: string) => boolean\n  apply: (body: string, ctx: { command: string }) => string\n}\n\nconst SHAPES = [S_gitdiff, S_pytest, S_npm, S_make, S_stacktrace,\n                S_tsc, S_kubectl, S_json, S_md, S_gostest]\n```\n\n\n\n## 5. Other Details\n\n**Clean inline only, not on-disk** — as soon as output reaches the truncation file (either early streaming overflow or the final `trunc.write(raw)`), cleanup is skipped. Disk archives preserve raw bytes for human grep; only inline output enters the cleanup pipeline, spending the byte savings on the most-frequently-read path.\n\n**TUI preview untouched** — `metadata.output` is the TUI live-preview field, kept as the raw streaming snapshot; only the final `output` goes through cleanup. This avoids cleanup side effects interfering with a human reading the original terminal output.\n\n**Single flag, off by default** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` is a standalone flag controlling the switch, off by default, not derived from `MIMOCODE_EXPERIMENTAL=1`. Explicit opt-in avoids silently changing the default output.\n\n"},{"path":"harness/MiMo Token Efficient Mode.fr.md","title":"MiMo Token Efficient Mode","group":"harness","content":"# MiMo Token Efficient Mode\n\n**Résumé en une phrase** : utilise un pipeline de filtrage par regex générique + un pipeline de filtrage heuristique pour retirer les tokens redondants de la sortie Bash (fonctionnalité expérimentale, désactivée par défaut).\n\n## 1. Contexte et objectifs\n\nLe stdout/stderr de l'outil bash sont souvent « saturés » par le bruit suivant :\n\n- Codes couleur ANSI, hyperliens OSC, séquences de contrôle terminal DCS\n\n- Superposition multi-frame des barres de progression `\\r`\n\n- Clés d'API / JWT / certificats PEM imprimés par erreur\n\n- Lignes ultra-longues comme JS minifié / JSON sur une seule ligne\n\n- Informations inutiles de pytest / go test / ...\n\n**Contrainte principale** : le nettoyage vise uniquement la vue LLM ; l'aperçu en direct du TUI et les archives sur disque conservent les octets bruts pour faciliter le debug humain.\n\n## 2. Flux global\n\nLe diagramme ci-dessous illustre le chemin de nettoyage de bout en bout de la sortie de l'outil bash, de la capture jusqu'à sa livraison au LLM. Il intègre le pipeline de filtrage générique (Chapitre 3), le pipeline de filtrage heuristique (Chapitre 4) et les contraintes de séparation en trois voies pour inline / disque / TUI (Chapitre 5).\n\nLes trois contraintes principales et leur position dans le diagramme :\n\n- **Nettoyer uniquement l'inline, pas le disque** — les deux voies les plus à gauche à l'entrée (archive disque / aperçu TUI) contournent entièrement le pipeline.\n\n- **Garde-fou never-worse** — rollback unifié en queue de pipeline : toute étape qui augmenterait la taille est rejetée, retour au chemin Raw.\n\n- **Un seul flag, désactivé par défaut** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` est le seul interrupteur pour entrer dans le pipeline de nettoyage, désactivé par défaut ; sinon la sortie passe directement en Raw.\n\n\n\n\n## 3. Pipeline de filtrage générique\n\n\n\n|**Couche**|**Rôle**|**Regex / algorithme clé**|**Contrainte d'ordre**|\n|---|---|---|---|\n|clean_progress_pipeline|Ligne par ligne, replie les barres de progression \\r, ne garde que la dernière frame|Découper par lignes, prendre le segment après le dernier \\r de chaque ligne|Doit s'exécuter avant clean_ansi_pipeline|\n|clean_ansi_pipeline|Retire ANSI CSI/OSC/DCS, backspace overstrike, octets de contrôle|4 regex de séquences ESC + classe de caractères pour octets de contrôle|Après progress, avant les regex suivantes|\n|clean_redact_pipeline|PEM, Bearer, JWT, clés AWS/GH/OpenAI/Anthropic/Slack|8 groupes de regex + substitution du bloc PEM multiligne|Doit s'exécuter avant la déduplication/troncature|\n|clean_longline_pipeline|Compresse les lignes uniques de plus de 500 caractères en un début de 160 caractères + indice d'élision|Balayage ligne par ligne, décision par seuil de longueur|En dernier, comme filet de sécurité|\n|garde never-worse|Si le nettoyage n'a pas réduit les octets, rollback vers le texte original|Si bytesOut ≥ bytesIn, retourne le texte original|Queue du pipeline|\n\n### 3.1 Aide-mémoire regex par couche\n\nLes constantes ci-dessous correspondent directement à l'implémentation dans `packages/opencode/src/tool/bash_token_efficient.ts`. L1 / L4 sont des algorithmes de balayage ligne par ligne sans regex isolée ; L0 / L3 définissent ensemble 14 regex (4 ESC + 1 octet de contrôle + 1 PEM multiligne + 8 secrets inline).\n\n**L0 clean_ansi — 4 regex ESC + 1 classe d'octets de contrôle**\n\n```ts\nconst ANSI_CSI   = /\\x1b\\[[0-?]*[ -/]*[@-~]/g              // séquence CSI  ESC[ ... terminateur\nconst ANSI_OSC   = /\\x1b\\][^\\x07\\x1b]*(?:\\x07|\\x1b\\\\)/g    // séquence OSC  ESC] ... BEL ou ESC\\\nconst ANSI_DCS   = /\\x1b[PX^_][\\s\\S]*?\\x1b\\\\/g             // séquence DCS/SOS/PM/APC multiligne\nconst BACKSPACE  = /[^\\n]\\x08/g                            // backspace overstrike  boucle de remplacement jusqu'à absence de match\nconst CTRL_BYTES = /[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F]/g     // octets de contrôle  conserve \\t \\n \\r\n```\n\n**L3 clean_redact — 1 bloc PEM multiligne + 8 patterns de secrets inline**\n\n```ts\n// Remplacement du bloc PEM multiligne → \u003credacted-pem-block>\nconst PEM_BLOCK = /-----BEGIN [A-Z ]+-----[\\s\\S]*?-----END [A-Z ]+-----/g\n\nconst REDACT_PATTERNS: Array\u003c[RegExp, string]> = [\n  // Bearer / Token \u003copaque>\n  [/\\b(Bearer|Token)\\s+[A-Za-z0-9._\\-+/=]{16,}/gi,                          \"$1 \u003credacted>\"],\n  // JWT  eyJ trois segments base64url (chacun ≥ 10 caractères)\n  [/\\beyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}/g,    \"\u003credacted-jwt>\"],\n  // Clé d'accès AWS  préfixe AKIA / ASIA + 16 alphanumériques majuscules\n  [/\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b/g,                                        \"\u003credacted-aws-key>\"],\n  // GitHub fine-grained / classic  gh[pousr]_ + ≥ 20 caractères\n  [/\\bgh[pousr]_[A-Za-z0-9]{20,}\\b/g,                                       \"\u003credacted-gh-token>\"],\n  // OpenAI  sk- + ≥ 20 caractères\n  [/\\bsk-[A-Za-z0-9_\\-]{20,}\\b/g,                                           \"\u003credacted-openai-key>\"],\n  // Anthropic  sk-ant- + ≥ 20 caractères\n  [/\\bsk-ant-[A-Za-z0-9_\\-]{20,}\\b/g,                                       \"\u003credacted-anthropic-key>\"],\n  // Slack  xox[abprs]- + ≥ 10 caractères\n  [/\\bxox[abprs]-[A-Za-z0-9\\-]{10,}\\b/g,                                    \"\u003credacted-slack-token>\"],\n  // KEY=VALUE / \"key\": \"value\" générique  valeur ≥ 12 caractères\n  [\n    /\\b((?:api|access|refresh|secret|client|auth)[_-]?(?:key|token|secret|password))(\\s*[:=]\\s*)[\"']?[A-Za-z0-9._\\-+/=]{12,}[\"']?/gi,\n    \"$1$2\u003credacted>\",\n  ],\n]\n```\n\n**L1 clean_progress — Repliement ligne par ligne des barres de progression `\\r`**\n\n```ts\n// Algorithme  pas de regex isolée\ntext.split(\"\\n\").map(line => {\n  const stripped = line.endsWith(\"\\r\") ? line.slice(0, -1) : line\n  const idx = stripped.lastIndexOf(\"\\r\")\n  return idx === -1 ? stripped : stripped.slice(idx + 1)   // ne garde que la dernière frame\n}).join(\"\\n\")\n```\n\n**L4 clean_longline — Compression des lignes ultra-longues**\n\n```ts\nconst MAX_LINE_CHARS = 500\nconst LINE_HEAD_KEEP = 160\n\ntext.split(\"\\n\").map(line => {\n  if (line.length \u003c= MAX_LINE_CHARS) return line\n  return `${line.slice(0, LINE_HEAD_KEEP)}…\u003celided ${line.length - LINE_HEAD_KEEP} chars>`\n}).join(\"\\n\")\n```\n\n**garde never-worse — Rollback en queue de pipeline**\n\n```ts\nconst bytesOut = Buffer.byteLength(out, \"utf-8\")\nif (bytesOut + NEVER_WORSE_MARGIN >= bytesIn) {\n  return { text, bytesIn, bytesOut: bytesIn, degraded: true }   // aucune économie  retourne l'original\n}\n```\n\n## 4. Pipeline de filtrage heuristique\n\n### 4.1 Détection de forme à deux canaux\n\nOn ne peut pas se fier uniquement au nom de la commande (les utilisateurs imbriquent souvent des pipes : `bash -c \"cd x && pytest\"`), ni uniquement au début de la sortie (les 30 premières lignes peuvent n'être que du bruit ANSI). Deux canaux exécutés en série :\n\n```ts\n// Canal nom-de-commande\nconst COMMAND_PATTERNS: Array\u003c[RegExp, ShapeID]> = [\n  [/^pytest(\\s|$)/,                \"pytest\"],\n  [/^(npm|pnpm|yarn)\\s+(install|i|add)/, \"npm\"],\n  [/^(make|cmake|automake)/,       \"make\"],\n  [/^git\\s+diff/,                  \"gitdiff\"],\n  [/^tsc(\\s|$)/,                   \"tsc\"],\n  [/^kubectl\\s+get\\s+pods?/,       \"kubectl\"],\n  [/^go\\s+test.*-json/,            \"gostest\"],\n  [/^gh\\s+(pr|issue)\\s+view/,      \"md\"],\n]\n\n// Canal empreinte-contenu (fallback quand le nom de commande ne matche pas)\nconst BODY_FINGERPRINTS: Array\u003c[RegExp, ShapeID]> = [\n  [/^={5,}\\s+test session starts\\s+={5,}/m, \"pytest\"],\n  [/^diff --git /m,                          \"gitdiff\"],\n  [/^Traceback \\(most recent call last\\)/m,  \"stacktrace\"],\n  [/^\\s*at .+:\\d+:\\d+/m,                     \"stacktrace\"],\n  [/^error\\[E\\d+\\]:/m,                       \"stacktrace\"],\n]\n```\n\n### 4.2 Aide-mémoire des stratégies par forme\n\n|**Commande détectée**|**Règle principale de trimming**|**Réduction attendue**|\n|---|---|---|\n|git diff / git show|Suppression complète des blocs par allowlist lockfile / min.js / chemins dist ; cap de 100 lignes par hunk ; append +added -removed en queue de fichier|85%|\n|pytest|Machine à 4 états Header → TestProgress → Failures → Summary, conserve collected / lignes E / file:line: / FAILED / short summary|90%|\n|npm/pnpm/yarn install|Replie les \"npm warn deprecated\" consécutifs en [×N deprecation warnings: top: A, B, C], conserve le résumé added/vuln/funding|65%|\n|make / cmake / automake|Supprime Entering/Leaving directory, commandes de compilation nues, carets ; conserve file:line:col: error: et le note: en dessous|53%|\n|Traceback / at ...:N:N / error[E...]|Replie les frames site-packages / .venv / node_modules / stdlib ; ≥ 2 consécutives fusionnées en [N dependency frame(s) suppressed]|69%|\n|tsc|Groupe par code d'erreur Top-5 en résumé une ligne ; groupe par fichier Top-8 ; garde 1 échantillon par groupe|80%|\n|kubectl get pods|Trailer suggère -o json ; côté client replie uniquement les lignes consécutives \"tous Running/0 restart\", ne réécrit pas les colonnes|70%|\n|Sortie commençant par { ou [|Deux modes : par défaut trim les champs volumineux embedding/raw_html/body/content/base64 ; mode schema-only infère les clés avec types|95%|\n|gh pr view / gh issue view|Nettoie commentaires HTML, lignes de badges, lignes image pure, --- décoratifs, lignes vides multiples|~50%|\n|go test ... -json|Agrégation flux NDJSON : accumule pass/fail/skip par pkg ; en cas de fail utilise la sortie accumulée comme cause|90%|\n\n### 4.2 Passthrough au niveau commande\n\nLaisse passer la sortie sans nettoyage quand l'utilisateur fait déjà de la projection :\n\n- La commande contient `--json` / `--format json` / `-o json` / `--no-color`\n\n- La queue de commande contient `| tee` / `| xxd` / `| hexdump`\n\n- La commande contient `# nofilter` / `# raw` (déjà implémenté)\n\n### 4.5 Contrat d'extension\n\nL'ajout d'une nouvelle forme nécessite juste l'implémentation de l'interface `Shape { match, apply }`, sans intrusion au point d'entrée principal :\n\n```TypeScript\nexport interface Shape {\n  id: string\n  match: (command: string, head4k: string, tail4k: string) => boolean\n  apply: (body: string, ctx: { command: string }) => string\n}\n\nconst SHAPES = [S_gitdiff, S_pytest, S_npm, S_make, S_stacktrace,\n                S_tsc, S_kubectl, S_json, S_md, S_gostest]\n```\n\n\n\n## 5. Autres détails\n\n**Nettoyage inline uniquement, pas sur disque** — dès que la sortie atteint le fichier de troncature (soit débordement précoce du flux, soit `trunc.write(raw)` final), le nettoyage est ignoré. Les archives disque préservent les octets bruts pour un grep humain ; seule la sortie inline entre dans le pipeline de nettoyage, dépensant les économies d'octets sur le chemin le plus lu.\n\n**Aperçu TUI intact** — `metadata.output` est le champ d'aperçu live du TUI, conservé comme snapshot streaming brut ; seul le `output` final passe par le nettoyage. Cela évite que les effets de bord du nettoyage n'interfèrent avec la lecture humaine de la sortie terminal originale.\n\n**Un seul flag, désactivé par défaut** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` est un flag autonome qui contrôle l'interrupteur, désactivé par défaut, non dérivé de `MIMOCODE_EXPERIMENTAL=1`. L'opt-in explicite évite de modifier silencieusement la sortie par défaut.\n\n"},{"path":"harness/MiMo Token Efficient Mode.ja.md","title":"MiMo Token Efficient Mode","group":"harness","content":"# MiMo Token Efficient Mode\n\n**一言まとめ**: 汎用正規表現フィルタパイプライン + ヒューリスティックフィルタパイプラインを使って Bash 出力の冗長トークンを除去する（実験機能、デフォルト無効）。\n\n## 1. 背景と目的\n\nbash ツールの stdout/stderr は、以下のノイズによってコンテキストが「膨れ上がる」ことがよくあります：\n\n- ANSI カラーコード、OSC ハイパーリンク、DCS 端末制御シーケンス\n\n- `\\r` プログレスバーの複数フレーム重ね書き\n\n- 誤って出力された API key / JWT / PEM 証明書\n\n- minified JS / 単一行 JSON などの超長行\n\n- pytest / go test / … などの無効情報\n\n**中心的な制約**: クリーンアップは LLM に対してのみ行う。TUI のリアルタイムプレビューとディスクへのアーカイブは、人手デバッグのために元のバイト列を保持する。\n\n## 2. 全体フロー\n\n以下の図は、bash ツール出力がキャプチャされてから LLM に届くまでのエンドツーエンドのクリーンアップ経路を示しています。汎用フィルタパイプライン（第 3 章）、ヒューリスティックフィルタパイプライン（第 4 章）、および inline / 落盤 / TUI の 3 経路分岐制約（第 5 章）を統合しています。\n\n図中における 3 つの中心的制約の位置：\n\n- **inline のみクリーン、ディスクは触らない** — 入口分岐の最も左側の 2 経路（ディスクアーカイブ / TUI プレビュー）はパイプライン全体をバイパスする。\n\n- **never-worse ガード** — パイプライン末尾で統一的にロールバック：いずれかの段階で出力が大きくなった場合は破棄し、Raw 経路に戻す。\n\n- **単一フラグ、デフォルト無効** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` がクリーンアップパイプラインに入る唯一のスイッチで、デフォルト無効。そうでなければ Raw で直通する。\n\n\n\n\n## 3. 汎用フィルタパイプライン\n\n\n\n|**レイヤー名**|**役割**|**主要な正規表現 / アルゴリズム**|**順序制約**|\n|---|---|---|---|\n|clean_progress_pipeline|行単位で \\r プログレスバーを折り畳み、最後のフレームのみ残す|行で分割し、各行の最後の \\r 以降のセグメントを取る|clean_ansi_pipeline より前に実行必須|\n|clean_ansi_pipeline|ANSI CSI/OSC/DCS、バックスペースの overstrike、制御バイトを除去|4 つの ESC シーケンス正規表現 + 制御バイト文字クラス|progress の後、下流の正規表現より前|\n|clean_redact_pipeline|PEM、Bearer、JWT、AWS/GH/OpenAI/Anthropic/Slack のキー|8 グループの正規表現 + 複数行 PEM ブロック全体置換|重複除去/切り詰めより前に必ず行う|\n|clean_longline_pipeline|500 文字を超える単一行を、先頭 160 文字 + 省略ヒントに圧縮|行スキャン、長さ閾値判定|セーフティネットとして最後に配置|\n|never-worse ガード|クリーンアップ後のバイト数が減っていなければ元テキストへロールバック|bytesOut ≥ bytesIn の場合、元 text を返す|パイプライン末尾|\n\n### 3.1 各レイヤーの正規表現クイックリファレンス\n\n以下の定数は `packages/opencode/src/tool/bash_token_efficient.ts` の実装に直接対応します。L1 / L4 は行スキャンアルゴリズムで単独の正規表現はありません。L0 / L3 で計 14 個の正規表現（4 個の ESC + 1 個の制御バイト + 1 個の複数行 PEM + 8 個の行内シークレット）を定義しています。\n\n**L0 clean_ansi — 4 つの ESC 正規表現 + 1 つの制御バイト文字クラス**\n\n```ts\nconst ANSI_CSI   = /\\x1b\\[[0-?]*[ -/]*[@-~]/g              // CSI シーケンス  ESC[ ... 終端子\nconst ANSI_OSC   = /\\x1b\\][^\\x07\\x1b]*(?:\\x07|\\x1b\\\\)/g    // OSC シーケンス  ESC] ... BEL または ESC\\\nconst ANSI_DCS   = /\\x1b[PX^_][\\s\\S]*?\\x1b\\\\/g             // DCS/SOS/PM/APC 複数行シーケンス\nconst BACKSPACE  = /[^\\n]\\x08/g                            // バックスペース overstrike  マッチがなくなるまでループ置換\nconst CTRL_BYTES = /[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F]/g     // 制御バイト  \\t \\n \\r は保持\n```\n\n**L3 clean_redact — 複数行 PEM ブロック全体 1 個 + 行内シークレット 8 個**\n\n```ts\n// 複数行 PEM ブロック全体置換 → \u003credacted-pem-block>\nconst PEM_BLOCK = /-----BEGIN [A-Z ]+-----[\\s\\S]*?-----END [A-Z ]+-----/g\n\nconst REDACT_PATTERNS: Array\u003c[RegExp, string]> = [\n  // Bearer / Token \u003copaque>\n  [/\\b(Bearer|Token)\\s+[A-Za-z0-9._\\-+/=]{16,}/gi,                          \"$1 \u003credacted>\"],\n  // JWT  eyJ に続く 3 つの base64url セグメント（各 ≥10 文字）\n  [/\\beyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}/g,    \"\u003credacted-jwt>\"],\n  // AWS アクセスキー  AKIA / ASIA プレフィックス + 16 個の大文字英数字\n  [/\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b/g,                                        \"\u003credacted-aws-key>\"],\n  // GitHub fine-grained / classic  gh[pousr]_ + 20 文字以上\n  [/\\bgh[pousr]_[A-Za-z0-9]{20,}\\b/g,                                       \"\u003credacted-gh-token>\"],\n  // OpenAI  sk- + 20 文字以上\n  [/\\bsk-[A-Za-z0-9_\\-]{20,}\\b/g,                                           \"\u003credacted-openai-key>\"],\n  // Anthropic  sk-ant- + 20 文字以上\n  [/\\bsk-ant-[A-Za-z0-9_\\-]{20,}\\b/g,                                       \"\u003credacted-anthropic-key>\"],\n  // Slack  xox[abprs]- + 10 文字以上\n  [/\\bxox[abprs]-[A-Za-z0-9\\-]{10,}\\b/g,                                    \"\u003credacted-slack-token>\"],\n  // 汎用 KEY=VALUE / \"key\": \"value\"  値 12 文字以上\n  [\n    /\\b((?:api|access|refresh|secret|client|auth)[_-]?(?:key|token|secret|password))(\\s*[:=]\\s*)[\"']?[A-Za-z0-9._\\-+/=]{12,}[\"']?/gi,\n    \"$1$2\u003credacted>\",\n  ],\n]\n```\n\n**L1 clean_progress — `\\r` プログレスバーを行単位で折り畳み**\n\n```ts\n// アルゴリズム  単独の正規表現なし\ntext.split(\"\\n\").map(line => {\n  const stripped = line.endsWith(\"\\r\") ? line.slice(0, -1) : line\n  const idx = stripped.lastIndexOf(\"\\r\")\n  return idx === -1 ? stripped : stripped.slice(idx + 1)   // 最後のフレームのみ残す\n}).join(\"\\n\")\n```\n\n**L4 clean_longline — 超長単一行の圧縮**\n\n```ts\nconst MAX_LINE_CHARS = 500\nconst LINE_HEAD_KEEP = 160\n\ntext.split(\"\\n\").map(line => {\n  if (line.length \u003c= MAX_LINE_CHARS) return line\n  return `${line.slice(0, LINE_HEAD_KEEP)}…\u003celided ${line.length - LINE_HEAD_KEEP} chars>`\n}).join(\"\\n\")\n```\n\n**never-worse ガード — パイプライン末尾でのロールバック**\n\n```ts\nconst bytesOut = Buffer.byteLength(out, \"utf-8\")\nif (bytesOut + NEVER_WORSE_MARGIN >= bytesIn) {\n  return { text, bytesIn, bytesOut: bytesIn, degraded: true }   // 削減できていない  元テキストを返す\n}\n```\n\n## 4. ヒューリスティックフィルタパイプライン\n\n### 4.1 二経路シェイプ判定\n\nコマンド名だけを見てはいけません（ユーザーはよくパイプをネストします：`bash -c \"cd x && pytest\"`）。出力の先頭だけ見てもいけません（最初の 30 行がすべて ANSI ノイズかもしれない）。2 つの経路を直列に実行します：\n\n```ts\n// コマンド名経路\nconst COMMAND_PATTERNS: Array\u003c[RegExp, ShapeID]> = [\n  [/^pytest(\\s|$)/,                \"pytest\"],\n  [/^(npm|pnpm|yarn)\\s+(install|i|add)/, \"npm\"],\n  [/^(make|cmake|automake)/,       \"make\"],\n  [/^git\\s+diff/,                  \"gitdiff\"],\n  [/^tsc(\\s|$)/,                   \"tsc\"],\n  [/^kubectl\\s+get\\s+pods?/,       \"kubectl\"],\n  [/^go\\s+test.*-json/,            \"gostest\"],\n  [/^gh\\s+(pr|issue)\\s+view/,      \"md\"],\n]\n\n// コンテンツ指紋経路（コマンド名がヒットしない場合のフォールバック）\nconst BODY_FINGERPRINTS: Array\u003c[RegExp, ShapeID]> = [\n  [/^={5,}\\s+test session starts\\s+={5,}/m, \"pytest\"],\n  [/^diff --git /m,                          \"gitdiff\"],\n  [/^Traceback \\(most recent call last\\)/m,  \"stacktrace\"],\n  [/^\\s*at .+:\\d+:\\d+/m,                     \"stacktrace\"],\n  [/^error\\[E\\d+\\]:/m,                       \"stacktrace\"],\n]\n```\n\n### 4.2 シェイプ戦略クイックリファレンス\n\n|**コマンドマッチ**|**主要トリミングルール**|**期待減量**|\n|---|---|---|\n|git diff / git show|lockfile / min.js / dist パスのホワイトリストで丸ごと抑制；ハンク単位で 100 行の上限；ファイル末尾に +added -removed を付加|85%|\n|pytest|4 状態のステートマシン Header → TestProgress → Failures → Summary、collected / E 行 / file:line: / FAILED / short summary を保持|90%|\n|npm/pnpm/yarn install|連続する npm warn deprecated を [×N deprecation warnings: top: A, B, C] にまとめ、added/vuln/funding のサマリーを保持|65%|\n|make / cmake / automake|Entering/Leaving directory、素のコンパイルコマンド、キャレットを削除；file:line:col: error: とその下の note: を保持|53%|\n|Traceback / at ...:N:N / error[E...]|site-packages / .venv / node_modules / stdlib フレームを折り畳み、2 つ以上連続する場合は [N dependency frame(s) suppressed] に統合|69%|\n|tsc|エラーコード別 Top-5 を 1 行サマリー；ファイル別 Top-8；各グループにつき 1 サンプルを保持|80%|\n|kubectl get pods|trailer で -o json を推奨；クライアント側は「全 Running/0 restart」の連続行だけ折り畳み、列は書き換えない|70%|\n|出力が { または [ で始まる|2 モード：デフォルトは embedding/raw_html/body/content/base64 の大きなフィールドをトリム；schema-only モードはキーと型を推論|95%|\n|gh pr view / gh issue view|HTML コメント、バッジ行、純粋な画像行、装飾的な ---、連続する空行を除去|~50%|\n|go test ... -json|NDJSON ストリーム集約：pkg ごとに pass/fail/skip を累積；fail 時は累積 output を cause として使用|90%|\n\n### 4.2 コマンドレベルパススルー\n\nユーザーがすでに投影処理をしている場合、そのまま通してクリーンアップしない：\n\n- コマンドに `--json` / `--format json` / `-o json` / `--no-color` を含む\n\n- コマンドの末尾に `| tee` / `| xxd` / `| hexdump` を含む\n\n- コマンドに `# nofilter` / `# raw` を含む（実装済み）\n\n### 4.5 拡張契約\n\n新しいシェイプを追加するには `Shape { match, apply }` インターフェースを実装するだけで、メインエントリはゼロ侵襲：\n\n```TypeScript\nexport interface Shape {\n  id: string\n  match: (command: string, head4k: string, tail4k: string) => boolean\n  apply: (body: string, ctx: { command: string }) => string\n}\n\nconst SHAPES = [S_gitdiff, S_pytest, S_npm, S_make, S_stacktrace,\n                S_tsc, S_kubectl, S_json, S_md, S_gostest]\n```\n\n\n\n## 5. その他の詳細\n\n**inline のみクリーン、ディスクは触らない** — truncation file に到達したら（早期のストリームオーバーフローでも、末尾の `trunc.write(raw)` でも）クリーンアップはスキップ。ディスクアーカイブは元のバイト列を保持して人手 grep しやすくし、inline 出力のみをクリーンアップパイプラインに通して、最も読まれる経路にバイトの節約を集中させる。\n\n**TUI プレビューは触らない** — `metadata.output` は TUI のリアルタイムプレビューフィールドで、元のストリーミングスナップショットのまま保持する。最終的な `output` のみがクリーンアップを通る。クリーンアップの副作用が、人が元の端末出力を読み取る判断を妨げるのを避ける。\n\n**単一フラグ、デフォルト無効** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` は独立したフラグで、デフォルトは無効。`MIMOCODE_EXPERIMENTAL=1` から派生しない。明示的オプトインで、デフォルト出力を静かに変更するのを避ける。\n\n"},{"path":"harness/MiMo Token Efficient Mode.md","title":"MiM Token Efficient Mode","group":"harness","content":"# MiM Token Efficient Mode\n\n**一句话总结**：使用通用正则过滤pipeline \\+ 启发式过滤pipeline过滤Bash Output中冗余token（实验功能，默认关闭）\n\n## 1\\. 背景与目标\n\nbash 工具的 stdout/stderr 经常被以下噪音\"撑爆\"上下文：\n\n- ANSI 色码、OSC hyperlink、DCS 终端控制序列\n\n- `\\r` 进度条多帧重叠\n\n- 误打印的 API key / JWT / PEM 证书\n\n- minified JS / 单行 JSON 等超长行\n\n- pytest/go test/\\.\\.\\.等无效信息\n\n**核心约束**：清理只面向 LLM；TUI 实时预览与磁盘归档保持原始字节，便于人工 debug。\n\n## 2\\. 整体流程\n\n下图给出 bash 工具输出从捕获到送达 LLM 的端到端清理路径，整合了通用过滤管线（第 3 章）、启发式过滤管线（第 4 章）以及 inline / 落盘 / TUI 三路分流约束（第 5 章）。\n\n三条核心约束在图中的位置：\n\n- **仅清 inline，不清落盘** — 入口分流的最左侧两路（落盘归档 / TUI 预览）直接绕开整条管线。\n\n- **never\\-worse 守门** — 管线尾部统一回吐：任何阶段使输出变大都被丢弃，回到 Raw 路径。\n\n- **单 flag、默认关** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` 是进入清理管线的唯一开关，且默认关闭，否则走 Raw 直出。\n\n\n\n\n\n## 3\\. 通用过滤管线\n\n\n\n|**层名**|**职责**|**关键正则 / 算法**|**顺序约束**|\n|---|---|---|---|\n|clean\\_progress\\_pipeline|按行折叠 \\\\r 进度条，只保留最后一帧|按行切分后取每行最后一个 \\\\r 之后的片段|必须先于 clean\\_ansi\\_pipeline|\n|clean\\_ansi\\_pipeline|剥 ANSI CSI/OSC/DCS、退格 overstrike、控制字节|4 条 ESC 序列正则 \\+ 控制字节字符类|progress 之后，下游正则之前|\n|clean\\_redact\\_pipeline|PEM、Bearer、JWT、AWS/GH/OpenAI/Anthropic/Slack 密钥|8 组正则 \\+ 跨行 PEM 块整体替换|去重截断前必须先做|\n|clean\\_longline\\_pipeline|单行超 500 字符压成 head 160 字符 \\+ 省略提示|按行扫描，长度阈值判定|放最后兜底|\n|never\\-worse 守门|清理后字节数没变小则回吐原文|bytesOut ≥ bytesIn 时返回原 text|管线尾部|\n\n### 3\\.1 各层正则速查\n\n下列常量直接对应 `packages/opencode/src/tool/bash_token_efficient.ts` 实现。L1 / L4 是按行扫描算法，无单独正则；L0 / L3 共 14 条正则（4 ESC \\+ 1 控制字节 \\+ 1 跨行 PEM \\+ 8 行内密钥）。\n\n**L0 clean\\_ansi — 4 ESC 正则 \\+ 1 控制字节字符类**\n\n```ts\nconst ANSI_CSI   = /\\x1b\\[[0-?]*[ -/]*[@-~]/g              // CSI 序列  ESC[ ... 终止符\nconst ANSI_OSC   = /\\x1b\\][^\\x07\\x1b]*(?:\\x07|\\x1b\\\\)/g    // OSC 序列  ESC] ... BEL 或 ESC\\\nconst ANSI_DCS   = /\\x1b[PX^_][\\s\\S]*?\\x1b\\\\/g             // DCS/SOS/PM/APC 跨行序列\nconst BACKSPACE  = /[^\\n]\\x08/g                            // 退格 overstrike  循环替换至无匹配\nconst CTRL_BYTES = /[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F]/g     // 控制字节  保留 \\t \\n \\r\n```\n\n**L3 clean\\_redact — 1 跨行 PEM 整块 \\+ 8 条行内密钥**\n\n```ts\n// 跨行 PEM 块整体替换 → \u003credacted-pem-block>\nconst PEM_BLOCK = /-----BEGIN [A-Z ]+-----[\\s\\S]*?-----END [A-Z ]+-----/g\n\nconst REDACT_PATTERNS: Array\u003c[RegExp, string]> = [\n  // Bearer / Token \u003copaque>\n  [/\\b(Bearer|Token)\\s+[A-Za-z0-9._\\-+/=]{16,}/gi,                          \"$1 \u003credacted>\"],\n  // JWT  eyJ 三段 base64url（每段 ≥10 字符）\n  [/\\beyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}/g,    \"\u003credacted-jwt>\"],\n  // AWS access key  AKIA / ASIA 前缀 + 16 大写字母数字\n  [/\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b/g,                                        \"\u003credacted-aws-key>\"],\n  // GitHub fine-grained / classic  gh[pousr]_ + ≥20 字符\n  [/\\bgh[pousr]_[A-Za-z0-9]{20,}\\b/g,                                       \"\u003credacted-gh-token>\"],\n  // OpenAI  sk- + ≥20 字符\n  [/\\bsk-[A-Za-z0-9_\\-]{20,}\\b/g,                                           \"\u003credacted-openai-key>\"],\n  // Anthropic  sk-ant- + ≥20 字符\n  [/\\bsk-ant-[A-Za-z0-9_\\-]{20,}\\b/g,                                       \"\u003credacted-anthropic-key>\"],\n  // Slack  xox[abprs]- + ≥10 字符\n  [/\\bxox[abprs]-[A-Za-z0-9\\-]{10,}\\b/g,                                    \"\u003credacted-slack-token>\"],\n  // 通用 KEY=VALUE / \"key\": \"value\"  ≥12 字符值\n  [\n    /\\b((?:api|access|refresh|secret|client|auth)[_-]?(?:key|token|secret|password))(\\s*[:=]\\s*)[\"']?[A-Za-z0-9._\\-+/=]{12,}[\"']?/gi,\n    \"$1$2\u003credacted>\",\n  ],\n]\n```\n\n**L1 clean\\_progress — 按行折叠 ****`\\r`**** 进度条**\n\n
