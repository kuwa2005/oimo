<script type="application/json" id="docs-manifest">[{"path":"RELEASING.md","title":"リリース手順 (RELEASING)","group":"トップ","content":"# リリース手順 (RELEASING)\n\nこのドキュメントは oimo のリリースを「迷わず」進めるためのランブックです。\nリリースカットは原則 **`./script/release` の 1 コマンド** で完結します (bump → タグ push → 自動リリース)。\n詳細な仕組みを知りたい場合やトラブル時は、このドキュメントの該当セクションを参照してください。\n\n## 概要\n\nリリース制御は GitHub Actions へ移譲されています。**`v*` 形式のタグを push すると**\nワークフロー (`.github/workflows/release.yml`) が自動でビルド・公開します。\n\n```\n[タグ push: v0.1.15]\n   ↓ (on: push.tags.v*)\nbuild-cli (12 ターゲットを build matrix で並列ビルド → アーカイブのみ生成)\n   ↓ (needs)\nassemble (アーカイブ集約 → SHA256SUMS 生成 → リリースノート → softprops でリリース作成・公開)\n```\n\n- **トリガー**: `v*` タグの push のみ。`workflow_dispatch` (手動発火) は廃止されました。\n- **公開まで自動**: タグ push 後はビルド・アセット・チェックサム・リリース公開まで CI が自動実行します。\n  人間が操作するのはタグを作って push する (次の手順) だけです。\n- **配布**: GitHub Releases のみ（上流 `@mimo-ai/*` npm とは無関係）。\n- バージョンの真実は**タグ名**です (`v0.1.15` → `MIMOCODE_VERSION=0.1.15`)。ワークフロー内での\n  bump コミットは行いません。\n\n## 前提条件\n\nリリースに必要な環境とシークレット。\n\n1. **gh CLI がインストール・認証済み** (`gh auth status` で確認)。必要なスコープ: `repo` と `workflow`。\n2. **リポジトリシークレット** (リポジトリ Settings → Secrets and variables → Actions):\n\n   | シークレット | 必須 | 省略時の挙動 |\n   |---|---|---|\n   | `MIMO_FDS_AK` / `MIMO_FDS_SK` | 任意 | FDS (中国向け CDN ミラー) へのアップロードをスキップ |\n   | `MIMO_FDS_ENDPOINT` / `MIMO_FDS_BUCKET` / `MIMO_FDS_PREFIX` | 任意 | FDS の接続先 (既定値がある場合は不要) |\n\n   この fork は **GitHub Releases のみ**で配布します。上流 `@mimo-ai/*` への npm 公開は行いません（`NPM_TOKEN` は不要）。\n\n   `gh secret list` で確認できます。`script/release` がプリフライトで設定状況を表示します。\n\n3. **作業ツリー**: 未コミットの変更があると警告が出ます。リリースの bump コミットには\n   **package.json のみ**が含まれるので、他の変更は先にコミットしておいてください。\n\n## リリース手順\n\n```bash\n# patch リリース (既定)\n./script/release\n\n# 明示的に bump 種別を指定\n./script/release minor\n\n# バージョンを直接指定 (bump 計算をスキップ)\n./script/release --version 0.1.15\n\n# タグ push のみで監視しない (バックグラウンドで回す場合)\n./script/release --no-watch\n```\n\n`script/release` が行うこと:\n\n1. **プリフライト** — gh の存在・認証、未コミット変更の警告、シークレット設定状況の表示。\n2. **bump & コミット** — `script/bump.ts` がバージョンを決定し、全 package.json を書き換えて\n   `chore: bump version to \u003cversion>` でコミット。\n3. **ブランチ push** — bump コミットを `origin/\u003c現在ブランチ>` へ push。\n4. **タグ push** — `v\u003cversion>` タグを作成して push。これがリリースのトリガーです。\n5. **監視** — `gh run watch` で release.yml の完了まで待機 (途中で Ctrl-C してもワークフローは継続)。\n6. **結果表示** — ジョブ別の結果とリリースページの URL。\n\nタグを push した時点でリリースは「作られる運命」です。ワークフローが失敗した場合は\n`gh run view \u003cid> --log-failed` でログを確認し、修正後に**バージョンを上げて**再実行してください。\n\n### 手動でタグを push する場合\n\n`script/release` を使わずに `git tag v0.1.15 && git push origin v0.1.15` でも release.yml は発火します\n(バージョンはタグ名から取られます)。ただし package.json の bump コミットは入らないため、\n**`script/release` を使うのが推奨**です (バージョン整合性が保たれます)。\n\n### バージョン決定規則\n\n- `--version X.Y.Z` を指定 → そのバージョンをそのまま使用。\n- bump 種別 (`major`/`minor`/`patch`) → `packages/opencode/package.json` の現在バージョンから\n  `script/bump.ts` (`nextVersion`) が 1 段上げ、`script/bump-version.ts` (`bumpVersions`) が\n  **全 package.json を一括書き換え** (`node_modules` / `dist` は除外)。\n- 指定がない場合は `patch` が既定。\n\n## ワークフロー各ジョブの動作\n\n### build-cli (build matrix)\n\n- 12 ターゲット (`linux-arm64`, `linux-x64`, `linux-x64-baseline`, `linux-arm64-musl`,\n  `linux-x64-musl`, `linux-x64-baseline-musl`, `darwin-arm64`, `darwin-x64`,\n  `darwin-x64-baseline`, `windows-arm64`, `windows-x64`, `windows-x64-baseline`) を\n  **並列ジョブ**でビルド。逐次ビルド時代に比べウォールクロックが大幅に短縮されます。\n- 各ジョブは `MIMOCODE_TARGETS=\u003ctarget>` で自分のターゲットだけをビルドします。\n  `MIMOCODE_RELEASE=1` でアーカイブ (`oimo-\u003cos>-\u003carch>[-baseline][-musl].{tar.gz|zip}`) を生成し、\n  `MIMOCODE_SKIP_UPLOAD=1` で **gh release へのアップロードを抑止**します\n  (この時点ではリリースが未作成のため)。アーカイブは `actions/upload-artifact` で assemble へ渡します。\n- FDS シークレットがあれば各ジョブが自分のアセットを FDS ミラーへもアップロードします\n  (SKIP_UPLOAD の影響を受けません)。\n- `packages/opencode/script/targets.ts` がターゲット定義・名前計算を一元管理します\n  (`MIMOCODE_TARGETS` 未指定なら従来どおり全ターゲットを 1 プロセスでビルド — ローカルリリースビルド互換)。\n\n### assemble\n\n1. `actions/download-artifact` で全アーカイブを `release-assets/` に集約。\n2. `script/checksums.ts` で **SHA256SUMS を集約生成** (`sha256sum -c` 互換)。matrix で分散ビルドしても\n   チェックサムは単一の正にまとまります。\n3. `script/changelog.ts` でリリースノートを生成 (git log、conventional commit グループ化。\n   範囲は直前の `v*` タグから HEAD)。\n4. **softprops/action-gh-release** でリリースを作成・公開 (`draft: false`)。\n   12 アーカイブ + `SHA256SUMS` を添付します。アセットが欠けている場合は失敗します\n   (`fail_on_unmatched_files: true`)。\n5. npm 公開は行いません（この fork は GitHub Releases のみ）。\n\n## アセットとチェックサム・インストーラー検証\n\n- リリースには 12 アーカイブ + `SHA256SUMS` が含まれます。形式は `sha256sum -c` 互換\n  (`\u003chex>  \u003cname>`、名前順ソート)。\n- インストーラー (`install` / `install.ps1`) は `SHA256SUMS` をダウンロードして検証します:\n  - 不一致 → インストール中止 (exit 1)。\n  - `SHA256SUMS` が無い / エントリが無い (旧リリース) → 警告のみで継続 (後方互換)。\n- `OIMO_BASE_URL` 環境変数でダウンロード・チェックサム取得のベース URL を差し替えられます\n  (既定は `https://github.com/\u003crepo>`。FDS ミラー運用やテストで使用)。\n\n## 配布経路\n\n公式インストールは **curl / irm インストーラー → GitHub Releases アセット** のみです。\n上流の `@mimo-ai/cli` npm パッケージとは無関係です。\n\n## FDS ミラー (任意)\n\n中国向け CDN ミラー。`MIMO_FDS_AK` / `MIMO_FDS_SK` (と必要に応じて ENDPOINT/BUCKET/PREFIX) を設定すると、\n各 build-cli ジョブがアセットを FDS へもアップロードします。シークレット未設定時は自動スキップです。\n\n## トラブルシュート\n\n| 症状 | 原因と対処 |\n|---|---|\n| `Error: not authenticated with gh` | `gh auth login` を実行 (スコープ: repo, workflow)。 |\n| `checksum mismatch` でインストール失敗 | ダウンロードが壊れているか、リリースの SHA256SUMS と実アセットが不一致。リリースページで SHA256SUMS を再確認し、壊れたリリースは `gh release delete` + バージョンを上げて再実行。 |\n| リリースノートが「No notable changes」になる | 直前タグからの差分が無いか、タグがローカルに無い。`git fetch --tags` してから再実行。 |\n| タグ push してもワークフローが走らない | release.yml がデフォルトブランチに存在し、**登録済み**であること (`gh api repos/\u003cowner>/\u003crepo>/actions/workflows` で確認)。このリポジトリでは登録拒否がサイレントに起きた実績があるため、ワークフロー変更時は必ず確認する。 |\n| build-cli の一部ジョブだけ失敗 | matrix は `fail-fast: false` なので他ターゲットは継続。失敗ジョブのログ (`gh run view \u003cid> --log-failed`) を確認し、修正後に**バージョンを上げて**再実行 (同じタグを再 push するには先にタグとリリースを削除する必要があります)。 |\n| `Unknown argument` が出る | `script/release --help` で使い方を確認。 |\n\n## 開発・デバッグ用コマンド\n\n```bash\n# 特定ターゲットだけローカルビルド (アップロードなし)\nMIMOCODE_TARGETS=linux-x64 bun packages/opencode/script/build.ts\n\n# リリースビルドのアーカイブのみ生成 (gh release へアップロードしない)\nMIMOCODE_RELEASE=1 MIMOCODE_SKIP_UPLOAD=1 MIMOCODE_TARGETS=linux-x64 bun packages/opencode/script/build.ts\n\n# バージョン bump のみ (コミット付き、新バージョンを表示)\nbun script/bump.ts patch\n\n# チェックサム生成のみ\nbun script/checksums.ts \u003cfile...>\n\n# リリースノート生成 (タグ範囲)\nbun script/changelog.ts --from v0.1.14 --to v0.1.15 --print\n\n# install.ps1 再生成 (決定性)\nbun script/build-install-ps1.ts\n```\n"},{"path":"agent-skills-export.md","title":"oimo → agent-skills エクスポート","group":"トップ","content":"# oimo → agent-skills エクスポート\n\nOpen Mimo Code の **ビルトインスキル**、**Compose フェーズ**、**組み込みワークフロー**、**独自パターン**を、Cursor / OpenCode / oimo 共通の [agent-skills](https://github.com/kuwa2005/agent-skills) 形式へエクスポートする手順です。\n\n## 境界\n\n| エクスポートする | エクスポートしない |\n|------------------|-------------------|\n| ホスト横断で使える SKILL.md + scripts | `mimocode-docs`（oimo 製品リファレンス） |\n| Compose 各フェーズ（`compose-phases` バンドル） | `drive-mimo`（oimo CLI 専用） |\n| ワークフロー meta の portable 手順 | `sales/*`（営業特化・巨大） |\n| `evolve` / `memory-search` の portable 版 | 本隊ランタイム（Auto failover 等）の TypeScript |\n\n本隊の不変条件は [core-vs-skills.ja.md](./architecture/core-vs-skills.ja.md) のとおり **本隊のまま**。ポータブル化できる手順だけを agent-skills へ載せます。\n\n## 実行\n\n```bash\n# 既定: ../agent-skills（oimo の隣）\nbun script/export-agent-skills.ts\n\n# パス指定\nAGENT_SKILLS_ROOT=/path/to/agent-skills bun script/export-agent-skills.ts\n\n# 確認のみ\nbun script/export-agent-skills.ts --dry-run\n```\n\n出力先: `agent-skills/skills/\u003cskill-name>/`\n\nカタログ: `agent-skills/skills/optional-oimo.txt`（**optional** 扱い — 既存 `catalog.txt` は変更しない）\n\n## エクスポート一覧\n\n### 直接コピー（ビルトイン）\n\n`packages/opencode/src/skill/builtin/.bundle/` からそのまま:\n\n- `compose-next`, `deep-research`, `super-research`, `arxiv`\n- `design-blueprint`, `skill-creator`, `playwright`\n- `pdf-official`, `docx-official`, `pptx-official`, `xlsx-official`\n- `modern-python-toolchain`, `research-paper-writing`, `learn-everything`, `loop`\n- `data-analytics`, `product-design`, `html-to-video-pipeline`, `grok-build`\n- `claude-code`, `codex`\n\n### Portable  adaptation\n\n| スキル | 内容 |\n|--------|------|\n| `evolve` | `.oimo/` パスを Cursor/OpenCode 向けに注記 + `references/host-paths.md` |\n| `memory-search` | oimo DB 前提を明記；他ホストは git/log 代替 |\n\n### バンドル\n\n| スキル | ソース |\n|--------|--------|\n| `compose-phases` | `skill/compose/.bundle/*` → `references/\u003cphase>/` |\n| `oimo-workflows` | `workflow/builtin/*.js` の meta → `references/\u003cname>.md` |\n| `goal-driven-stop` | `/goal` 停止条件パターン（新規 portable スキル） |\n\n## インストール（利用者向け）\n\n```bash\n# 1 件\ncurl -fsSL https://raw.githubusercontent.com/kuwa2005/agent-skills/main/install.sh | bash -s -- compose-next\n\n# optional-oimo 掲載分をまとめて（リポジトリ clone 後）\ncd agent-skills && ./install.sh $(grep -v '^#' skills/optional-oimo.txt)\n```\n\n## 検証\n\n```bash\ncd agent-skills && python3 validate_skills.py\n```\n\n## 運用\n\n- oimo ビルトインを更新したら `bun script/export-agent-skills.ts` を再実行し、agent-skills 側で commit。\n- 両方に存在するスキル（例: `frontend-design`）は **意図的に二重管理** — 片方だけ古くしない（[core-vs-skills.ja.md](./architecture/core-vs-skills.ja.md)）。\n"},{"path":"architecture/codex-microkernel-runtime.en.md","title":"MiMoCode's Codex Microkernel Runtime for GPT Models","group":"architecture","content":"# MiMoCode's Codex Microkernel Runtime for GPT Models\n\n> “Codex microkernel runtime” is this document's summary of the current architecture. It is not an official module name in the source code, nor does it refer to an operating-system-level microkernel.\n\n## Abstract\n\nMiMoCode runs GPT/Codex models on a shared Session engine while exposing a smaller, Codex-style tool ABI to them: `bash`, `apply_patch`, `view_image`, and `exec`. `exec` composes authorized host tools inside QuickJS; permissions, paths, subprocesses, cancellation, persistence, and UI always remain under host control.\n\n## Core Design\n\nMiMoCode does not create a separate Agent engine for GPT. Instead, it does three things on top of the unified Session runtime:\n\n1. Uses a GPT/Codex-specific system prompt that defines tool selection and orchestration conventions;\n2. Uses `ToolRegistry` to assemble a smaller, model-specific tool ABI;\n3. Provides QuickJS-based `exec` to compose host tools without expanding permissions.\n\n```mermaid\nflowchart LR\n    Model[GPT / Codex] --> Registry[SystemPrompt + ToolRegistry]\n    Registry --> Direct[bash / apply_patch / view_image]\n    Registry --> Exec[exec / QuickJS]\n    Exec --> Tools[Filtered host tools]\n    Direct --> Host[Permission + path guards]\n    Tools --> Host\n    Host --> Effects[Filesystem / Shell / MCP]\n    Effects --> Session[SessionProcessor / MessageV2 / TUI]\n```\n\nThe core principle is:\n\n> The model decides what to do, `exec` determines how to compose the operations, and the host decides whether they are allowed and how their side effects are produced.\n\n## GPT Tool ABI\n\n[`ToolRegistry.available()`](../../packages/opencode/src/tool/registry.ts#L363) currently determines whether to enable the GPT profile from the model ID: the ID must contain `gpt-`, while `oss` and `gpt-4` are excluded.\n\n| Tool visible to GPT | Purpose |\n| --- | --- |\n| `bash` | Inspect and search files with `rg`, `sed`, and similar tools, and execute commands |\n| `apply_patch` | Modify text files with structured patches |\n| `view_image` | Convert local JPEG, PNG, GIF, and WebP files into model attachments |\n| `exec` | Batch-call and aggregate host tools inside QuickJS |\n\nThe GPT profile hides the overlapping `read`, `write`, `edit`, `multiedit`, `grep`, `glob`, and `notebook_edit` capabilities. Other tools remain governed by the provider, agent allowlist, and runtime permissions.\n\n[`SystemPrompt.provider()`](../../packages/opencode/src/session/system.ts#L24) independently selects `gpt.txt`, `codex.txt`, or `beast.txt`. Prompt routing and tool profiles currently use two separate sets of string rules; they have not yet been unified into a model-capability negotiation layer.\n\n## The `exec` Microkernel\n\n[`ToolScriptTool`](../../packages/opencode/src/tool/tool-script.ts#L303) is exposed to the model as `exec`. The model submits a TypeScript/JavaScript async function body and calls host tools through `tools.\u003cname>()`.\n\n### Why It Cannot Bypass Permissions\n\n[`tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts#L1) uses a late-bound registry so that `exec` receives the same `Tool.Def` instances as the outer layer, after model/agent filtering:\n\n- `read`, `write`, and `edit` tools invisible to the outer layer do not reappear inside `exec`;\n- Built-in subcalls execute the original `Tool.Def.execute()` and `Tool.Context`;\n- MCP subcalls still execute `ctx.ask()` individually;\n- `exec_command` is only an alias for `bash`, with the same permissions and execution path.\n\nControl-flow tools such as `task`, `actor`, `question`, `skill`, `workflow`, `cron`, and `session` are excluded because they change conversation or scheduling state and should not be hidden inside a single script call.\n\n### Two Security Boundaries\n\n1. [`evalScript()`](../../packages/opencode/src/workflow/sandbox.ts#L106) isolates guest code with QuickJS and provides no Node, `process`, `fetch`, timers, or module loading;\n2. Actual side effects are still performed by host tools and pass through permissions, external-directory checks, memory guards, and each tool's own validation.\n\nQuickJS isolates only the `exec` code. `bash` remains a real shell, not a container sandbox.\n\n### Resource Limits\n\n| Resource | Default / Limit |\n| --- | --- |\n| Nested tool calls | 50 by default, 500 maximum |\n| Concurrent calls | 8 |\n| Active computation | 60 seconds by default, 600 seconds maximum |\n| Wall clock | 30 minutes |\n| Guest memory | 64 MiB by default |\n| Code / return value / logs | 128 KiB / 256 KiB / 64 KiB |\n| Single `files.*` file | 10 MiB |\n\n`files.readText` can read only UTF-8 text within the worktree or OS temporary directory; `files.writeText` can write only to the OS temporary directory. Project changes must use permission-controlled host tools.\n\n## Other Key Primitives\n\n### `apply_patch`\n\nBefore writing, [`ApplyPatchTool`](../../packages/opencode/src/tool/apply_patch.ts#L24) parses all hunks, checks paths, computes the diff, and requests `edit` permission. After writing, it publishes file events, runs formatting, and refreshes the LSP.\n\nIt prevalidates the entire patch, but multi-file writes are not transactional. A failure partway through does not automatically roll back files already written.\n\n### `view_image`\n\n[`ViewImageTool`](../../packages/opencode/src/tool/view-image.ts#L23) checks the model's image capability, external-directory access, and `read` permission, then validates the image format and returns a data URL attachment.\n\nCurrent limitations:\n\n- `detail` is recorded only in metadata and does not change image processing;\n- There is no separate image size limit;\n- `exec` passes only text, metadata, and JSON values. It cannot forward image attachments, so images should be handled by calling `view_image` directly.\n\n## OpenAI Responses\n\nThe OpenAI provider sends requests through [`sdk.responses(modelID)`](../../packages/opencode/src/provider/provider.ts#L203). [`ProviderTransform.options()`](../../packages/opencode/src/provider/transform.ts#L1275) sets `store: false` by default and requests `reasoning.encrypted_content` for GPT-5 reasoning models.\n\nMiMoCode writes provider metadata into messages and replays it in the next turn, allowing stateless Responses tool loops to continue reasoning. Before sending, it also removes `itemId` values that cannot be safely reused, preventing the server or proxy from failing to parse stale `rs_...` references.\n\n[`CodexAuthPlugin`](../../packages/opencode/src/plugin/codex.ts#L364) separately handles ChatGPT Plus/Pro OAuth, token refresh, account headers, and Codex endpoint rewriting. It belongs to the authentication and transport layer and does not alter tool permissions.\n\n## PR Evolution\n\n[PR #1865](https://github.com/XiaomiMiMo/MiMo-Code/pull/1865) is a stacked PR whose base points to #1864's `feat/view-image-tool` branch. It first introduced:\n\n- GPT-specific Bash guidance;\n- masking of overlapping file tools;\n- aligned skill-search prompts and reminders for GPT and Claude.\n\n[PR #1864](https://github.com/XiaomiMiMo/MiMo-Code/pull/1864) then added `view_image`, broader tool masking, the `tool_script → exec` transition, the GPT prompt, TUI integration, and checkpoint support before the complete stack was merged into `main`.\n\nToday, `skill_search` remains visible to GPT and Claude, but the system prompt and reminder do not proactively ask those models to search. This is a later refinement of #1865's original tool-masking policy.\n\n## Current Gaps\n\n- Model classification relies on string heuristics, so prompt and tool-profile rules can drift;\n- `codex.txt` still mentions Read/Edit/Write/Glob/Grep tools hidden by the GPT profile;\n- `view_image` exposure and its runtime image-capability check are not fully aligned;\n- `files.readText` relies on a path jail and does not perform the normal `read` permission ask;\n- QuickJS does not provide OS-level isolation for Bash;\n- GPT profile cases for `exec`, the Bash description, `skill_search`, and `multiedit` are currently skipped in [`registry-invocation-style.test.ts`](../../packages/opencode/test/tool/registry-invocation-style.test.ts#L17).\n\n## Key Source Files\n\n- [`session/system.ts`](../../packages/opencode/src/session/system.ts): model prompt routing;\n- [`tool/registry.ts`](../../packages/opencode/src/tool/registry.ts): GPT tool ABI;\n- [`tool/tool-script.ts`](../../packages/opencode/src/tool/tool-script.ts): `exec` declaration, dispatch, budgets, and results;\n- [`tool/tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts): shared tool filtering and control-flow exclusions;\n- [`workflow/sandbox.ts`](../../packages/opencode/src/workflow/sandbox.ts): QuickJS sandbox;\n- [`session/prompt.ts`](../../packages/opencode/src/session/prompt.ts): tool execution context and permission routing;\n- [`provider/transform.ts`](../../packages/opencode/src/provider/transform.ts): Responses reasoning round-trip.\n"},{"path":"architecture/codex-microkernel-runtime.fr.md","title":"Environnement d’exécution à micronoyau Codex de MiMoCode pour les modèles GPT","group":"architecture","content":"# Environnement d’exécution à micronoyau Codex de MiMoCode pour les modèles GPT\n\n> « Environnement d’exécution à micronoyau Codex » est la formulation employée dans ce document pour résumer l’architecture actuelle. Il ne s’agit ni du nom officiel d’un module dans le code source, ni d’une référence à un micronoyau de système d’exploitation.\n\n## Résumé\n\nMiMoCode exécute les modèles GPT/Codex sur un moteur de Session partagé, tout en leur exposant une ABI d’outils plus restreinte, dans le style de Codex : `bash`, `apply_patch`, `view_image` et `exec`. `exec` compose dans QuickJS des outils hôte préalablement autorisés ; les permissions, les chemins, les sous-processus, l’annulation, la persistance et l’interface utilisateur restent toujours sous le contrôle de l’hôte.\n\n## Conception fondamentale\n\nMiMoCode n’a pas créé un moteur d’Agent distinct pour GPT. Il effectue plutôt trois opérations sur l’environnement d’exécution unifié de Session :\n\n1. utiliser un system prompt propre à GPT/Codex, qui définit la sélection et l’orchestration des outils ;\n2. assembler, au moyen de `ToolRegistry`, une ABI d’outils plus restreinte et propre au modèle ;\n3. fournir `exec` fondé sur QuickJS afin de composer les outils hôte sans étendre les permissions.\n\n```mermaid\nflowchart LR\n    Model[GPT / Codex] --> Registry[SystemPrompt + ToolRegistry]\n    Registry --> Direct[bash / apply_patch / view_image]\n    Registry --> Exec[exec / QuickJS]\n    Exec --> Tools[Outils hôte filtrés]\n    Direct --> Host[Permissions + garde-fous sur les chemins]\n    Tools --> Host\n    Host --> Effects[Système de fichiers / Shell / MCP]\n    Effects --> Session[SessionProcessor / MessageV2 / TUI]\n```\n\nLe principe fondamental est le suivant :\n\n> Le modèle décide quoi faire, `exec` détermine comment composer les opérations, et l’hôte décide si elles sont autorisées et comment produire leurs effets de bord.\n\n## ABI des outils GPT\n\nÀ l’heure actuelle, [`ToolRegistry.available()`](../../packages/opencode/src/tool/registry.ts#L363) détermine à partir de l’ID du modèle si le profil GPT doit être activé : l’ID doit contenir `gpt-`, à l’exclusion de `oss` et de `gpt-4`.\n\n| Outil visible par GPT | Rôle |\n| --- | --- |\n| `bash` | Inspecter et rechercher des fichiers avec `rg`, `sed`, etc., ainsi qu’exécuter des commandes |\n| `apply_patch` | Modifier des fichiers texte au moyen d’un patch structuré |\n| `view_image` | Convertir des fichiers locaux JPEG, PNG, GIF ou WebP en pièces jointes pour le modèle |\n| `exec` | Appeler par lots et agréger des outils hôte dans QuickJS |\n\nLe profil GPT masque les outils aux fonctions redondantes : `read`, `write`, `edit`, `multiedit`, `grep`, `glob` et `notebook_edit`. Les autres outils restent régis par le provider, l’allowlist de l’agent et les permissions de l’environnement d’exécution.\n\n[`SystemPrompt.provider()`](../../packages/opencode/src/session/system.ts#L24) sélectionne indépendamment `gpt.txt`, `codex.txt` ou `beast.txt`. Le routage du prompt et le profil des outils reposent actuellement sur deux ensembles distincts de règles fondées sur des chaînes de caractères ; ils n’ont pas encore été unifiés dans une couche de négociation des capacités du modèle.\n\n## Micronoyau `exec`\n\n[`ToolScriptTool`](../../packages/opencode/src/tool/tool-script.ts#L303) est exposé au modèle sous le nom `exec`. Le modèle soumet le corps d’une fonction async TypeScript/JavaScript et appelle les outils hôte via `tools.\u003cname>()`.\n\n### Pourquoi les permissions ne peuvent pas être contournées\n\n[`tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts#L1) utilise un registre à liaison tardive, de sorte que `exec` obtient les mêmes `Tool.Def` que la couche externe, déjà filtrées selon le modèle et l’agent :\n\n- les outils `read`, `write` et `edit`, invisibles dans la couche externe, ne réapparaissent pas dans `exec` ;\n- les sous-appels builtin exécutent les méthodes `Tool.Def.execute()` et les `Tool.Context` d’origine ;\n- les sous-appels MCP exécutent toujours `ctx.ask()` à chaque appel ;\n- `exec_command` n’est qu’un alias de `bash` et partage les mêmes permissions et le même chemin d’exécution.\n\nLes outils de contrôle de flux tels que `task`, `actor`, `question`, `skill`, `workflow`, `cron` et `session` sont exclus, car ils modifient l’état de la conversation ou de l’orchestration et ne doivent pas être dissimulés dans un appel de script unique.\n\n### Deux niveaux de sécurité\n\n1. [`evalScript()`](../../packages/opencode/src/workflow/sandbox.ts#L106) isole le guest code au moyen de QuickJS, sans exposer Node, `process`, `fetch`, les timers ni le chargement de modules ;\n2. les véritables effets de bord sont toujours exécutés par les outils hôte et soumis aux permissions, au contrôle `external-directory`, au memory guard ainsi qu’aux validations propres à chaque outil.\n\nQuickJS isole uniquement le code de `exec`. `bash` reste un véritable Shell et ne s’exécute pas dans un container sandbox.\n\n### Limites de ressources\n\n| Ressource | Valeur par défaut / limite |\n| --- | --- |\n| Appels d’outils imbriqués | 50 par défaut, 500 au maximum |\n| Appels concurrents | 8 |\n| Calcul actif | 60 secondes par défaut, 600 secondes au maximum |\n| Wall clock | 30 minutes |\n| Mémoire du guest | 64 MiB par défaut |\n| Code / valeur de retour / journaux | 128 KiB / 256 KiB / 64 KiB |\n| Fichier individuel via `files.*` | 10 MiB |\n\n`files.readText` ne peut lire que du texte UTF-8 situé dans le worktree ou le répertoire temporaire du système d’exploitation ; `files.writeText` ne peut écrire que dans ce dernier. Les modifications apportées au projet doivent passer par des outils hôte soumis au contrôle des permissions.\n\n## Autres primitives essentielles\n\n### `apply_patch`\n\nAvant toute écriture, [`ApplyPatchTool`](../../packages/opencode/src/tool/apply_patch.ts#L24) analyse tous les hunks, vérifie les chemins, calcule le diff et demande la permission `edit` ; après l’écriture, il publie les événements relatifs aux fichiers, exécute le formatage et actualise le LSP.\n\nIl prévalide l’intégralité du patch, mais les écritures portant sur plusieurs fichiers ne sont pas transactionnelles : en cas d’échec en cours d’opération, les fichiers déjà écrits ne sont pas automatiquement restaurés.\n\n### `view_image`\n\n[`ViewImageTool`](../../packages/opencode/src/tool/view-image.ts#L23) vérifie la capacité image du modèle, `external-directory` et la permission `read`, puis valide le format de l’image et renvoie une pièce jointe sous forme de data URL.\n\nLimites actuelles :\n\n- `detail` est uniquement inscrit dans les metadata et ne modifie pas le traitement de l’image ;\n- aucune limite distincte ne s’applique à la taille des images ;\n- `exec` ne transmet que du texte, des metadata et des valeurs JSON ; il ne peut pas relayer les pièces jointes de type image. Il convient donc d’appeler directement `view_image` pour les images.\n\n## OpenAI Responses\n\nLe provider OpenAI envoie les requêtes via [`sdk.responses(modelID)`](../../packages/opencode/src/provider/provider.ts#L203). [`ProviderTransform.options()`](../../packages/opencode/src/provider/transform.ts#L1275) définit `store: false` par défaut et demande `reasoning.encrypted_content` pour les modèles de reasoning GPT-5.\n\nMiMoCode enregistre les metadata du provider dans le message et les rejoue au tour suivant, afin que la boucle d’outils Responses sans état puisse poursuivre le raisonnement. Avant l’envoi, il supprime également les `itemId` qui ne peuvent pas être réutilisés de manière sûre, afin d’éviter que le serveur ou le proxy échoue à analyser des références `rs_...` invalides.\n\n[`CodexAuthPlugin`](../../packages/opencode/src/plugin/codex.ts#L364) gère séparément l’OAuth ChatGPT Plus/Pro, le token refresh, les headers de compte et l’endpoint rewrite de Codex. Il appartient à la couche d’authentification et de transport et ne modifie pas les permissions des outils.\n\n## Évolution des PR\n\nLa [PR #1865](https://github.com/XiaomiMiMo/MiMo-Code/pull/1865) est une PR empilée dont la base pointe vers la branche `feat/view-image-tool` de la #1864. Elle a d’abord introduit :\n\n- des instructions Bash propres à GPT ;\n- le masquage des outils de fichiers aux capacités redondantes ;\n- l’alignement des prompts et rappels de recherche de skills pour GPT et Claude.\n\nLa [PR #1864](https://github.com/XiaomiMiMo/MiMo-Code/pull/1864) a ensuite ajouté `view_image`, un masquage plus complet des outils, la transition `tool_script → exec`, le prompt GPT, l’intégration TUI et la prise en charge des checkpoints, avant que l’ensemble ne soit fusionné dans `main`.\n\nAujourd’hui, `skill_search` reste visible pour GPT et Claude, mais le prompt système et le rappel ne leur demandent pas proactivement d’effectuer une recherche. Il s’agit d’un ajustement ultérieur de la politique initiale de masquage de la #1865.\n\n## Lacunes actuelles\n\n- La classification des modèles repose sur des heuristiques de chaînes, de sorte que les règles de prompt et de profil d’outils peuvent diverger ;\n- `codex.txt` mentionne encore les outils Read/Edit/Write/Glob/Grep masqués par le profil GPT ;\n- l’exposition de `view_image` et sa vérification à l’exécution de la capacité image ne sont pas totalement alignées ;\n- `files.readText` repose sur un confinement de chemins et n’effectue pas la demande de permission `read` habituelle ;\n- QuickJS ne fournit pas d’isolation Bash au niveau du système d’exploitation ;\n- les cas du profil GPT concernant `exec`, la description Bash, `skill_search` et `multiedit` sont actuellement ignorés dans [`registry-invocation-style.test.ts`](../../packages/opencode/test/tool/registry-invocation-style.test.ts#L17).\n\n## Fichiers source clés\n\n- [`session/system.ts`](../../packages/opencode/src/session/system.ts) : routage des prompts de modèle ;\n- [`tool/registry.ts`](../../packages/opencode/src/tool/registry.ts) : ABI des outils GPT ;\n- [`tool/tool-script.ts`](../../packages/opencode/src/tool/tool-script.ts) : déclaration, dispatch, budgets et résultats de `exec` ;\n- [`tool/tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts) : filtrage partagé des outils et exclusion du contrôle de flux ;\n- [`workflow/sandbox.ts`](../../packages/opencode/src/workflow/sandbox.ts) : sandbox QuickJS ;\n- [`session/prompt.ts`](../../packages/opencode/src/session/prompt.ts) : contexte d’exécution des outils et routage des permissions ;\n- [`provider/transform.ts`](../../packages/opencode/src/provider/transform.ts) : round-trip du raisonnement Responses.\n"},{"path":"architecture/codex-microkernel-runtime.ja.md","title":"GPT モデル向け MiMoCode Codex マイクロカーネルランタイム","group":"architecture","content":"# GPT モデル向け MiMoCode Codex マイクロカーネルランタイム\n\n> 「Codex マイクロカーネルランタイム」は、本稿における現行アーキテクチャの総称であり、ソースコード上の正式なモジュール名ではなく、OS レベルのマイクロカーネルを意味するものでもありません。\n\n## 概要\n\nMiMoCode は、共有 Session エンジン上で GPT/Codex モデルを実行すると同時に、より小規模な Codex スタイルのツール ABI、すなわち `bash`、`apply_patch`、`view_image`、`exec` をモデルに公開します。`exec` は QuickJS 内で、許可されたホストツールを組み合わせます。権限、パス、サブプロセス、キャンセル、永続化、UI は常にホストによって制御されます。\n\n## コア設計\n\nMiMoCode は GPT 専用の Agent エンジンを新設するのではなく、統一された Session runtime 上で次の三つを行います。\n\n1. GPT/Codex 専用の system prompt を使用し、ツールの選択方法とスケジューリング方法を規定する。\n2. `ToolRegistry` を介して、より小規模なモデル専用ツール ABI を構成する。\n3. 権限を拡大することなくホストツールを組み合わせる QuickJS `exec` を提供する。\n\n```mermaid\nflowchart LR\n    Model[GPT / Codex] --> Registry[SystemPrompt + ToolRegistry]\n    Registry --> Direct[bash / apply_patch / view_image]\n    Registry --> Exec[exec / QuickJS]\n    Exec --> Tools[Filtered host tools]\n    Direct --> Host[Permission + path guards]\n    Tools --> Host\n    Host --> Effects[Filesystem / Shell / MCP]\n    Effects --> Session[SessionProcessor / MessageV2 / TUI]\n```\n\nコア原則は次のとおりです。\n\n> モデルが何を行うかを決定し、`exec` がその組み合わせ方を担い、ホストが許可の可否と副作用の発生方法を決定します。\n\n## GPT ツール ABI\n\n現在、[`ToolRegistry.available()`](../../packages/opencode/src/tool/registry.ts#L363) はモデル ID に基づいて GPT profile を有効にするかどうかを判定します。ID に `gpt-` が含まれ、かつ `oss` と `gpt-4` が除外されている場合に有効になります。\n\n| GPT から見えるツール | 用途 |\n| --- | --- |\n| `bash` | `rg`、`sed` などを使用してファイルを調査・検索し、コマンドを実行する |\n| `apply_patch` | 構造化された patch でテキストファイルを変更する |\n| `view_image` | ローカルの JPEG、PNG、GIF、WebP をモデル用 attachment に変換する |\n| `exec` | QuickJS 内でホストツールを一括呼び出しし、結果を集約する |\n\nGPT profile では、機能が重複する `read`、`write`、`edit`、`multiedit`、`grep`、`glob`、`notebook_edit` が非表示になります。その他のツールは引き続き、provider、agent allowlist、runtime permission によって管理されます。\n\n[`SystemPrompt.provider()`](../../packages/opencode/src/session/system.ts#L24) は、`gpt.txt`、`codex.txt`、`beast.txt` のいずれかを独立して選択します。Prompt のルーティングとツール profile は現在、二つの異なる文字列ルールに基づいており、モデル能力のネゴシエーションレイヤーとしてはまだ統合されていません。\n\n## `exec` マイクロカーネル\n\n[`ToolScriptTool`](../../packages/opencode/src/tool/tool-script.ts#L303) は `exec` としてモデルに公開されます。モデルは TypeScript/JavaScript の async function body を送信し、`tools.\u003cname>()` を介してホストツールを呼び出します。\n\n### 権限を迂回できない理由\n\n[`tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts#L1) は late-bound registry を使用するため、`exec` が取得するのは外側と同じ、model/agent によるフィルタリング済みの `Tool.Def` です。\n\n- 外側から見えない `read`、`write`、`edit` が `exec` 内で再び現れることはありません。\n- builtin のサブ呼び出しは、元の `Tool.Def.execute()` と `Tool.Context` を実行します。\n- MCP のサブ呼び出しでも、毎回 `ctx.ask()` が実行されます。\n- `exec_command` は単なる `bash` のエイリアスであり、権限と実行経路は同一です。\n\n`task`、`actor`、`question`、`skill`、`workflow`、`cron`、`session` などの制御フローツールは除外されています。これらは対話やスケジューリングの状態を変更するため、一度のスクリプト呼び出しの中に隠すのには適していません。\n\n### 二層のセキュリティ境界\n\n1. [`evalScript()`](../../packages/opencode/src/workflow/sandbox.ts#L106) は QuickJS で guest code を隔離し、Node、`process`、`fetch`、timer、モジュール読み込みを提供しません。\n2. 実際の副作用は引き続きホストツールによって実行され、permission、external-directory、memory guard、各ツール固有の検証を経ます。\n\nQuickJS が隔離するのは `exec` のコードのみです。`bash` は引き続き実際の Shell であり、コンテナ sandbox ではありません。\n\n### リソース制限\n\n| リソース | デフォルト値 / 上限 |\n| --- | --- |\n| ネストされたツール呼び出し | デフォルト 50、最大 500 |\n| 並行呼び出し | 8 |\n| アクティブ計算時間 | デフォルト 60 秒、最大 600 秒 |\n| Wall clock | 30 分 |\n| Guest メモリ | デフォルト 64 MiB |\n| コード / 戻り値 / ログ | 128 KiB / 256 KiB / 64 KiB |\n| `files.*` の単一ファイル | 10 MiB |\n\n`files.readText` が読み取れるのは、worktree または OS tmp 内にある UTF-8 テキストのみです。`files.writeText` が書き込めるのは OS tmp のみです。プロジェクトの変更には、権限制御されたホストツールを呼び出す必要があります。\n\n## その他の主要プリミティブ\n\n### `apply_patch`\n\n[`ApplyPatchTool`](../../packages/opencode/src/tool/apply_patch.ts#L24) は、書き込み前にすべての hunks を解析し、パスを検査して diff を計算したうえで `edit` permission を要求します。書き込み後はファイルイベントを発行し、フォーマットを実行して LSP を更新します。\n\nすべての patch を事前検証しますが、複数ファイルへの書き込みはトランザクションではなく、途中で失敗しても書き込み済みのファイルは自動的にロールバックされません。\n\n### `view_image`\n\n[`ViewImageTool`](../../packages/opencode/src/tool/view-image.ts#L23) は、モデルの image capability、external-directory、`read` permission を確認した後、画像形式を検証し、data URL attachment を返します。\n\n現在の制限事項は次のとおりです。\n\n- `detail` は metadata に書き込まれるだけで、画像処理には影響しません。\n- 画像サイズには個別の制限がありません。\n- `exec` が受け渡せるのはテキスト、metadata、JSON 値のみで、画像 attachment は透過的に受け渡せません。そのため、画像には `view_image` を直接呼び出す必要があります。\n\n## OpenAI Responses\n\nOpenAI provider は、[`sdk.responses(modelID)`](../../packages/opencode/src/provider/provider.ts#L203) を介してリクエストを送信します。[`ProviderTransform.options()`](../../packages/opencode/src/provider/transform.ts#L1275) はデフォルトで `store: false` を設定し、GPT-5 reasoning モデルには `reasoning.encrypted_content` を要求します。\n\nMiMoCode は provider metadata をメッセージに書き込み、次のターンで再生することで、ステートレスな Responses ツールループが推論を継続できるようにします。同時に、送信前に安全に再利用できない `itemId` を取り除き、サーバーまたはプロキシによる無効な `rs_...` 参照の解析エラーを回避します。\n\n[`CodexAuthPlugin`](../../packages/opencode/src/plugin/codex.ts#L364) は別途、ChatGPT Plus/Pro OAuth、token refresh、アカウント header、Codex endpoint rewrite を担います。これは認証・トランスポート層に属し、ツールの権限を変更するものではありません。\n\n## PR の変遷\n\n[PR #1865](https://github.com/XiaomiMiMo/MiMo-Code/pull/1865) は stacked PR で、base は #1864 の `feat/view-image-tool` ブランチです。まず次の変更を導入しました。\n\n- GPT 専用の Bash ガイダンス\n- 機能が重複するファイルツールの非表示化\n- GPT/Claude 向け skill-search prompt と reminder の整合\n\nその後、[PR #1864](https://github.com/XiaomiMiMo/MiMo-Code/pull/1864) で `view_image`、より包括的なツールの非表示化、`tool_script → exec` への移行、GPT prompt、TUI、checkpoint 対応が追加され、最終的に一式が `main` にマージされました。\n\n現在も `skill_search` は GPT/Claude に公開されていますが、system prompt と reminder は能動的な検索を要求しません。これは #1865 の当初のツール非表示化方針を後から調整したものです。\n\n## 現在の課題\n\n- モデル分類が文字列ヒューリスティックに依存しており、Prompt とツール profile のルールが乖離する可能性がある\n- `codex.txt` には、GPT profile で非表示になった Read/Edit/Write/Glob/Grep ツールが今も記載されている\n- `view_image` の公開条件と実行時の image capability check が完全には一致していない\n- `files.readText` は path jail に依存し、通常の `read` permission ask を実行しない\n- QuickJS は Bash に OS レベルの分離を提供しない\n- [`registry-invocation-style.test.ts`](../../packages/opencode/test/tool/registry-invocation-style.test.ts#L17) では、GPT の `exec`、Bash description、`skill_search`、`multiedit` の profile テストが現在スキップされている\n\n## 主要ソースコード\n\n- [`session/system.ts`](../../packages/opencode/src/session/system.ts)：モデル prompt のルーティング\n- [`tool/registry.ts`](../../packages/opencode/src/tool/registry.ts)：GPT ツール ABI\n- [`tool/tool-script.ts`](../../packages/opencode/src/tool/tool-script.ts)：`exec` の宣言、dispatch、budget、結果\n- [`tool/tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts)：同一ソースによるツール filtering と制御フローの除外\n- [`workflow/sandbox.ts`](../../packages/opencode/src/workflow/sandbox.ts)：QuickJS sandbox\n- [`session/prompt.ts`](../../packages/opencode/src/session/prompt.ts)：ツール実行 context と permission routing\n- [`provider/transform.ts`](../../packages/opencode/src/provider/transform.ts)：Responses reasoning の round-trip\n"},{"path":"architecture/codex-microkernel-runtime.md","title":"MiMoCode 面向 GPT 模型的 Codex 微内核运行时","group":"architecture","content":"# MiMoCode 面向 GPT 模型的 Codex 微内核运行时\n\n> “Codex 微内核运行时”是本文对当前架构的概括，不是源码中的正式模块名，也不表示操作系统级微内核。\n\n## 摘要\n\nMiMoCode 在共享 Session 引擎上运行 GPT/Codex 模型，同时向它们暴露一套更小的 Codex 风格工具 ABI：`bash`、`apply_patch`、`view_image` 和 `exec`。`exec` 在 QuickJS 中组合经过授权的宿主工具；权限、路径、子进程、取消、持久化和 UI 始终由宿主控制。\n\n## 核心设计\n\nMiMoCode 没有为 GPT 新建一套 Agent 引擎，而是在统一 Session runtime 上做三件事：\n\n1. 使用 GPT/Codex 专属 system prompt，约定工具选择和调度方式；\n2. 通过 `ToolRegistry` 装配更小的模型专属工具 ABI；\n3. 提供 QuickJS `exec`，在不扩大权限的前提下组合宿主工具。\n\n```mermaid\nflowchart LR\n    Model[GPT / Codex] --> Registry[SystemPrompt + ToolRegistry]\n    Registry --> Direct[bash / apply_patch / view_image]\n    Registry --> Exec[exec / QuickJS]\n    Exec --> Tools[Filtered host tools]\n    Direct --> Host[Permission + path guards]\n    Tools --> Host\n    Host --> Effects[Filesystem / Shell / MCP]\n    Effects --> Session[SessionProcessor / MessageV2 / TUI]\n```\n\n核心原则是：\n\n> 模型决定做什么，`exec` 负责如何组合，宿主决定是否允许以及如何产生副作用。\n\n## GPT 工具 ABI\n\n[`ToolRegistry.available()`](../../packages/opencode/src/tool/registry.ts#L363) 当前通过模型 ID 判断是否启用 GPT profile：ID 包含 `gpt-`，同时排除 `oss` 和 `gpt-4`。\n\n| GPT 可见工具 | 作用 |\n| --- | --- |\n| `bash` | 使用 `rg`、`sed` 等检查和搜索文件，并执行命令 |\n| `apply_patch` | 以结构化 patch 修改文本文件 |\n| `view_image` | 将本地 JPEG、PNG、GIF、WebP 转为模型附件 |\n| `exec` | 在 QuickJS 中批量调用和聚合宿主工具 |\n\nGPT profile 会隐藏能力重叠的 `read`、`write`、`edit`、`multiedit`、`grep`、`glob` 和 `notebook_edit`。其他工具仍按 provider、agent allowlist 和运行时 permission 治理。\n\n[`SystemPrompt.provider()`](../../packages/opencode/src/session/system.ts#L24) 独立选择 `gpt.txt`、`codex.txt` 或 `beast.txt`。Prompt 路由与工具 profile 目前是两套字符串规则，尚未统一成模型能力协商层。\n\n## `exec` 微内核\n\n[`ToolScriptTool`](../../packages/opencode/src/tool/tool-script.ts#L303) 对模型暴露为 `exec`。模型提交一个 TypeScript/JavaScript async function body，通过 `tools.\u003cname>()` 调用宿主工具。\n\n### 为什么不会绕过权限\n\n[`tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts#L1) 使用 late-bound registry，让 `exec` 取得和外层相同、已经过 model/agent 过滤的 `Tool.Def`：\n\n- 外层不可见的 `read`、`write`、`edit` 不会在 `exec` 内重新出现；\n- builtin 子调用执行原来的 `Tool.Def.execute()` 和 `Tool.Context`；\n- MCP 子调用仍逐次执行 `ctx.ask()`；\n- `exec_command` 只是 `bash` 的别名，权限和执行路径相同。\n\n`task`、`actor`、`question`、`skill`、`workflow`、`cron`、`session` 等控制流工具被排除，因为它们改变对话或调度状态，不适合隐藏在一次脚本调用中。\n\n### 两层安全边界\n\n1. [`evalScript()`](../../packages/opencode/src/workflow/sandbox.ts#L106) 用 QuickJS 隔离 guest code，不提供 Node、`process`、`fetch`、timer 或模块加载；\n2. 真正副作用仍由宿主工具执行，并经过 permission、external-directory、memory guard 和工具自身校验。\n\nQuickJS 只隔离 `exec` 代码。`bash` 仍是真实 Shell，不是容器 sandbox。\n\n### 资源限制\n\n| 资源 | 默认值 / 上限 |\n| --- | --- |\n| 嵌套工具调用 | 默认 50，最高 500 |\n| 并发调用 | 8 |\n| 活跃计算 | 默认 60 秒，最高 600 秒 |\n| Wall clock | 30 分钟 |\n| Guest 内存 | 默认 64 MiB |\n| 代码 / 返回值 / 日志 | 128 KiB / 256 KiB / 64 KiB |\n| `files.*` 单文件 | 10 MiB |\n\n`files.readText` 只能读取 worktree 或 OS tmp 内的 UTF-8 文本；`files.writeText` 只能写 OS tmp。项目变更必须调用受权限控制的宿主工具。\n\n## 其他关键原语\n\n### `apply_patch`\n\n[`ApplyPatchTool`](../../packages/opencode/src/tool/apply_patch.ts#L24) 在写入前解析所有 hunks、检查路径、计算 diff 并请求 `edit` permission；写入后发布文件事件、运行格式化并刷新 LSP。\n\n它会预验证全部 patch，但多文件写入不是事务性的，中途失败不会自动回滚已写文件。\n\n### `view_image`\n\n[`ViewImageTool`](../../packages/opencode/src/tool/view-image.ts#L23) 检查模型 image capability、external-directory 和 `read` permission，再验证图片格式并返回 data URL attachment。\n\n当前限制：\n\n- `detail` 只写入 metadata，不改变图片处理；\n- 没有独立的图片大小限制；\n- `exec` 只传递文本、metadata 和 JSON 值，不能透传图片 attachment，因此图片应直接调用 `view_image`。\n\n## OpenAI Responses\n\nOpenAI provider 通过 [`sdk.responses(modelID)`](../../packages/opencode/src/provider/provider.ts#L203) 发送请求。[`ProviderTransform.options()`](../../packages/opencode/src/provider/transform.ts#L1275) 默认设置 `store: false`，并为 GPT-5 reasoning 模型请求 `reasoning.encrypted_content`。\n\nMiMoCode 将 provider metadata 写入消息并在下一轮回放，使无状态 Responses 工具循环可以继续推理；同时在发送前移除不可安全复用的 `itemId`，避免服务端或代理解析失效的 `rs_...` 引用。\n\n[`CodexAuthPlugin`](../../packages/opencode/src/plugin/codex.ts#L364) 另行负责 ChatGPT Plus/Pro OAuth、token refresh、账户 header 和 Codex endpoint rewrite。它属于认证与传输层，不改变工具权限。\n\n## PR 演化\n\n[PR #1865](https://github.com/XiaomiMiMo/MiMo-Code/pull/1865) 是 stacked PR，base 指向 #1864 的 `feat/view-image-tool` 分支。它先完成：\n\n- GPT 专属 Bash guidance；\n- 隐藏重叠文件工具；\n- 对齐 GPT/Claude 的 skill-search prompt 和 reminder。\n\n[PR #1864](https://github.com/XiaomiMiMo/MiMo-Code/pull/1864) 随后继续加入 `view_image`、更完整的工具裁剪、`tool_script → exec`、GPT prompt、TUI 和 checkpoint 支持，最终整体合入 `main`。\n\n当前 `skill_search` 仍向 GPT/Claude 暴露，但 system prompt 和 reminder 不主动要求它们搜索；这是 #1865 初始“隐藏工具”策略的后续调整。\n\n## 当前缺口\n\n- 模型分类依赖字符串启发式，Prompt 与工具 profile 规则可能漂移；\n- `codex.txt` 仍提到 GPT profile 已隐藏的 Read/Edit/Write/Glob/Grep 工具；\n- `view_image` 的暴露条件与执行期 image capability check 不完全一致；\n- `files.readText` 依赖路径 jail，不执行普通 `read` permission ask；\n- QuickJS 不能让 Bash 获得 OS 级隔离；\n- [`registry-invocation-style.test.ts`](../../packages/opencode/test/tool/registry-invocation-style.test.ts#L17) 中 GPT `exec`、Bash description、`skill_search` 和 `multiedit` profile 用例目前被跳过。\n\n## 关键源码\n\n- [`session/system.ts`](../../packages/opencode/src/session/system.ts)：模型提示词路由；\n- [`tool/registry.ts`](../../packages/opencode/src/tool/registry.ts)：GPT 工具 ABI；\n- [`tool/tool-script.ts`](../../packages/opencode/src/tool/tool-script.ts)：`exec` 声明、dispatch、预算与结果；\n- [`tool/tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts)：同源工具过滤和控制流排除；\n- [`workflow/sandbox.ts`](../../packages/opencode/src/workflow/sandbox.ts)：QuickJS sandbox；\n- [`session/prompt.ts`](../../packages/opencode/src/session/prompt.ts)：工具执行上下文和 permission routing；\n- [`provider/transform.ts`](../../packages/opencode/src/provider/transform.ts)：Responses reasoning round-trip。\n"},{"path":"architecture/codex-microkernel-runtime.ru.md","title":"Микроядерная среда выполнения Codex в MiMoCode для моделей GPT","group":"architecture","content":"# Микроядерная среда выполнения Codex в MiMoCode для моделей GPT\n\n> «Микроядерная среда выполнения Codex» — это используемое в данной статье обобщённое название текущей архитектуры, а не официальное имя модуля в исходном коде; оно также не означает микроядро уровня операционной системы.\n\n## Краткое описание\n\nMiMoCode запускает модели GPT/Codex на общем движке сеансов и предоставляет им сокращённый ABI инструментов в стиле Codex: `bash`, `apply_patch`, `view_image` и `exec`. `exec` компонует авторизованные инструменты хоста внутри QuickJS, при этом разрешения, пути, дочерние процессы, отмена, сохранение состояния и пользовательский интерфейс всегда остаются под контролем хоста.\n\n## Основная архитектура\n\nMiMoCode не создаёт для GPT отдельный агентный движок, а выполняет три задачи поверх единой среды выполнения сеансов:\n\n1. Использует специальный системный промпт для GPT/Codex, определяющий порядок выбора и оркестрации инструментов;\n2. Формирует с помощью `ToolRegistry` сокращённый ABI инструментов, предназначенный для конкретной модели;\n3. Предоставляет `exec` на базе QuickJS для композиции инструментов хоста без расширения разрешений.\n\n```mermaid\nflowchart LR\n    Model[GPT / Codex] --> Registry[SystemPrompt + ToolRegistry]\n    Registry --> Direct[bash / apply_patch / view_image]\n    Registry --> Exec[exec / QuickJS]\n    Exec --> Tools[Отфильтрованные инструменты хоста]\n    Direct --> Host[Разрешения + проверка путей]\n    Tools --> Host\n    Host --> Effects[Файловая система / Shell / MCP]\n    Effects --> Session[SessionProcessor / MessageV2 / TUI]\n```\n\nОсновной принцип:\n\n> Модель решает, что делать, `exec` определяет, как это скомпоновать, а хост решает, разрешено ли действие и каким образом оно создаёт побочные эффекты.\n\n## ABI инструментов GPT\n\n[`ToolRegistry.available()`](../../packages/opencode/src/tool/registry.ts#L363) в настоящее время определяет необходимость включения профиля GPT по идентификатору модели: идентификатор должен содержать `gpt-`, но не должен содержать `oss` или `gpt-4`.\n\n| Инструмент, доступный GPT | Назначение |\n| --- | --- |\n| `bash` | Просмотр и поиск файлов с помощью `rg`, `sed` и других средств, а также выполнение команд |\n| `apply_patch` | Изменение текстовых файлов с помощью структурированного патча |\n| `view_image` | Преобразование локальных файлов JPEG, PNG, GIF и WebP во вложения для модели |\n| `exec` | Пакетный вызов и агрегация инструментов хоста внутри QuickJS |\n\nПрофиль GPT скрывает инструменты с пересекающимися возможностями: `read`, `write`, `edit`, `multiedit`, `grep`, `glob` и `notebook_edit`. Остальные инструменты по-прежнему управляются настройками провайдера, списком разрешённых инструментов агента и разрешениями среды выполнения.\n\n[`SystemPrompt.provider()`](../../packages/opencode/src/session/system.ts#L24) независимо выбирает `gpt.txt`, `codex.txt` или `beast.txt`. В настоящее время маршрутизация промптов и выбор профиля инструментов основаны на двух разных наборах строковых правил и ещё не объединены в единый слой согласования возможностей модели.\n\n## Микроядро `exec`\n\n[`ToolScriptTool`](../../packages/opencode/src/tool/tool-script.ts#L303) предоставляется модели под именем `exec`. Модель передаёт тело асинхронной функции TypeScript/JavaScript и вызывает инструменты хоста через `tools.\u003cname>()`.\n\n### Почему разрешения нельзя обойти\n\nВ [`tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts#L1) используется реестр с поздним связыванием, благодаря которому `exec` получает те же `Tool.Def`, уже отфильтрованные по модели и агенту, что и внешний уровень:\n\n- Недоступные на внешнем уровне `read`, `write` и `edit` не появляются повторно внутри `exec`;\n- Вложенные вызовы встроенных инструментов используют исходные `Tool.Def.execute()` и `Tool.Context`;\n- Вложенные вызовы MCP по-прежнему каждый раз выполняют `ctx.ask()`;\n- `exec_command` — лишь псевдоним `bash` с теми же разрешениями и путём выполнения.\n\nИнструменты управления потоком `task`, `actor`, `question`, `skill`, `workflow`, `cron`, `session` и другие исключены, поскольку они изменяют состояние диалога или оркестрации и не должны быть скрыты внутри одного вызова скрипта.\n\n### Два уровня защиты\n\n1. [`evalScript()`](../../packages/opencode/src/workflow/sandbox.ts#L106) изолирует гостевой код с помощью QuickJS и не предоставляет Node, `process`, `fetch`, таймеры или загрузку модулей;\n2. Реальные побочные эффекты по-прежнему выполняются инструментами хоста и проходят проверки разрешений (permission), внешних каталогов (external-directory), защиты памяти (memory guard), а также проверки самих инструментов.\n\nQuickJS изолирует только код `exec`. `bash` по-прежнему является реальной командной оболочкой, а не контейнерной песочницей.\n\n### Ограничения ресурсов\n\n| Ресурс | Значение по умолчанию / предел |\n| --- | --- |\n| Вложенные вызовы инструментов | По умолчанию 50, максимум 500 |\n| Параллельные вызовы | 8 |\n| Активные вычисления | По умолчанию 60 секунд, максимум 600 секунд |\n| Общее время выполнения | 30 минут |\n| Память гостевой среды | По умолчанию 64 MiB |\n| Код / возвращаемое значение / журнал | 128 KiB / 256 KiB / 64 KiB |\n| Один файл `files.*` | 10 MiB |\n\n`files.readText` может читать только текст UTF-8 из worktree или OS tmp; `files.writeText` может записывать только в OS tmp. Для изменений в проекте необходимо вызывать инструменты хоста, контролируемые системой разрешений.\n\n## Другие ключевые примитивы\n\n### `apply_patch`\n\nПеред записью [`ApplyPatchTool`](../../packages/opencode/src/tool/apply_patch.ts#L24) разбирает все фрагменты патча, проверяет пути, вычисляет различия и запрашивает разрешение `edit`; после записи он публикует события файлов, запускает форматирование и обновляет LSP.\n\nВсе части патча проходят предварительную проверку, однако запись нескольких файлов не является транзакционной: ошибка в процессе не приводит к автоматическому откату уже записанных файлов.\n\n### `view_image`\n\n[`ViewImageTool`](../../packages/opencode/src/tool/view-image.ts#L23) проверяет поддержку изображений моделью (image capability), доступ к внешним каталогам (external-directory) и разрешение `read`, затем проверяет формат изображения и возвращает вложение в виде data URL.\n\nТекущие ограничения:\n\n- `detail` записывается только в метаданные и не влияет на обработку изображения;\n- Отдельное ограничение размера изображения отсутствует;\n- `exec` передаёт только текст, метаданные и значения JSON, но не может передавать вложения с изображениями, поэтому для изображений следует напрямую вызывать `view_image`.\n\n## OpenAI Responses\n\nПровайдер OpenAI отправляет запросы через [`sdk.responses(modelID)`](../../packages/opencode/src/provider/provider.ts#L203). [`ProviderTransform.options()`](../../packages/opencode/src/provider/transform.ts#L1275) по умолчанию устанавливает `store: false` и запрашивает `reasoning.encrypted_content` для моделей GPT-5 с поддержкой рассуждений.\n\nMiMoCode записывает метаданные провайдера в сообщение и воспроизводит их в следующем цикле, позволяя не сохраняющему состояние инструментальному циклу Responses продолжать рассуждение; одновременно перед отправкой удаляются `itemId`, которые нельзя безопасно использовать повторно, чтобы сервер или прокси не пытался разобрать недействительные ссылки `rs_...`.\n\n[`CodexAuthPlugin`](../../packages/opencode/src/plugin/codex.ts#L364) отдельно отвечает за OAuth ChatGPT Plus/Pro, обновление токена, заголовок учётной записи и перезапись конечной точки Codex. Он относится к уровню аутентификации и транспорта и не изменяет разрешения инструментов.\n\n## Эволюция PR\n\n[PR #1865](https://github.com/XiaomiMiMo/MiMo-Code/pull/1865) — это stacked PR, базой которого служит ветка `feat/view-image-tool` из #1864. Сначала он добавил:\n\n- специальные инструкции Bash для GPT;\n- скрытие файловых инструментов с пересекающимися возможностями;\n- согласование prompt и reminder для поиска skills у GPT и Claude.\n\nЗатем [PR #1864](https://github.com/XiaomiMiMo/MiMo-Code/pull/1864) добавил `view_image`, более полное скрытие инструментов, переход `tool_script → exec`, prompt GPT, интеграцию с TUI и поддержку checkpoint, после чего весь набор изменений был объединён с `main`.\n\nСейчас `skill_search` по-прежнему доступен GPT и Claude, однако system prompt и reminder не предлагают этим моделям выполнять поиск автоматически. Это более позднее уточнение первоначальной политики скрытия инструментов из #1865.\n\n## Текущие пробелы\n\n- Классификация моделей основана на строковых эвристиках, поэтому правила Prompt и профиля инструментов могут расходиться;\n- `codex.txt` всё ещё упоминает инструменты Read/Edit/Write/Glob/Grep, скрытые профилем GPT;\n- условия показа `view_image` и проверка поддержки изображений во время выполнения согласованы не полностью;\n- `files.readText` полагается на ограничение путей и не выполняет обычный запрос разрешения `read`;\n- QuickJS не обеспечивает для Bash изоляцию на уровне операционной системы;\n- тесты профиля GPT для `exec`, описания Bash, `skill_search` и `multiedit` в [`registry-invocation-style.test.ts`](../../packages/opencode/test/tool/registry-invocation-style.test.ts#L17) сейчас пропущены.\n\n## Ключевые исходные файлы\n\n- [`session/system.ts`](../../packages/opencode/src/session/system.ts): маршрутизация prompt моделей;\n- [`tool/registry.ts`](../../packages/opencode/src/tool/registry.ts): ABI инструментов GPT;\n- [`tool/tool-script.ts`](../../packages/opencode/src/tool/tool-script.ts): объявление `exec`, dispatch, бюджеты и результаты;\n- [`tool/tool-script-ref.ts`](../../packages/opencode/src/tool/tool-script-ref.ts): единая фильтрация инструментов и исключение управления потоком;\n- [`workflow/sandbox.ts`](../../packages/opencode/src/workflow/sandbox.ts): sandbox QuickJS;\n- [`session/prompt.ts`](../../packages/opencode/src/session/prompt.ts): контекст выполнения инструментов и маршрутизация разрешений;\n- [`provider/transform.ts`](../../packages/opencode/src/provider/transform.ts): round-trip рассуждений Responses.\n"},{"path":"architecture/core-vs-skills.ja.md","title":"oimo 機能追加の置き場所方針（コア / ビルトイン / agent-skills）","group":"architecture","content":"# oimo 機能追加の置き場所方針（コア / ビルトイン / agent-skills）\n\n> 採用方針（2026-08-26）。機能を足すとき「本隊を触るか・同梱スキルか・配布リポか」を自動で振り分けるための判断基準。  \n> エージェントは本ドキュメントに従い、実装前に置き場を決めてから着手する。\n\n## 結論\n\n**デフォルトはスキル側。本隊改造はプラットフォームに限る。**\n\n- **oimo 全員に同梱したい** → ビルトイン（`src/skill/builtin/.bundle`）\n- **ビルトインが他ホストでも有用** → **同じ能力を [`kuwa2005/agent-skills`](https://github.com/kuwa2005/agent-skills) にも載せる**（ポータブル版）\n- **最初からホスト横断・任意インストール** → agent-skills のみ（同梱は不要ならビルトインに載せない）\n- **実行時の不変条件** → 本隊\n\n```\n新しい機能の置き場所?\n\n  実行時の不変条件・安全・セッション・TUI・プロバイダ・権限か?\n    YES → 本隊（packages/opencode）\n    NO  ↓\n\n  oimo を入れた全員に最初から載せたい製品能力か?\n    YES → ビルトインに追加\n         └─ Cursor / OpenCode でも有用? → agent-skills にも追加（推奨）\n    NO  ↓\n\n  Cursor / OpenCode / oimo 横断、または任意インストールでよいか?\n    YES → agent-skills のみ\n    NO  → プロジェクトローカル .oimo/skills\n```\n\n| 層 | 役割 | 置き場 |\n|---|---|---|\n| **本隊** | エンジン・TUI・信頼性・権限 | `packages/opencode/src/**` |\n| **ビルトイン** | oimo 製品同梱 | `packages/opencode/src/skill/builtin/.bundle/**` |\n| **agent-skills** | ホスト横断のポータブル配布 | [`kuwa2005/agent-skills`](https://github.com/kuwa2005/agent-skills) → `~/.cursor/skills` / `~/.config/opencode/skills` / `~/.config/oimo/skills` |\n| **プロジェクト** | リポ固有の結晶化 | `\u003cworktree>/.oimo/skills/` |\n\nCompose 内部スキル（`skill/compose/.bundle`）はユーザー向けではなく Compose 専用オーケストレーション。本方針の「ビルトイン充実」とは別枠。\n\n---\n\n## ビルトイン → agent-skills の昇格（必須ルール）\n\nビルトインに入れたスキルが **oimo 以外でも役立つ**（手順・スクリプトがホスト非依存、または軽い条件分岐で足りる）なら、**agent-skills にも入れる**。\n\n| 観点 | ビルトイン側 | agent-skills 側 |\n|---|---|---|\n| 目的 | oimo 同梱の既定体験 | Cursor / OpenCode / oimo への curl 配布 |\n| oimo 専用 API 依存 | そのまま書いてよい | 削る／「oimo では同梱版を優先」と書く／フォールバックを書く |\n| 更新 | oimo リリースに乗せる | agent-skills を独立に更新してよい（内容は揃える） |\n| catalog | — | 既定利用者向けなら `catalog.txt`、任意なら `optional.txt` |\n\n**二重メンテは許容する。** ただし片方だけ古くしない。ビルトインを直したら agent-skills 側の要否を必ず確認し、載っているなら同じ PR シリーズで追従する（リポが別なら follow-up タスクを残す）。\n\noimo 専用すぎて他ホストで無意味なもの（例: `mimocode-docs` の製品リファレンス全文、`evolve` の oimo パス前提）は **ビルトインのみ**でよい。ポータブルな核だけ切り出せるなら、薄い版を agent-skills に出す。\n\n---\n\n## 現状の境界（根拠）\n\n### 本隊\n\nセッションループ、LLM、再試行、ツール、権限、プロバイダ、メモリ配管、TUI、ホットリロード土台。\n\n### ビルトイン\n\n`builtin/extract.ts` で `~/.local/share/oimo/builtin_skills/\u003cversion>/skills/` へ展開。  \n`MIMOCODE_DISABLE_BUILTIN_SKILLS` 等で切れる → 切られても必須動作は本隊側で保つ。\n\n### agent-skills\n\n`curl | bash` で三ホストへインストール。開発衛生・ドメインスクリプト・任意スキルの倉庫。\n\n### 上書き順\n\nユーザー／`~/.config/oimo/skills` は同名でビルトインを上書きできる。同梱は既定、配布・プロジェクトは上書き。\n\n---\n\n## 判断基準（チェックリスト）\n\n### A. 本隊\n\n次の **いずれか** のときだけ。\n\n1. スキル無効でも壊れてはいけない動作\n2. TUI / API / プロトコル変更\n3. 新ランタイム primitive\n4. セキュリティ／サンドボックス境界\n5. 信頼性ホットパス（リトライ、フェイルオーバー等）\n\n本隊は薄く。手順の文章はスキルへ。\n\n### B. ビルトイン\n\n次を満たすとき。\n\n1. oimo 利用者の大多数に最初から見せたい\n2. バイナリ版と手順を揃えたい、または oimo API に依存する\n\n追加後: **他ホストでも有用なら agent-skills にも載せる**（上記昇格ルール）。\n\n### C. agent-skills のみ\n\n1. 最初からホスト横断・任意インストールで十分\n2. 同梱するとバイナリが重い／更新を oimo リリースから切り離したい\n3. すでに agent-skills が真実で、oimo 同梱が不要\n\n### D. プロジェクト `.oimo/skills`\n\nそのリポ固有。evolve / distill の出力。製品配布には使わない（汎用化したら B または C へ昇格）。\n\n---\n\n## エージェント向け：自動振り分け手順\n\n機能追加・仕様変更の依頼を受けたら、実装前に必ず:\n\n1. 本ドキュメントのフローチャートで置き場を決める（本隊 / ビルトイン / agent-skills / プロジェクト）\n2. ユーザーへの最初の実質作業説明に、選びと一言理由を書く（例:「ホスト横断なので agent-skills」「セッション契約なので本隊」）\n3. ビルトインに足す場合、agent-skills への同時追加または follow-up の要否を明示する\n4. PR / コミット説明に置き場を1行含める\n\n置き場が曖昧なら、スキル側（ビルトインまたは agent-skills）を既定とし、本隊は primitive 不足が証明されたときだけ触る。\n\n---\n\n## 具体例\n\n| やりたいこと | 置き場 |\n|---|---|\n| レート制限バックオフ、セッション停止ダイアログ | 本隊 |\n| `--log` 既定 ON | 本隊 |\n| Excel → 仕様書 | agent-skills（既存） |\n| verify / prevent-secret-leak | agent-skills（既存） |\n| `/evolve`（oimo API 密結合） | ビルトイン（他ホスト向け薄版が作れるなら agent-skills も） |\n| 汎用デザイン指針（frontend-design） | ビルトインに載せるなら **agent-skills にも載せる**（既存 optional と揃える） |\n| PR babysit | agent-skills |\n| 新プロバイダ | 本隊 |\n\n---\n\n## PR レビュー用チェック\n\n- [ ] 置き場は 本隊 / ビルトイン / agent-skills / プロジェクト のどれか明示\n- [ ] スキル無効時に必須動作が壊れない\n- [ ] ビルトイン追加時、agent-skills への同時追加 or 「oimo 専用のため不要」の理由がある\n- [ ] 両方にあるスキルを直したとき、片方だけの古さを残していない\n\n---\n\n## 変更履歴\n\n| 日付 | 内容 |\n|---|---|\n| 2026-08-26 | 初版 |\n| 2026-08-26 | 有用なビルトインは agent-skills にも載せる方針に変更。エージェント自動振り分け手順を追加 |\n"},{"path":"auto-free-fcc-sync.md","title":"Auto (無料) カタログと Free Claude Code の同期","group":"トップ","content":"# Auto (無料) カタログと Free Claude Code の同期\n\nOpen Mimo Code の `auto/free` は **内製の first-frame フォールバック**で動く。Free Claude Code（FCC）はランタイム依存ではなく、**無料候補カタログの上流**として定期取り込みする。\n\n将来の `auto/paid` / `auto/hybrid`（無料を使い、能力不足で有料へ）は [auto-mode-roadmap.md](./auto-mode-roadmap.md) を参照。\n\n## 境界\n\n| 取り込む | 取り込まない |\n|----------|----------------|\n| 無料向けデフォルト / smoke 既知の `provider/model` 候補 | Python `ProviderExecutor` / Admin UI |\n| FCC `provider_id` → OIMO provider id マップ更新 | Anthropic / Responses wire 変換 |\n| ドキュメント上の MODEL_FALLBACKS 例のうち無料寄り | クライアント向け proxy ランチャ |\n\nFailover 状態機械（first-frame コミット）は OIMO の TypeScript が所有する。仕様の参照元は FCC の `docs/provider-failover-and-routing.md`。\n\n## 同期手順\n\n```bash\n# 既定: ../free-claude-code（このリポジトリの隣）\nbun script/sync-auto-free-catalog.ts\n\n# パス指定\nFCC_ROOT=/home/ubuntu/workspace/free-claude-code bun script/sync-auto-free-catalog.ts\n```\n\n出力: [`packages/opencode/src/provider/auto-free-catalog.json`](../packages/opencode/src/provider/auto-free-catalog.json)\n\nマップ: [`packages/opencode/src/provider/auto-free/provider-map.ts`](../packages/opencode/src/provider/auto-free/provider-map.ts)\n\n## 差分レビュー観点\n\n1. 新しい FCC provider_id が未マップで warn されていないか → マップに追加するか意図的スキップか\n2. 候補に有料モデルが混入していないか（`:free` / Zen `cost.input===0` / 明示 note）\n3. `opencode/big-pickle` が先頭付近に残っているか（ゼロ設定動作）\n4. ToS 非準拠・スクレイプ系 endpoint を入れていないか（FCC 方針に合わせる）\n\n## ランタイム上書き\n\n`oimo.json`:\n\n```json\n{\n  \"auto_free\": {\n    \"fallbacks\": [\n      \"opencode/big-pickle\",\n      \"openrouter/openai/gpt-oss-120b:free\"\n    ]\n  }\n}\n```\n\n設定がある場合はカタログの先頭列より優先。その後も **ロード済みの OpenCode Zen 無料モデル（`cost.input === 0`）は自動で末尾に追加**される。\n\n## ゼロ設定で使えるもの\n\nキーやログインなしでも、OpenCode Zen の無料プール（`apiKey: \"public\"`）上の **active な無料モデル**（`cost.input === 0` かつ `status !== deprecated`）が Auto(無料) の候補になる。設定不要で first-frame フォールバックが効く。\n\n[`models.dev`](https://models.dev/api.json) の `opencode.models` を正とする。2026-09 時点の active 無料 7 件（試行優先順は [`ZEN_FREE_PREFERRED_ORDER`](../packages/opencode/src/provider/auto-free/resolve.ts)）:\n\n| 試行順 | model id | 表示名 |\n|--------|----------|--------|\n| 1 | `big-pickle` | Big Pickle |\n| 2 | `nemotron-3-ultra-free` | Nemotron 3 Ultra |\n| 3 | `nemotron-3.5-lightning-free` | Nemotron 3.5 Lightning |\n| 4 | `mimo-v2.5-free` | MiMo V2.5 |\n| 5 | `muse-spark-1.3-contributor-free` | Muse Spark 1.3 |\n| 6 | `muse-spark-1.2-contributor-free` | Muse Spark 1.2 |\n| 7 | `ling-3.0-flash-fin-free` | Ling 3.0 Flash Fin |\n\n`big-pickle` は起動時プローブとカタログ prior で先頭を維持。他 6 件は Zen プールから自動追加され、上記順で failover する。\n\n**MiMo について:** Xiaomi 直 API や旧 `mimo-v2-flash-free` 等の無料キャンペーン終了と、OpenCode Zen の `mimo-v2.5-free` は別枠。Zen 上では `cost.input: 0` / `active` のまま（Windows 版 OpenCode で無料応答があるのはこのプール）。`mimo-v2-flash-free` 等は models.dev 上 `deprecated`。\n\nFCC 由来の OpenRouter / NVIDIA / Groq などは、利用者がキーを入れたときだけ候補に乗る（ボーナス）。\n\n## アカウント＋APIキー設定ヘルパー\n\n「無料」でも各社サイトでのアカウント作成が必要なプロバイダ向け:\n\n- TUI: `/free-setup` またはモデル選択の「無料プロバイダのキーを追加…」\n- 実装: `dialog-auto-free-setup.tsx` + `auto-free/setup-providers.ts`\n- 流れ: 登録 URL をブラウザで開く → API キー貼り付け → `auth.set` → Auto(無料) 候補に反映\n\n| プロバイダ | 登録 URL |\n|-----------|----------|\n| OpenRouter | https://openrouter.ai/keys |\n| NVIDIA NIM | https://build.nvidia.com/settings/api-keys |\n| Groq | https://console.groq.com/keys |\n"},{"path":"auto-mode-roadmap.md","title":"Auto モード ロードマップ","group":"トップ","content":"# Auto モード ロードマップ\n\n現状は **Auto(無料)**（公開 ID: `auto/free`）のみ実装する。有料・併用は後続。\n\n## 公開 ID（予約）\n\n| 公開 ID | UI 名（案） | 状態 | 候補列 |\n|---------|-------------|------|--------|\n| `auto/free` | Auto (無料) | **現行** | 無料枠のみ。FCC カタログ＋認証済み候補を first-frame フォールバック |\n| `auto/paid` | Auto (有料) | 将来 | 有料モデルのみの順序付き候補 |\n| `auto/hybrid` | Auto (無料＋有料) | 将来 | **無料を先に試し、能力不足と判断したら有料へ** |\n\n名前空間 `auto/*` を空けておく。有料込みの「全部入り」を単に `auto` にしない（無料専用と混同しやすい）。\n\n## Auto (無料＋有料) の意図\n\n```text\n優秀な無料枠 → … → 弱い無料枠 まで試す\n        │\n        └─「お馬鹿な無料枠では対応しきれない」と判断\n              → 有料枠へエスカレーション\n```\n\n- 目的: 普段は無料枠を使い切り、難しい依頼だけ有料に落とす\n- 「対応しきれない」は **レート制限だけでは足りない**。品質・能力不足（ツール失敗の反復、計画不能、ユーザー意図の取り違え等）を検知して有料へ上げる\n- first-frame 障害フォールバック（429/5xx）とは **別レイヤ**: 障害切替はリクエスト前半、能力エスカレーションはターン／タスク単位で後から設計する\n\n## 能力エスカレーション（将来設計メモ）\n\n障害フォールバック（現行 `auto/free`）と混ぜない。\n\n| 層 | トリガ | 挙動 |\n|----|--------|------|\n| L1 障害 failover | 429 / 5xx、first-frame 前 | 次の **同ティア** 候補（無料→無料） |\n| L2 能力 escalate | 無料候補を使い尽くした／品質シグナル | **有料候補列**へ。同一ターン再試行 or 次ターンから有料固定 |\n\n品質シグナル案（未実装・要検証）:\n\n- 同一ツール失敗・同一編集の反復（既存 try-best / repeated-step と整合）\n- モデル自身の「できない」表明＋検証失敗\n- ユーザー明示の「もっと賢いモデルで」\n- コンパクション／コンテキスト破綻が無料枠の窓制限に起因する場合\n\n**やらないこと（現行方針の延長）:**\n\n- 部分出力後に別モデルでサイレントやり直し（first-frame 規則）\n- 有料を黙って先頭に差し込む（コスト不意打ち）\n- 無料カタログに有料 ref を混ぜる\n\n## 実装順序（将来）\n\n1. `auto/free` 安定化＋FCC カタログ同期運用（現行）\n2. `auto/paid` — 同じ Failover エンジンに有料候補カタログを載せるだけ\n3. `auto/hybrid` — L1 は無料列、L2 で有料列へ。UI でコスト注意を明示\n\n## 関連\n\n- 同期運用: [auto-free-fcc-sync.md](./auto-free-fcc-sync.md)\n- FCC 仕様参照: `free-claude-code/docs/provider-failover-and-routing.md`\n"},{"path":"compose/plans/2025-07-01-fix-task-component-spawn-rendering.md","title":"Fix Task Component Rendering for Spawned Actors","group":"plans","content":"# Fix Task Component Rendering for Spawned Actors\n\n> [!NOTE]\n> This document may not reflect the current implementation.\n> See the final report for up-to-date state:\n> [Final Report](../reports/task-spawn-rendering.md)\n\n> **For agentic workers:** REQUIRED SUB-SKILL: Use compose:subagent (recommended) or compose:execute to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.\n\n**Goal:** Fix the `Task` TUI component so that spawned (background) actors are displayed with running/spinner state until the actor actually completes, rather than showing a misleading \"completed\" state with 0ms duration.\n\n**Architecture:** The `Task` component currently determines its visual state solely from `props.part.state.status` (the tool part's completion status). For `spawn` operations, this becomes \"completed\" immediately (spawn itself returned successfully), even though the spawned actor is still running. The fix adds a secondary check against the actor's actual runtime status from `sync.data.actor[sessionID]`. Additionally, `wait` tool calls (which have no `description`) should display context about what they're waiting for.\n\n**Tech Stack:** SolidJS (TUI rendering), TypeScript\n\n## Global Constraints\n\n- Run typecheck from `packages/opencode` via `bun typecheck`\n- Tests cannot run from repo root; run from `packages/opencode`\n- Avoid `any` types; rely on type inference where possible\n- Follow the existing code style (no destructuring, const-over-let, no else statements)\n\n---\n\n## Problem Summary\n\nWhen the LLM uses `actor spawn` + `actor wait` pattern:\n\n1. **spawn tool part** → status \"completed\" immediately (spawn returned actor_id)\n2. **Task component** sees `props.part.state.status === \"completed\"` → renders `└ N toolcalls · 0ms`\n3. The 0ms happens because `duration()` reads the subagent's last assistant message `time.completed`, which is still `undefined` (subagent still running)\n4. **wait tool part** → status \"running\", but `input().description` is `undefined` → renders as a bare spinner with no context\n\nThe user sees: completed-looking tasks (clickable, with metadata) at top, mysterious spinners at bottom. The \"completed\" tasks are actually still running.\n\n### Root Cause Location\n\n`packages/opencode/src/cli/cmd/tui/routes/session/index.tsx:2721-2811` — the `Task` function.\n\n### Data Available for Fix\n\n- `sync.data.actor[sessionID]` contains `ActorEntry[]` with each actor's real-time `status` field (updated via `actor.status` events)\n- `props.metadata.actorId` identifies which actor this tool call is associated with\n- `props.metadata.sessionId` identifies the session\n\n---\n\n### Task 1: Make Task component check actual actor status for visual state\n\n**Files:**\n- Modify: `packages/opencode/src/cli/cmd/tui/routes/session/index.tsx:2721-2811`\n\n**Interfaces:**\n- Consumes: `sync.data.actor[sessionID]: ActorEntry[]` from the sync store (already available via `useSync()`)\n- Produces: Corrected visual state — shows spinner/running UI when actor is still running, regardless of tool part status\n\n- [ ] **Step 1: Add actor status lookup to Task component**\n\nAfter line 2734 (`const targetBucket = ...`), add a memo that looks up the actual actor status:\n\n```ts\nconst actorStatus = createMemo(() => {\n  const session = targetSession()\n  const actorId = targetBucket()\n  if (!session || actorId === \"main\") return undefined\n  const actors = sync.data.actor[session]\n  if (!actors) return undefined\n  return actors.find((a) => a.actor_id === actorId)?.status\n})\n```\n\n- [ ] **Step 2: Update `isRunning` memo to consider actor status**\n\nReplace the current `isRunning` (line 2757):\n\n```ts\nconst isRunning = createMemo(() => props.part.state.status === \"running\")\n```\n\nWith:\n\n```ts\nconst isRunning = createMemo(() => {\n  if (props.part.state.status === \"running\") return true\n  if (props.part.state.status === \"completed\") {\n    const status = actorStatus()\n    return status === \"running\" || status === \"pending\"\n  }\n  return false\n})\n```\n\n- [ ] **Step 3: Update content memo to not show completed format when actor is still running**\n\nReplace the completed check in the content memo (line 2779):\n\n```ts\nif (props.part.state.status === \"completed\") {\n  content.push(`└ ${tools().length} toolcalls · ${Locale.duration(duration())}`)\n}\n```\n\nWith:\n\n```ts\nif (props.part.state.status === \"completed\" && !isRunning()) {\n  content.push(`└ ${tools().length} toolcalls · ${Locale.duration(duration())}`)\n}\n```\n\n- [ ] **Step 4: Run typecheck**\n\nRun: `bun typecheck` from `packages/opencode`\nExpected: PASS with no new errors\n\n---\n\n### Task 2: Add context to `wait` tool call rendering\n\n**Files:**\n- Modify: `packages/opencode/src/cli/cmd/tui/routes/session/index.tsx:2721-2811`\n\n**Interfaces:**\n- Consumes: `props.input` which for `wait` operations contains `{ operation: { action: \"wait\", actor_id: \"...\" } }`\n- Consumes: `sync.data.actor[sessionID]` to find the actor's description\n- Produces: Meaningful display text for wait operations instead of empty spinners\n\n- [ ] **Step 1: Update input parsing to handle wait/status/cancel operations**\n\nAfter the existing `input` memo, add a fallback description lookup:\n\n```ts\nconst resolvedDescription = createMemo(() => {\n  if (input().description) return input().description\n  const raw = props.input as Partial\u003c{ operation: { action: string; actor_id: string } }>\n  const op = raw?.operation\n  if (!op?.actor_id) return undefined\n  const session = targetSession() ?? props.part.sessionID\n  const actors = sync.data.actor[session]\n  if (!actors) return undefined\n  return actors.find((a) => a.actor_id === op.actor_id)?.description\n})\n```\n\n- [ ] **Step 2: Update content memo and InlineTool to use resolvedDescription**\n\nReplace `if (!input().description) return \"\"` with:\n```ts\nconst desc = resolvedDescription()\nif (!desc) return \"\"\n```\n\nUpdate the content line and InlineTool's `complete` prop accordingly.\n\n- [ ] **Step 3: Update targetSession/targetBucket for wait operations**\n\nAdd fallback logic to read `actor_id` from input when metadata isn't available.\n\n- [ ] **Step 4: Run typecheck**\n\nRun: `bun typecheck` from `packages/opencode`\nExpected: PASS with no new errors\n"},{"path":"compose/plans/2026-06-17-align-last-step-handling.md","title":"Align Last-Step Handling With Provider Requirements Implementation Plan","group":"plans","content":"# Align Last-Step Handling With Provider Requirements Implementation Plan\n\n> [!NOTE]\n> This document may not reflect the current implementation.\n> See the final report for up-to-date state:\n> [Final Report](../reports/align-last-step-handling.md)\n\n> **For agentic workers:** REQUIRED SUB-SKILL: Use compose:subagent (recommended) or compose:execute to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.\n\n**Goal:** Stop ending the conversation on an assistant message when the agent reaches its step cap, so Bedrock-routed Claude no longer returns a 400 (`This model does not support assistant message prefill`), while restoring the step-cap enforcement that the effectify refactor accidentally gutted.\n\n**Architecture:** At `step >= agent.steps` (`isLastStep`), both LLM send sites in `prompt.ts` currently append `{ role: \"assistant\", content: MAX_STEPS }` — an assistant prefill that Bedrock rejects. Replace it with a provider-agnostic pattern: deliver the MAX_STEPS instruction on a **user**-role message (conversation ends on a user turn → accepted by all providers) and set `toolChoice: \"none\"` on the last step so tools are physically disabled (the cap is enforced, not merely requested).\n\n**Tech Stack:** TypeScript, Effect, Bun, the `ai` SDK (`ModelMessage`, `toolChoice`).\n\n---\n\n## Background (verified facts)\n\n- The original feature (upstream PR #4062, `feat: add max steps`) had **three** last-step layers: `system.push(MAX_STEPS)`, `toolChoice: isLastStep ? \"none\"`, and the assistant prefill.\n- The effectify refactor (upstream PR #19483) **dropped** the first two. Today only the assistant prefill remains — so naively deleting it would silently disable step-cap enforcement.\n- The provider-agnostic alternative is to never end on an assistant turn for this purpose: deliver the instruction via a prompt-text/user message plus turn-bounding, since models behind providers that don't support prefill reject conversations ending with an assistant turn.\n- `toolChoice?: \"auto\" | \"required\" | \"none\"` is valid in both `llm.ts:195` (StreamInput) and `max-mode.ts:61` (max-mode path). `\"none\"` is accepted.\n- Both send sites already have `isLastStep` (computed at `prompt.ts:2573`) in scope.\n\n## File Structure\n\n- Modify: `packages/opencode/src/session/prompt.ts`\n  - Main-loop send site (`messages` at `:2720`, `toolChoice` at `:2723`)\n  - Fork-loop send site (`messages` at `:2850`, `toolChoice` at `:2853`)\n- Test: `packages/opencode/src/session/classify.test.ts` is unrelated; the build of the messages array is inline in `prompt.ts` and not independently exported, so verification is via typecheck + a targeted assertion in a new/existing prompt-level test if one exists. If no prompt-level unit harness exists, verification is typecheck + manual reasoning (documented in Task 3).\n\nNo new files. `max-steps.txt` content reused verbatim. No `system.ts` change (the instruction now rides on the last-step user message).\n\n---\n\n### Task 1: Replace prefill with a user-role MAX_STEPS message + restore `toolChoice:\"none\"` at the main-loop send site\n\n**Covers:** core fix (main loop)\n\n**Files:**\n- Modify: `packages/opencode/src/session/prompt.ts:2720` (messages) and `:2723` (toolChoice)\n\n- [ ] **Step 1: Edit the `messages` line (main loop, `:2720`)**\n\nReplace the assistant prefill with a user-role message so the conversation ends on a user turn.\n\nOld:\n```ts\n                messages: [...modelMsgs, ...(isLastStep ? [{ role: \"assistant\" as const, content: MAX_STEPS }] : [])],\n```\n\nNew:\n```ts\n                messages: [...modelMsgs, ...(isLastStep ? [{ role: \"user\" as const, content: MAX_STEPS }] : [])],\n```\n\n- [ ] **Step 2: Edit the `toolChoice` line (main loop, `:2723`)**\n\nRestore last-step tool disabling. Last-step takes precedence over the `json_schema` \"required\" form — the step cap is the harder constraint and a closing summary turn must not be forced into a tool call.\n\nOld:\n```ts\n                toolChoice: format.type === \"json_schema\" ? \"required\" : undefined,\n```\n\nNew:\n```ts\n                toolChoice: isLastStep ? \"none\" : format.type === \"json_schema\" ? \"required\" : undefined,\n```\n\n- [ ] **Step 3: Typecheck**\n\nRun from `packages/opencode`:\n```bash\nbun typecheck\n```\nExpected: PASS (no new errors). `\"none\"` is a valid `toolChoice` literal per `llm.ts:195`.\n\n- [ ] **Step 4: Commit**\n\n```bash\ngit add packages/opencode/src/session/prompt.ts\ngit commit -m \"fix(session): use user-role MAX_STEPS message + toolChoice none on last step (main loop)\n\nThe assistant-prefill MAX_STEPS message made the conversation end on an\nassistant turn, which Bedrock-routed Claude rejects (400, no prefill\nsupport). Deliver the instruction on a user turn instead and restore\ntoolChoice:\\\"none\\\" (lost in the effectify refactor) so the step cap is\nenforced rather than merely requested.\"\n```\n\n---\n\n### Task 2: Apply the identical fix at the fork-loop send site\n\n**Covers:** core fix (fork / subagent loop)\n\n**Files:**\n- Modify: `packages/opencode/src/session/prompt.ts:2850` (messages) and `:2853` (toolChoice)\n\n- [ ] **Step 1: Edit the `messages` line (fork loop, `:2850`)**\n\nOld:\n```ts\n              messages: [...modelMsgs, ...(isLastStep ? [{ role: \"assistant\" as const, content: MAX_STEPS }] : [])],\n```\n\nNew:\n```ts\n              messages: [...modelMsgs, ...(isLastStep ? [{ role: \"user\" as const, content: MAX_STEPS }] : [])],\n```\n\n- [ ] **Step 2: Edit the `toolChoice` line (fork loop, `:2853`)**\n\nNote this site annotates the literal with `as const`; keep that on the `json_schema` branch.\n\nOld:\n```ts\n              toolChoice: format.type === \"json_schema\" ? (\"required\" as const) : undefined,\n```\n\nNew:\n```ts\n              toolChoice: isLastStep ? (\"none\" as const) : format.type === \"json_schema\" ? (\"required\" as const) : undefined,\n```\n\n- [ ] **Step 3: Typecheck**\n\nRun from `packages/opencode`:\n```bash\nbun typecheck\n```\nExpected: PASS. The fork path's `processArgs` flows into both `handle.process` and `MaxMode.runMaxStep`; `max-mode.ts:61` also types `toolChoice?: \"auto\" | \"required\" | \"none\"`, so `\"none\"` is accepted on both.\n\n- [ ] **Step 4: Commit**\n\n```bash\ngit add packages/opencode/src/session/prompt.ts\ngit commit -m \"fix(session): apply user-role MAX_STEPS + toolChoice none on fork last step\n\nMirror the main-loop fix on the fork/subagent send site so subagents that\nhit agent.steps also end on a user turn (Bedrock-safe) with tools disabled.\"\n```\n\n---\n\n### Task 3: Verify the fix end-to-end\n\n**Covers:** verification\n\n**Files:**\n- Read-only inspection of `packages/opencode/src/session/prompt.ts`\n\n- [ ] **Step 1: Confirm no assistant-prefill remains**\n\nRun:\n```bash\ncd /root/projects/.vibe-board-workspaces/41f7-/opencode && grep -n 'role: \"assistant\" as const, content: MAX_STEPS' packages/opencode/src/session/prompt.ts\n```\nExpected: no output (zero matches).\n\n- [ ] **Step 2: Confirm both sites now use the user-role form + last-step toolChoice**\n\nRun:\n```bash\ncd /root/projects/.vibe-board-workspaces/41f7-/opencode && grep -n 'role: \"user\" as const, content: MAX_STEPS' packages/opencode/src/session/prompt.ts; grep -n 'isLastStep ?' packages/opencode/src/session/prompt.ts | grep -i none\n```\nExpected: two matches for the user-role messages line; two matches for the `isLastStep ? ... none` toolChoice lines.\n\n- [ ] **Step 3: Final typecheck**\n\nRun from `packages/opencode`:\n```bash\nbun typecheck\n```\nExpected: PASS, no new errors.\n\n- [ ] **Step 4: Reasoning check (no behavioral regression)**\n\nConfirm by inspection:\n- When `isLastStep` is false, both lines are byte-identical to before except the (false) ternary branch — no behavior change on normal steps.\n- When `isLastStep` is true, the appended message is `role:\"user\"` (conversation ends on user turn) and `toolChoice` is `\"none\"` (model cannot emit tool calls). This matches the intended provider-agnostic design.\n\nNo commit (verification only).\n"},{"path":"compose/reports/2025-06-18-tui-repaint-after-interactive-resume.md","title":"Report: TUI Full Repaint After Interactive Command Resume","group":"reports","content":"# Report: TUI Full Repaint After Interactive Command Resume\n\n## Problem\n\nAfter an interactive command (e.g. `git push` triggering `bun turbo typecheck` via pre-push hook), the MiMoCode TUI resumes with visual artifacts: cells that only contain background color show the terminal's native background (VSCode theme color) instead of the TUI's dark theme background.\n\n## Root Cause\n\n`renderer.resume()` in @opentui/core internally calls:\n\n```js\nthis.currentRenderBuffer.clear(this.backgroundColor)\n```\n\nThis sets `currentRenderBuffer` to the theme's background color (e.g., dark gray). On the next frame, the renderer diffs `nextRenderBuffer` against `currentRenderBuffer`. Background-only cells in `nextRenderBuffer` also contain the same theme background color. The diff sees them as identical → skips writing them to the terminal. But the physical terminal (alternate screen just re-entered) doesn't have that color — it has the terminal emulator's native background.\n\n## Fix\n\nAfter `renderer.resume()`, call `renderer.currentRenderBuffer.clear()` **without arguments** (clears to transparent/zeros). This creates a mismatch:\n\n- `currentRenderBuffer`: transparent (RGBA 0,0,0,0)  \n- `nextRenderBuffer`: theme background color (e.g., RGBA 30,30,30,255)\n\nThe diff now sees ALL cells as different → writes every cell → full repaint.\n\n## Affected Call Sites (3)\n\n1. `packages/opencode/src/cli/cmd/tui/app.tsx` — interactive bash handler (finally block)\n2. `packages/opencode/src/cli/cmd/tui/app.tsx` — Ctrl+Z SIGCONT handler\n3. `packages/opencode/src/cli/cmd/tui/util/editor.ts` — external editor resume\n\n## Approaches Tried and Rejected\n\n| Approach | Why it failed |\n|----------|--------------|\n| `process.stdout.write(\"\\x1b[2J\\x1b[H\")` after resume | Clears screen but renderer still skips background cells in the diff — they appear briefly then go missing |\n| `renderer.clearPaletteCache()` | Only clears color code lookup cache, doesn't force cell writes |\n| `--ui stream` / `TURBO_UI=0` / `CI=1` on turbo | Not a turbo bug — stream mode output itself causes the issue by writing to the terminal during suspend |\n\n## Verification\n\nTested with local build `0.0.0-local-202606181503`: interactive `bun typecheck` completes, TUI resumes with clean full repaint, no VSCode background bleeding through.\n"},{"path":"compose/reports/align-last-step-handling.md","title":"Align Last-Step Handling With Provider Requirements — Final Report","group":"reports","content":"---\nfeature: align-last-step-handling\nstatus: delivered\nspecs: []\nplans:\n  - docs/compose/plans/2026-06-17-align-last-step-handling.md\nbranch: 41f7-\ncommits: e9fa96ac83..5fd4316a5e\n---\n\n# Align Last-Step Handling With Provider Requirements — Final Report\n\n## What Was Built\n\nWhen an agent reaches its configured step cap (`agent.steps`), the session loop sends one final \"wrap up and summarize\" request to the model. That final request is now constructed so it ends on a **user** turn with tools disabled, instead of ending on a pre-filled **assistant** turn.\n\nThis fixes a hard failure on Bedrock-routed Claude, which rejects any conversation that ends on an assistant message (`400 — This model does not support assistant message prefill. The conversation must end with a user message.`). It also restores step-cap enforcement that had silently regressed: the model can no longer emit tool calls on the final step, so `agent.steps` is an actual hard stop rather than a suggestion.\n\n## Architecture\n\nThe change lives entirely in `packages/opencode/src/session/prompt.ts`, at the two sites that build the per-step LLM request inside the run loop:\n\n- *
