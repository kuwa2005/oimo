```ts\n// 算法 无单独正则\ntext.split(\"\\n\").map(line => {\n  const stripped = line.endsWith(\"\\r\") ? line.slice(0, -1) : line\n  const idx = stripped.lastIndexOf(\"\\r\")\n  return idx === -1 ? stripped : stripped.slice(idx + 1)   // 只留最后一帧\n}).join(\"\\n\")\n```\n\n**L4 clean\\_longline — 单行超长压缩**\n\n```ts\nconst MAX_LINE_CHARS = 500\nconst LINE_HEAD_KEEP = 160\n\ntext.split(\"\\n\").map(line => {\n  if (line.length \u003c= MAX_LINE_CHARS) return line\n  return `${line.slice(0, LINE_HEAD_KEEP)}…\u003celided ${line.length - LINE_HEAD_KEEP} chars>`\n}).join(\"\\n\")\n```\n\n**never\\-worse 守门 — 管线尾部回吐**\n\n```ts\nconst bytesOut = Buffer.byteLength(out, \"utf-8\")\nif (bytesOut + NEVER_WORSE_MARGIN >= bytesIn) {\n  return { text, bytesIn, bytesOut: bytesIn, degraded: true }   // 没省到 退原文\n}\n```\n\n## 4\\. 启发式过滤管线\n\n### 4\\.1 双通道形状识别\n\n不能只看命令名（用户常 pipe 嵌套：`bash -c \"cd x && pytest\"`），也不能只看输出开头（前 30 行可能全是 ANSI 噪音）。两路串行：\n\n```ts\n// 命令名通道\nconst COMMAND_PATTERNS: Array\u003c[RegExp, ShapeID]> = [\n  [/^pytest(\\s|$)/,                \"pytest\"],\n  [/^(npm|pnpm|yarn)\\s+(install|i|add)/, \"npm\"],\n  [/^(make|cmake|automake)/,       \"make\"],\n  [/^git\\s+diff/,                  \"gitdiff\"],\n  [/^tsc(\\s|$)/,                   \"tsc\"],\n  [/^kubectl\\s+get\\s+pods?/,       \"kubectl\"],\n  [/^go\\s+test.*-json/,            \"gostest\"],\n  [/^gh\\s+(pr|issue)\\s+view/,      \"md\"],\n]\n\n// 内容指纹通道（命令名未命中时兜底）\nconst BODY_FINGERPRINTS: Array\u003c[RegExp, ShapeID]> = [\n  [/^={5,}\\s+test session starts\\s+={5,}/m, \"pytest\"],\n  [/^diff --git /m,                          \"gitdiff\"],\n  [/^Traceback \\(most recent call last\\)/m,  \"stacktrace\"],\n  [/^\\s*at .+:\\d+:\\d+/m,                     \"stacktrace\"],\n  [/^error\\[E\\d+\\]:/m,                       \"stacktrace\"],\n]\n```\n\n### 4\\.2 形状策略速查\n\n|**命令匹配**|**核心剪裁规则**|**预期减量**|\n|---|---|---|\n|git diff / git show|lockfile / min\\.js / dist 路径白名单整段抑制；单 hunk 100 行 cap；文件尾追加 \\+added \\-removed|85%|\n|pytest|4 态状态机 Header → TestProgress → Failures → Summary，保留 collected / E 行 / file:line: / FAILED / short summary|90%|\n|npm/pnpm/yarn install|连续 npm warn deprecated 折成 \\[×N deprecation warnings: top: A, B, C\\]，保留 added/vuln/funding 摘要|65%|\n|make / cmake / automake|砍 Entering/Leaving directory、bare 编译命令、caret，保留 file:line:col: error: 及下方 note:|53%|\n|Traceback / at \\.\\.\\.:N:N / error\\[E\\.\\.\\.\\]|折 site\\-packages / \\.venv / node\\_modules / stdlib 帧，连续 ≥2 合并为 \\[N dependency frame\\(s\\) suppressed\\]|69%|\n|tsc|按错误码 group Top\\-5 一行汇总；按文件 group Top\\-8；每组留 1 样本|80%|\n|kubectl get pods|trailer 建议 \\-o json；客户端只折\"全 Running/0 restart\"连续行，不重写列|70%|\n|输出以 \\{ 或 \\[ 开头|双模式：默认裁 embedding/raw\\_html/body/content/base64 大字段；schema\\-only 模式推断键加类型|95%|\n|gh pr view / gh issue view|清 HTML 注释、徽章行、纯图片行、装饰 \\-\\-\\-、多空行|\\~50%|\n|go test \\.\\.\\. \\-json|NDJSON 流式聚合：按 pkg 累 pass/fail/skip；fail 时把累积 output 作 cause|90%|\n\n### 4\\.2 命令层 passthrough\n\n用户已经在做投影时直接放行，不再清理：\n\n- 命令含 `--json` / `--format json` / `-o json` / `--no-color`\n\n- 命令尾含 `| tee` / `| xxd` / `| hexdump`\n\n- 命令含 `# nofilter` / `# raw`（已实现）\n\n### 4\\.5 扩展契约\n\n新增形状只需实现 `Shape { match, apply }` 接口，主入口零侵入：\n\n```TypeScript\nexport interface Shape {\n  id: string\n  match: (command: string, head4k: string, tail4k: string) => boolean\n  apply: (body: string, ctx: { command: string }) => string\n}\n\nconst SHAPES = [S_gitdiff, S_pytest, S_npm, S_make, S_stacktrace,\n                S_tsc, S_kubectl, S_json, S_md, S_gostest]\n```\n\n\n\n## 5\\. 其他细节\n\n**仅清 inline，不清落盘** — 只要走到 truncation file（早期流式溢出或末尾 `trunc.write(raw)`），就跳过清理。落盘归档保持原始字节，方便人工 grep；inline 输出才进清理管线，把节省字节用在最常被读到的路径上。\n\n**TUI 预览不动** — `metadata.output` 是 TUI 实时预览字段，保持原始流式快照；只有最终 `output` 经过清理。避免清理副作用打断人对原始终端输出的判读。\n\n**单 flag、默认关** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` 一个独立 flag 控制开关，默认关闭，不被 `MIMOCODE_EXPERIMENTAL=1` 派生。显式 opt\\-in，避免静默改变默认输出。\n\n"},{"path":"harness/MiMo Token Efficient Mode.ru.md","title":"MiMo Token Efficient Mode","group":"harness","content":"# MiMo Token Efficient Mode\n\n**Кратко в одном предложении**: использует общий пайплайн фильтрации на регулярных выражениях + эвристический пайплайн фильтрации для удаления избыточных токенов из вывода Bash (экспериментальная функция, по умолчанию отключена).\n\n## 1. Предпосылки и цели\n\nstdout/stderr инструмента bash часто «раздуваются» следующим шумом:\n\n- ANSI цветовые коды, OSC гиперссылки, DCS управляющие последовательности терминала\n\n- Наложение нескольких кадров прогресс-баров через `\\r`\n\n- Случайно выведенные API-ключи / JWT / PEM-сертификаты\n\n- Сверхдлинные строки вроде minified JS / однострочного JSON\n\n- Бесполезная информация из pytest / go test / ...\n\n**Основное ограничение**: очистка предназначена только для LLM; предпросмотр в реальном времени в TUI и архив на диске сохраняют исходные байты для удобства ручной отладки.\n\n## 2. Общий поток\n\nДиаграмма ниже показывает сквозной путь очистки вывода инструмента bash от захвата до доставки в LLM. Она объединяет общий пайплайн фильтрации (Глава 3), эвристический пайплайн фильтрации (Глава 4) и ограничения трёхстороннего разделения inline / диск / TUI (Глава 5).\n\nТри основных ограничения и их расположение на диаграмме:\n\n- **Очищаем только inline, не диск** — две крайние левые ветви на входе (архив на диск / предпросмотр TUI) полностью обходят пайплайн.\n\n- **Защитник never-worse** — единый откат в хвосте пайплайна: любой этап, увеличивший вывод, отбрасывается, возврат к пути Raw.\n\n- **Один флаг, по умолчанию выключен** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` — единственный переключатель для входа в пайплайн очистки, по умолчанию отключён; иначе вывод идёт напрямую по пути Raw.\n\n\n\n\n## 3. Общий пайплайн фильтрации\n\n\n\n|**Слой**|**Обязанность**|**Ключевые regex / алгоритм**|**Порядковое ограничение**|\n|---|---|---|---|\n|clean_progress_pipeline|Построчно сворачивает прогресс-бары `\\r`, оставляя только последний кадр|Разбить по строкам, взять сегмент после последнего `\\r` в каждой строке|Должен выполняться до clean_ansi_pipeline|\n|clean_ansi_pipeline|Удаляет ANSI CSI/OSC/DCS, backspace overstrike, управляющие байты|4 regex для ESC-последовательностей + класс символов для управляющих байтов|После progress, до последующих regex|\n|clean_redact_pipeline|PEM, Bearer, JWT, ключи AWS/GH/OpenAI/Anthropic/Slack|8 групп regex + замена всего многострочного PEM-блока|Должен выполняться до дедупликации/усечения|\n|clean_longline_pipeline|Сжимает одиночные строки длиннее 500 символов до заголовка в 160 символов + подсказка об элизии|Построчное сканирование, проверка по порогу длины|Ставится последним как страховка|\n|защитник never-worse|Если очистка не уменьшила количество байтов, откат к исходному тексту|При bytesOut ≥ bytesIn возвращает исходный text|Хвост пайплайна|\n\n### 3.1 Справочник regex по слоям\n\nПриведённые ниже константы напрямую соответствуют реализации в `packages/opencode/src/tool/bash_token_efficient.ts`. L1 / L4 — это построчные алгоритмы сканирования без отдельных regex; L0 / L3 вместе определяют 14 regex (4 ESC + 1 управляющий байт + 1 многострочный PEM + 8 inline-секретов).\n\n**L0 clean_ansi — 4 ESC regex + 1 класс управляющих байтов**\n\n```ts\nconst ANSI_CSI   = /\\x1b\\[[0-?]*[ -/]*[@-~]/g              // CSI-последовательность  ESC[ ... терминатор\nconst ANSI_OSC   = /\\x1b\\][^\\x07\\x1b]*(?:\\x07|\\x1b\\\\)/g    // OSC-последовательность  ESC] ... BEL или ESC\\\nconst ANSI_DCS   = /\\x1b[PX^_][\\s\\S]*?\\x1b\\\\/g             // DCS/SOS/PM/APC многострочная последовательность\nconst BACKSPACE  = /[^\\n]\\x08/g                            // Backspace overstrike  циклическая замена до отсутствия совпадений\nconst CTRL_BYTES = /[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F]/g     // Управляющие байты  сохраняются \\t \\n \\r\n```\n\n**L3 clean_redact — 1 многострочный PEM-блок + 8 паттернов inline-секретов**\n\n```ts\n// Замена всего многострочного PEM-блока → \u003credacted-pem-block>\nconst PEM_BLOCK = /-----BEGIN [A-Z ]+-----[\\s\\S]*?-----END [A-Z ]+-----/g\n\nconst REDACT_PATTERNS: Array\u003c[RegExp, string]> = [\n  // Bearer / Token \u003copaque>\n  [/\\b(Bearer|Token)\\s+[A-Za-z0-9._\\-+/=]{16,}/gi,                          \"$1 \u003credacted>\"],\n  // JWT  eyJ, три сегмента base64url (каждый ≥10 символов)\n  [/\\beyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}/g,    \"\u003credacted-jwt>\"],\n  // AWS access key  префикс AKIA / ASIA + 16 заглавных букв/цифр\n  [/\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b/g,                                        \"\u003credacted-aws-key>\"],\n  // GitHub fine-grained / classic  gh[pousr]_ + ≥20 символов\n  [/\\bgh[pousr]_[A-Za-z0-9]{20,}\\b/g,                                       \"\u003credacted-gh-token>\"],\n  // OpenAI  sk- + ≥20 символов\n  [/\\bsk-[A-Za-z0-9_\\-]{20,}\\b/g,                                           \"\u003credacted-openai-key>\"],\n  // Anthropic  sk-ant- + ≥20 символов\n  [/\\bsk-ant-[A-Za-z0-9_\\-]{20,}\\b/g,                                       \"\u003credacted-anthropic-key>\"],\n  // Slack  xox[abprs]- + ≥10 символов\n  [/\\bxox[abprs]-[A-Za-z0-9\\-]{10,}\\b/g,                                    \"\u003credacted-slack-token>\"],\n  // Универсальный KEY=VALUE / \"key\": \"value\"  значение ≥12 символов\n  [\n    /\\b((?:api|access|refresh|secret|client|auth)[_-]?(?:key|token|secret|password))(\\s*[:=]\\s*)[\"']?[A-Za-z0-9._\\-+/=]{12,}[\"']?/gi,\n    \"$1$2\u003credacted>\",\n  ],\n]\n```\n\n**L1 clean_progress — построчное сворачивание прогресс-баров `\\r`**\n\n```ts\n// Алгоритм  без отдельного regex\ntext.split(\"\\n\").map(line => {\n  const stripped = line.endsWith(\"\\r\") ? line.slice(0, -1) : line\n  const idx = stripped.lastIndexOf(\"\\r\")\n  return idx === -1 ? stripped : stripped.slice(idx + 1)   // оставляем только последний кадр\n}).join(\"\\n\")\n```\n\n**L4 clean_longline — сжатие сверхдлинных одиночных строк**\n\n```ts\nconst MAX_LINE_CHARS = 500\nconst LINE_HEAD_KEEP = 160\n\ntext.split(\"\\n\").map(line => {\n  if (line.length \u003c= MAX_LINE_CHARS) return line\n  return `${line.slice(0, LINE_HEAD_KEEP)}…\u003celided ${line.length - LINE_HEAD_KEEP} chars>`\n}).join(\"\\n\")\n```\n\n**Защитник never-worse — откат в хвосте пайплайна**\n\n```ts\nconst bytesOut = Buffer.byteLength(out, \"utf-8\")\nif (bytesOut + NEVER_WORSE_MARGIN >= bytesIn) {\n  return { text, bytesIn, bytesOut: bytesIn, degraded: true }   // экономии нет  возвращаем исходный текст\n}\n```\n\n## 4. Эвристический пайплайн фильтрации\n\n### 4.1 Двухканальное распознавание формы\n\nНельзя полагаться только на имя команды (пользователи часто вкладывают пайпы: `bash -c \"cd x && pytest\"`) или только на начало вывода (первые 30 строк могут быть сплошным ANSI-шумом). Два канала выполняются последовательно:\n\n```ts\n// Канал имени команды\nconst COMMAND_PATTERNS: Array\u003c[RegExp, ShapeID]> = [\n  [/^pytest(\\s|$)/,                \"pytest\"],\n  [/^(npm|pnpm|yarn)\\s+(install|i|add)/, \"npm\"],\n  [/^(make|cmake|automake)/,       \"make\"],\n  [/^git\\s+diff/,                  \"gitdiff\"],\n  [/^tsc(\\s|$)/,                   \"tsc\"],\n  [/^kubectl\\s+get\\s+pods?/,       \"kubectl\"],\n  [/^go\\s+test.*-json/,            \"gostest\"],\n  [/^gh\\s+(pr|issue)\\s+view/,      \"md\"],\n]\n\n// Канал отпечатка содержимого (запасной вариант, если имя команды не совпало)\nconst BODY_FINGERPRINTS: Array\u003c[RegExp, ShapeID]> = [\n  [/^={5,}\\s+test session starts\\s+={5,}/m, \"pytest\"],\n  [/^diff --git /m,                          \"gitdiff\"],\n  [/^Traceback \\(most recent call last\\)/m,  \"stacktrace\"],\n  [/^\\s*at .+:\\d+:\\d+/m,                     \"stacktrace\"],\n  [/^error\\[E\\d+\\]:/m,                       \"stacktrace\"],\n]\n```\n\n### 4.2 Справочник стратегий по формам\n\n|**Совпадение команды**|**Основное правило усечения**|**Ожидаемое сокращение**|\n|---|---|---|\n|git diff / git show|Полное подавление блоков по allowlist для lockfile / min.js / dist путей; ограничение 100 строк на hunk; в конце файла добавляется +added -removed|85%|\n|pytest|Автомат из 4 состояний Header → TestProgress → Failures → Summary, сохраняет collected / строки E / file:line: / FAILED / short summary|90%|\n|npm/pnpm/yarn install|Сворачивает подряд идущие «npm warn deprecated» в [×N deprecation warnings: top: A, B, C], сохраняет сводку added/vuln/funding|65%|\n|make / cmake / automake|Удаляет Entering/Leaving directory, «голые» команды компиляции, каретки; сохраняет file:line:col: error: и note: под ним|53%|\n|Traceback / at ...:N:N / error[E...]|Сворачивает кадры site-packages / .venv / node_modules / stdlib; ≥2 подряд объединяются в [N dependency frame(s) suppressed]|69%|\n|tsc|Группировка по коду ошибки Top-5 в одну строку; группировка по файлу Top-8; по одному образцу на группу|80%|\n|kubectl get pods|Trailer предлагает `-o json`; на клиенте сворачиваются только подряд идущие «все Running/0 restart», колонки не переписываются|70%|\n|Вывод, начинающийся с { или [|Два режима: по умолчанию обрезаются большие поля embedding/raw_html/body/content/base64; в режиме schema-only выводятся ключи с типами|95%|\n|gh pr view / gh issue view|Очищает HTML-комментарии, строки бейджей, чисто-графические строки, декоративные ---, множественные пустые строки|~50%|\n|go test ... -json|Потоковая агрегация NDJSON: накопление pass/fail/skip по pkg; при fail использует накопленный output как причину|90%|\n\n### 4.2 Passthrough уровня команды\n\nПропускаем вывод без очистки, если пользователь уже сам делает проекцию:\n\n- Команда содержит `--json` / `--format json` / `-o json` / `--no-color`\n\n- Хвост команды содержит `| tee` / `| xxd` / `| hexdump`\n\n- Команда содержит `# nofilter` / `# raw` (уже реализовано)\n\n### 4.5 Контракт расширения\n\nДля добавления новой формы достаточно реализовать интерфейс `Shape { match, apply }`, основной вход остаётся без изменений:\n\n```TypeScript\nexport interface Shape {\n  id: string\n  match: (command: string, head4k: string, tail4k: string) => boolean\n  apply: (body: string, ctx: { command: string }) => string\n}\n\nconst SHAPES = [S_gitdiff, S_pytest, S_npm, S_make, S_stacktrace,\n                S_tsc, S_kubectl, S_json, S_md, S_gostest]\n```\n\n\n\n## 5. Прочие детали\n\n**Очистка только inline, диск не трогаем** — как только вывод достигает файла усечения (либо ранний overflow потока, либо финальный `trunc.write(raw)`), очистка пропускается. Архив на диске хранит исходные байты для удобства ручного grep; в пайплайн очистки попадает только inline-вывод, и экономия байт тратится на самый часто читаемый путь.\n\n**Предпросмотр TUI не изменяется** — `metadata.output` — это поле живого предпросмотра TUI, оно хранится как исходный потоковый снимок; через очистку проходит только финальный `output`. Это позволяет избежать побочных эффектов очистки, мешающих человеку читать оригинальный вывод терминала.\n\n**Один флаг, по умолчанию выключен** — `MIMOCODE_EXPERIMENTAL_TOKEN_EFFICIENCY` — независимый флаг-переключатель, по умолчанию отключён, не выводится из `MIMOCODE_EXPERIMENTAL=1`. Явный opt-in избавляет от тихого изменения поведения по умолчанию.\n\n"},{"path":"harness/Mix of Harness and Hand-off.en.md","title":"Mix of Harness && Hand-off","group":"harness","content":"# Mix of Harness && Hand-off\n\n**In one line**: package **Codex CLI** and **Claude Code CLI** as callable executors exposed through skills, so that when MiMoCode falls into a \"low-yield loop,\" it can pause the current turn and let the user hand the work to another harness with one action. The control plane remains in the MiMoCode session, while the execution plane runs in the selected harness—the two planes are decoupled.\n\nSupported harnesses: **Codex CLI** && **Claude Code CLI**.\n\n---\n\n## 1. Why Mix of Harness\n\nWhen a single harness encounters a task it is inherently poor at, it almost never recovers on its own: Codex is more optimistic and tends to declare completion too early; Claude Code explores in greater detail, but under explicit instructions it can get stuck repeatedly rewriting similar diffs. The real failure signal is not that \"one step failed,\" but that **spending more tokens still produces no progress**—the same file is edited repeatedly, the same bash command is retried unchanged, or the ratio of exploration to modification does not improve.\n\nMix of Harness (MoH below) addresses this problem by turning each harness into an executor that MiMoCode can launch through a skill and run as a subprocess. A **Try-Best detector** monitors the health of the current turn; once it detects a low-yield loop, it pauses the turn and lets the user choose a more suitable harness to take over.\n\n**Core boundary**: MoH **does not switch the session's provider/model**. After selecting \"hand off to Codex CLI\" or \"hand off to Claude Code CLI,\" the session remains the original MiMoCode session with the original model. The model is simply instructed to load the corresponding skill and delegate execution to the selected harness. Context, task panels, memory, and approval routing therefore do not need to be rebuilt.\n\n---\n\n## 2. SKILL Design\n\nCodex and Claude Code are each packaged as a **built-in skill**, located at `\u003cdata>/builtin_skills/local/skills/codex/` and `\u003cdata>/builtin_skills/local/skills/claude-code/`, respectively. Each skill directory contains:\n\n```\ncodex/\n  SKILL.md                # Trigger description + operating rules (prefer headless; no interaction except --yolo)\n  agents/openai.yaml\n  references/\n    recipes.md            # Common codex exec patterns\n    windows.md            # Separate guidance for native PowerShell and WSL2\n\nclaude-code/\n  SKILL.md\n  references/\n    config.md\n    flags.md\n    interactive-tmux.md\n    platforms.md\n    print-mode.md\n```\n\nSKILL.md is the entry point, and its `description` field determines when the skill router triggers it. The principle is to **provide directly executable CLI command templates in the skill**. For example, the Codex skill immediately provides:\n\n```bash\ncodex exec \\\n  -C /path/to/repo \\\n  --sandbox workspace-write \\\n  --ask-for-approval never \\\n  \"\u003cTASK>\"\n```\n\nrather than making the model look up a combination of flags itself. Cross-platform differences (macOS/Linux vs. Windows PowerShell vs. WSL2) are covered by the documents under `references/`.\n\n> **Why use a separate skill instead of a built-in tool?** Harness operating details stay in the skill and are injected together with the model prompt; the tool layer exposes only the ability to run a subprocess. Skill updates, cross-platform differences, and flag changes can all be handled by replacing the skill directory without changing code.\n\n---\n\n## 3. The Five MoH Modes\n\nDifferent tasks need different orchestration structures. MoH currently supports the following five modes. **Fallback is MiMoCode's default mode**—the path that automatically enables Try-Best detection and Hand-off.\n\n### 3.1 Single\n\n```\nTask → Codex → Validator\n```\n\nRun a single harness directly, followed by a validator. Suitable when a harness is fully trusted and the task scope is clear.\n\n### 3.2 Fallback (default)\n\n```\nTask → MiMoCode\n          │ failure/stall\n          ▼\n        Codex / Claude Code\n```\n\nMiMoCode first attempts the work itself. After a failure or stall signal is detected, the user chooses another harness to take over. Common rules for detecting failure/stall include:\n\n- N consecutive failures from the same class of tool\n- No file changes for more than X minutes\n- Too many context compactions\n- No improvement across consecutive test results\n- Cost exceeding 80% of the budget\n- Final output missing a required artifact\n\nThe Try-Best detector (see §4) implements the subset of these rules that can be evaluated in real time within a turn.\n\n### 3.3 Pipeline\n\n```\nClaude Code research\n       ↓ HandoffPacket\nCodex implementation\n       ↓ Patch\nMiMoCode review\n       ↓ Findings\nCodex repair\n```\n\nStages are connected in sequence, with the best harness used for each stage and structured packets carrying context between adjacent stages. Suitable for tasks with clear stage boundaries (understand before changing, review after implementation).\n\n### 3.4 Parallel Competition\n\n```\n               ┌→ Claude Code → Patch A ┐\nTask → Fork ───┤                        ├→ Evaluator\n               └→ Codex        → Patch B ┘\n```\n\nMultiple harnesses independently perform the same task, and an evaluator chooses the result to adopt. Suitable when boundaries are unclear, several approaches are plausible, and taking a probabilistic bet is worthwhile. **It costs more**, so it is not the default.\n\n### 3.5 Debate / Review\n\n```\nCodex Implementer → Claude Reviewer → Codex Repairer\n```\n\nOne harness proposes an implementation, another challenges it, and the first harness then repairs it. Suitable for correctness- or security-sensitive changes that need cross-checking.\n\n---\n\n## 4. Hand-off Mechanism (Try-Best HandOff)\n\nTry-Best HandOff automates Fallback mode: it **monitors low-yield loops in real time within a turn** and, upon a match, pauses the turn, records evidence from the scene, and gives the user the choice of what to do next.\n\n### 4.1 What Counts as a \"Low-Yield Loop\"\n\nThe failure modes of coding agents leave observable shapes in their trajectories. Try-Best selects the strongest signals:\n\n- **Loops and repetition**. The same file is edited repeatedly (edit count exceeds a threshold), semantically similar diffs appear consecutively, or the same bash command is retried unchanged after repeated failures. This is the strongest precursor to failure—once an agent enters a loop, it almost never escapes on its own, and spending more tokens is pure waste. In practice, **sliding-window deduplication** over the most recent N tool calls is sufficient; embeddings are unnecessary.\n- **Progress decoupled from consumption**. Define a coarse progress signal (change in passing-test count, or the proportion of files mentioned by the issue covered by the diff) and compare it with token burn rate. If 40% of the budget is spent with zero progress, the harness is almost certainly unsuitable for the task; switching is much cheaper than waiting for it to finish.\n- **Lost-navigation pattern**. Reading files during exploration is normal, but broad greps late in the task, repeatedly reading the same large files, or opening directories unrelated to the issue indicate that the agent has not built a working model of the repo. Quantify this with the ratio of new-information operations to modification operations over the last K steps—a healthy trajectory should show a monotonically decreasing ratio over time.\n- **Premature completion claims**. The harness says it is done, but the trajectory contains no test run, or it ran tests without inspecting the result. **Do not trust self-reported completion**; Codex is more optimistic about this than Claude Code.\n\n### 4.2 Detection Mechanism (Three Trigger Reasons)\n\nThe current implementation in `packages/opencode/src/session/try-best-detector.ts` detects the first two signal classes through three concrete rules:\n\n| Reason | Description | Default threshold |\n|---|---|---|\n| `edit_repeat` | Approximate edits to the **same file**: extract each diff into a set of 3-shingles, then compare the latest 12 edit events using **Jaccard similarity**; similarity > 0.8 counts as one match | Trigger after ≥ 2 cumulative matches (that is, on the \"third approximate edit\") |\n| `bash_retry` | A normalized bash command **fails consecutively** with unchanged failure output | 3 consecutive times |\n| `action_streak` | Consecutive actions of the same class (`edit` or `verify`) show no observable improvement | 4 consecutive times |\n\nCommands and results are normalized to prevent false positives caused by timestamps, temporary paths, or random seeds:\n\n- Command: `/tmp/...` → `\u003cTMP>`, pure numbers of 6 or more digits → `\u003cNUM>`, `--seed=xxx` → `\u003cSEED>`\n- Result: durations such as `Ns / Nms / N seconds` are additionally removed; results longer than 2,000 characters retain half from each end with `\u003cTRUNCATED>` inserted in the middle\n\n`verify` commands (bun/npm/pnpm/yarn test/typecheck/lint/build, pytest, cargo test, go test, make test, tsc, etc.) participate in `bash_retry` detection and also count toward `action_streak`.\n\n### 4.3 Pausing and Persistence\n\nAfter any reason is triggered, `SessionProcessor.detectTryBest`:\n\n1. **Resets the monitor** to avoid repeated triggers within the same turn.\n2. **Sets `ctx.blocked = true`** so that the processor returns `stop` for subsequent model output and the prompt loop immediately exits the current turn.\n3. **Writes a synthetic `TextPart`**: `text` contains a human-readable reason (\"Try-best loop detected; this turn was paused. …\"), while `metadata.origin` contains `kind: \"try_best\"`, the current `providerID / modelID`, and the complete `incident` (reason + evidence). **The part is the source of truth**: even if an event subscriber disconnects, a restarted session can recover by scanning parts.\n4. **Publishes a `session.try_best.detected` event**: the TUI subscribes to it and immediately opens a dialog. The event is a low-latency notification, while the part provides the fallback.\n5. **Publishes the metrics event** `Metrics.TryBestDetected`, making it possible to track trigger frequency by model/reason.\n\n### 4.4 User Choice (Three Options in the TUI Dialog)\n\nAfter pausing, the TUI opens a dialog titled \"Try-best loop detected — turn paused.\" Its description includes specific evidence (for example, \"Near-identical edits repeated 3 times in packages/opencode/src/foo.ts\"). It offers three options:\n\n1. **Continue with Codex CLI** (`Hand off to Codex CLI`)\n2. **Continue with Claude Code CLI** (`Hand off to Claude Code CLI`)\n3. **Keep the current model but continue with a different strategy** (`Continue with \u003cmodel>`)—make the original model abandon its current approach and re-plan\n\nCandidate targets **exclude the current model family** (`handoffTargets` in `packages/opencode/src/cli/cmd/tui/util/handoff.ts`):\n\n- If the current provider is `openai`, or the model name contains `gpt / codex` → show only \"Claude Code CLI\" (no second attempt with itself)\n- If the model name contains `anthropic / claude` → show only \"Codex CLI\"\n- Otherwise → show both\n\nThe TUI also checks whether the corresponding skill (`codex` / `claude-code`) is registered in `sync.data.command`; an unregistered option is disabled.\n\n### 4.5 Execution Protocol (Orchestrated Hand-off)\n\nAfter a harness is selected, the TUI **does not switch sessions or models**. Instead, it sends `promptAsync` to the original sessionID, using a `\u003csystem-reminder>` as the next turn's input (see `formatHarnessReminder` for the template):\n\n```\n\u003csystem-reminder>\nTry-best loop detection paused the previous turn: \u003cdetail>\nThe user explicitly selected and authorized the \u003charness> harness to take over the unfinished work.\nYou MUST load and follow the `\u003cskill>` skill now and invoke \u003charness> as the primary executor …\nGive the selected harness the complete user goal, relevant workspace state, the failed approach, and all remaining validation requirements. Do not include credentials, secrets, or unrelated private data.\nStay in this CLI and supervise \u003charness> until it completes or reaches a concrete blocker …\nInspect the harness result and workspace changes, ensure its validation is complete, and report the final outcome to the user. Do not stop after merely launching the harness.\n\u003c/system-reminder>\n```\n\nKey points:\n\n- **Control plane = original session**: the task panel, approval routing, context, and memory remain in the MiMoCode session; the harness is only a launched subprocess.\n- **Execution plane = selected harness**: the actual research, implementation, repair, and validation must all happen in this subprocess. The system reminder explicitly forbids using the harness \"only as a reference\" or returning immediately after launching it.\n- **The original model remains present**: it loads the skill, packages the work for the harness, supervises it to completion, and reports the final result to the user. It does not surrender control; it becomes the harness's runtime supervisor.\n\nSelecting \"keep the current model but use a different strategy\" sends no reminder; it only clears `ctx.blocked`, allowing the original model to re-plan on the next turn.\n\n---\n\n## 5. Configuration\n\n### 5.1 Master Switch\n\n- **Environment variable `MIMOCODE_ENABLE_TRY_BEST_HANDOFF`** (default: `true`)\n  - Set to `false` or `0` → disable the entire loop detection, turn pausing, and hand-off dialog capability.\n  - Defined in `packages/opencode/src/flag/flag.ts`.\n\n### 5.2 Thresholds (`experimental.try_best`)\n\nDetection thresholds can be overridden individually in `mimocode.json` / config:\n\n```json\n{\n  \"experimental\": {\n    \"try_best\": {\n      \"edit_window\": 12,\n      \"edit_similarity\": 0.8,\n      \"edit_matches\": 2,\n      \"action_streak\": 4\n    }\n  }\n}\n```\n\nMeaning:\n\n| Key | Default | Description |\n|---|---|---|\n| `edit_window` | 12 | Number of most recent edit events included in comparison |\n| `edit_similarity` | 0.8 | Jaccard similarity threshold (0–1); exceeding it counts as one match |\n| `edit_matches` | 2 | Number of cumulative similarity matches needed before triggering (that is, trigger on edit N+1) |\n| `action_streak` | 4 | Number of consecutive `edit`/`verify` actions without progress |\n\nThe consecutive failure count for `bash_retry` is currently fixed at 3 (`TRY_BEST_BASH_RETRIES`) and has no config option.\n\n### 5.3 Skill Registration Status\n\nThe two harness options in the Hand-off dialog require the `codex` and `claude-code` skills to be registered in `sync.data.command`. An unregistered option is hidden so that users cannot select a harness that cannot be launched.\n"},{"path":"harness/Mix of Harness and Hand-off.fr.md","title":"Mécanisme Mix of Harness && Hand-off","group":"harness","content":"# Mécanisme Mix of Harness && Hand-off\n\n**En une phrase** : encapsuler **Codex CLI** et **Claude Code CLI** sous forme d'exécuteurs appelables via des skills, afin que MiMoCode puisse suspendre le turn courant lorsqu'il tombe dans une « boucle à faible rendement » et permettre à l'utilisateur de confier le travail en un clic à un autre harness. Le plan de contrôle reste dans la session MiMoCode, tandis que le plan d'exécution se trouve dans le harness sélectionné — les deux plans sont découplés.\n\nHarness pris en charge : **Codex CLI** && **Claude Code CLI**.\n\n---\n\n## 1. Pourquoi Mix of Harness\n\nFace à une tâche pour laquelle il est intrinsèquement peu adapté, un harness unique ne se rétablit presque jamais seul : Codex est plus optimiste et tend à annoncer la fin trop tôt ; Claude Code explore plus finement, mais peut réécrire en boucle des diff similaires sous des instructions explicites. Le véritable signal d'échec n'est pas qu'« une étape a échoué », mais que **continuer à consommer des tokens ne produit aucun progrès** : le même fichier est modifié à répétition, la même commande bash est réessayée sans changement, ou le rapport exploration/modification ne s'améliore pas.\n\nMix of Harness (MoH ci-après) résout ce problème en transformant chaque harness en exécuteur que MiMoCode peut lancer via un skill et exécuter comme sous-processus. Un **détecteur Try-Best** surveille la santé du turn courant ; dès qu'il détecte une boucle à faible rendement, il suspend le turn et laisse l'utilisateur choisir un harness plus approprié pour prendre le relais.\n\n**Limite fondamentale** : MoH **ne change pas le provider/model de la session**. Après avoir choisi « confier à Codex CLI » ou « confier à Claude Code CLI », la session reste la session MiMoCode d'origine avec son modèle d'origine. Celui-ci doit simplement charger le skill correspondant et déléguer l'exécution au harness choisi. Le contexte, le panneau des tâches, la mémoire et le routage des approbations n'ont donc pas à être reconstruits.\n\n---\n\n## 2. Conception des SKILL\n\nCodex et Claude Code sont chacun encapsulés dans un **built-in skill**, respectivement sous `\u003cdata>/builtin_skills/local/skills/codex/` et `\u003cdata>/builtin_skills/local/skills/claude-code/`. Chaque répertoire contient :\n\n```\ncodex/\n  SKILL.md                # Description du déclencheur + règles (headless privilégié, pas d'interaction hors --yolo)\n  agents/openai.yaml\n  references/\n    recipes.md            # Patterns courants de codex exec\n    windows.md            # Précautions distinctes pour PowerShell natif / WSL2\n\nclaude-code/\n  SKILL.md\n  references/\n    config.md\n    flags.md\n    interactive-tmux.md\n    platforms.md\n    print-mode.md\n```\n\nSKILL.md est le point d'entrée ; son champ `description` détermine quand le skill router le déclenche. Le principe est de **fournir directement dans le skill des modèles de commandes CLI exécutables**. Par exemple, le skill Codex fournit immédiatement :\n\n```bash\ncodex exec \\\n  -C /path/to/repo \\\n  --sandbox workspace-write \\\n  --ask-for-approval never \\\n  \"\u003cTASK>\"\n```\n\nplutôt que de laisser le modèle rechercher lui-même la combinaison de flags. Les différences entre plateformes (macOS/Linux, Windows PowerShell et WSL2) sont couvertes par les documents de `references/`.\n\n> **Pourquoi un skill distinct plutôt qu'un outil intégré ?** Les détails d'utilisation du harness restent dans le skill et sont injectés avec le prompt du modèle ; la couche outil n'expose que la capacité d'exécuter un sous-processus. Les mises à jour du skill, différences de plateforme et changements de flags se traitent en remplaçant le répertoire du skill, sans modifier le code.\n\n---\n\n## 3. Les cinq modes de MoH\n\nLes tâches exigent des structures d'orchestration différentes. MoH prend actuellement en charge les cinq modes suivants. **Fallback est le mode par défaut de MiMoCode** : c'est le chemin qui active automatiquement la détection Try-Best et le Hand-off.\n\n### 3.1 Single\n\n```\nTask → Codex → Validator\n```\n\nUn seul harness s'exécute directement, suivi d'un validator. Adapté lorsque le harness est entièrement fiable et que le périmètre est clair.\n\n### 3.2 Fallback (par défaut)\n\n```\nTask → MiMoCode\n          │ échec/blocage\n          ▼\n        Codex / Claude Code\n```\n\nMiMoCode essaie d'abord d'effectuer le travail lui-même. Après un signal d'échec/blocage, l'utilisateur choisit un autre harness. Règles courantes :\n\n- N échecs consécutifs d'outils de même type\n- Aucune modification de fichier pendant plus de X minutes\n- Trop de compressions du contexte\n- Aucune amélioration des résultats de tests successifs\n- Coût supérieur à 80 % du budget\n- Artifact requis absent de la sortie finale\n\nLe détecteur Try-Best (voir §4) implémente les règles qui peuvent être évaluées en temps réel au sein d'un turn.\n\n### 3.3 Pipeline\n\n```\nRecherche par Claude Code\n       ↓ HandoffPacket\nImplémentation par Codex\n       ↓ Patch\nRevue par MiMoCode\n       ↓ Findings\nCorrection par Codex\n```\n\nLes étapes sont enchaînées, chacune utilisant le harness le plus adapté, avec des packets structurés pour transmettre le contexte. Ce mode convient aux tâches dont les étapes sont clairement séparées (comprendre avant de modifier, puis relire après l'implémentation).\n\n### 3.4 Parallel Competition\n\n```\n               ┌→ Claude Code → Patch A ┐\nTask → Fork ───┤                        ├→ Evaluator\n               └→ Codex        → Patch B ┘\n```\n\nPlusieurs harness effectuent séparément la même tâche, puis un evaluator choisit le résultat. Adapté lorsque les limites sont floues, que plusieurs approches sont possibles et qu'un pari probabiliste est utile. **Son coût est plus élevé**, il n'est donc pas utilisé par défaut.\n\n### 3.5 Debate / Review\n\n```\nCodex Implementer → Claude Reviewer → Codex Repairer\n```\n\nUn harness propose une solution, un autre la critique, puis le premier la corrige. Adapté aux changements sensibles à la sécurité ou à l'exactitude qui nécessitent une vérification croisée.\n\n---\n\n## 4. Mécanisme Hand-off (Try-Best HandOff)\n\nTry-Best HandOff automatise le mode Fallback : il **surveille en temps réel dans le turn** les boucles à faible rendement et, dès qu'une règle est satisfaite, suspend le turn, enregistre les preuves et rend le choix à l'utilisateur.\n\n### 4.1 Qu'est-ce qu'une « boucle à faible rendement » ?\n\nLes modes d'échec d'un agent de codage ont des formes observables dans sa trajectoire. Try-Best retient les signaux les plus forts :\n\n- **Boucles et répétitions**. Même fichier modifié à répétition, diff sémantiquement proches qui se succèdent, même commande bash réessayée à l'identique après plusieurs échecs. C'est le précurseur d'échec le plus fort : une fois dans une boucle, l'agent n'en sort presque jamais seul et continuer à brûler des tokens est inutile. Une **déduplication par fenêtre glissante** des N derniers tool calls suffit, sans embedding.\n- **Découplage entre progrès et consommation**. Un signal de progress grossier (évolution du nombre de tests réussis, proportion des fichiers cités dans l'issue couverts par le diff) est comparé au token burn rate. Si 40 % du budget sont consommés sans progrès, le harness est probablement inadapté ; changer coûte bien moins cher que d'attendre.\n- **Mode d'égarement**. Lire des fichiers durant l'exploration est normal, mais poursuivre de larges grep tardivement, relire les mêmes gros fichiers ou ouvrir des répertoires sans rapport avec l'issue montre que l'agent n'a pas construit de modèle de travail du repo. On le quantifie par le rapport opérations apportant de nouvelles informations / opérations de modification sur les K dernières étapes ; dans une trajectoire saine, ce rapport doit décroître avec le temps.\n- **Déclaration de fin prématurée**. Le harness se dit done sans avoir exécuté les tests, ou sans avoir examiné leurs résultats. **Ne faites pas confiance à une fin autodéclarée** ; Codex est plus optimiste que Claude Code sur ce point.\n\n### 4.2 Détection (trois motifs de déclenchement)\n\nL'implémentation actuelle dans `packages/opencode/src/session/try-best-detector.ts` détecte les deux premières catégories au moyen de trois règles :\n\n| Reason | Description | Seuil par défaut |\n|---|---|---|\n| `edit_repeat` | Modifications proches du **même fichier** : transformer le diff en ensemble de 3-shingles et comparer les 12 derniers événements edit avec la **similarité de Jaccard** ; une similarité > 0,8 compte comme une correspondance | Déclenchement après ≥ 2 correspondances cumulées (« troisième modification proche ») |\n| `bash_retry` | Une commande bash normalisée **échoue consécutivement** sans changement de la sortie d'échec | 3 fois de suite |\n| `action_streak` | Des actions consécutives du même type (`edit` ou `verify`) n'apportent aucune amélioration observable | 4 fois de suite |\n\nLes commandes et résultats sont normalisés afin d'éviter les faux positifs dus aux horodatages, chemins temporaires ou seeds aléatoires :\n\n- Commande : `/tmp/...` → `\u003cTMP>`, nombres purs d'au moins 6 chiffres → `\u003cNUM>`, `--seed=xxx` → `\u003cSEED>`\n- Résultat : suppression supplémentaire des durées `Ns / Nms / N seconds` ; au-delà de 2 000 caractères, conservation de la moitié au début et à la fin, avec `\u003cTRUNCATED>` au milieu\n\nLes commandes `verify` (bun/npm/pnpm/yarn test/typecheck/lint/build, pytest, cargo test, go test, make test, tsc, etc.) participent à `bash_retry` et sont aussi comptées dans `action_streak`.\n\n### 4.3 Suspension et persistance\n\nLorsqu'un reason est déclenché, `SessionProcessor.detectTryBest` :\n\n1. **reset le monitor** pour éviter plusieurs déclenchements dans le même turn ;\n2. **définit `ctx.blocked = true`** afin que le processor return `stop` pour les sorties suivantes et que la prompt loop quitte immédiatement le turn ;\n3. **écrit un `TextPart` synthetic** : `text` contient une explication lisible (« Try-best loop detected; this turn was paused. … ») et `metadata.origin` contient `kind: \"try_best\"`, les `providerID / modelID` courants et l'`incident` complet (reason + evidence). **Le part est la source de vérité** : même si un abonné aux événements se déconnecte, la session peut être restaurée en parcourant les parts ;\n4. **publie l'événement `session.try_best.detected`** : la TUI s'y abonne et ouvre immédiatement un dialog. L'événement fournit la faible latence, le part sert de repli ;\n5. **publie l'événement metrics** `Metrics.TryBestDetected` pour mesurer la fréquence par modèle/reason.\n\n### 4.4 Choix utilisateur (trois options dans le dialog TUI)\n\nAprès la suspension, la TUI ouvre le dialog « Try-best loop detected — turn paused », dont la description contient les preuves (par exemple « Near-identical edits repeated 3 times in packages/opencode/src/foo.ts »). Trois options sont proposées :\n\n1. **Continuer avec Codex CLI** (`Hand off to Codex CLI`)\n2. **Continuer avec Claude Code CLI** (`Hand off to Claude Code CLI`)\n3. **Conserver le modèle actuel mais changer de stratégie** (`Continue with \u003cmodel>`) — lui faire abandonner son approach et replanifier\n\nLes cibles candidates **excluent la famille du modèle courant** (`handoffTargets` dans `packages/opencode/src/cli/cmd/tui/util/handoff.ts`) :\n\n- provider courant `openai` ou nom du modèle contenant `gpt / codex` → seulement « Claude Code CLI »\n- nom contenant `anthropic / claude` → seulement « Codex CLI »\n- autres → les deux\n\nLa TUI vérifie également que le skill correspondant (`codex` / `claude-code`) est enregistré dans `sync.data.command` ; une option non enregistrée est désactivée.\n\n### 4.5 Protocole d'exécution (handoff orchestré)\n\nAprès sélection du harness, la TUI **ne change ni de session ni de modèle**. Elle appelle `promptAsync` sur le sessionID d'origine et transmet un `\u003csystem-reminder>` comme entrée du turn suivant (modèle dans `formatHarnessReminder`) :\n\n```\n\u003csystem-reminder>\nTry-best loop detection paused the previous turn: \u003cdetail>\nThe user explicitly selected and authorized the \u003charness> harness to take over the unfinished work.\nYou MUST load and follow the `\u003cskill>` skill now and invoke \u003charness> as the primary executor …\nGive the selected harness the complete user goal, relevant workspace state, the failed approach, and all remaining validation requirements. Do not include credentials, secrets, or unrelated private data.\nStay in this CLI and supervise \u003charness> until it completes or reaches a concrete blocker …\nInspect the harness result and workspace changes, ensure its validation is complete, and report the final outcome to the user. Do not stop after merely launching the harness.\n\u003c/system-reminder>\n```\n\nPoints essentiels :\n\n- **Plan de contrôle = session d'origine** : panneau des tâches, routage des approbations, contexte et mémoire restent dans MiMoCode ; le harness n'est qu'un sous-processus lancé.\n- **Plan d'exécution = harness sélectionné** : recherche, implémentation, correction et validation doivent avoir lieu dans ce sous-processus. Le system-reminder interdit explicitement de n'utiliser le harness « que comme référence » ou de return juste après son launch.\n- **Le modèle d'origine reste présent** : il charge le skill, prépare le travail pour le harness, le supervise jusqu'à la fin et rapporte le résultat. Il ne cède pas le contrôle, mais devient le superviseur d'exécution du harness.\n\nChoisir « conserver le modèle actuel mais changer de stratégie » n'envoie aucun reminder ; seul `ctx.blocked` est levé pour que le modèle replanifie au turn suivant.\n\n---\n\n## 5. Configuration\n\n### 5.1 Interrupteur principal\n\n- **Variable d'environnement `MIMOCODE_ENABLE_TRY_BEST_HANDOFF`** (`true` par défaut)\n  - `false` ou `0` → désactive la détection de boucle, la suspension du turn et le dialog de handoff.\n  - Définie dans `packages/opencode/src/flag/flag.ts`.\n\n### 5.2 Seuils (`experimental.try_best`)\n\nChaque seuil peut être remplacé dans `mimocode.json` / config :\n\n```json\n{\n  \"experimental\": {\n    \"try_best\": {\n      \"edit_window\": 12,\n      \"edit_similarity\": 0.8,\n      \"edit_matches\": 2,\n      \"action_streak\": 4\n    }\n  }\n}\n```\n\nSignification :\n\n| Key | Défaut | Description |\n|---|---|---|\n| `edit_window` | 12 | Nombre d'événements edit récents comparés |\n| `edit_similarity` | 0.8 | Seuil de similarité de Jaccard (0–1) ; le dépasser compte comme une correspondance |\n| `edit_matches` | 2 | Nombre cumulé de correspondances requis (déclenchement à la modification N+1) |\n| `action_streak` | 4 | Nombre consécutif de `edit`/`verify` sans progrès |\n\nLe nombre d'échecs consécutifs de `bash_retry` est actuellement fixé à 3 (`TRY_BEST_BASH_RETRIES`), sans option de config.\n\n### 5.3 État d'enregistrement des skills\n\nLes deux options de harness du dialog Hand-off exigent que les skills `codex` et `claude-code` soient enregistrés dans `sync.data.command`. Une option non enregistrée est masquée afin d'éviter de sélectionner un harness impossible à lancer.\n"},{"path":"harness/Mix of Harness and Hand-off.ja.md","title":"Mix of Harness && Hand-off の仕組み","group":"harness","content":"# Mix of Harness && Hand-off の仕組み\n\n**一言で言えば**：**Codex CLI** と **Claude Code CLI** を呼び出し可能な実行器として skill にラップし、MiMoCode が「低収益ループ」に陥ったとき、現在の turn を一時停止して、ユーザーがワンクリックで別の harness に作業を引き継げるようにする仕組みです。制御プレーンは MiMoCode セッションに残り、実行プレーンは選択した harness で動作します。この 2 つのプレーンは分離されています。\n\n対応 harness：**Codex CLI** && **Claude Code CLI**。\n\n---\n\n## 1. Mix of Harness が必要な理由\n\n単一の harness は、そもそも不得意なタスクに遭遇しても、ほとんど自力で立て直せません。Codex は楽観的で完了を早まって宣言しやすく、Claude Code はより細かく探索しますが、明確な指示のもとでは似た diff を何度も書き直す状態に陥りがちです。本当の失敗シグナルは「ある手順が失敗した」ことではなく、**token を使い続けても progress が得られない**ことです。同じファイルを繰り返し編集する、同じ bash コマンドをそのまま再試行する、探索と変更の比率が改善しない、といった状態が該当します。\n\nMix of Harness（以下 MoH）は、各 harness を MiMoCode が skill 経由で起動し、サブプロセスとして実行できる実行器にすることで、この問題を解決します。**Try-Best 検出器**が現在の turn の健全性を監視し、低収益ループを検出すると turn を一時停止して、より適切な harness をユーザーに選んでもらいます。\n\n**中核となる境界**：MoH は**セッションの provider/model を切り替えません**。「Codex CLI に引き継ぐ」または「Claude Code CLI に引き継ぐ」を選んだ後も、セッションは元の MiMoCode セッション、モデルも元のモデルのままです。対応する skill をロードし、選択した harness に実行を委譲するよう指示されるだけです。そのため、コンテキスト、タスクパネル、メモリ、承認ルーティングを再構築する必要はありません。\n\n---\n\n## 2. SKILL の設計\n\nCodex と Claude Code は、それぞれ **built-in skill** としてラップされ、パスは `\u003cdata>/builtin_skills/local/skills/codex/` と `\u003cdata>/builtin_skills/local/skills/claude-code/` です。各 skill ディレクトリの内容は次のとおりです。\n\n```\ncodex/\n  SKILL.md                # トリガー説明 + 操作ルール（headless 優先、--yolo 以外の対話を無効化）\n  agents/openai.yaml\n  references/\n    recipes.md            # codex exec の一般的なパターン\n    windows.md            # ネイティブ PowerShell / WSL2 を分けて扱う際の注意事項\n\nclaude-code/\n  SKILL.md\n  references/\n    config.md\n    flags.md\n    interactive-tmux.md\n    platforms.md\n    print-mode.md\n```\n\nSKILL.md が入口であり、`description` フィールドが skill router のトリガー条件を決めます。原則は、**skill がそのまま実行可能な CLI コマンドテンプレートを提供する**ことです。たとえば Codex skill は、すぐに次を提示します。\n\n```bash\ncodex exec \\\n  -C /path/to/repo \\\n  --sandbox workspace-write \\\n  --ask-for-approval never \\\n  \"\u003cTASK>\"\n```\n\nモデル自身に flag の組み合わせを調べさせることはしません。プラットフォーム間の差異（macOS/Linux、Windows PowerShell、WSL2）は `references/` 配下の文書で補完します。\n\n> **組み込みツールではなく、独立した skill にする理由は？** harness の操作詳細を skill 内に保持し、モデルの prompt と一緒に注入できるためです。ツール層は「サブプロセスを実行する」能力だけを公開します。skill の更新、プラットフォーム差異、flag の変更は、コードを変更せずに skill ディレクトリを置き換えるだけで対応できます。\n\n---\n\n## 3. MoH の 5 つのモード\n\nタスクによって必要なオーケストレーション構造は異なります。現在の MoH は次の 5 モードに対応しており、**Fallback が MiMoCode のデフォルトモード**です。つまり、Try-Best 検出と Hand-off が自動的に組み込まれる経路です。\n\n### 3.1 Single\n\n```\nTask → Codex → Validator\n```\n\n単一の harness を直接実行し、最後に validator を接続します。特定の harness を完全に信頼でき、タスク範囲が明確な場合に適しています。\n\n### 3.2 Fallback（デフォルト）\n\n```\nTask → MiMoCode\n          │ 失敗/停滞\n          ▼\n        Codex / Claude Code\n```\n\nMiMoCode が最初に自分で作業します。失敗/停滞シグナルを検出すると、ユーザーが別の harness を選んで引き継がせます。一般的な検出ルールは次のとおりです。\n\n- 同種ツールが N 回連続で失敗\n- X 分を超えてファイル変更がない\n- コンテキスト圧縮の回数が多すぎる\n- テスト結果が連続して改善しない\n- コストが予算の 80% を超える\n- 最終出力に必須 artifact がない\n\nTry-Best 検出器（§4 を参照）は、このうち turn 内でリアルタイムに判定できるルールを実装しています。\n\n### 3.3 Pipeline\n\n```\nClaude Code が調査\n       ↓ HandoffPacket\nCodex が実装\n       ↓ Patch\nMiMoCode がレビュー\n       ↓ Findings\nCodex が修正\n```\n\n段階を直列につなぎ、各段階に最適な harness を使い、隣接する段階の間では構造化 packet でコンテキストを渡します。段階の境界が明確なタスク（理解してから変更する、実装後にレビューする）に適しています。\n\n### 3.4 Parallel Competition\n\n```\n               ┌→ Claude Code → Patch A ┐\nTask → Fork ───┤                        ├→ Evaluator\n               └→ Codex        → Patch B ┘\n```\n\n同じ作業を別々に実行し、最後に evaluator が採用する案を選びます。境界が曖昧で複数の進め方があり、確率に賭ける価値がある場合に適しています。**コストが高い**ため、デフォルトにはしません。\n\n### 3.5 Debate / Review\n\n```\nCodex Implementer → Claude Reviewer → Codex Repairer\n```\n\n1 つの harness が案を出し、別の harness が問題点を指摘し、最初の harness が修正します。正確性やセキュリティに敏感で、クロスチェックが必要な変更に適しています。\n\n---\n\n## 4. Hand-off の仕組み（Try-Best HandOff）\n\nTry-Best HandOff は Fallback モードを自動化したものです。**turn 内でリアルタイムに**低収益ループを監視し、検出すると turn を一時停止し、その時点の証拠を記録して、選択権をユーザーに渡します。\n\n### 4.1 「低収益ループ」とは何か\n\nコーディング agent の失敗モードは、軌跡上で観測可能な形を持ちます。Try-Best は、その中でも強いシグナルを選びます。\n\n- **ループと反復**。同じファイルを繰り返し編集する（edit 回数がしきい値を超える）、意味的に近い diff が連続する、同じ bash コマンドが繰り返し失敗した後もそのまま再試行される、といった状態です。これは最も強い失敗の予兆です。agent は一度ループに入ると、ほぼ自力で抜け出せず、token の消費を続けても無駄になります。実装上は、直近 N 件の tool call に対する**スライディングウィンドウ重複排除**で十分で、embedding は不要です。\n- **進捗と消費の乖離**。粗い progress シグナル（合格したテスト数の変化、issue で言及されたファイルを diff がカバーする割合）を定義し、token burn rate と比較します。予算の 40% を消費しても progress がゼロなら、その harness はタスクに不向きだとほぼ判断でき、完了を待つより切り替えるほうがはるかに安価です。\n- **迷走パターン**。探索段階でファイルを読むのは正常ですが、後半にも広範囲の grep を続ける、同じ大きなファイル群を繰り返し読む、issue と無関係なディレクトリを開く場合、repo の作業モデルを構築できていません。「直近 K ステップにおける新規情報操作と変更操作の比率」で定量化します。健全な軌跡では、この比率は時間とともに単調減少するはずです。\n- **早すぎる完了宣言**。harness が done と宣言しても、軌跡内でテストを実行していない、またはテスト後に結果を確認していない状態です。**自己申告の完了状態を信用してはいけません**。この点で Codex は Claude Code より楽観的です。\n\n### 4.2 検出の仕組み（3 種類の検出理由）\n\n現在の `packages/opencode/src/session/try-best-detector.ts` の実装は、最初の 2 種類のシグナルを次の 3 ルールで検出します。\n\n| Reason | 説明 | デフォルトしきい値 |\n|---|---|---|\n| `edit_repeat` | **同じファイル**への類似編集：diff を 3-shingle の集合に変換し、直近 12 件の edit イベントを **Jaccard 類似度**で比較。類似度 > 0.8 を 1 回の一致とする | 一致が累計 2 回以上で発火（つまり「3 回目の類似編集」） |\n| `bash_retry` | 正規化後の bash コマンドが**連続して失敗**し、失敗出力も変化しない | 3 回連続 |\n| `action_streak` | 同種の操作（`edit` または `verify`）が連続し、観測可能な改善がない | 4 回連続 |\n\nタイムスタンプ、一時パス、ランダム seed による誤検出を避けるため、コマンドと結果を正規化します。\n\n- コマンド：`/tmp/...` → `\u003cTMP>`、6 桁以上の純粋な数値 → `\u003cNUM>`、`--seed=xxx` → `\u003cSEED>`\n- 結果：`Ns / Nms / N seconds` のような所要時間も除去。2,000 文字を超える場合は先頭と末尾を半分ずつ残し、中央に `\u003cTRUNCATED>` を挿入\n\n`verify` 系コマンド（bun/npm/pnpm/yarn test/typecheck/lint/build、pytest、cargo test、go test、make test、tsc など）は `bash_retry` の判定に加わると同時に、`action_streak` にもカウントされます。\n\n### 4.3 一時停止と永続化\n\nいずれかの reason が検出されると、`SessionProcessor.detectTryBest` は次を実行します。\n\n1. **monitor を reset**し、同じ turn で繰り返し発火するのを防ぎます。\n2. **`ctx.blocked = true` に設定**し、processor が後続のモデル出力に `stop` を return して、prompt loop が現在の turn を直ちに終了するようにします。\n3. **synthetic `TextPart` を書き込み**ます。`text` は人間が読める理由（\"Try-best loop detected; this turn was paused. …\"）で、`metadata.origin` には `kind: \"try_best\"`、現在の `providerID / modelID`、完全な `incident`（reason + evidence）が含まれます。**part が信頼できる事実の情報源**です。イベント購読者が切断しても、session の再起動時に part を走査して復元できます。\n4. **`session.try_best.detected` イベントを発行**します。TUI はこれを購読し、即座に dialog を表示します。イベントは低遅延通知で、part がフォールバックになります。\n5. **metrics イベント** `Metrics.TryBestDetected` を発行し、モデル/reason ごとの発火頻度を集計できるようにします。\n\n### 4.4 ユーザーの選択（TUI dialog の 3 オプション）\n\n一時停止後、TUI はタイトルが \"Try-best loop detected — turn paused\" の dialog を表示します。説明には具体的な証拠（例：\"Near-identical edits repeated 3 times in packages/opencode/src/foo.ts\"）が含まれ、次の 3 つを選べます。\n\n1. **Codex CLI に引き継いで続行**（`Hand off to Codex CLI`）\n2. **Claude Code CLI に引き継いで続行**（`Hand off to Claude Code CLI`）\n3. **現在のモデルを維持し、戦略を変えて続行**（`Continue with \u003cmodel>`）—元のモデルに現在の approach を捨てて再計画させる\n\n候補は**同じモデルファミリーを除外**します（`packages/opencode/src/cli/cmd/tui/util/handoff.ts` の `handoffTargets`）。\n\n- 現在の provider が `openai`、またはモデル名に `gpt / codex` が含まれる → \"Claude Code CLI\" のみ表示（自分自身に再挑戦させない）\n- モデル名に `anthropic / claude` が含まれる → \"Codex CLI\" のみ表示\n- その他 → 両方を表示\n\n同時に `sync.data.command` で対応する skill（`codex` / `claude-code`）が登録済みか確認し、未登録のオプションは無効化されます。\n\n### 4.5 実行プロトコル（オーケストレーション型 handoff）\n\nharness を選択しても、TUI は**セッションもモデルも切り替えません**。元の sessionID に `promptAsync` を送り、`\u003csystem-reminder>` を次の turn の入力にします（テンプレートは `formatHarnessReminder` を参照）。\n\n```\n\u003csystem-reminder>\nTry-best loop detection paused the previous turn: \u003cdetail>\nThe user explicitly selected and authorized the \u003charness> harness to take over the unfinished work.\nYou MUST load and follow the `\u003cskill>` skill now and invoke \u003charness> as the primary executor …\nGive the selected harness the complete user goal, relevant workspace state, the failed approach, and all remaining validation requirements. Do not include credentials, secrets, or unrelated private data.\nStay in this CLI and supervise \u003charness> until it completes or reaches a concrete blocker …\nInspect the harness result and workspace changes, ensure its validation is complete, and report the final outcome to the user. Do not stop after merely launching the harness.\n\u003c/system-reminder>\n```\n\n要点：\n\n- **制御プレーン = 元のセッション**：タスクパネル、承認ルーティング、コンテキスト、メモリはすべて MiMoCode セッションに残り、harness は起動されたサブプロセスにすぎません。\n- **実行プレーン = 選択した harness**：実際の調査、実装、修正、検証はすべてこのサブプロセス内で完了させます。system-reminder は「harness を参考として使うだけ」や「harness の launch 後すぐ return する」ことを明示的に禁止します。\n- **元のモデルも引き続き存在**：skill の呼び出し、harness への作業のパッケージング、完了までの監督、ユーザーへの最終結果報告を担当します。制御権を手放すのではなく、harness のランタイム監督者になります。\n\n「現在のモデルを維持し、戦略を変える」を選んだ場合は reminder を送らず、`ctx.blocked` を解除するだけです。元のモデルは次の turn で自ら再計画します。\n\n---\n\n## 5. 設定\n\n### 5.1 マスタースイッチ\n\n- **環境変数 `MIMOCODE_ENABLE_TRY_BEST_HANDOFF`**（デフォルト `true`）\n  - `false` または `0` に設定 → loop 検出、turn の一時停止、handoff dialog の全機能を無効化。\n  - 定義は `packages/opencode/src/flag/flag.ts`。\n\n### 5.2 しきい値（`experimental.try_best`）\n\n`mimocode.json` / config で検出しきい値を個別に上書きできます。\n\n```json\n{\n  \"experimental\": {\n    \"try_best\": {\n      \"edit_window\": 12,\n      \"edit_similarity\": 0.8,\n      \"edit_matches\": 2,\n      \"action_streak\": 4\n    }\n  }\n}\n```\n\n各項目の意味：\n\n| Key | デフォルト | 説明 |\n|---|---|---|\n| `edit_window` | 12 | 比較対象となる直近の edit イベント数 |\n| `edit_similarity` | 0.8 | Jaccard 類似度のしきい値（0–1）。超えると 1 回の一致とみなす |\n| `edit_matches` | 2 | 発火前に必要な類似一致の累計回数（つまり N+1 回目の編集で発火） |\n| `action_streak` | 4 | progress のない `edit`/`verify` の連続回数 |\n\n`bash_retry` の連続失敗回数は現在 3（`TRY_BEST_BASH_RETRIES`）に固定されており、config 項目はありません。\n\n### 5.3 skill の登録状態\n\nHand-off dialog の 2 つの harness オプションを表示するには、`codex` と `claude-code` skill が `sync.data.command` に登録されている必要があります。未登録のオプションは、起動できない harness を選ばせないよう非表示になります。\n"},{"path":"harness/Mix of Harness and Hand-off.md","title":"Mix of Harness && Hand-off 机制","group":"harness","content":"# Mix of Harness && Hand-off 机制\n\n**一句话总结**：把 **Codex CLI** 与 **Claude Code CLI** 作为可调用的执行器封装成 skill，让 MiMoCode 在自己陷入\"低收益循环\"时能够把当前 turn 暂停、由用户一键把工作交给另一个 harness 继续。控制平面仍在 MiMoCode 会话里，执行平面在选中的 harness 里——两个平面解耦。\n\n支持的 harness：**Codex CLI** && **Claude Code CLI**。\n\n---\n\n## 1. 为什么要 Mix of Harness\n\n单一 harness 在遇到\"它本来就不擅长\"的任务时几乎不会自救：Codex 更乐观、容易过早宣告完成；Claude Code 探索更细，但在明确指令下容易陷入相似 diff 反复重写。真正的失败信号不是\"某一步错了\"，而是**继续烧 token 也换不来 progress**——同一文件被反复编辑、同一条 bash 命令原样重试、探索/修改的比例上不去。\n\nMix of Harness（下称 MoH）解决的是这个问题：把每个 harness 都做成可以由 MiMoCode 通过 skill 拉起、以子进程形式跑的执行器；配合 **Try-Best 检测器**监控当前 turn 的健康度，一旦命中低收益循环就暂停 turn、让用户选一个更合适的 harness 接手。\n\n**核心边界**：MoH **不切换会话的 provider/model**。选择\"交给 Codex CLI\"或\"交给 Claude Code CLI\"之后，会话仍然是原来的 MiMoCode 会话、原来的模型，只是被要求加载对应 skill、把执行权委派给选中的 harness。这样上下文、任务面板、记忆、审批路由都不用重建。\n\n---\n\n## 2. SKILL 设计\n\nCodex 和 Claude Code 各封装为一个 **built-in skill**，路径分别在 `\u003cdata>/builtin_skills/local/skills/codex/` 与 `\u003cdata>/builtin_skills/local/skills/claude-code/`。每个 skill 目录含：\n\n```\ncodex/\n  SKILL.md                # 触发描述 + 操作规则（headless 优先，禁用 --yolo 之外的交互）\n  agents/openai.yaml\n  references/\n    recipes.md            # codex exec 的常用 pattern\n    windows.md            # 原生 PowerShell / WSL2 分开走的注意事项\n\nclaude-code/\n  SKILL.md\n  references/\n    config.md\n    flags.md\n    interactive-tmux.md\n    platforms.md\n    print-mode.md\n```\n\nSKILL.md 是入口，`description` 字段决定何时被 skill router 触发。原则是 **让 skill 直接给出可执行的 CLI 命令模板**——例如 Codex skill 会立刻给出：\n\n```bash\ncodex exec \\\n  -C /path/to/repo \\\n  --sandbox workspace-write \\\n  --ask-for-approval never \\\n  \"\u003cTASK>\"\n```\n\n而不是让模型自己去查 flag 组合。跨平台差异（macOS/Linux vs Windows PowerShell vs WSL2）由 `references/` 里的子文档兜底。\n\n> **为什么单独做 skill 而不是内置成工具？** 让 harness 的操作细节留在 skill 里、随模型 prompt 一并注入；工具层只暴露\"运行子进程\"这一层能力。skill 更新、跨平台差异、flag 变化都可以通过替换 skill 目录内容完成，不用改代码。\n\n---\n\n## 3. MoH 的五种模式\n\n不同任务需要的编排结构不同。当前 MoH 支持以下五种，其中 **Fallback 是 MiMoCode 的默认模式**——也就是自动接入 Try-Best 检测 + Hand-off 的那一路。\n\n### 3.1 Single\n\n```\nTask → Codex → Validator\n```\n\n单 harness 直跑，末尾接一个 validator。适合完全信任某个 harness、任务范围明确的场景。\n\n### 3.2 Fallback（默认）\n\n```\nTask → MiMoCode\n          │ 失败/停滞\n          ▼\n        Codex / Claude Code\n```\n\nMiMoCode 首选自己动手；命中失败/停滞信号后由用户挑选另一个 harness 接手。触发失败/停滞的常见规则：\n\n- 连续 N 次同类工具失败\n- 超过 X 分钟无文件变化\n- 上下文压缩次数过多\n- 测试结果连续没有改善\n- 成本超过预算的 80%\n- 最终输出缺少要求的 artifact\n\nTry-Best 检测器（见 §4）实现了其中前几条中\"可以在 turn 内实时判定\"的那部分。\n\n### 3.3 Pipeline\n\n```\nClaude Code 调研\n       ↓ HandoffPacket\nCodex 实现\n       ↓ Patch\nMiMoCode 审查\n       ↓ Findings\nCodex 修复\n```\n\n阶段式串联，每个阶段用最合适的 harness，相邻阶段之间用结构化 packet 传递上下文。适合有明确阶段边界的任务（先看清再改、先改完再评审）。\n\n### 3.4 Parallel Competition\n\n```\n               ┌→ Claude Code → Patch A ┐\nTask → Fork ───┤                        ├→ Evaluator\n               └→ Codex        → Patch B ┘\n```\n\n分头做同一件事，最后由 evaluator 挑一个采纳。适合边界模糊、方案有多种走法、想赌一次概率的场景。**成本更高**，不做默认。\n\n### 3.5 Debate / Review\n\n```\nCodex Implementer → Claude Reviewer → Codex Repairer\n```\n\n一个 harness 出方案，另一个 harness 挑刺，然后回到第一个 harness 修。适合对正确性/安全性敏感、需要交叉检查的改动。\n\n---\n\n## 4. Hand-off 机制（Try-Best HandOff）\n\nTry-Best HandOff 是 Fallback 模式的自动化实现：**turn 内实时监测**低收益循环，一旦命中就把 turn 暂停、写入现场证据、把选择权交给用户。\n\n### 4.1 什么算\"低收益循环\"\n\n编码 agent 的失败模式在轨迹上有可观测的形状，Try-Best 只挑其中三种最强的信号：\n\n- **循环与重复**。同一文件被反复编辑（edit 次数超过阈值）、连续出现语义相近的 diff、同一条 bash 命令反复失败后原样重试。这是最强的失败前兆——agent 陷入循环后几乎不会自己爬出来，继续烧 token 纯属浪费。实现上对最近 N 个 tool call 做**滑动窗口去重**就够，不需要 embedding。\n- **进度与消耗脱钩**。定义一个粗粒度 progress 信号（测试通过数变化、diff 覆盖 issue 提到的文件的比例），对比 token burn rate。烧了 40% 预算但 progress 为零，基本可以判定这个 harness 不适合该任务，触发切换比等它跑完便宜得多。\n- **迷路模式**。探索阶段读文件是正常的，但后期还在大范围 grep、反复读同一批大文件、打开与 issue 无关的目录，说明它没建立起对 repo 的工作模型。用\"最近 K 步中新增信息类操作 vs 修改类操作的比例\"来量化——健康轨迹这个比例应该随时间单调下降。\n- **过早宣告完成**。harness 声明 done 但轨迹里没有跑测试/跑了但没看结果。**不要信任自报完成状态**，Codex 在这点上比 Claude Code 更乐观。\n\n### 4.2 检测机制（三类命中原因）\n\n当前实现在 `packages/opencode/src/session/try-best-detector.ts` 中命中前两类信号的三种具体规则：\n\n| Reason | 说明 | 默认阈值 |\n|---|---|---|\n| `edit_repeat` | 对**同一文件**做近似编辑：把 diff 抽成 3-shingle 集合、用 **Jaccard 相似度**比对最近 12 个 edit 事件；相似度 > 0.8 视为一次匹配 | 累计 ≥ 2 次匹配就触发（即\"第 3 次近似编辑\" ） |\n| `bash_retry` | 规范化后的 bash 命令**连续失败**、且失败输出没有变化 | 连续 3 次 |\n| `action_streak` | 连续同类动作（`edit` 或 `verify`）没有可观察改善 | 连续 4 次 |\n\n命令与结果都会做归一化，避免因时间戳、临时路径、随机 seed 造成误判：\n\n- 命令：`/tmp/...` → `\u003cTMP>`、纯数字（6 位以上）→ `\u003cNUM>`、`--seed=xxx` → `\u003cSEED>`\n- 结果：额外抹掉 `Ns / Nms / N seconds` 时长；超过 2000 字符时头尾各留一半、中间插 `\u003cTRUNCATED>`\n\n`verify` 类命令（bun/npm/pnpm/yarn test/typecheck/lint/build、pytest、cargo test、go test、make test、tsc 等）在参与 `bash_retry` 判定的同时也进入 `action_streak` 计数。\n\n### 4.3 暂停与持久化\n\n命中任一 reason 后，`SessionProcessor.detectTryBest` 会：\n\n1. **reset monitor**——避免同一 turn 反复触发。\n2. **置 `ctx.blocked = true`**——processor 后续对模型输出 return `stop`，让 prompt loop 立刻退出当前 turn。\n3. **写入 synthetic `TextPart`**：`text` 是人类可读的原因描述（\"Try-best loop detected; this turn was paused. …\"），`metadata.origin` 里带 `kind: \"try_best\"`、当前 `providerID / modelID`、完整 `incident`（reason + evidence）。**part 是事实来源**，即便事件订阅者掉线，重新拉起 session 也能通过扫描 part 恢复。\n4. **发布 `session.try_best.detected` 事件**：TUI 端订阅这条事件即时弹出 dialog。事件是低延迟通知，与 part 互为兜底。\n5. **发布 metrics 事件** `Metrics.TryBestDetected`：便于统计各模型/reason 的触发频率。\n\n### 4.4 用户选择（TUI dialog 三选项）\n\n暂停后 TUI 弹出 dialog，标题 \"Try-best loop detected — turn paused\"，描述里带具体证据（例如\"Near-identical edits repeated 3 times in packages/opencode/src/foo.ts\"）。三个选项：\n\n1. **交给 Codex CLI 继续**（`Hand off to Codex CLI`）\n2. **交给 Claude Code CLI 继续**（`Hand off to Claude Code CLI`）\n3. **保留当前模型换策略继续**（`Continue with \u003cmodel>`）——让原模型放弃当前 approach、重新规划\n\n候选目标按**模型家族排除同类**（`packages/opencode/src/cli/cmd/tui/util/handoff.ts` 里的 `handoffTargets`）：\n\n- 当前 provider 是 `openai` 或模型名含 `gpt / codex` → 只显示 \"Claude Code CLI\"（不给自己回炉的机会）\n- 模型名含 `anthropic / claude` → 只显示 \"Codex CLI\"\n- 其他 → 两个都显示\n\n同时检查 `sync.data.command` 中对应 skill（`codex` / `claude-code`）已注册；未注册的选项会灰掉。\n\n### 4.5 执行协议（编排式 handoff）\n\n选定 harness 后 TUI **不换会话、不换模型**，而是向原 sessionID 发起 `promptAsync`，把一段 `\u003csystem-reminder>` 作为下一轮的输入（模板见 `formatHarnessReminder`）：\n\n```\n\u003csystem-reminder>\nTry-best loop detection paused the previous turn: \u003cdetail>\nThe user explicitly selected and authorized the \u003charness> harness to take over the unfinished work.\nYou MUST load and follow the `\u003cskill>` skill now and invoke \u003charness> as the primary executor …\nGive the selected harness the complete user goal, relevant workspace state, the failed approach, and all remaining validation requirements. Do not include credentials, secrets, or unrelated private data.\nStay in this CLI and supervise \u003charness> until it completes or reaches a concrete blocker …\nInspect the harness result and workspace changes, ensure its validation is complete, and report the final outcome to the user. Do not stop after merely launching the harness.\n\u003c/system-reminder>\n```\n\n关键点：\n\n- **控制平面 = 原会话**：任务面板、审批路由、上下文、记忆都在 MiMoCode 会话里；harness 只是被拉起来的子进程。\n- **执行平面 = 选中的 harness**：真正的调研、实现、修复、验证都要在这个子进程里完成。system-reminder 显式禁止\"只是把 harness 当参考\"，也禁止\"launch 完 harness 就 return\"。\n- **原模型仍然在场**：负责调用 skill、把工作打包给 harness、监督到完成、把最终结果汇报给用户。它不是把控制权交出去，而是变成 harness 的运行时监工。\n\n选择\"保留当前模型换策略\"时不发 reminder，仅解除 `ctx.blocked`，让原模型下一轮自己重规划。\n\n---\n\n## 5. 配置\n\n### 5.1 总开关\n\n- **环境变量 `MIMOCODE_ENABLE_TRY_BEST_HANDOFF`**（默认 `true`）\n  - 设为 `false` 或 `0` → 关闭 loop 检测、turn 暂停、handoff dialog 全套能力。\n  - 定义见 `packages/opencode/src/flag/flag.ts`。\n\n### 5.2 阈值（`experimental.try_best`）\n\n在 `mimocode.json` / config 里可以逐项覆盖检测阈值：\n\n```json\n{\n  \"experimental\": {\n    \"try_best\": {\n      \"edit_window\": 12,\n      \"edit_similarity\": 0.8,\n      \"edit_matches\": 2,\n      \"action_streak\": 4\n    }\n  }\n}\n```\n\n含义：\n\n| Key | 默认 | 说明 |\n|---|---|---|\n| `edit_window` | 12 | 参与比对的最近 edit 事件数 |\n| `edit_similarity` | 0.8 | Jaccard 相似度阈值（0–1）；超过视为一次匹配 |\n| `edit_matches` | 2 | 触发前需要累计的相似匹配次数（即\"第 N+1 次编辑\"触发） |\n| `action_streak` | 4 | `edit`/`verify` 无进展的连续次数 |\n\n`bash_retry` 的连续失败次数目前固定为 3（`TRY_BEST_BASH_RETRIES`），无 config 项。\n\n### 5.3 skill 注册状态\n\nHandoff dialog 的两个 harness 选项要求 `codex` 与 `claude-code` skill 已在 `sync.data.command` 中注册。未注册时对应选项会被隐藏，避免选了却拉不起来。\n"},{"path":"harness/Mix of Harness and Hand-off.ru.md","title":"Механизм Mix of Harness && Hand-off","group":"harness","content":"# Механизм Mix of Harness && Hand-off\n\n**В одну строку**: упаковать **Codex CLI** и **Claude Code CLI** как вызываемые через skill исполнители, чтобы MiMoCode при попадании в «цикл с низкой отдачей» мог приостановить текущий turn, а пользователь — одним действием передать работу другому harness. Плоскость управления остаётся в сессии MiMoCode, а плоскость исполнения находится в выбранном harness — эти плоскости разделены.\n\nПоддерживаемые harness: **Codex CLI** && **Claude Code CLI**.\n\n---\n\n## 1. Зачем нужен Mix of Harness\n\nКогда единственный harness сталкивается с задачей, для которой он изначально плохо подходит, он почти никогда не восстанавливается сам: Codex более оптимистичен и склонен слишком рано объявлять о завершении; Claude Code исследует подробнее, но при явных инструкциях может застрять в многократном переписывании похожих diff. Настоящий сигнал неудачи — не то, что «один шаг завершился ошибкой», а то, что **дальнейший расход token не приносит progress**: один файл снова и снова редактируется, одна команда bash повторяется без изменений, а соотношение исследования и изменений не улучшается.\n\nMix of Harness (далее MoH) решает проблему, превращая каждый harness в исполнитель, который MiMoCode может запустить через skill как дочерний процесс. **Детектор Try-Best** следит за состоянием текущего turn; обнаружив цикл с низкой отдачей, он приостанавливает turn и предлагает пользователю выбрать более подходящий harness для продолжения.\n\n**Ключевая граница**: MoH **не переключает provider/model сессии**. После выбора «передать Codex CLI» или «передать Claude Code CLI» остаются исходные сессия MiMoCode и модель. Модель лишь получает указание загрузить соответствующий skill и делегировать исполнение выбранному harness. Контекст, панель задач, память и маршрутизация одобрений не требуют перестройки.\n\n---\n\n## 2. Устройство SKILL\n\nCodex и Claude Code упакованы в отдельные **built-in skill** по путям `\u003cdata>/builtin_skills/local/skills/codex/` и `\u003cdata>/builtin_skills/local/skills/claude-code/`. Содержимое каталогов:\n\n```\ncodex/\n  SKILL.md                # Описание триггера + правила (предпочитать headless, без интерактива кроме --yolo)\n  agents/openai.yaml\n  references/\n    recipes.md            # Частые паттерны codex exec\n    windows.md            # Отдельные указания для нативного PowerShell / WSL2\n\nclaude-code/\n  SKILL.md\n  references/\n    config.md\n    flags.md\n    interactive-tmux.md\n    platforms.md\n    print-mode.md\n```\n\nSKILL.md — точка входа, а поле `description` определяет, когда skill router его активирует. Основной принцип — **давать прямо в skill готовые исполняемые шаблоны команд CLI**. Например, skill Codex сразу предлагает:\n\n```bash\ncodex exec \\\n  -C /path/to/repo \\\n  --sandbox workspace-write \\\n  --ask-for-approval never \\\n  \"\u003cTASK>\"\n```\n\nвместо того чтобы заставлять модель самостоятельно искать комбинацию flags. Различия платформ (macOS/Linux, Windows PowerShell и WSL2) описаны в документах `references/`.\n\n> **Почему отдельный skill, а не встроенный инструмент?** Детали работы harness остаются в skill и вводятся вместе с prompt модели; слой инструментов предоставляет только возможность запустить дочерний процесс. Обновления skill, различия платформ и изменения flags можно поддерживать заменой каталога skill без изменения кода.\n\n---\n\n## 3. Пять режимов MoH\n\nРазным задачам нужны разные структуры оркестрации. Сейчас MoH поддерживает пять режимов, причём **Fallback — режим MiMoCode по умолчанию**: именно в нём автоматически подключаются детектор Try-Best и Hand-off.\n\n### 3.1 Single\n\n```\nTask → Codex → Validator\n```\n\nОдин harness запускается напрямую, после него — validator. Подходит, когда harness полностью заслуживает доверия, а границы задачи ясны.\n\n### 3.2 Fallback (по умолчанию)\n\n```\nTask → MiMoCode\n          │ неудача/застой\n          ▼\n        Codex / Claude Code\n```\n\nСначала MiMoCode пытается выполнить работу сам. После сигнала неудачи/застоя пользователь выбирает другой harness. Распространённые правила:\n\n- N последовательных сбоев инструментов одного класса\n- Нет изменений файлов более X минут\n- Слишком много сжатий контекста\n- Результаты тестов последовательно не улучшаются\n- Расход превышает 80% бюджета\n- В финальном выводе нет требуемого artifact\n\nДетектор Try-Best (см. §4) реализует те правила, которые можно оценивать в реальном времени внутри turn.\n\n### 3.3 Pipeline\n\n```\nИсследование Claude Code\n       ↓ HandoffPacket\nРеализация Codex\n       ↓ Patch\nРевью MiMoCode\n       ↓ Findings\nИсправление Codex\n```\n\nЭтапы соединены последовательно, каждый выполняет наиболее подходящий harness, а контекст передаётся между соседними этапами структурированными packets. Подходит для задач с чёткими границами этапов: сначала разобраться, затем изменить; после реализации провести ревью.\n\n### 3.4 Parallel Competition\n\n```\n               ┌→ Claude Code → Patch A ┐\nTask → Fork ───┤                        ├→ Evaluator\n               └→ Codex        → Patch B ┘\n```\n\nНесколько harness независимо выполняют одну задачу, после чего evaluator выбирает результат. Подходит при неясных границах, нескольких возможных подходах и желании сделать вероятностную ставку. **Требует больше ресурсов**, поэтому не используется по умолчанию.\n\n### 3.5 Debate / Review\n\n```\nCodex Implementer → Claude Reviewer → Codex Repairer\n```\n\nОдин harness предлагает решение, другой критикует его, затем первый исправляет. Подходит для изменений, чувствительных к корректности или безопасности и требующих перекрёстной проверки.\n\n---\n\n## 4. Механизм Hand-off (Try-Best HandOff)\n\nTry-Best HandOff автоматизирует режим Fallback: он **в реальном времени внутри turn** отслеживает циклы с низкой отдачей и при срабатывании приостанавливает turn, сохраняет свидетельства и передаёт выбор пользователю.\n\n### 4.1 Что считается «циклом с низкой отдачей»\n\nРежимы неудачи агента кодинга имеют наблюдаемую форму в его траектории. Try-Best выбирает самые сильные сигналы:\n\n- **Циклы и повторения**. Один файл многократно редактируется, последовательно появляются семантически близкие diff или одна команда bash без изменений повторяется после нескольких сбоев. Это сильнейший предвестник неудачи: попав в цикл, agent почти никогда не выбирается сам, и дальнейший расход token бесполезен. Достаточно **дедупликации скользящего окна** последних N tool call; embedding не нужны.\n- **Разрыв между прогрессом и расходом**. Грубый сигнал progress (изменение числа успешных тестов, доля упомянутых в issue файлов, покрытая diff) сравнивается с token burn rate. Если потрачено 40% бюджета при нулевом прогрессе, harness почти наверняка не подходит; переключиться дешевле, чем ждать.\n- **Потеря ориентации**. Читать файлы на этапе исследования нормально, но широкие grep на позднем этапе, повторное чтение одних больших файлов или открытие не связанных с issue каталогов означают, что agent не построил рабочую модель repo. Это измеряется отношением операций получения новой информации к операциям изменения за последние K шагов; в здоровой траектории оно должно монотонно снижаться.\n- **Преждевременное объявление о завершении**. Harness говорит done, хотя тесты не запускались или их результат не был просмотрен. **Не доверяйте самостоятельно заявленному завершению**; Codex в этом отношении оптимистичнее Claude Code.\n\n### 4.2 Механизм обнаружения (три причины срабатывания)\n\nТекущая реализация в `packages/opencode/src/session/try-best-detector.ts` обнаруживает первые две категории сигналов тремя правилами:\n\n| Reason | Описание | Порог по умолчанию |\n|---|---|---|\n| `edit_repeat` | Похожие изменения **одного файла**: diff преобразуется в набор 3-shingle, последние 12 событий edit сравниваются по **сходству Жаккара**; сходство > 0,8 считается одним совпадением | Срабатывание после ≥ 2 накопленных совпадений («третье похожее изменение») |\n| `bash_retry` | Нормализованная команда bash **последовательно завершается ошибкой**, а вывод ошибки не меняется | 3 раза подряд |\n| `action_streak` | Последовательные действия одного класса (`edit` или `verify`) не дают наблюдаемого улучшения | 4 раза подряд |\n\nКоманды и результаты нормализуются, чтобы избежать ложных срабатываний из-за временных меток, временных путей или случайных seed:\n\n- Команда: `/tmp/...` → `\u003cTMP>`, числа из 6 и более цифр → `\u003cNUM>`, `--seed=xxx` → `\u003cSEED>`\n- Результат: дополнительно удаляются длительности `Ns / Nms / N seconds`; свыше 2000 символов сохраняется по половине начала и конца, а в середину вставляется `\u003cTRUNCATED>`\n\nКоманды `verify` (bun/npm/pnpm/yarn test/typecheck/lint/build, pytest, cargo test, go test, make test, tsc и т. д.) участвуют в проверке `bash_retry` и одновременно учитываются в `action_streak`.\n\n### 4.3 Приостановка и сохранение\n\nПосле срабатывания любого reason `SessionProcessor.detectTryBest`:\n\n1. **сбрасывает monitor**, предотвращая повторные срабатывания в одном turn;\n2. **задаёт `ctx.blocked = true`**, чтобы processor для последующего вывода модели return `stop`, а prompt loop немедленно завершил текущий turn;\n3. **записывает synthetic `TextPart`**: `text` содержит понятное человеку описание («Try-best loop detected; this turn was paused. …»), а `metadata.origin` — `kind: \"try_best\"`, текущие `providerID / modelID` и полный `incident` (reason + evidence). **Part является источником истины**: даже при отключении подписчика событий сессию можно восстановить сканированием parts;\n4. **публикует событие `session.try_best.detected`**: TUI подписывается на него и сразу показывает dialog. Событие даёт низкую задержку, part служит резервным каналом;\n5. **публикует событие metrics** `Metrics.TryBestDetected` для подсчёта частоты по моделям/reason.\n\n### 4.4 Выбор пользователя (три варианта в dialog TUI)\n\nПосле приостановки TUI открывает dialog «Try-best loop detected — turn paused», содержащий конкретные свидетельства (например, «Near-identical edits repeated 3 times in packages/opencode/src/foo.ts»). Доступны три варианта:\n\n1. **Продолжить с Codex CLI** (`Hand off to Codex CLI`)\n2. **Продолжить с Claude Code CLI** (`Hand off to Claude Code CLI`)\n3. **Оставить текущую модель, но сменить стратегию** (`Continue with \u003cmodel>`) — заставить исходную модель отказаться от текущего approach и перепланировать\n\nКандидаты **исключают семейство текущей модели** (`handoffTargets` в `packages/opencode/src/cli/cmd/tui/util/handoff.ts`):\n\n- текущий provider — `openai` или имя модели содержит `gpt / codex` → только «Claude Code CLI»\n- имя содержит `anthropic / claude` → только «Codex CLI»\n- иначе → оба варианта\n\nОдновременно проверяется регистрация соответствующего skill (`codex` / `claude-code`) в `sync.data.command`; незарегистрированный вариант отключается.\n\n### 4.5 Протокол исполнения (оркестрированный handoff)\n\nПосле выбора harness TUI **не меняет ни сессию, ни модель**. Вместо этого он отправляет `promptAsync` исходному sessionID, передавая `\u003csystem-reminder>` как ввод следующего turn (шаблон — `formatHarnessReminder`):\n\n```\n\u003csystem-reminder>\nTry-best loop detection paused the previous turn: \u003cdetail>\nThe user explicitly selected and authorized the \u003charness> harness to take over the unfinished work.\nYou MUST load and follow the `\u003cskill>` skill now and invoke \u003charness> as the primary executor …\nGive the selected harness the complete user goal, relevant workspace state, the failed approach, and all remaining validation requirements. Do not include credentials, secrets, or unrelated private data.\nStay in this CLI and supervise \u003charness> until it completes or reaches a concrete blocker …\nInspect the harness result and workspace changes, ensure its validation is complete, and report the final outcome to the user. Do not stop after merely launching the harness.\n\u003c/system-reminder>\n```\n\nКлючевые моменты:\n\n- **Плоскость управления = исходная сессия**: панель задач, маршрутизация одобрений, контекст и память остаются в сессии MiMoCode; harness — лишь запущенный дочерний процесс.\n- **Плоскость исполнения = выбранный harness**: исследование, реализация, исправление и проверка выполняются в этом процессе. System-reminder явно запрещает использовать harness «только как справочник» или делать return сразу после launch.\n- **Исходная модель остаётся в работе**: загружает skill, упаковывает работу для harness, контролирует до завершения и сообщает итог пользователю. Она не отдаёт управление, а становится runtime-руководителем harness.\n\nПри выборе «оставить текущую модель, но сменить стратегию» reminder не отправляется; снимается только `ctx.blocked`, и модель перепланирует работу в следующем turn.\n\n---\n\n## 5. Конфигурация\n\n### 5.1 Главный переключатель\n\n- **Переменная окружения `MIMOCODE_ENABLE_TRY_BEST_HANDOFF`** (по умолчанию `true`)\n  - `false` или `0` → отключает обнаружение циклов, приостановку turn и dialog handoff.\n  - Определена в `packages/opencode/src/flag/flag.ts`.\n\n### 5.2 Пороги (`experimental.try_best`)\n\nПороги можно по отдельности переопределить в `mimocode.json` / config:\n\n```json\n{\n  \"experimental\": {\n    \"try_best\": {\n      \"edit_window\": 12,\n      \"edit_similarity\": 0.8,\n      \"edit_matches\": 2,\n      \"action_streak\": 4\n    }\n  }\n}\n```\n\nЗначения:\n\n| Key | По умолчанию | Описание |\n|---|---|---|\n| `edit_window` | 12 | Число последних событий edit для сравнения |\n| `edit_similarity` | 0.8 | Порог сходства Жаккара (0–1); превышение считается совпадением |\n| `edit_matches` | 2 | Накопленное число совпадений до срабатывания (то есть изменение N+1) |\n| `action_streak` | 4 | Число последовательных `edit`/`verify` без прогресса |\n\nЧисло последовательных сбоев `bash_retry` сейчас зафиксировано как 3 (`TRY_BEST_BASH_RETRIES`), опции config нет.\n\n### 5.3 Состояние регистрации skill\n\nДва варианта harness в dialog Hand-off требуют регистрации skills `codex` и `claude-code` в `sync.data.command`. Незарегистрированный вариант скрывается, чтобы нельзя было выбрать harness, который невозможно запустить.\n"},{"path":"multi-repo/README.en.md","title":"Multi-repository usage (oimo)","group":"multi-repo","content":"# Multi-repository usage (oimo)\n\n[日本語](./README.md) | English\n\noimo can treat several independent Git repositories as one **system workspace**.\n\n| Doc | Contents |\n|-----|----------|\n| **[README.md](./README.md) (Japanese, primary)** | Quick start and overview |\n| [config-reference.ja.md](./config-reference.ja.md) | Full key reference for `repos.txt` / `workspace.yaml` / `.gitmodules` |\n| [samples/](./samples/) | Copy-paste samples |\n| [current-architecture.md](./current-architecture.md) | Architecture survey (Japanese) |\n| [implementation-plan.md](./implementation-plan.md) | Phased plan (Japanese) |\n\n---\n\n## Quick start (recommended): `repos.txt`\n\n1. Create a folder for the system (does not need to be a git repo):\n\n```text\nmkdir -p ~/work/customer-platform/.oimo\ncd ~/work/customer-platform\n```\n\n2. Copy the sample and edit URLs:\n\n```bash\ncp /path/to/oimo/docs/multi-repo/samples/url-list/repos.txt .oimo/repos.txt\n```\n\n3. Clone siblings (folder name = last URL segment, or `id=`):\n\n```bash\ngit clone https://github.com/example-org/frontend\ngit clone https://github.com/example-org/backend\nbash /path/to/oimo/docs/multi-repo/samples/url-list/clone-from-repos-txt.sh\n```\n\n4. Launch from the primary app repo: `cd backend && oimo`\n\nDiscovery order: `workspace.yaml` → `repos.txt` → `.gitmodules` (superproject).\n\n### `repos.txt` at a glance\n\n| Token | Meaning |\n|-------|---------|\n| `name:` / `primary:` | Display name / default repo id |\n| URL / local path | Remote (expect `\u003cworkspace>/\u003cid>/`) or existing clone |\n| `read-only` / `id=` / `role=` | Deny writes / override id / short role |\n\nFull tables (Japanese): [config-reference.ja.md §1](./config-reference.ja.md)\n\n## `workspace.yaml` / `.gitmodules`\n\nSee the Japanese guide and [config-reference.ja.md](./config-reference.ja.md) §§2–3. Samples under [samples/](./samples/).\n\n## Phase 1 status\n\nRegistry + Resolver + doctor + finge
