rrent process.env behavior (covers: S2)\n- [x] T2: Route all inherited external process environments through `childProcessEnv(explicit)` — acceptance: direct and Effect spawners plus Bash/PTY/LSP/MCP/ripgrep use the same baseline and explicit env still overrides (covers: S2; depends: T1)\n- [x] T3: Add MiMoCode unit and structural regression tests — acceptance: baseline fidelity, credential scrub, replacement lifecycle and all spawn funnels are covered (covers: S2; depends: T2)\n"},{"path":"compose/spec/exec-tool-view.md","title":"exec Tool View (bash-style collapse)","group":"spec","content":"---\nfeature: exec-tool-view\nstatus: delivered\nupdated: 2026-07-27\nbranch: feat/exec-tool-view\ncommits: 47c8425f..6479a56b\n---\n\n# exec Tool View (bash-style collapse)\n\n## Report\n\n**What was built** — `exec` (the parallel tool-call script tool) now renders like `bash`. Once `input.code` has streamed in, the part lives in a `BlockTool` for the rest of its life; collapsing caps the script and its output at a 10-row budget with a `…` marker instead of compressing everything into a one-line summary. Expanding shows both in full. The click handler and the expand/collapse hint appear only when something actually overflows, so a short script with short output is a static block — the same rule `bash` uses.\n\nThe budget counts *rendered* rows, not source lines. The first cut of this change counted source lines and bounded nothing: `exec` returns JSON, one line of it wraps to dozens of terminal rows, and the collapsed block still filled the screen. Estimation and clipping now live in `packages/opencode/src/cli/cmd/tui/util/collapse.ts` and are shared with `Bash`, which had the same latent defect for long single-line output. Height is measured in display cells (`Bun.stringWidth`, plus one cell per tab), so CJK and emoji count double; a line straddling the budget is sliced on the cell budget without splitting a wide character, so a single 4000-char line still shows its head.\n\nThe pre-execution state keeps the single `InlineTool` pending line (`~ Writing script...`). Because that branch is only reachable while `code` is still empty, its failure color, spinner and summary children were unreachable and were removed; `InlineTool`'s `iconColor` prop lost its last user and was deleted. `exec` output now passes through `stripAnsi` like bash's, since nested `bash` calls put raw escape sequences into `\u003creturn_value>` / `\u003clogs>`.\n\nOn the backend, `exec` re-publishes the per-tool `counts` map in its terminal metadata. `SessionProcessor.completeToolCall` (`packages/opencode/src/session/processor.ts:359`) *replaces* part metadata rather than merging it, so the live breakdown streamed through `ctx.metadata` used to vanish the moment a run finished and the summary degraded to `12 calls`.\n\n**Verification**\n\n- `cd packages/opencode && bun typecheck` — PASS (clean), re-run after the display-cell rework.\n- `cd packages/opencode && bun test test/cli/tui/collapse.test.ts` — PASS, 16 pass / 0 fail (row estimation, clipping, CJK/emoji/tab widths, a budget invariant across grapheme classes, and the over-wide-cluster guard — verified to go red when the guard is removed).\n- `cd packages/opencode && bun test test/tool/tool-script.test.ts` — PASS, 42 pass / 0 fail.\n- `cd packages/opencode && bun test test/tool test/cli/tui` — PASS, 874 pass / 10 skip / 0 fail.\n- Independent subagent review of `47c8425f..b5dbe888`: both acceptance criteria met, no critical findings. Two of its three minor findings were fixed in `1e463724` (dead pending-branch props, missing `stripAnsi`); the third (`clip()` being a plain function rather than a memo) was rejected — reads of `expanded()` inside JSX children are tracked by the render effect. A second review covered the row-budget and display-cell work and found one CRITICAL — a per-code-point width walk under-charged variation-selector emoji and clipped ~2x the budget — fixed by segmenting graphemes (`36372846`), plus a scrollbox-chrome under-reservation. Its re-review passed after fuzzing the budget invariant over regional indicators, skin tones, combining marks and Hangul jamo; two residual nits were fixed in `6e23a566`. A third review covered that residual fix and found the new guard test was not exercising the guard (its budget equalled the cluster width) — tightened in `6479a56b`.\n- Not covered: there is no render harness for the components in `routes/session/index.tsx`, so wiring (which memo feeds which `\u003ctext>`) was reviewed by reading, not asserted. The row math itself is unit-tested. `exec` is gated to GPT-toolset models (`registry.ts:379-381`), so no live TUI run was performed; both display defects were reported from user screenshots, not caught by a test.\n\n**Journey log**\n\n- A source-line collapse budget is meaningless for tools whose output can be one enormous line. `exec` returns JSON via `JSON.stringify(parsed, null, 2)`, but each *string value* inside it (a nested `bash` stdout, a `grep` result set) keeps its `\\n` escaped, so 40 rows of text arrive as one source line. Budget rendered rows for anything block-shaped.\n- `Bun.stringWidth` returns **0** for a tab (and for a newline) — found via `component/prompt/offset.ts`, which special-cases both to stay aligned with `@opentui`'s editor offsets. Any width math over raw tool output has to handle tabs explicitly.\n- `Bun.stringWidth` is also **not additive over code points**: `\"❤️\"` is 2 as a unit but 1 + 0 when summed per code point. The second review caught this as a real overshoot of the row budget; per-character width walks must segment by grapheme cluster.\n- `ctx.width` (`contentWidth`, `routes/session/index.tsx:244`) subtracts the conversation box padding but not the transcript scrollbox's viewport padding or its always-visible scrollbar, so it over-states usable text columns by ~3 cells for any exact-width math.\n\n- The spec's original §S2 rule — leave the two pre-execution error returns without `counts` — did not survive contact with the type system: `Tool.define` infers metadata as the union of `execute`'s return literals, and `bun typecheck` covers `test/`, so a non-uniform union makes `result.metadata.counts` inaccessible in tests. All five terminal returns now carry `counts` (empty map for the pre-execution pair, behaviorally identical). §S2 records the delivered rule.\n- Hoisting `trace` above the code-size guard so `tally()` could be shared briefly left a duplicated `const trace` declaration; caught by grepping declarations, not by the first typecheck pass.\n- Anything streamed via `ctx.metadata` must be re-emitted in every terminal return or it is lost on completion — a general trap for future live-progress tools.\n\n## [S1] Problem\n\nThe `exec` tool (parallel tool-call script, `packages/opencode/src/tool/tool-script.ts`, tool id `exec`) renders in the TUI through `ToolScript` (`packages/opencode/src/cli/cmd/tui/routes/session/index.tsx:2292-2345`) as a binary toggle:\n\n- Collapsed (default): a single `InlineTool` line — `» exec 12 calls · read×7 grep×4`. Neither the script nor its output is visible.\n- Expanded: a `BlockTool` dumping the full `input.code` and the full `props.output` with no truncation at all.\n\nEvery other block-shaped tool — `bash` above all (`index.tsx:2922-2987`) — treats collapse as *overflow protection*, not as compression to one line: the command is always visible, and the first 10 output lines leak through with a `…` marker. `exec` is the odd one out, so a batch of parallel tool calls is either invisible or floods the transcript.\n\nA second, smaller defect: per-tool counts are streamed live through `ctx.metadata` (`tool-script.ts:411-419`) but the terminal metadata returned by `execute` is only `{ status, toolCalls }` (`tool-script.ts:549,568,575`). `SessionProcessor.completeToolCall` **replaces** part metadata rather than merging it (`packages/opencode/src/session/processor.ts:359`), so the moment a run finishes the breakdown disappears and the summary degrades to `12 calls`.\n\n## [S2] Design\n\n### Collapsed/expanded behavior (TUI)\n\nRestructure `ToolScript` to mirror `Bash`:\n\n- Shape selection is a `\u003cSwitch>` on whether script source has arrived. With no `input.code` yet, keep the existing single `InlineTool` pending line (`~ Writing script...`). Once `input.code` is a non-empty string, render `BlockTool` for the rest of the part's life, with `spinner={isRunning()}` on the title.\n- `BlockTool` title stays `# exec · \u003csummary>`, where `summary` keeps its current composition (`N calls · read×7 grep×4(1!)`, prefixed with the failure status when the run did not complete).\n- Body, in order:\n  1. script source — clipped to a 10-**rendered-row** budget when collapsed with a `…` marker; full source when expanded;\n  2. output — the `props.output` string with ANSI stripped (nested `bash` calls embed escape sequences), clipped to the same 10-row budget when collapsed, full when expanded. The XML envelope (`\u003cexec status=…>`, `\u003creturn_value>`, `\u003clogs>`, `\u003ctrace>`) is displayed verbatim, exactly as `bash` shows raw stdout. Coloured `theme.error` when the run failed.\n  3. hint line `Click to expand` / `Click to collapse`, rendered only when at least one of the two blocks overflows.\n- `onClick` is wired only when something overflows, so a short script with short output is a static, non-hoverable block (bash parity, `index.tsx:2967`).\n- The budget counts **rendered rows, not source lines**: `exec` returns JSON, and one line of it wraps to dozens of terminal rows, so a source-line budget does not bound the collapsed height at all. Per-line height is `ceil(width(line) / columns)` where `width` is `Bun.stringWidth` plus one cell per tab (`Bun.stringWidth` reports 0 for tabs, and the real tab stop in a static `\u003ctext>` is unverified) — so CJK and emoji count as two cells. `columns` comes from `ctx.width` minus the transcript scrollbox chrome and the block's border and padding. A line straddling the budget is sliced on the cell budget, dropping whole grapheme clusters, so a single huge line still shows its head instead of collapsing to a bare `…`.\n- Slicing walks **grapheme clusters** (`Intl.Segmenter`), not code points: `Bun.stringWidth` is not additive over code points — `\"❤️\"` (U+2764 U+FE0F) measures 2 as a unit but 1 + 0 summed — so a per-code-point walk under-charges emoji-presentation sequences and overshoots the budget.\n- The prompt editor has its own width translation at `component/prompt/offset.ts` (tab = 2, newline = 1) because it must match `@opentui`'s *editor* offsets. That is a different coordinate system and is deliberately not shared with `Collapse`.\n- **Known limitation (accepted, follow-up):** the height estimate assumes character wrapping, but `\u003ctext>` renders through `@opentui` `TextBufferRenderable` whose `wrapMode` defaults to `\"word\"`. A row therefore breaks early at a space and the leftover spills into an extra row, so the collapsed block can exceed the 10-row budget and the final sliced row looks ragged rather than full. The budget is an approximate ceiling, not a hard bound. Two fixes exist and both were declined for now: simulating greedy word wrap in `Collapse` (duplicates renderer internals) and forcing `wrapMode=\"char\"` on these bodies (loses word-boundary readability elsewhere). The collapsed view is readable as-is.\n- The row-budget helpers live in `packages/opencode/src/cli/cmd/tui/util/collapse.ts` (`lines`, `columns`, `rows`, `clip`) and are shared by `Bash` and `ToolScript` — bash has the same long-single-line defect. `hasLongDisplayLine` / `Write`'s line count reuse `Collapse.lines`.\n- The pending branch is only reachable while `code` is empty, so it carries no failure color, spinner, or summary. `InlineTool`'s `iconColor` prop has no other user and is removed.\n\nNot in this change: syntax highlighting for the script body, envelope parsing, live output streaming.\n\n### Terminal metadata (backend)\n\n`exec` keeps the per-tool breakdown after completion: the aggregation previously inlined in `publishProgress` is extracted into one host-side `tally()` helper (hoisted above the code-size guard together with `trace`), and the resulting `counts` map is included in **all five** terminal returns — code-too-large, transpile-error, failure, result-too-large, success. The two pre-execution returns emit an empty map, which is behaviorally identical to omitting the field (the TUI renders an empty `counts` as no breakdown) but keeps the inferred metadata union uniform so `metadata.counts` stays accessible to typed consumers, including tests.\n\n`running: true` is not part of terminal metadata; the TUI derives running state from `part.state.status`.\n\n## [S3] Out of Scope\n\n- Streaming logs / per-call trace lines into metadata for a live-scrolling collapsed view.\n- A dedicated `exec` panel with per-call expansion (WorkflowPanel-style).\n- Parsing the `\u003cexec>` envelope to render `return_value` / `trace` as distinct sections.\n- TypeScript syntax highlighting of the script body.\n- Any change to the `exec` enablement gate (`registry.ts:379-381`, GPT-toolset only).\n- Making the row budget a hard bound (see the word-wrap follow-up in S2): neither simulating greedy word wrap nor switching these bodies to `wrapMode=\"char\"` is done here.\n\n## Tasks\n\n- [x] T1: Retain per-tool `counts` in `exec` terminal metadata — acceptance: `bun test test/tool/tool-script.test.ts` passes with a new assertion that a completed run's metadata carries `counts` with per-tool `n`/`errors`, and that a failed inner call is reflected in `errors` (covers: S2)\n- [x] T2: Render `exec` as a bash-style collapsible block — acceptance: `ToolScript` renders `BlockTool` whenever `input.code` is non-empty, showing a clipped script + clipped output + `…` markers while collapsed and full content when expanded, with the hint/click wiring gated on overflow; `bun typecheck` clean (covers: S2)\n- [x] T3: Budget the collapsed height in rendered rows — acceptance: `bun test test/cli/tui/collapse.test.ts` passes, covering wrapped-height counting, whole-line drops, mid-line slicing at the budget, and the column floor; `Bash` and `ToolScript` both consume the shared helper (covers: S2)\n- [x] T4: Measure height in display cells — acceptance: `bun test test/cli/tui/collapse.test.ts` covers CJK and emoji counting as two cells, a tab charged at least one cell, and a slice that stops before splitting a wide character (covers: S2)\n"},{"path":"compose/spec/flaky-test-isolation.md","title":"Flaky Test Isolation","group":"spec","content":"---\nfeature: flaky-test-isolation\nstatus: delivered\nupdated: 2026-07-27\nbranch: fix/flaky-test-isolation\ncommits: 028f3178..f4daa79e\n---\n\n# Flaky Test Isolation\n\n## Report\n\n**What was built** — Three suites that failed off-CI for environment reasons now assert the behavior\nthey claim to. `assertSafeUrl` takes the DNS resolver as an optional parameter, so the fail-closed and\nrebinding assertions run against a stub instead of whichever resolver the developer's network hands\nthem; the rebinding branch gained its first test. `checkpoint-rebuild-unify` wipes\n`ActorRegistryTable` before each test, because `renderRebuildContext` reads the process-wide\n`ActorRegistry.listActive()` and earlier test files leave background actors behind in the singleton\nSQLite client.\n\nThe workflow cancel-cascade test no longer times out. Its assertions always passed in ~280ms; the\nbudget was consumed by an unbounded teardown. Reclaiming the run's children notifies the parent\nsession's `main` inbox, which re-arms the parent's `main` runner against the auto-answering test LLM,\nand `SessionRunState`'s instance-state finalizer then awaits `Runner.cancel` from inside an\nuninterruptible finalizer, where no timeout can fire. The test drains that runner itself, bounded, on\nthe interruptible side of scope close. The same drain let the previously-skipped orphan-on-cancel\nregression test come back, restoring the only coverage of that bug; its recorded skip rationale\nblamed a slow `cancel`, which measurement disproved.\n\n**Verification** — `bun test test/util/ssrf.test.ts` passed 23 tests.\n`bun test test/actor test/session/checkpoint-rebuild-unify.test.ts` passed 130 tests / 2 skip, having\nreproduced the failure on the same command before the fix.\n`bun test test/workflow/runtime.test.ts` passed three consecutive times (28 pass, 1 skip) and again\nafter the review follow-up. `bun test` (full suite) passed three times: 4360 pass / 0 fail twice\nbefore the unskip and 4361 pass / 37 skip / 0 fail after, 4399 tests across 418 files.\n`bun typecheck` passed. oxlint on the four changed files reported 49 warnings / 0 errors against 48 /\n0 on `main`; the single added warning is another instance of the `await-thenable` false positive that\nalready fires 20 times in that file.\n\n**Journey log**\n\n- The first fix attempt for the cancel test — swapping `llm.hang` for `hangUntil` + release, the\n  idiom `runtime-worktree.test.ts` uses — made it strictly worse: releasing the hang lets the child\n  resume, so it was still Running at teardown and the isolated run started hanging too. The\n  established idiom in a sibling file was the wrong tool here.\n- Measuring before theorising was what cracked it. Probes showed the assertions finishing in 280ms,\n  raising the budget to 180s still timing out (so: deadlock, not slowness), and\n  `process._getActiveHandles()` empty (so: an Effect fiber, not a socket).\n- Naming the stuck disposer needed the stack captured at the `InstanceState.make` call site, outside\n  the returned `Effect.gen` — inside it, every frame is Effect runtime internals. A first attempt\n  filtered stack lines on `/src/`, which matches every path under `~/src`, and silently kept nothing.\n- Effect finalizers run uninterruptibly, so an `Effect.timeout` placed inside one never fires. That\n  is why the deadlock presented as infinite rather than as a bounded 6s stall.\n- Bisecting showed *any* predecessor test triggered the hang, which ruled out a specific\n  interaction and pointed at process-global state instead.\n\n## [S1] Problem\n\nThree suites in `packages/opencode` fail off-CI for reasons unrelated to the behavior they claim to\ncover. Each failure is an environment or harness artifact, not a product defect, so each one trains\nreaders to ignore red output.\n\n1. `test/util/ssrf.test.ts` asserts that `assertSafeUrl` rejects an unresolvable hostname by asking\n   the real resolver for a `.invalid` name. Resolvers that answer for `.invalid` (ISP or corporate\n   DNS, mDNS) make the call succeed, so the assertion depends on which network the developer sits on.\n2. `test/session/checkpoint-rebuild-unify.test.ts` asserts that `insertRebuildBoundary` returns\n   `false` when there is nothing to push. `renderRebuildContext` reads\n   `ActorRegistry.listActive()`, which is process-wide, and the SQLite client is a process-level\n   singleton, so background actors left `pending`/`running` by an earlier test file make the context\n   non-empty. It passes alone and fails in a whole-suite run.\n3. `test/workflow/runtime.test.ts` \"cancel stops in-flight child agents and marks the run cancelled\"\n   exhausts its 30s budget. The assertions complete in ~280ms; the remaining time is a teardown\n   deadlock, and it is not a slow path but an unbounded one — raising the budget to 180s still times\n   out.\n\n## [S2] Design\n\n**SSRF resolver injection.** `assertSafeUrl` takes the resolver as an optional second parameter\ndefaulting to `dns/promises.lookup`, mirroring the `fetchImpl` parameter `safeFetch` already exposes\nfor the same reason. The DNS-dependent assertions inject a stub, so they pin the behavior that\nmatters — resolution failure means reject, and a hostname resolving into a blocked range means\nreject — without consulting a real resolver. Production callers are unchanged.\n\n**Rebuild-context actor leakage.** `listActive()` stays process-wide: peer actors legitimately live\nin child sessions, so scoping the query to one `session_id` would drop live children from the \"Active\nactors\" section. The test instead wipes `ActorRegistryTable` in `beforeEach`, the same isolation\n`test/session/checkpoint-rebuild-v3.test.ts` already applies for the same reason, and consistent with\nhow that test already neutralizes the other inputs (deleting the memory dirs, capping `recent_user`\nto 0).\n\n**Cancel-cascade teardown deadlock.** Reclaiming the workflow's children makes each one notify the\nparent session's `main` inbox, which re-arms the parent's `main` runner against the auto-answering\ntest LLM. `SessionRunState`'s instance-state finalizer cancels every runner still in its map, and\n`Runner.cancel` awaits `Deferred.await(run.done)`. Effect finalizers run uninterruptibly, so that\nawait cannot be bounded from inside and the instance disposer never returns. The test drains the\nrunner map itself — `SessionRunState.cancel(parent.id)`, bounded and ignored — after its assertions\nand before the fixture scope closes, where the cancel is still interruptible and the bound applies.\n\nOut of the three, only the SSRF change touches `src/`, and it is additive.\n\n**Restored orphan-on-cancel coverage.** The sibling test in the same describe, \"cancel during an\nin-flight fan-out reclaims every child (no orphan)\", was skipped under the same symptom with the\ndiagnosis \"`cancel` itself does not return before the test deadline\". That diagnosis is wrong —\n`cancel` returns in ~300ms — and the real cause is the teardown deadlock above. With the same drain\napplied it is unskipped, restoring the only coverage of the MR104 orphan-on-cancel regression.\n\n## [S3] Out of Scope\n\n- Bounding `Instance.dispose()` so a stuck instance-state finalizer cannot wedge teardown.\n  `Instance.disposeDirectory` already bounds its path with `DIRECTORY_DISPOSE_TIMEOUT`; the direct\n  `dispose()` path does not. That is a real robustness gap, reachable in production whenever an\n  instance is disposed while a session run is live, but changing teardown semantics is a separate\n  change with its own risk surface.\n- Session-scoping the \"Active actors\" rebuild section.\n- The other `llm.hang` call sites in `test/workflow/runtime.test.ts`. They pass today; converting\n  them is unverified churn.\n\n## Tasks\n\n- [x] T1: Inject the resolver into `assertSafeUrl` and rewrite the DNS assertions against a stub —\n      acceptance: `bun test test/util/ssrf.test.ts` passes with no network dependency (covers: S2)\n- [x] T2: Wipe leaked `ActorRegistryTable` rows in `checkpoint-rebuild-unify` — acceptance:\n      `bun test test/actor test/session/checkpoint-rebuild-unify.test.ts` passes, having failed\n      before (covers: S2)\n- [x] T3: Quiesce the parent session before teardown in the cancel-cascade test — acceptance:\n      `bun test test/workflow/runtime.test.ts` passes with zero failures (covers: S2)\n- [x] T4: Confirm no further local-only failures across two full runs — acceptance: the union of two\n      `bun test` runs adds no failure attributable to this branch (covers: S1)\n- [x] T5: Unskip the orphan-on-cancel test with the same drain — acceptance:\n      `bun test test/workflow/runtime.test.ts` green three consecutive times and a full run stays\n      green (covers: S2; depends: T3)\n"},{"path":"compose/spec/log-safety.md","title":"Log Safety","group":"spec","content":"---\nfeature: log-safety\nstatus: delivered\nupdated: 2026-07-27\nbranch: fix/tui-log-stderr\ncommits: 014a2577..aa28c273\n---\n\n# Log Safety\n\n## Report\n\n**What was built** — Logger instances own unique active files and serialize initialization, writes, rotation, and shutdown through one lifecycle queue. Cleanup preserves live files, recovers stale process and worker files, enforces archive count and size budgets, and stops file writes safely when finalization cannot complete. CLI hard exits use `Log.exit()` and normal TUI exits return through the top-level shutdown.\n\nThe logger no longer treats stderr as a fallback sink. Records reach stderr only under `--print-logs`; without a usable file sink they are dropped, and sink failures are swallowed rather than reported. The TUI worker flushes before its bounded teardown and closes its log as the last teardown step, so instance disposal and bus unsubscribe records land in the file instead of on the rendered screen.\n\n**Verification** — `MIMOCODE_PROCESS_ROLE=main bun test test/util/log.test.ts` passed 18 tests / 53 expectations, and `MIMOCODE_PROCESS_ROLE=worker bun test test/util/log.test.ts test/effect/app-runtime-logger.test.ts test/effect/runner-warn-log.test.ts` passed 26 tests. `bun typecheck` passed. oxlint on the changed files reported zero warnings and zero errors.\n\nReproduction, before and after: running the same child-process script against the pre-fix `log.ts` leaked `INFO … teardown after shutdown` to stderr, while the fixed logger emitted nothing. End-to-end, a tmux-driven `bun dev \u003cdir>` quit through the `exit` prompt command on `main` printed nine teardown records to stderr — the exact lines the user reported — with the worker log file ending at `worker shutting down`; on the delivered head stderr stayed empty and the worker log file contained the full teardown sequence through `service=bus type=session.updated unsubscribing`.\n\n**Journey log**\n\n- The first review exposed that a write queue alone is insufficient; lifecycle mutations must use the same queue.\n- Capturing a stream before queued rotation can make shutdown close the wrong resource; shutdown now resolves the current stream only when its queued operation runs.\n- Bun main and worker contexts share a PID, so stale worker recovery also needs the process role.\n- Closing the worker log before its teardown traded one bug for another: the records were durable but were printed over the TUI. Flushing, then closing last, satisfies both; a worker killed mid-drain leaves an `.active.log` that the next initialization recovers.\n- Gating the failure report behind print mode made it unreachable — print mode never opens a file — which is why the reporting path was removed instead of gated. Attempting to test a branch is the cheapest way to discover it cannot happen.\n- `bun dev` writes its logs under the checkout's `.dev-home` (`MIMOCODE_HOME` in `script/dev.ts`), so redirecting only stderr to a file keeps the TUI on the real terminal while making a leak trivially greppable.\n\n## [S1] Problem\n\nThe CLI main context and TUI worker initialize logging independently but can target the same file. Rotation and cleanup can therefore rename, truncate, or delete a file another context still writes. Log writes also discard asynchronous failures and fatal exits do not flush.\n\n## [S2] File Ownership And Retention\n\nEach logger initialization owns a unique active filename containing the timestamp, process role, PID, and a random instance identifier. Active files are distinguishable from completed and rotated files and are never selected by cleanup. Initialization, writes, rotation, and shutdown share one ordered lifecycle queue, so concurrent initialization closes the prior stream before replacing its state.\n\nWith rotation enabled, queued records that individually fit within the threshold rotate before an active file would exceed 50 MiB. Archived files are reduced to at most 10 and at most 200 MiB in total, and cleanup errors do not interrupt logging. A failed archive move uses a copy/remove fallback; if finalization still fails, the file sink closes instead of reopening the same oversized file with a reset counter. Explicitly disabling rotation continues to permit one active file to exceed 50 MiB.\n\n## [S3] Failure And Shutdown Behavior\n\nStream failures are consumed by the logger and must not create unhandled promise rejections, crash on a stream `error` event, or recursively call the logger. They are not reported to any stream: a file failure can only happen while logging to a file, which is exactly when stderr belongs to the rendered TUI screen, so the missing or short log file is the only signal. `flush()` waits for queued writes and leaves the file sink open. `shutdown()` runs after earlier queued rotations, closes the final stream, and marks its file completed. CLI hard exits use `Log.exit()`, and normal TUI exits return through the top-level shutdown.\n\n## [S4] Terminal Isolation\n\nThe logger writes to stderr only when the process was initialized with `print` (`--print-logs`), and then only the records themselves. Without a usable file sink — before initialization, after `shutdown()`, or when opening or finalizing the file failed — records are dropped. The TUI renders on the same terminal the process writes stderr to, so a leaked line corrupts the screen; a dropped record is preferable to a corrupted display.\n\nThe TUI worker therefore flushes, not closes, before its bounded teardown: queued records must be durable in case the host kills the worker mid-drain, while the teardown that follows (checkpoint drain, instance disposal, server stop) must still log to the file. The worker closes its log as the last teardown step. A worker killed before that leaves an `.active.log` that the next initialization recovers.\n\n## [S5] Testing Boundaries\n\nTests use real temporary files and streams. They cover unique ownership across repeated and concurrent initialization, same-PID worker recovery, ordered concurrent writes, size rotation, shutdown queued behind a rotation, retention by count and total bytes, active-file preservation, disabled rotation, write failure without unhandled rejection, and flush/shutdown persistence.\n\nTerminal isolation is verified in a child process, because the sink state is module-level: records emitted before initialization and after `shutdown()` produce empty stdout and stderr while earlier records remain in the file, an unusable log directory produces no output at all, and `print` mode still writes records to stderr — without creating a file, and unaffected by an unusable log directory. An isolated dev CLI run verifies that a post-initialization command error exits nonzero with no active log and one completed log.\n\n## [S6] Out Of Scope\n\nThis change does not introduce per-record truncation, modify MCP/ACP/voice logging, add time-based retention, compress archives, change session/database retention, or remove the explicit rotation-disable option.\n\n## Tasks\n\n- [x] T1: Implement unique active-file ownership and a serialized lifecycle queue — acceptance: concurrent initialization cannot target, leak, or clean another live active file, and file/count/total limits hold (covers: S2)\n- [x] T2: Add failure-safe flush, shutdown, and command exit lifecycle — acceptance: write/finalization failures do not reject globally or resume unsafe file writes, and CLI/TUI/worker exit paths close pending logs before termination (covers: S3; depends: T1)\n- [x] T3: Add and run focused tests and package typecheck — acceptance: all S5 cases pass from packages/opencode and typecheck succeeds (covers: S5; depends: T1, T2)\n- [x] T4: Confine log records to the file sink unless print mode is active — acceptance: a record emitted after `shutdown()` or before `init()` produces no stderr output, while `--print-logs` still prints (covers: S4)\n- [x] T5: Keep the worker's file sink open across teardown — acceptance: a TUI quit writes the worker teardown records (instance disposal, bus unsubscribe) to the log file and nothing to stderr (covers: S4; depends: T4)\n"},{"path":"compose/spec/mcp-tool-search.md","title":"MCP Tool Skillization","group":"spec","content":"---\nfeature: mcp-tool-search\nstatus: completed\nupdated: 2026-07-26\nbranch: feature/mcp-tool-search\ncommits: c946f4c215aaf326036342a8c3dec6ad12d8772a..HEAD\n---\n\n# MCP Tool Skillization\n\n## [S1] Problem\n\nSending every complete MCP function definition to the model consumes context before the task needs any MCP capability. Hiding all metadata, however, leaves the model unable to discover capabilities it does not already know exist. OpenAI `defer_loading` is provider-specific and cannot generalize to Claude, Gemini, DeepSeek, MiMo, or compatibility gateways.\n\n## [S2] Private Catalog And Generic Discovery\n\nMiMoCode keeps every transformed schema and execute closure in a local registry. When MCP Tool Search is enabled, at least one effective MCP tool exists, and the selected model supports function calling, the request exposes one ordinary function named `mcp_tool_search`. Its description contains a deterministic catalog of the effective MCP tools so the model knows what it can search for, while individual MCP function definitions and schemas remain hidden until activation.\n\nAt context pressure levels 0-1 (below 70% of the usable input window), the catalog includes every effective callable name and description when the complete rendering fits its budget. At levels 2-3, or when the rich catalog itself exceeds the budget, it degrades to callable names only. The catalog budget is 10% of the model's usable input window capped at 20,000 estimated tokens; unknown windows use the 20,000-token cap. If all names still exceed the budget, the renderer includes a deterministic prefix plus an omitted-count notice. Local search always covers the complete catalog.\n\nThe catalog is recomputed on every model step because API requests are stateless and context pressure may change after compaction. It contains only tools that survive request disables, permissions, agent allowlists, actor whitelists, executable checks, and local-name collision handling. Names and descriptions are normalized and explicitly framed as untrusted metadata rather than instructions. Parameter names, parameter descriptions, schemas, and executors are never included in the catalog.\n\n`mcp_tool_search` uses a cached local BM25 index over callable names, descriptions, and recursive parameter names/descriptions. It returns only matched names, descriptions, and scores in its visible output; schemas remain private until activation. The literal name `tool_search` is intentionally avoided because OpenAI Responses adapters reserve it for the native provider protocol.\n\n## [S3] Request-Scoped Loading\n\nA successful search persists a catalog fingerprint and validated matched callable names in ordinary tool-result metadata. On the next existing Session outer-loop step, MiMoCode scans only completed searches parented to the current user message, unions valid matches, and exposes those MCP definitions through the AI SDK `activeTools` subset.\n\nLoaded tools accumulate across searches for the current user request, up to a bounded total. A new user message starts with all MCP functions hidden again. A catalog change invalidates earlier matches. Model-visible output is never trusted as activation state.\n\n## [S4] Execution Safety\n\nAll MCP executors remain in the full local tool map so existing permission checks, actor whitelists, plugin hooks, metrics, result normalization, truncation, attachments, cancellation, and MCP client dispatch are preserved. Before any side effect, the MCP wrapper rejects a call not loaded for the current request and instructs the model to use `mcp_tool_search`.\n\nThis guard covers hallucinated calls, stale history, repair mistakes, Max Mode replay, and same-step parallel search plus MCP calls. Search matches become callable only on the next outer-loop step. Local tools win on callable-name collisions, and conflicting MCP entries are not advertised.\n\n## [S5] Provider And ToolScript Behavior\n\nThe mechanism uses an ordinary function tool and does not depend on OpenAI provider tools or `defer_loading`. It is enabled by default for GPT-family models except GPT-OSS. Other models expose effective MCP definitions directly by default and may opt into discovery with `MIMOCODE_EXPERIMENTAL_MCP_TOOL_SEARCH=true` (or the umbrella `MIMOCODE_EXPERIMENTAL`). Models without function calling receive neither MCP discovery nor MCP definitions.\n\nThe GPT ToolScript/`exec` surface no longer embeds or dispatches MCP tools. This prevents ToolScript descriptions and sandbox declarations from leaking the private catalog or bypassing request-scoped activation. Loaded MCP capabilities are invoked through their ordinary direct tool definitions.\n\n## [S6] Testing Boundaries\n\nFocused coverage must prove that initial GPT requests contain `mcp_tool_search` with the effective name/description catalog but no MCP schema or separately callable MCP definitions; non-GPT models expose MCP tools directly by default and can opt into discovery with the feature flag; only search matches become callable on the next request; unmatched tools remain inactive; multiple searches accumulate; new user messages reset loading; non-tool-call models omit both discovery and MCP definitions; inactive calls fail recoverably; and ordinary MCP success/error normalization remains unchanged.\n\nTests also cover context-pressure boundaries, rich-to-name-only budget fallback, deterministic truncation, BM25 ranking and cache invalidation, active tool wire serialization, ToolScript isolation, reserved search-tool collisions, limits, catalog fingerprints, and package type safety.\n\n## [S7] Out Of Scope\n\nThis change does not add semantic embeddings, persist loaded tools across user requests, expose MCP server summaries, change MCP connection lifecycle, redesign MCP naming, or make non-function-calling models capable of tool use.\n\n## Report\n\nImplemented provider-independent, request-scoped MCP discovery with token-aware catalog disclosure, GPT-default gating, direct non-GPT fallback, and execution-time eligibility guards. Focused and integration coverage verifies search activation, direct execution, permission filtering, GPT-OSS exclusion, context-pressure degradation, and schema privacy. Package and repository type checks pass.\n\n## Tasks\n\n- [x] T1: Replace provider-native Tool Search with ordinary `mcp_tool_search` and cached local BM25 discovery.\n- [x] T2: Separate registered executors from model-visible `activeTools` and activate only request-scoped matches.\n- [x] T3: Preserve MCP execution safety while removing ToolScript catalog leakage and inactive-call bypasses.\n- [x] T4: Complete focused/broad verification, independent review, and delivery report.\n"},{"path":"compose/spec/plan-enter-removal.md","title":"Remove the plan_enter tool","group":"spec","content":"---\nfeature: plan-enter-removal\nstatus: delivered\nupdated: 2026-08-03\nbranch: plan-enter-removal\ncommits: ce124cbd..e28331185884\n---\n\n# Remove the plan_enter tool\n\n## Report\n\n**What was built** — `plan_enter` is gone: tool, description file, registry wiring,\ntool-script exclusion, the three permission rules, the headless deny rule, the TUI\n`plan_enter → plan` switch mapping, and the `tui.question.plan_enter.*` block in\nall seven locales. `plan_exit` and everything else about plan mode are untouched,\nso `build` and `plan` now expose exactly the same mode tool and Tab still\nround-trips between them. The system prompt lost its plan-mode advocacy paragraph\nand gained no replacement instruction; the user-facing answer to \"how do I enter\nplan mode\" moved to `mimocode-docs`, which loads only when someone asks how\nMiMoCode works.\n\n**Verification** — from `packages/opencode`: `bun typecheck` PASS.\n`bun test test/tool test/cli/tui test/agent test/permission` — 1274 pass / 1 fail\n/ 11 skip, where the single failure is `test/tool/registry.test.ts > loads tools\nfrom .mimocode/tool (singular)` timing out at 5000ms under parallel load;\nPRE-EXISTING flake, 5 pass / 0 fail when the file runs alone.\n`bun test test/skill` — 79 pass / 0 fail. `bunx prettier --check` on the touched\nfiles — clean (`i18n/*.ts`, `registry.ts`, `agent.ts` are nonconformant at base\n`ce124cbd` too, verified by stashing). `git diff --check` PASS. Root\n`bun run lint` — 0 errors, ~4040 PRE-EXISTING warnings. Independent reviewer:\nspec compliance met after two fixes (see log), no correctness bugs, style\nconsistent.\n\n**Journey log**\n\n1. First attempt gated `plan_enter` behind a default-deny permission rule, then\n   behind a registration flag. Both work mechanically; neither was the question.\n   The question was whether anything justifies keeping the surface at all, and\n   nothing did — the deciding evidence was the entrance table in S2, not any\n   property of the gating mechanism.\n2. The first prompt rewrite replaced the advocacy paragraph with instructions on\n   how to *talk about* plan mode. That is the same interruption in a new costume:\n   a model told how to discuss plan mode will discuss it. The fix was deletion,\n   moving the user-facing answer to an on-demand skill.\n3. `mimocode-docs` routing keys off the frontmatter `description` (BM25 over name\n   + aliases + description, `skill/search.ts:98`). The body can hold a perfect\n   answer and still never load; the mode/keybinding vocabulary had to go into the\n   description.\n4. `rg -rn \u003cpattern>` silently means `--replace n`, printing `n` where matches\n   were. Two searches during this change reported false clean states. Use\n   `rg -n`.\n5. No locale key-parity test exists in this package, and `test/cli/tui/i18n` is\n   not a real path — a verification band naming it exercises nothing. Question\n   i18n is fail-soft anyway (`routes/session/question.tsx:24` falls back to the\n   DB-stored text), so deleted keys cannot break historical replay.\n\n## [S1] Problem\n\nUsers report that plan mode behaves badly with frontier models, and that the\nmodel keeps putting itself into plan mode unasked.\n\nPlan mode's workflow was designed for weaker models: a five-phase curriculum\n(parallel `explore` subagents → a `general` design subagent → review → write the\nplan file → `plan_exit`) injected as a ~90-line system-reminder on every entry\n(`packages/opencode/src/session/prompt.ts:991-1073`). Frontier models do not fit\nthat shape — they research and weigh alternatives before acting anyway, so the\nphase scaffolding mostly buys tokens and extra turns. A large share of users have\nresponded by staying in Build for everything.\n\nFor a build-only user, every model-initiated switch into plan mode is pure\ninterruption: a Yes/No card they did not ask for, leading either to a mode they\ndid not want or to a \"No\" that the model may still misread. Cutting that\ninterruption is the point of this change.\n\nBoth complaints share one cause: `plan_enter` exists as a model-callable tool.\n\nNothing in a system prompt is needed to trigger it. The tool's own description\nis a standing invitation (`packages/opencode/src/tool/plan-enter.txt:5`):\n\n> If the user explicitly mentions wanting to create a plan, ALWAYS call this\n> tool first.\n\nA tool description is part of every request's schema, so any model that reads\n\"the user said plan\" reaches for it. When it fires, the tool writes a synthetic\nuser message carrying `agent: \"plan\"` (`src/tool/plan.ts:80-96`), which discards\nthe mode the user selected and swaps in a read-only agent plus a ~90-line\nworkflow system-reminder (`src/session/prompt.ts:991-1073`). The user gets a\nYes/No card, but the decision was framed by the model, not requested by the\nuser.\n\nThe value the tool delivers is small, because it is not how anyone actually\nenters plan mode.\n\n## [S2] Design\n\nDelete `plan_enter` outright. Keep `plan_exit`. Keep the `plan` agent, its\n`hardPermission` write-block, the plan file, and the plan workflow prompt\nexactly as they are.\n\n### Why deletion, not a flag\n\n**1. It is not a user-facing entry point.** Plan mode has five other entrances,\nnone of which this change touches:\n\n| Entrance | Site | Affected |\n| --- | --- | --- |\n| Tab / shift+tab agent cycle | `config/keybinds.ts:64-65` → `cli/cmd/tui/context/local.tsx:113` | no |\n| Agent dialog | `cli/cmd/tui/component/dialog-agent.tsx:30` | no |\n| Startup `--agent plan` | `cli/cmd/tui/thread.ts` | no |\n| Input-bar / voice switch | `cli/cmd/tui/component/prompt/index.tsx:202` | no |\n| Model calls `plan_enter` | `tool/plan.ts:21` | **removed** |\n\n`plan_enter` has no slash command and no keybinding — a user cannot invoke it\neven deliberately. Removing it removes a model capability, not a user gesture.\n`build`/`plan` remain the free-switch group (`local.tsx:50`), so Tab still\nround-trips between them mid-session.\n\n**2. It is already dead outside the TUI.** `mimo run` denies both plan tools\nunconditionally (`cli/cmd/run.ts:350-365`), so headless sessions have never had\nit. Removal aligns the TUI with the surface that already ships without it.\n\n**3. A registration flag would work but earns nothing.** Gating the tool's\nregistration on a config flag (the `experimental.maxMode` / orchestrator pattern)\nis a perfectly serviceable way to default it off. It just buys nothing here: it\nkeeps the description, the i18n strings, the TUI switch mapping and the tests in\nthe tree to serve a default-off path with no evidence of demand, and it leaves a\nsecond knob for a decision nobody has asked to reverse. The repository's stance is\nto delete unused code rather than keep a shim. If demand appears, restoring one\ntool from git history is cheap — and restoring it behind a flag then is no harder\nthan adding the flag now.\n\n**4. `plan_exit` is not symmetric and stays.** It cannot solicit itself: it\nno-ops unless the session is already in plan mode (`tool/plan.ts:120`), which\nonly a user gesture can establish. It is also the approval handshake the plan\nworkflow terminates on (`session/prompt.ts:1066-1070`). After this change both\n`build` and `plan` expose exactly `plan_exit`, so switching modes still does not\nmutate the tool list (the invariant from PR #1207).\n\n### Accepted consequences\n\n- **Natural-language planning no longer flips the mode.** \"帮我先做个计划\" in\n  build now yields planning in the reply, not a read-only agent, and the\n  `hardPermission` write-block does not engage. `prompt/default.txt` is\n  corrected so the model recommends the Tab switch instead of silently losing\n  the affordance (see below). This is the intended trade: the user owns the\n  mode.\n- **One-time prefix-cache invalidation.** `build`'s tool schema loses an entry,\n  so the first request of every pre-existing session after upgrade recomputes\n  its prefix. This is a version-upgrade-level cost, unavoidable for any tool\n  removal, and it does not recur.\n\n### Prompt correction\n\n`prompt/default.txt` is the fallback system prompt (`session/system.ts:49`) —\ni.e. the one MiMo's own models get; `anthropic.txt` / `gpt.txt` / `codex.txt` /\n`gemini.txt` / `beast.txt` / `deepseek.txt` / `glm.txt` / `minimax.txt` /\n`trinity.txt` contain no plan-mode instructions at all, and `kimi.txt:17` only\nmentions plan mode as an example of a system-reminder. So exactly one prompt\nneeds editing:\n\n- `default.txt:87` — drop `plan-enter` from the \"Mode / safety\" tool list.\n- `default.txt:132` (item 5 of \"Plan mode in detail\") — absorb the entry rule into\n  the existing exit rule: the user switches in and out themselves (`Tab` or the\n  agent dialog); the model cannot enter plan mode; **and the model must not tell\n  the user they could switch manually unless the user raises plan mode first**.\n  The model's one mode tool remains `plan_exit`, which requests approval of a\n  finished plan and the switch back to build.\n- `default.txt:134` — delete the \"Enter plan mode for non-trivial implementation\n  work…\" paragraph outright. Do not replace it with a paragraph about what to do\n  instead: an instruction that discusses plan mode is itself a prompt to bring\n  plan mode up. Frontier models should just do the work.\n\nThe net effect on the prompt is one shortened line and one deleted paragraph — no\nnew behavioural instruction, no standing invitation.\n\n`session/prompt/compose.txt` also names `plan_enter` (line 20) but is\ndeliberately left byte-identical: it is a model-facing system prompt for the\ndeprecated Compose agent, and any change invalidates prefix cache for every\nexisting Compose session (constraint carried from `compose-next.md` S5). A stale\n\"do not use a tool that no longer exists\" sentence is harmless.\n\n### Documentation surfaces\n\nTwo audiences need different treatment, and conflating them is what made the\nfirst draft of the prompt edit wrong.\n\n**The model, always:** nothing. Removing the advocacy paragraph is the whole\nchange. It carries no guidance about recommending plan mode, because a model that\nhas been told how to talk about plan mode will talk about plan mode.\n\n**The user, on demand:** one genuine question survives — \"how do I get into plan\nmode?\" / \"why don't you switch to plan any more?\" That answer belongs in\n`mimocode-docs`, which is loaded exactly when a user asks how MiMoCode itself\nworks (`skill_search` BM25 over name + description, or explicit `/mimocode-docs`),\nand costs nothing on every other turn. Users also learn the `Tab` gesture from\nthe home tips, so this is a fallback for the confused case, not the primary\nteaching surface.\n\n- `mimocode-docs/SKILL.md` frontmatter `description` — add mode / keybinding\n  vocabulary (\"agent modes (build / plan / compose) and how to switch between\n  them\", \"how to enter or leave plan mode\") so the routing actually fires on that\n  question. Without it the skill's description never mentions modes and BM25 has\n  nothing to match.\n- `mimocode-docs/SKILL.md:18` — the Agents / modes row states that only the user\n  enters a mode, that no tool switches into plan, and that `plan_exit` is the\n  agent's one move from inside plan.\n- `mimocode-docs/reference/commands.md:130` — under Keybindings, the concrete\n  answer: `Tab` or the agent dialog to enter; `Tab` or `plan_exit` to leave; and\n  that the agent will not offer plan mode unasked (so the user reads the silence\n  as intended behaviour, not a regression).\n\n`mimocode-docs/reference/guide.md:114` and `config.md:92` mention plan only as a\nCompose-legacy skill name and an agent-config key; both stay accurate and are\nleft alone. The localized `tui.skill.mimocode-docs.description` strings are the\ndialog copy, not the routing input, so they are untouched.\n\n## [S3] Implementation\n\nDelete:\n\n- `packages/opencode/src/tool/plan-enter.txt`\n- `PlanEnterTool` in `packages/opencode/src/tool/plan.ts` (keep `getLastModel`\n  and `PlanExitTool`)\n- `packages/opencode/src/tool/registry.ts` — the `plan_enter` import, its\n  `Tool.init` entry, and `tool.planenter` in `builtin`\n- `packages/opencode/src/tool/tool-script-ref.ts:29` — `\"plan_enter\"` exclusion\n- `packages/opencode/src/agent/agent.ts` — the `plan_enter` rules at `:113`\n  (defaults deny), `:141` (build allow), `:181` (plan allow)\n- `packages/opencode/src/cli/cmd/run.ts:356-360` — the `plan_enter` deny rule\n- `packages/opencode/src/cli/cmd/tui/routes/session/plan-switch.ts:7` — the\n  `plan_enter → \"plan\"` mapping\n- the `tui.question.plan_enter.*` block (6 keys plus its comment header) from all\n  seven locale files under `packages/opencode/src/cli/cmd/tui/i18n/`. There is no\n  locale key-parity test in this package, so removal is verified by grep for\n  residual keys rather than by a suite. Deleting them cannot break historical\n  replay either way: `routes/session/question.tsx:24` falls back to the\n  DB-stored question text when a `tui.question.\u003ckey>.*` lookup misses.\n\nModify:\n\n- `packages/opencode/src/session/prompt/default.txt` — lines 87 and 134 per S2.\n- `packages/opencode/src/skill/builtin/.bundle/mimocode-docs/SKILL.md` and\n  `reference/commands.md` — per S2 Documentation surfaces.\n\nTests:\n\n- `test/tool/plan.test.ts` — drop the `plan_enter` \"No\" case; `plan_exit` cases\n  unchanged.\n- `test/cli/tui/plan-switch.test.ts` — drop the `plan_enter → \"plan\"` cases and\n  keep one inverted assertion: a completed `plan_enter` part must now map to\n  `undefined`. Resumed sessions still hold historical `plan_enter` parts in the\n  DB, and replaying them must not switch the mode.\n- `test/agent/agent.test.ts:160,177` — assert on `plan_exit` only.\n- `test/permission/disabled.test.ts:53-65` — these exercise `Permission.disabled`\n  semantics using tool names as data; rename the subjects to `plan_exit` /\n  `question` so no test references a deleted tool.\n- `test/tool/tool-script.test.ts:557` — drop `plan_enter` from the exclusion-set\n  assertion.\n- New: `test/tool/plan-enter-absent.test.ts` — `registry.ids()` does not contain\n  `plan_enter`, and does contain `plan_exit`. This is the regression guard\n  against a re-add.\n\nVerification, from `packages/opencode`: `bun test test/tool test/cli/tui test/skill\ntest/agent test/permission`, `bun typecheck`, `git diff --check`, and\n`bunx prettier --check` on the touched files. Two baseline caveats: root\n`bun run lint` reports ~4040 pre-existing warnings (0 errors), and\n`src/cli/cmd/tui/i18n/*.ts`, `src/tool/registry.ts` and `src/agent/agent.ts` are\nalready prettier-nonconformant on `main`, so those files must be compared against\ntheir own baseline rather than to a clean `prettier --check`.\n\nDo not touch: `session/prompt/compose.txt`, `Session.plan()`, the `plan` agent's\n`hardPermission`, the plan workflow reminder in `session/prompt.ts`, the\n`build`/`plan` free-switch group, or the delivered reports and specs that describe\npast state (`docs/compose/reports/sticky-agent-mode.md`,\n`docs/compose/spec/plan-no-continue.md`) — they document the state at their own\ndelivery and stay as written.\n\n## [S4] Roadmap — deliberately not in this change\n\n`compose-next.md` S4.5 already parked \"plan-mode dissolution and Tab permission\npresets\" as independent work. This section records the intended direction so the\npresent change is legible as a first step toward it, and fixes what must not be\ndone yet. **None of it is in scope here, and none of it is committed to.**\n\n**Direction: plan mode goes away.** The current lean is to stop shipping plan as\nan agent at all and split it along its two real concerns:\n\n1. **Permission handled by another mechanism** — the only part of plan mode\n   carrying durable value is the `hardPermission` write-block. As a permission\n   preset (read-only / ask / accept-edits / bypass) switchable mid-session, it\n   applies to whatever agent the user is already in instead of forcing them into\n   a different one, and it composes with the existing ruleset machinery\n   (`permission/index.ts`) with no new name-branching. Claude Code's shift+tab\n   cycle is the reference shape. One constraint that design must respect:\n   `Permission.evaluate` is `findLast` over the flattened rulesets with no\n   specificity scoring (`permission/evaluate.ts:9-15`), and\n   `--dangerously-skip-permissions` merges `{\"*\": \"allow\"}` into the last `user`\n   layer (`config/config.ts:953`) — so a read-only preset expressed as an ordinary\n   ruleset deny would be silently defeated by allow-all. Today's plan mode dodges\n   this via `hardPermission` being re-appended after the user merge; a preset needs\n   an equivalent last-layer story.\n2. **A plan skill** — the ~90-line workflow injected as a system-reminder\n   (`session/prompt.ts:991-1073`) is curriculum, not policy, and per S1 it is\n   curriculum aimed at weaker models. `compose-next` already established the\n   migration pattern: collapse the curriculum into one compact executable\n   contract, loaded on demand by explicit invocation, instead of taxing every\n   plan turn's prompt.\n\n**Ordering constraint.** The permission mechanism must ship before `plan` leaves\nthe Tab cycle. Plan mode is today the only read-only backstop in the TUI;\nremoving it first would leave users with no way to get one.\n\n**Keybinding.** shift+tab is `agent_cycle_reverse` today\n(`config/keybinds.ts:65`). It frees up naturally: once `plan` and `compose` exit\nthe primary cycle, the cycle holds one or two entries and Tab alone covers it.\nDo not reassign shift+tab before that happens.\n\n**Do not mark Plan \"(legacy)\" yet.** Compose could carry the label\n(`compose-next.md` S2) because its successor had already shipped and users had\nsomewhere to go. Plan has no successor in the tree: no permission preset, no plan\nskill. Labelling it now would announce the mode is going away while it is still\nthe only way to get a write-block, which is worse than saying nothing. The label\nbelongs in the PR that lands the permission mechanism.\n\n## [S5] Out of scope\n\n- Removing the `plan` agent, its `hardPermission`, `plan_exit`, the plan file,\n  or the plan workflow prompt.\n- Any keybinding change, including reassigning shift+tab.\n- Introducing permission presets or a plan skill (S4 direction only).\n- Marking Plan deprecated in any UI surface.\n- Any byte change to `session/prompt/compose.txt`.\n- Rewriting the plan workflow reminder's content (only `plan_exit` survives in\n  it, and that reference stays valid).\n- Hardening `bash` against writes in plan mode (existing \"trust the model,\n  permission is a backstop\" stance).\n- `packages/web/src/content/docs/**` — the upstream opencode website, carried in\n  ~12 locales. Per `AGENTS.md` the TUI is the supported surface; syncing that\n  corpus is its own change.\n\n## Tasks\n\n- [x] T1: delete `PlanEnterTool`, `plan-enter.txt`, and its registry / tool-script-ref wiring — acceptance: `registry.ids()` omits `plan_enter` and still contains `plan_exit`; `bun typecheck` clean (covers: S2, S3)\n- [x] T2: remove the three `plan_enter` permission rules in `agent/agent.ts` and the deny rule in `cli/cmd/run.ts` — acceptance: no `plan_enter` string remains in `src/agent` or `src/cli/cmd/run.ts`; build and plan agents both expose exactly `plan_exit` (covers: S2, S3; depends: T1)\n- [x] T3: remove the `plan_enter` branch in `plan-switch.ts` and the `tui.question.plan_enter.*` block from all seven locales — acceptance: `rg \"plan_enter\" src/cli/cmd/tui` returns nothing; no locale file is left with a dangling comment header or a double blank line; `plan_exit` switch mapping still returns `\"build\"` (covers: S3; depends: T1)\n- [x] T4: correct `prompt/default.txt` — acceptance: no `plan-enter` in the tool list; item 5 of \"Plan mode in detail\" states the user switches modes, forbids unprompted suggestions to switch, and keeps `plan_exit` as the model's request path; the \"Enter plan mode for non-trivial implementation work\" paragraph is gone with no behavioural replacement (covers: S2)\n- [x] T5: make `mimocode-docs` answer \"how do I enter/leave plan mode\" — acceptance: the frontmatter description carries mode/keybinding vocabulary so the question routes to the skill; `SKILL.md` and `reference/commands.md` both state that entering is a user gesture (`Tab` / agent dialog), that no tool enters plan, that `plan_exit` is the agent's only move, and that the agent will not raise plan mode unasked (covers: S2, S3)\n- [x] T6: update the five affected test files and add `test/tool/plan-enter-absent.test.ts` — acceptance: no test asserts a deleted tool is available; the historical-part guard in `plan-switch.test.ts` proves a replayed `plan_enter` part no longer switches modes; the new test fails if `plan_enter` is re-registered (covers: S3; depends: T1, T2, T3)\n- [x] T7: verification band — acceptance: the S3 test bands, `bun typecheck`, and `git diff --check` all pass from `packages/opencode` (covers: S3; depends: T1-T6)\n"},{"path":"compose/spec/plan-no-continue.md","title":"Plan mode: non-Yes paths must guide the model to continue planning","group":"spec","content":"---\nfeature: plan-no-continue\nstatus: delivered\nupdated: 2026-07-23\nbranch: plan-no-continue\ncommits: 29a107adfe76cfb67f73862115f56eebb007f569..5006141ccd8dc0088a8a791295db2160891fc971\n---\n\n# Plan mode: non-Yes paths must guide the model to continue planning\n\n## Report\n\n**What was built** — `plan_exit`/`plan_enter` answered \"No\" no longer throw `QuestionRejectedError` (which hard-stopped the turn and left an intent-free \"dismissed\" error); both now resolve normally with `switched: false` and explicit stay-in-mode guidance — `plan_exit`'s output instructs the model to use the question tool to ask what to refine and forbids implementing. Custom-feedback answers additionally carry a \"mode did NOT change, do not implement\" reminder. Esc (dismiss) still rejects and stops the turn.\n\nEvery plan→plan turn now injects a one-line synthetic system-reminder (plan mode active, only the plan file is writable, end the turn with question or plan_exit) — deliberately short per user direction to save tokens; the full workflow reminder remains entry-transition-only. A dedup guard keeps it to exactly one reminder per user message across multi-step turns (see S2), and upgrade impact on resumed sessions is a one-time incremental prefix-cache miss only (see S2).\n\n**Verification** — from `packages/opencode`: `bun typecheck` PASS; `bun test test/tool/plan.test.ts` PASS (4 new tests: No/feedback/Esc on plan_exit, No on plan_enter); `bun test test/session/plan-reminder-dedup.test.ts` PASS (multi-step entry + continuation turns each carry exactly one reminder); `bun test test/tool/question.test.ts test/agent/agent.test.ts test/permission/disabled.test.ts test/session/prompt.test.ts` PASS (71); `bun test test/tool/tool-script.test.ts` PASS (47). Independent reviewer: spec compliance MET, no correctness bugs, style consistent.\n\n**Journey log**\n- Tool pipeline appends `truncated: false` to metadata — assert with `toMatchObject`, not `toEqual`.\n- `Question.Service.reject` takes a bare `requestID`, unlike `reply` which takes an object; passing an object silently no-ops (logged warning) and hangs the awaiting fiber until test timeout.\n- Esc semantics survive the fix for free: the `RejectedError` for dismissal originates inside `question.ask`'s deferred, not from the removed `answer === \"No\"` re-throw.\n- The continuation reminder was first written as 3 lines; user flagged token cost on chatty planning sessions — compressed to one line.\n- `insertReminders` runs per-step, not per-turn, and persists parts — any unconditional injection there duplicates on multi-step turns. The base entry branch only avoided this by accident (its condition flips after step 1). First fix matched on reminder text (\"Plan mode is\"); replaced with the simpler positional guard `messages.at(-1) === userMessage` (fresh user turn = step 1), which encodes the intent directly.\n\n## [S1] Problem\n\nWhen the model calls `plan_exit` (or `plan_enter`) and the user does not pick \"Yes\", the model either goes silent or misbehaves (issue #1812):\n\n- **\"No\"** — `plan.ts` throws `Question.RejectedError`, whose message is the intent-free \"The user dismissed this question\". `processor.ts:377` then sets `ctx.blocked`, hard-stopping the turn. The model never responds to the user's explicit \"stay in plan mode and refine\" decision, and next turn only sees a failed tool call with no guidance.\n- **Custom feedback** — the tool returns `User chose not to switch yet and provided feedback: ...` with no instruction that plan mode is still active. Models routinely misread the feedback as approval and start implementing while in plan mode (reading files, attempting edits via bash — only the `edit` tool is hard-blocked).\n- **Subsequent plan turns** — the full plan-mode system-reminder is injected only on the transition *into* plan mode (`prompt.ts:810` returns early when the previous assistant message was already plan). Long planning conversations lose the constraint entirely.\n\n## [S2] Design\n\n### plan.ts — replace RejectedError on \"No\" with a guiding tool result\n\nApplies to both `PlanExitTool` and `PlanEnterTool` (symmetric fix, user-confirmed).\n\n- `plan_exit`, answer `\"No\"`: do NOT throw. Return a normal result:\n  - `title`: \"Staying in plan mode\"\n  - `output`: states that the user chose to stay in plan mode and continue refining; instructs the model it must NOT implement, and to use the `question` tool to ask the user which aspects of the plan to refine or change.\n  - `metadata`: `{ switched: false, feedback: \"\" }`\n- `plan_enter`, answer `\"No\"`: same shape; output states the user chose to stay in the current mode and the model should continue the current task without switching.\n- Custom-feedback branch (answer is neither \"Yes\" nor \"No\"), both tools: keep returning the feedback, and append an explicit reminder that the mode did not change — for `plan_exit`: plan mode is still active, do not implement; address the feedback by refining the plan file, then call `plan_exit` again when ready.\n- **Esc (dismiss)**: unchanged. The `RejectedError` for Esc originates inside `question.ask` itself (deferred failure), not from the removed `answer === \"No\"` re-throw, so turn-stop behavior for Esc is preserved automatically.\n- Loop consequence: with no error thrown on \"No\", `processor.ts:377` no longer fires; the turn continues and the model can immediately ask what to refine.\n\n### prompt.ts — short continuation reminder on plan→plan turns\n\nIn `SessionPrompt` where `input.agent.name === \"plan\"` and the previous assistant message is already `plan` (currently an early return at prompt.ts:810), inject a compact synthetic `\u003csystem-reminder>` on the user message instead of returning bare. Content (short, ~3 lines, to avoid token waste — user-directed):\n\n- Plan mode is still active: read-only, the only writable file is the plan file at `${plan}` (or \"create it at ${plan}\" when absent).\n- Refine the plan per the user's message.\n- End the turn by either asking a question (`question` tool) or calling `plan_exit`.\n\nThe full plan-mode workflow reminder stays exclusive to the entry transition; this new one covers every subsequent plan turn.\n\n**Dedup guard (required for correctness)**: `insertReminders` runs on EVERY loop step and persists parts via `updatePart`. The base code's entry branch was implicitly self-guarding — at step 2 the last assistant message is already plan, flipping the condition. The new plan→plan branch has no such flip: its condition stays true all turn, so step 2+ would stack duplicate reminders into the DB (and shift the prompt prefix every step). The branch therefore injects only on a fresh user turn — when the user message is the last message in the context (step 1); at step 2+ the turn's own assistant message follows it. This directly encodes the intended semantic (\"user typed a new plan-mode message\") with no content matching. Regression test: `test/session/plan-reminder-dedup.test.ts` (multi-step entry turn + multi-step continuation turn each end with exactly one reminder).\n\n**Upgrade compatibility / prefix cache**: no schema change; historic messages are never rewritten. For an in-flight plan session resumed after upgrade, the next plan→plan user message gains one extra synthetic part — a one-time incremental prefix-cache miss from that message onward (equivalent to any new user input), not a full-history invalidation. Subsequent turns append the reminder only on the newest message, so the historic prefix stays byte-stable and cacheable.\n\n### Out-of-scope UI note\n\nTUI strike-through rendering (`completed && metadata.switched === false`) is left as-is; it applies uniformly to No/feedback results and is cosmetic.\n\n## [S3] Out of Scope\n\n- Removing or redesigning plan mode itself (possible future direction; not this change).\n- Esc/dismiss semantics and `continue_loop_on_deny` behavior.\n- Hardening bash against writes in plan mode (existing \"trust the model\" stance).\n- TUI rendering changes, i18n question text changes.\n\n## Tasks\n\n- [x] T1: Rework \"No\" and feedback branches in `PlanExitTool` and `PlanEnterTool` (`packages/opencode/src/tool/plan.ts`) — acceptance: replying \"No\" to either tool resolves successfully with `switched: false` and output containing continue-planning guidance (plan_exit output instructs asking the user what to refine via the question tool); feedback replies include a \"mode unchanged, do not implement\" reminder; rejecting (Esc) still fails with `QuestionRejectedError`; covered by new unit tests under `packages/opencode/test/tool/` (covers: S2)\n- [x] T2: Inject short plan-continuation reminder for plan→plan turns in `packages/opencode/src/session/prompt.ts` — acceptance: when agent is `plan` and previous assistant message agent is `plan`, the outgoing user message gains one synthetic system-reminder naming the plan file path and the question/plan_exit turn-ending rule; entry transition still gets the full workflow reminder only; verified by unit test or, if the prompt pipeline is impractical to harness, by targeted inspection plus typecheck (covers: S2)\n- [x] T3: Verify — acceptance: `bun typecheck` passes in `packages/opencode`; new and existing related tests (`test/tool/question.test.ts`, new plan tool tests, `test/agent/agent.test.ts`) pass from the package dir (covers: S2; depends: T1, T2)\n"},{"path":"compose/spec/sidebar-shrink-and-press-gate.md","title":"Sidebar state model & press-gated mouse controls","group":"spec","content":"---\nfeature: sidebar-shrink-and-press-gate\nstatus: delivered\nupdated: 2026-08-03\nbranch: fix/sidebar-shrink-and-press-gate\ncommits: 6853935c..6dff0b1a\n---\n\n# Sidebar state model & press-gated mouse controls\n\n## Report\n\n**What was built** — The right sidebar's two overlapping state variables collapse into one\npersisted tri-state `SidebarPreference`, normalised on every toggle so that a result the\nterminal width would have chosen anyway is stored as `auto`. The sticky state that kept a\nmanually-expanded sidebar visible in terminals too narrow to dock it is now\nunrepresentable, rather than cleared by a resize handler. An expanded sidebar always offers\na collapse control — the narrow-terminal overlay used to paint over the only one — while a\ncollapsed sidebar offers an expand control only where it can dock, and a subagent view\noffers neither and cannot write the preference. `contentWidth` stops reserving the\nsidebar's columns in overlay mode, where the sidebar takes no layout space.\n\nMouse activation for the sidebar toggle and the voice control moves behind\n`ui/press.ts`'s `createPress`, which takes a **stable click** only: press and release on\nthe element with no `out` in between. This replaces `onMouseUp`-only handling, which\nopentui fires on whatever sits under the cursor when a drag captured elsewhere ends there —\nthe scrollbar-drag mis-fire that prompted the work. The gate is a narrow opt-in, not a\nmigration target: plain `onMouseUp` remains correct for the other ~127 call sites, and its\nentry criterion is a control where an accidental activation is itself the defect.\n\n**Verification** — `bun typecheck` in `packages/opencode` passes. `bun test\ntest/cli/tui/press-gate.test.tsx test/cli/tui/sidebar-state.test.ts` — 16 pass. `bun test\ntest/cli/tui test/cli/cmd/tui` — 261 pass, 1 fail, 1 error; the same command on base `main`\ngives 245 pass, 1 fail, 1 error, so that failure is `PRE-EXISTING` (`thread.test.ts`,\nindependently root-caused: the workflow builtin `.js` files are function bodies with a\ntop-level `return`, imported as raw text via `with { type: \"text\" }`, and Bun sometimes\nloads one through the ESM parser instead; minimal repro `bun test\ntest/cli/tui/plugin-toggle.test.ts test/cli/tui/thread.test.ts`, each file green alone).\nEach fix was reproduced as a failing assertion before being made to pass, including the\nbaseline mis-fire against a plain `onMouseUp` button, the dropped intra-element click, and\nthe toggle's position parity between docked and overlay modes, all proven with throwaway\n`testRender` probes.\n\n**Journey log**\n\n- Three review rounds each found a real CRITICAL, and the third one found a defect the\n  second round's own fix had introduced. When a fix keeps reopening its own area, the\n  problem is usually the model, not the patch: this gate was accumulating disarm hooks to\n  approximate browser click semantics against a dispatcher that does not supply the events\n  for it.\n- The product owner cut that knot by naming the contract instead of the mechanism — stable\n  click, leaving discards, don't care about the rest. That reverted a fix (`d0bb626b` →\n  `50fee2d1`) and turned a reviewer's CRITICAL into an asserted contract. The asymmetry is\n  the whole point: a dropped click is a non-event the user repeats, an unintended one is the\n  bug. Encode such a rule as a test, or the next contributor \"fixes\" it.\n- The contract then had to be read precisely, because \"no `out`\" and \"never left\" are not\n  the same predicate here. Reverting wholesale also discarded clicks that merely drifted\n  inside the control, which the contract never asked for. Restoring the geometric check\n  turned out to cost nothing: the mis-fire it had been reverted for only reproduces when a\n  press arrives with no preceding pointer motion, which no real pointer does. The lesson is\n  that the earlier revert leaned on a reviewer's synthetic repro without asking whether the\n  input sequence was reachable — measure the cost of a guard before paying for it.\n- Two hypotheses died to cheap experiments. Unrestored `spyOn`s looked like the obvious\n  cause of the pre-existing failure until reading the file showed `mockRestore()` in a\n  `finally`; a static-plus-dynamic double import of a text-loaded module looked like the\n  Bun bug until a 4-file standalone repro refused to reproduce. Both cost minutes and\n  saved a wrong fix.\n- `rg -rn` is `--replace`, not recursive — it silently rewrote match output mid-investigation\n  and briefly made `builtin.ts` look like it imported `./builtin/n.js`.\n- The upstream-facing half of that failure (a Bun text-import/ESM loader collision) is\n  parked with a worktree and no commits; CI is green because it shards test files across\n  four processes, so the two files that collide rarely share one.\n\n## [S1] Problem\n\nTwo independent mouse/layout defects in the session TUI.\n\n**S1.1 — sidebar survives a shrink it cannot fit into, with no way to close it.**\n`routes/session/index.tsx` carried two overlapping pieces of sidebar state: a persisted\n`sidebar: \"auto\" | \"hide\"` (index.tsx:199) and an in-memory `sidebarOpen` signal\n(index.tsx:200). Visibility was\n\n```\nsidebarVisible = agent === \"main\" && (sidebarOpen || (sidebar === \"auto\" && wide))\n```\n\n`sidebarOpen` short-circuited ahead of the `wide` term and nothing ever cleared it.\nCollapsing then re-expanding on a wide terminal left `sidebarOpen === true` for the rest\nof the session, so shrinking below the `width > 120` threshold no longer auto-hid the\nsidebar: it flipped to the narrow full-area overlay branch (index.tsx:1497-1509), which\npaints over the 3-column toggle button (index.tsx:1480-1491) because the overlay is the\nlater sibling with no `zIndex`. The user saw a sidebar that pops out with no visible\ncontrol. Reproducible every time after one collapse/expand cycle; a fresh session reset\n`sidebarOpen` and looked fine, which is why it read as intermittent.\n\nThe overlay buried the toggle in *every* narrow case, not just the sticky one — opening\nvia `Ctrl+X B` on a narrow terminal produced the same unclosable-by-mouse sidebar. A\nthrowaway `testRender` probe confirmed the layering: without `zIndex` the button's glyph\nis absent from the captured frame entirely.\n\n`contentWidth` (index.tsx:239) also subtracted the sidebar's hardcoded 42 columns even in\noverlay mode, where the sidebar takes no layout space. Below 46 columns that drove it\nnon-positive.\n\n**S1.2 — scrollbar drags mis-trigger neighbouring buttons.** The sidebar toggle\n(index.tsx:155) and the voice control (component/prompt/index.tsx:1834-1851) fired on\n`onMouseUp` alone, with no record of where the press began. `@opentui/core`'s renderer\ndispatches a bare `up` to the renderable under the cursor *in addition to* delivering\n`drag-end`/`up` to the captured renderable, because the captured-`up` branch has no\n`return` before the generic dispatch at the end of `handleMouseEvent`. Dragging the\ntranscript scrollbar — which becomes the captured renderable via `SliderRenderable`'s\n`onMouseDown`/`onMouseDrag` — and releasing with the cursor drifted onto an adjacent\nbutton therefore activated that button. The button also receives `over` during the drag,\nso its hover highlight lights up and the mis-fire looks intentional. Confirmed with a\nbaseline `testRender` + `mockMouse` probe: an `onMouseUp`-only button fires when a drag\ncaptured on a neighbour is released over it.\n\nTwo dispatch details constrain any fix:\n\n- Releasing inside a captured renderable delivers `up` **twice** (once from the captured\n  branch, once from the generic dispatch), so a press gate must consume its armed state\n  exactly once.\n- A captured renderable never receives `out` (the dispatcher guards with\n  `lastOverRenderable !== capturedRenderable`), so \"press the button, drag away, release\n  outside\" cannot be detected by hover tracking alone and needs a geometric bounds check\n  at release time.\n\n## [S2] Design\n\n### [S2.1] One tri-state preference, normalised on toggle\n\n`sidebarOpen` is deleted. The persisted preference widens to\n`SidebarPreference = \"auto\" | \"show\" | \"hide\"` and all logic moves into two pure\nfunctions in `routes/session/sidebar-state.ts`:\n\n```ts\nexport function sidebarVisibleFor(preference: SidebarPreference, wide: boolean) {\n  if (preference === \"auto\") return wide\n  return preference === \"show\"\n}\n\nexport function sidebarToggle(preference: SidebarPreference, wide: boolean): SidebarPreference {\n  const next = !sidebarVisibleFor(preference, wide)\n  if (next === wide) return \"auto\"\n  return next ? \"show\" : \"hide\"\n}\n```\n\nThe normalisation is the fix for S1.1: a toggle whose resulting visibility matches what\nthe width would have picked anyway stores `auto` rather than an override. A\ncollapse/expand round-trip on a wide terminal therefore ends at `auto`, and a later\nshrink hides the sidebar again. No resize effect is needed — the sticky state cannot be\nrepresented.\n\nAn explicit expand on a narrow terminal still yields `show`, which deliberately survives\nfurther shrinking: the user asked for it, so it stays until they collapse it. Collapsing\nit lands back on `auto` by the same rule. Existing `\"auto\"` / `\"hide\"` values on disk\nremain valid, so no kv migration is required.\n\nBoth toggle call sites (`sidebar_toggle` command and the button) collapse to\n`setSidebar(() => sidebarToggle(sidebar(), wide()))`, removing the duplicated two-signal\nupdate and the `batch` it needed.\n\n### [S2.2] Toggle affordance rules\n\n- Expanded → a collapse control at **any** width.\n- Collapsed → an expand control only when wide enough to dock.\n- Subagent views → no control at all, and the `sidebar_toggle` command disabled.\n\nThe render condition `sidebarVisible() || wide()` already expressed the first two; what was\nmissing is that the narrow overlay painted over the button. Rather than raise the button\nabove the overlay, it now rides *inside* it as a right-aligned row sibling placed before the\npanel. That keeps one invariant across both modes — the control sits immediately to the left\nof the sidebar — instead of the control appearing left of the panel when docked and on the\npanel's right edge when overlaid. It also removes the `zIndex` the raised version needed, and\nsimplifies the in-flow gate to `sidebarAllowed() && wide()` since the overlay now owns its\nown control. Verified
